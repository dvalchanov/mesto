    title: "Гараж и паркомясто"
    summary: "Гаражът може да е самостоятелен обект, докато паркомястото често се придобива чрез идеални части и разпределено ползване. Маркировката и номерът сами по себе си не определят правото."
    aliases: ["паркомясто", "паркинг място", "гараж", "идеални части паркинг", "право на ползване паркомясто"]
    keywords: ["самостоятелен обект", "ползване", "общи части", "подземен гараж"]
    related_stage_keys: [building.handover]
    related_document_keys: [document.title_deed, document.cadastral_sketch_scheme, document.handover_protocol]
    related_term_keys: [term.ideal_shares, term.individual_object, term.appurtenant_parts]
    source_ids: [cadastre_law, cadastre_services, property_law, zut]
    source_checked_at: "2026-09-05"
    content_version: 2
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      definition: |-
        Гаражът може да бъде обособен самостоятелен обект със собствен идентификатор. Очертаното паркомясто често не е отделен недвижим имот: правото може да представлява идеални части от подземен гараж или терен, комбинирани с договорено разпределение на ползването.

        Достъпите, рампите и зоните за маневриране обичайно имат общ режим и не са част от очертанията на конкретното място.
      example: |-
        Оферта „паркомясто №12“ може юридически да означава 1/30 идеална част от подземен гараж и споразумение собственикът да използва зона №12. Друг проект може да съдържа отделен гараж №12 със собствен кадастрален идентификатор.

        Цената може да е сходна, но правото и начинът на прехвърляне са различни.
      confusion: |-
        Боята, табелата, колоните или индивидуалната врата не създават непременно самостоятелен недвижим имот. „Изключително ползване“ не означава автоматично отделен имот, а идеалната част не очертава сама конкретно място.

        Не бива да се приема и че всяко открито място в двора може свободно да бъде обект на отделна продажба.
      importance: |-
        За купувача разликата влияе върху нотариалната форма, ипотеката, достъпа, разходите, решенията на съсобствениците и бъдещата продажба. При спор защитата зависи от действително придобитото право, не от номера в рекламната брошура.

        Практическата стойност на мястото зависи и от размерите, възможността за маневриране и общия достъп. Те трябва да се проверят на място, защото не могат да се преценят само от правния документ.
      related: |-
        Сравни кадастралната схема, проекта, документа за собственост, квотите и споразумението за разпределено ползване. Установи кой притежава рампата и общите зони, как се разпределят разходите и дали правото може да се прехвърля или ипотекира заедно с жилището.

        При предаване измери и заснеми мястото, но провери правния режим преди резервация или капаро.

  - key: term.condominium
    slug: etazhna-sobstvenost
    kind: term
    category: ownership_rights
