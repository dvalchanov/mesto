    sections:
      definition: |-
        „Покупка на зелено“ е пазарен израз за ангажимент към имот преди сградата или обектът да са завършени. Той не определя сам какво придобива купувачът днес: може да има предварителен договор, прехвърлено или обещано право на строеж, бъдещо прехвърляне на обект или друга структура.

        Какво действително придобива купувачът зависи от страните, собствеността върху земята, вписаните права, проекта и договорите.
      example: |-
        Двама купувачи резервират апартаменти на етап разрешение за строеж. Единият подписва само предварителен договор за бъдеща продажба, а на другия с нотариален акт се прехвърля право на строеж. И двамата казват „купих на зелено“, но придобитите права и моментът на придобиване са различни.

        Физическият напредък не уеднаквява договорите.
      confusion: |-
        Плащането на цена и подписването на предварителен договор не правят автоматично купувача собственик на апартамент. Разрешението за строеж не гарантира завършване, а популярността на инвеститора не заменя проверката на дружеството, земята и конкретния договор.

        „Запазен апартамент“ може да означава само договорно обещание, не отделен нанесен имот.
      importance: |-
        Купувачът поема едновременно строителен, финансов и договорен риск, както и риск, свързан с правата върху имота, защото плащанията предхождат завършения обект. Трябва да разбере как са защитени внесените средства при забавяне, промяна на проекта, тежести или неизпълнение.

        Колкото по-ранен е етапът, толкова по-важни са проверката на продавача и измеримите междинни условия.
      related: |-
        Опиши ясно кой притежава земята, кой има право да строи, кой е продавачът, как е идентифициран бъдещият обект, кои документи са условие за плащане и кога се прехвърля право върху имота. Провери тежестите и финансовите зависимости преди първото невъзстановимо плащане.

        Договори последици при забава, промяна, спиране и невъзможност за завършване с независим адвокат.

