    title: "РЗП - разгъната застроена площ"
    summary: "Показател за площта на сградата, изчисляван по нормативна методика; не е площта на конкретния апартамент и не трябва да се смесва с продаваема квадратура."
    aliases: ["РЗП", "разгъната застроена площ", "обща площ на сградата", "застроена площ на етажите"]
    keywords: ["сграда", "етажи", "проект", "площ"]
    related_stage_keys: [building.land_planning, building.authorization]
    related_document_keys: [document.pup, document.design_visa, document.building_permit]
    related_term_keys: [term.property_areas, term.upi, term.construction_category]
    source_ids: [zut, mrrb_rzp]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      definition: |-
        РЗП означава разгъната застроена площ и описва сбор от застроените площи на етажите, включени според приложимото нормативно определение. Това е проектен и устройствен показател за сграда или застрояване, а не автоматично сборът на площите, които се продават на отделни купувачи.

        В зависимост от конкретния въпрос трябва да се провери кои надземни, подпокривни и други площи участват в изчислението.
      example: |-
        Проектът може да посочва РЗП 8500 кв.м за цялата сграда, докато апартаментът в офертата е 92 кв.м „с общи части“. Първото число описва мащаба и параметрите на сградата. За второто трябва да се уточни каква е площта на жилището и какви общи или прилежащи части са добавени.

        Делението на общата цена на РЗП не дава цена на квадратен метър за жилището.
      confusion: |-
        РЗП не е застроената площ на отпечатъка на сградата, чистата площ на апартамента или кадастралната площ на самостоятелния обект. Разговорното „обща квадратура“ може да обозначава съвсем различно число.

        Не приемай по подразбиране, че определено ниво е включено или изключено - това трябва да се провери според нормативната методика и проекта.
      importance: |-
        За купувача РЗП помага да разбере мащаба на проекта, устройствените показатели, категорията и някои общи натоварвания, но не определя директно какво придобива. Смесването му с площта на жилището може да изкриви ценовото сравнение.

        При проверка за промяна на проекта РЗП е един от показателите, които архитектът може да сравни между отделните документи.
      related: |-
        Установи за коя сграда, етап или разрешение е посочена РЗП и от кой одобрен проект идва числото. За апартамента изискай отделна таблица за площта на обекта, идеалните части и принадлежностите.

        Не използвай РЗП като заместител на проверката на предмета и квадратурата в своя договор.

  - key: term.construction_roles
    slug: investitor-vazlozhitel-stroitel
    kind: term
    category: construction
    locale: bg
    title: "Инвеститор, възложител и строител"
    summary: "Роли с различни права и отговорности: кой организира и има право да възлага, кой изпълнява строежа и кой поема обещанията към купувача."
    aliases: ["инвеститор", "възложител", "строител", "предприемач", "главен изпълнител"]
    keywords: ["продавач", "собственик на земята", "договор", "участник в строителството"]
    related_stage_keys: [building.land_planning, building.authorization, building.commencement]
    related_document_keys: [document.building_permit, document.site_opening, document.preliminary_contract]
    related_term_keys: [term.right_to_build, term.off_plan, term.construction_papers]
    source_ids: [zut, ordinance_3, dnsk_construction_control]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      definition: |-
        Възложителят е участникът, който има законовото основание да възлага и организира инвестиционния процес според конкретния строеж. Строителят изпълнява строителните и монтажните работи по договор и строителни книжа. „Инвеститор“ е широко използвана бизнес дума и може да обозначава възложителя, финансиращо или свързано дружество.

        Продавачът по договора с купувача може да е едно от тези лица или отделно дружество.
      example: |-
        Земята е собственост на дружество А, правото на строеж е учредено на дружество Б, разрешението посочва Б като възложител, строител е дружество В, а предварителният договор се предлага от дружество Г. Общата марка на проекта не доказва правомощията между тях.

        Купувачът трябва да проследи договорната и вещната връзка до обещания обект.
      confusion: |-
        „Инвеститорът строи“ често смесва поне три различни роли. Строителят не издава разрешение за строеж и не е непременно собственик или продавач; възложителят не изпълнява непременно работите със собствен екип.

        Сходни имена, общ сайт или един управител не правят дружествата една юридическа страна.
      importance: |-
        За купувача ролите показват кой може да прехвърли правото върху имота, на кого се плаща, към кого се отправят претенции за строителството и кой подписва отделните актове. Обещание от лице, което не е поело ясно задължение, може да се окаже без практическа стойност.

        Проверяват се и представителството, финансовото състояние и зависимостите на конкретния продавач, не само репутацията на бранда.
      related: |-
        Състави таблица с ЕИК и роля на всеки участник: собственик на земята, носител на право на строеж, възложител, строител, надзор, продавач и получател на плащанията. Свържи всяка роля с конкретен акт или договор.

        Попитай кой носи отговорност при забавяне, дефект, промяна на проекта и невъзможност за прехвърляне - и къде това е подписано.

  - key: term.construction_papers
    slug: stroitelni-knizha
    kind: term
    category: construction
    locale: bg
    title: "Строителни книжа"
    summary: "Общото название на одобрените проекти, разрешенията, заповедите, актовете и протоколите за даден строеж. Един документ не замества останалите."
    aliases: ["строителни книжа", "строителна документация", "строително досие", "одобрени проекти"]
    keywords: ["разрешение", "проект", "акт", "протокол"]
    related_stage_keys: [building.authorization, building.commencement, building.act15]
    related_document_keys: [document.building_permit, document.site_opening, document.act14, document.act15]
    related_term_keys: [term.material_deviation, term.construction_roles, term.object_designation]
    source_ids: [zut, ordinance_3, dnsk_construction_control]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      definition: |-
        „Строителни книжа“ е общо понятие за документите, въз основа на които строежът се разрешава, изпълнява, контролира и приема. То може да включва одобрени инвестиционни проекти, разрешение за строеж, заповедна книга, актове и протоколи, екзекутивна документация и други приложими документи.

        Всеки документ има конкретна функция, дата, издател, участници и обхват; наличието на един не доказва автоматично целия процес.
      example: |-
        Продавач показва разрешение за строеж и твърди, че „всички строителни книжа са наред“. Купувачът обаче трябва да установи дали разрешението е действащо, какви изменения има, кой блок обхваща и как проектният апартамент се свързва с него.

        Акт 14 по-късно доказва различен въпрос от самото разрешение.
      confusion: |-
        Папка с много документи не е равна на проверен и последователен строителен процес. Неофициални чертежи, рекламни разпределения и неподписани таблици не стават одобрени проекти само защото изглеждат технически.

        Това, че документът е публичен, не означава, че Mesto или един общински портал показва всички приложения и актуални изменения.
      importance: |-
        Строителните книжа помагат на купувача да провери дали обещаният обект е част от разрешения строеж, какви промени са правени и кои събития са удостоверени. Ако документите не са пълни, може да останат неясни секцията, етапът, предназначението или последващо изменение.

        Те често са свързани и с договорни плащания, затова заглавието без съдържание не е достатъчно.
      related: |-
        Направи хронология от ПУП и виза през разрешение, откриване на площадка, актове за конструкция и приемане до въвеждане в експлоатация. За всеки документ провери номер, дата, влизане в сила, строеж, етап, участници, приложения и изменения.

        Нека архитект или инженер прочете техническия обхват, а адвокатът - правния и договорния ефект.

  - key: term.material_deviation
    slug: sashtestveno-otklonenie
    kind: term
    category: construction
    locale: bg
    title: "Съществено отклонение от проекта"
    summary: "Промяна спрямо одобрения инвестиционен проект, за която ЗУТ може да изисква специална процедура. Уговорката между купувач и продавач не е административно одобрение."
    aliases: ["съществено отклонение", "промяна на проекта", "екзекутив", "изменение на инвестиционния проект"]
    keywords: ["одобрен проект", "разпределение", "предназначение", "разрешение"]
    related_stage_keys: [building.authorization, building.installations, building.act15]
    related_document_keys: [document.building_permit, document.act15, document.cadastral_sketch_scheme]
    related_term_keys: [term.construction_papers, term.object_designation, term.property_areas]
    source_ids: [zut, dnsk_qa, dnsk_construction_control]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      definition: |-
        Отклонение е разлика между изпълненото или планираната промяна и одобрения инвестиционен проект. ЗУТ разграничава съществени отклонения с различни последици и процедури; точната квалификация зависи от характера и момента на промяната.

        Не всяка промяна е забранена, но разрешаването ѝ не се доказва с устно съгласие или нова рекламна схема.
      example: |-
        Купувачът иска преместване на стена и обединяване на помещения. Инвеститорът показва актуализиран чертеж, но трябва да се установи дали промяната засяга конструкция, инсталации, предназначение, общи части или показатели и по какъв ред е отразена.

        При обща промяна на етаж може да бъдат засегнати и други обекти.
      confusion: |-
        Екзекутивната документация не може впоследствие да узакони всяка промяна. Подписът на купувача под ново разпределение не е административно одобрение, а отразяването в кадастъра не заменя строителните книжа.

        Малката визуална разлика може да има голям правен ефект, а видима голяма промяна може да е надлежно одобрена - проверяват се актовете.
      importance: |-
        За купувача отклонението може да промени площ, предназначение, съседство, общи части и възможността за въвеждане в експлоатация. Ако обещаният апартамент не съответства на одобрения и изпълнен обект, нотариалният акт не решава техническото несъответствие.

        Ранната проверка намалява риска от скъпи поправки или от това желаната промяна да се окаже недопустима.
      related: |-
        Сравни приложението към договора с последния одобрен проект и изпълненото на място. Поискай заповедите, проектите и съгласуванията за всяка промяна. Нека проектант или независим архитект обясни дали тя е съществена и по какъв ред е одобрена и отразена.

        Запиши кой носи разхода и отговорността, ако обещаната промяна не може да бъде одобрена или въведена в експлоатация.

  - key: term.construction_category
    slug: kategoriya-na-stroezha
    kind: term
    category: construction
