    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      definition: |-
        Задатъкът има уредена функция да доказва сключването и да обезпечава изпълнението на договор, с определени последици при неизпълнение. „Капаро“, „депозит“ и „резервационна такса“ са използвани с различно съдържание и не получават автоматично същия режим само по име.

        Трябва да се прочете кой получава сумата, по кой договор, срещу какво задължение и при кои точно събития тя се връща, задържа или приспада.
      example: |-
        Купувач плаща 3000 лв. на посредник за „резервация“, но формулярът позволява задържане при неодобрен кредит и не задължава собственика да подпише предварителен договор. Друг договор изрично определя сума като задатък между продавач и купувач и урежда последиците при неизпълнение.

        И в двата случая сумата може разговорно да се нарича „капаро“, но правата и задълженията на страните са различни.
      confusion: |-
        Не всяко капаро се връща в двоен размер и не всяка резервационна такса се приспада от цената. Фактът, че документът е кратък или е озаглавен „заявка“, не означава, че няма обвързващи условия.

        Одобрението на ипотека, успешната правна проверка и получаването на строителен документ не са автоматични условия за връщане, ако не са ясно договорени.
      importance: |-
        Това обикновено е първото необратимо плащане на купувача и често се прави преди пълна проверка. Неясни основания могат да превърнат нуждата да се откажеш от рисков имот във финансова загуба.

        Добрата клауза свързва парите с конкретен имот, страни, срок, проверки и следваща стъпка.
      related: |-
        Преди плащане установи кой е насрещната страна и има ли право да резервира имота. Запиши крайния срок, документите и проверките, основанията за отказ, връщането, приспадането от цената и отговорността при отказ на всяка страна.

        Нека независим адвокат прегледа текста преди превода; платежното основание трябва да съвпада с подписания договор.

