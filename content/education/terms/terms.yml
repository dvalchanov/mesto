    title: "Присъединяване и индивидуални партиди"
    summary: "Изградена мрежа наблизо, присъединена сграда, активна услуга и индивидуална партида не са едно и също. Всяка стъпка се проверява отделно."
    aliases: ["присъединяване", "индивидуална партида", "битов ток", "партида за вода", "отделен електромер"]
    keywords: ["електро", "ВиК", "топлофикация", "оператор", "измервателен уред"]
    related_stage_keys: [building.installations, building.commissioning, building.handover]
    related_document_keys: [document.act15, document.commissioning, document.handover_protocol]
    related_term_keys: [term.bds_finish, term.construction_papers, term.condominium]
    source_ids: [zut, dnsk_commissioning, ordinance_3]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      definition: |-
        „Присъединяване“ обхваща технически и договорни стъпки, чрез които строежът или обектът получава достъп до електрическа, водоснабдителна, канализационна, топлопреносна или друга мрежа. Изградено отклонение, монтиран уред, активна доставка и индивидуална клиентска партида не са едно събитие.

        За всяка услуга операторът, условията и документите са различни и трябва да се проверят отделно.
      example: |-
        В апартамента има електромер и осветление, но временното захранване е организирано през строителя и индивидуалната битова партида още не може да бъде открита. В друг случай сградата е въведена в експлоатация, но собственикът трябва лично да подаде документи за смяна или откриване на партида.

        Видимото наличие на ток не доказва, че захранването е постоянно или че може да се открие индивидуална партида.
      confusion: |-
        „Има ток и вода“, „сградата е присъединена“, „има отделни уреди“ и „можеш да откриеш индивидуална партида на битова тарифа“ са различни твърдения. Общото захранване на строежа не доказва окончателното състояние на всеки обект.

        Документът за въвеждане в експлоатация е важен, но не заменя конкретната процедура с всеки оператор.
      importance: |-
        За купувача неясният статус може да забави нанасянето, ремонта или отдаването под наем и да създаде временни условия и зависимост от инвеститора. Липсващата инфраструктура около проекта може да остане проблем дори когато вътрешните инсталации изглеждат завършени.

        Индивидуалните партиди помагат и за ясно разпределение на потребление и задължения при предаване.
      related: |-
        Поискай за всяка мрежа отделен статус: договор и условия за присъединяване, изпълнено отклонение, приемни протоколи, постоянна доставка, измервателен уред и документи за индивидуална партида. Установи кой плаща оставащите такси и кой трябва да извърши следващото действие.

        При предаване запиши номерата и показанията на уредите и не приемай общото „готово е“ без конкретен оператор и документ.
