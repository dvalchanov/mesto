    title: "Явни и скрити дефекти"
    summary: "Недостатъци, които могат да бъдат видими при нормален оглед или да се проявят по-късно; приемането трябва да документира фактите, без да се превръща в прибързан отказ от права."
    aliases: ["явен дефект", "скрит дефект", "недостатък", "забележка при приемане", "строителен дефект"]
    keywords: ["оглед", "протокол", "уведомяване", "ремонт"]
    related_stage_keys: [building.act15, building.handover]
    related_document_keys: [document.act15, document.handover_protocol]
    related_term_keys: [term.warranty_period, term.bds_finish, term.possession_ownership]
    source_ids: [obligations_contracts, construction_warranties, ordinance_3]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      definition: |-
        Дефектът е несъответствие или недостатък спрямо дължимото качество, проекта, спецификацията или нормалното използване. Практически явен е проблемът, който може да бъде установен при подходящ оглед, а скритият не е разумно разпознаваем тогава и се проявява по-късно.

        Квалификацията и правните последици зависят от договора, вида работа, момента, уведомяването и доказателствата, а не само от етикета на купувача.
      example: |-
        Надраскана дограма и липсващ контакт се виждат при предаване и се описват. Теч зад облицовка или неправилно изпълнена хидроизолация може да се прояви след първия силен дъжд.

        И в двата случая снимката е полезна, но установяването на техническата причина и отговорното лице може да изисква специалист.
      confusion: |-
        Подписът под приемо-предавателен протокол не трябва автоматично да се разбира като потвърждение, че няма никакви скрити проблеми. Обратно, списъкът със забележки не означава непременно, че купувачът може едностранно да откаже всяко плащане или приемане.

        Естетичният недостатък, незавършената договорена работа и конструктивният дефект имат различни последици и изискват различна реакция.
      importance: |-
        За купувача ранното откриване и точното документиране намаляват разхода и спора за причината. Пропуснат видим дефект може да стане по-труден за доказване, а неправилна намеса при скрит проблем може да унищожи доказателства.

        Общите части заслужават отделен оглед, защото дефект там може да засегне много обекти и бъдещия бюджет на етажната собственост.
      related: |-
        Направи технически оглед спрямо проекта и договорната спецификация, опиши място, размер и симптом и приложи снимки с дата. Уточни срок за отстраняване, достъп и повторна проверка в протокола, без неясни фрази за пълен отказ от бъдещи претенции.

        При проявил се по-късно проблем документирай преди ремонт, уведоми проследимо и потърси независима техническа и правна помощ според риска.

  - key: term.utility_connection
    slug: prisaedinyavane-individualni-partidi
