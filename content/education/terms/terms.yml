    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      definition: |-
        Възбраната е мярка върху недвижим имот, която се вписва по предвидения ред и ограничава противопоставимото разпореждане с него. Тя може да е свързана с обезпечаване на иск, принудително изпълнение, публично вземане или друго законово основание.

        От вписването трябва да се проследят органът, делото, датата, засегнатият имот и последващите действия, включително евентуално заличаване.
      example: |-
        При проверка преди предварителен договор се открива възбрана, наложена от съдебен изпълнител. Продавачът казва, че дългът е платен, но това не е достатъчно. Трябва да се проверят делото и надлежното заличаване на възбраната.

        Възбраната може да е върху идеална част, цял ПИ или конкретен обект - обхватът е решаващ.
      confusion: |-
        Възбраната не е ипотека и не показва сама размера или основателността на претенцията. Разговорното „запор на имота“ може да прикрива неточна терминология; официалният акт и вписването са това, което трябва да се прочете.

        Изтекло време или обещание за бъдещо вдигане не са равни на доказано заличаване.
      importance: |-
        За купувача възбраната може сериозно да засегне придобиването на имота и финансирането на сделката. Плащане към продавача без предварително съгласувана процедура може да увеличи риска от загуба, вместо да реши проблема.

        Ранното ѝ откриване позволява сделката да бъде спряна или преструктурирана преди необратим ангажимент.
      related: |-
        Вземи акта за възбраната и актуални справки, установи изпълнителното или съдебното производство и поискай адвокатска оценка на ефекта. Ако се обсъжда заличаване, договори точни предварителни условия и доказателства преди освобождаване на средства.

        Не използвай единствено бележка от продавача или екранна снимка като потвърждение, че мярката е отпаднала.

