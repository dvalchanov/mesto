entries:
  - key: term.cadastral_identifier
    slug: kadastralen-identifikator
    kind: term
    category: cadastre_identity
    locale: bg
    title: "Кадастрален идентификатор"
    summary: "Уникален код за поземлен имот, сграда или самостоятелен обект в кадастъра. По него можеш да сравниш документите, но не и да установиш собствеността."
    aliases: ["идентификатор", "кадастрален номер", "стар идентификатор", "номер на имот"]
    keywords: ["ПИ", "сграда", "самостоятелен обект", "адрес"]
    related_stage_keys: []
    related_document_keys: [document.cadastral_sketch_scheme, document.title_deed]
    related_term_keys: [term.land_property, term.individual_object, term.property_record]
    source_ids: [cadastre_identifier, cadastre_law]
    source_checked_at: "2026-09-05"
    content_version: 2
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      definition: |-
        Кадастралният идентификатор е уникален номер, даден от Агенцията по геодезия, картография и кадастър, чрез който недвижимият имот се посочва еднозначно за страната. Полетата му следват йерархия: населено място, кадастрален район, поземлен имот, сграда и самостоятелен обект.

        По-късият код може да сочи само земята, а добавените полета - конкретна сграда и конкретен обект в нея. При промени в кадастъра може да има стар идентификатор, който трябва да се проследи до актуалния.
      example: |-
        68134.1609.3263 може да е идентификатор на поземлен имот. 68134.1609.3263.1 би насочил към сграда в него, а 68134.1609.3263.1.10 - към самостоятелен обект в сградата.

        Ако офертата посочва само първите три полета, тя още не идентифицира еднозначно апартамента, който купувачът очаква да придобие.
      confusion: |-
        Идентификаторът не е адрес, номер на апартамент, номер на нотариален акт, имотна партида или означение на УПИ. Два документа могат да използват различни стари и нови означения, без това автоматично да означава грешка - но връзката трябва да бъде доказуема.

        Наличието на код в кадастъра също не удостоверява само по себе си кой е собственик, има ли ипотека или дали обектът може законно да се ползва като жилище.
      importance: |-
        За купувача пълният идентификатор е най-надеждният начин да провери дали схемата, нотариалният акт, договорът, строителните документи и справките се отнасят до един и същ обект. Пропуснато поле може да насочи проверката към парцела или сградата, вместо към конкретния апартамент.

        Точната идентичност е особено важна при плащане, обезпечение с ипотека и нотариално прехвърляне, защото обещаното и провереното трябва да са един и същ обект.
      related: |-
        Сравни целия код във всеки наличен документ и отбележи кое ниво описва: земя, сграда или самостоятелен обект. При стар идентификатор поискай официална връзка с актуалния, а при разминаване на адрес, етаж, предназначение или площ - не приемай, че само еднаквото име на проекта е достатъчно.

        Следващият въпрос е: „Този документ отнася ли се точно за обекта, който ще бъде предмет на договора и нотариалния акт?“

  - key: term.land_property
    slug: pozemlen-imot
    kind: term
    category: cadastre_identity
    locale: bg
    title: "Поземлен имот (ПИ)"
    summary: "Част от земната повърхност с определени граници и основна единица в кадастъра. Не я бъркай с УПИ, адрес или разговорното „парцел“."
    aliases: ["ПИ", "поземлен имот", "кадастрален имот", "парцела"]
    keywords: ["земя", "граници", "площ", "УПИ"]
    related_stage_keys: [building.land_planning]
    related_document_keys: [document.cadastral_sketch_scheme, document.pup, document.title_deed]
    related_term_keys: [term.cadastral_identifier, term.upi, term.right_to_build]
    source_ids: [cadastre_law, cadastre_services]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      definition: |-
        Поземленият имот е част от земната повърхност, определена с граници съобразно правото на собственост. Той е основната единица на кадастъра и получава собствен кадастрален идентификатор, площ, адрес, трайно предназначение и начин на трайно ползване.

        ПИ описва кадастралния обект. Плановите правила за застрояване се четат отделно чрез действащия устройствен план и съответния УПИ.
      example: |-
        Жилищна сграда може да е нанесена в ПИ 68134.1609.3263. Купувачът на апартамент обичайно не придобива автоматично целия ПИ: може да получи идеални части от земята, идеални части от право на строеж или друг точно описан обхват.

        Затова изразът „апартамент със земя“ трябва да се преведе в конкретни права и квоти.
      confusion: |-
        „ПИ“, „УПИ“, „двор“, „парцела на комплекса“ и административният адрес не означават едно и също. Един УПИ може да включва части от повече кадастрални имоти. Ако кадастралните и регулационните граници се разминават, може да е необходима проверка от геодезист.

        Сграда в даден ПИ също не доказва, че собственикът на апартамента притежава земята под нея.
      importance: |-
        За купувача ПИ е основата за проверка на собствеността върху терена, достъпа, строителното право и обхвата на разрешенията. Неточното разбиране на земята може да скрие зависимост от чужд имот, липса на обещани идеални части или различен предмет на сделката.

        При ново строителство връзката между ПИ, възложител, право на строеж и бъдещ обект е част от веригата на правата.
      related: |-
        Поискай актуална скица на ПИ и сравни идентификатора, границите и площта с документа за собственост, ПУП, визата и разрешението за строеж. Установи кой притежава терена и какво точно получаваш ти: дял от земята, дял от правото на строеж или само самостоятелния обект с принадлежности.

        При несъвпадение между кадастър и регулация включи геодезист, архитект и независим адвокат според въпроса.

  - key: term.upi
    slug: upi
    kind: term
    category: cadastre_identity
    locale: bg
    title: "УПИ"
    summary: "Урегулиран поземлен имот по подробен устройствен план - планово понятие за граници и режим на застрояване, което не е непременно идентично с кадастралния ПИ."
    aliases: ["урегулиран поземлен имот", "упи", "парцел по регулация", "регулиран парцел"]
    keywords: ["ПУП", "регулация", "ПИ", "застрояване"]
    related_stage_keys: [building.land_planning, building.authorization]
    related_document_keys: [document.pup, document.design_visa, document.cadastral_sketch_scheme]
    related_term_keys: [term.land_property, term.cadastral_identifier, term.easement]
    source_ids: [zut, nag, cadastre_law]
    source_checked_at: "2026-09-05"
    content_version: 2
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      definition: |-
        УПИ означава урегулиран поземлен имот: териториална единица, определена с подробен устройствен план, за която планът задава регулационни граници и режим на застрояване. Означението може да съдържа римски номер на парцела, номер на квартал и номера на имоти, за които е отреден.

        УПИ е понятие от устройственото планиране, а ПИ е обект от кадастъра. Данните от двете системи трябва да се сравнят - не приемай, че границите им съвпадат.
      example: |-
        В ПУП може да пише „УПИ IV-3263, кв. 12“, а кадастралната скица да сочи ПИ с цифров идентификатор. Ако границите не съвпадат напълно, архитектът и геодезистът трябва да обяснят коя част е урегулирана и как това засяга проекта.

        Самото римско означение не е достатъчно за търсене на конкретен самостоятелен обект.
      confusion: |-
        УПИ не означава автоматично, че имотът е готов за незабавно застрояване, че има уреден достъп и инфраструктура или че всяко желано строителство е допустимо. Важни са действащият план, предназначението, показателите, ограниченията и необходимите последващи актове.

        „Регулиран“ не е равнозначно и на „без спор за граници или собственост“.
      importance: |-
        За купувача разликата между УПИ и ПИ може да засегне достъпа, части от терена, правото на строеж и точния обхват на разрешението. Ако обещаната сграда стъпва върху различен обхват от проверения, рискът не се решава с еднакъв адрес или търговско име.

        При покупка на къща или земя плановият режим влияе пряко върху бъдещото ползване и застрояване.
      related: |-
        Чети ПУП, визата, разрешението за строеж и кадастралната скица заедно. При различни граници поискай графично сравнение от геодезист. Провери и достъпа до улица, предназначението, показателите за застрояване и всички сервитути или ограничения.

        Следващият въпрос е: „Действащият УПИ и провереният ПИ покриват ли един и същ терен за целите на конкретния проект?“

  - key: term.individual_object
    slug: samostoyatelen-obekt-v-sgrada
    kind: term
    category: cadastre_identity
    locale: bg
    title: "Самостоятелен обект в сграда"
    summary: "Обособена част от сграда със собствено предназначение - например апартамент, ателие, магазин или гараж. Не всяко отделено помещение е самостоятелен имот."
    aliases: ["СОС", "самостоятелен обект", "обект в сграда", "апартамент в кадастъра"]
    keywords: ["апартамент", "ателие", "гараж", "кадастър"]
    related_stage_keys: [building.act14, building.handover]
    related_document_keys: [document.cadastral_sketch_scheme, document.title_deed]
    related_term_keys: [term.cadastral_identifier, term.appurtenant_parts, term.object_designation]
    source_ids: [cadastre_law, cadastre_services]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      definition: |-
        Самостоятелният обект е етаж или част от етаж в сграда със самостоятелно функционално предназначение и собствена идентичност в кадастъра. Типични примери са апартамент, ателие, магазин, офис или гараж, когато са обособени и отразени като отделен обект.

        Общите части, паркоместата и обслужващи помещения като мазета, тавани и складове не са автоматично самостоятелни обекти. Те могат да бъдат принадлежности или част от друг правен режим.
      example: |-
        Апартамент №10 в рекламата може да съответства на СОС с идентификатор, предназначение „жилище, апартамент“, етаж и площ. Мазе №10 може да е описано като прилежаща част към него, а не като втори имот със собствен идентификатор.

        За гараж или ателие трябва да се види как точно е нанесено и какво пише в документа за собственост.
      confusion: |-
        Номерът на врата, вътрешното разпределение или отделният електромер не създават сами по себе си самостоятелен недвижим имот. И обратното - един СОС може да включва части на различни нива, ако така е одобрен и отразен.

        „Апартамент“ в оферта не гарантира кадастрално и строително предназначение „жилище“.
      importance: |-
        Купувачът трябва да знае дали придобива отделен обект, идеални части или само договорено ползване. Разликата влияе върху нотариалното прехвърляне, ипотечното финансиране, последващата продажба, данъците и възможността за самостоятелно разпореждане.

        Точната идентичност предпазва и от проверка на документ, който се отнася само за сградата или парцела.
      related: |-
        Сравни идентификатора, предназначението, етажа, площта, съседите и прилежащите части в схемата, проекта, договора и нотариалния акт. Ако обектът още не е нанесен, поискай проектното му означение и ясна проследимост към бъдещия кадастрален код.

        Попитай изрично кои части ще бъдат самостоятелни и кои ще се прехвърлят като принадлежности, идеални части или право на ползване.

  - key: term.appurtenant_parts
    slug: prilezhashti-chasti
    kind: term
    category: cadastre_identity
    locale: bg
    title: "Прилежащи части"
    summary: "Мазе, таванско помещение, склад или друга част, свързана с основния обект; описанието ѝ трябва да показва какво право се придобива и дали може да се разпорежда отделно."
    aliases: ["прилежаща част", "мазе", "изба", "таван", "склад към апартамент"]
    keywords: ["принадлежност", "самостоятелен обект", "площ", "схема"]
    related_stage_keys: [building.handover]
    related_document_keys: [document.cadastral_sketch_scheme, document.title_deed, document.handover_protocol]
    related_term_keys: [term.individual_object, term.property_areas, term.ideal_shares]
    source_ids: [cadastre_law, cadastre_services, property_law]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      definition: |-
        Прилежащата част обслужва основния самостоятелен обект и се описва към него - например избено или таванско помещение. Тя може да присъства в кадастрални и собственически документи без да има самостоятелен идентификатор и отделен статут на недвижим имот.

        Точният режим зависи от одобрените проекти, документа за собственост и връзката с основния обект, а не само от поставен номер или фактическо ползване.
      example: |-
        Нотариалният акт може да прехвърля апартамент заедно с „избено помещение №7 с площ 4,20 кв.м“. Ако офертата обещава склад №7, но той липсва от проекта или документа за собственост, приемо-предавателният протокол не може сам да създаде вещно право върху него.

        Склад с отделен идентификатор би изисквал различно четене.
      confusion: |-
        Прилежаща част, обща част и самостоятелен обект са различни категории. Заключването на помещение и изключителното му ползване не доказват отделна собственост, а включването на площта му в рекламна „обща площ“ не показва автоматично как се прехвърля.

        Не приемай, че мазе или таван може винаги да се продаде отделно от жилището.
      importance: |-
        За купувача прилежащите части често са материална част от цената и ежедневното ползване. Неясното описание може да доведе до липсващо помещение, спор за номер или граници, невъзможност за отделно разпореждане и разминаване между договор и нотариален акт.

        Банка или бъдещ купувач също може да изисква ясно проследима принадлежност към основния обект.
      related: |-
        Сравни описанието в офертата, архитектурния проект, кадастралната схема и проекта на нотариален акт. Запиши номера, местоположението, площта, границите и правния статут: прилежаща част, самостоятелен обект, обща част или разпределено ползване.

        При предаване провери физическото помещение, но не използвай само ключа като доказателство за придобитото право.

  - key: term.object_designation
    slug: prednaznachenie-na-obekta
    kind: term
    category: cadastre_identity
    locale: bg
    title: "Предназначение на обекта"
    summary: "Официално определената функция на обекта - жилище, ателие, офис, магазин или гараж. Рекламното име и обзавеждането не променят предназначението му."
    aliases: ["предназначение", "статут на имота", "апартамент или ателие", "жилищен статут"]
    keywords: ["жилище", "ателие", "офис", "промяна на предназначение"]
    related_stage_keys: [building.land_planning, building.authorization, building.commissioning]
    related_document_keys: [document.building_permit, document.cadastral_sketch_scheme, document.commissioning]
    related_term_keys: [term.individual_object, term.upi, term.construction_papers]
    source_ids: [zut, cadastre_law, dnsk_construction_control]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      definition: |-
        Предназначението описва за каква функция е одобрен и отразен даден обект - например жилище, ателие, офис, магазин или гараж. То се проследява през устройствените и строителните документи, документа за въвеждане в експлоатация и кадастралните данни.

        Разговорната дума „статут“ често събира различни въпроси; затова е по-точно да се пита какво предназначение е одобрено и къде е записано.
      example: |-
        Помещение може да изглежда и да се продава като малък апартамент, но в схемата да е „ателие“ или „офис“. Това не означава автоматично, че не може да се използва, но изискванията, финансирането и очакванията на купувача трябва да се проверят спрямо конкретното предназначение.

        Адресната регистрация не е единственият и достатъчен тест.
      confusion: |-
        Обзавеждането с кухня и баня, плащането на битов ток или използването от предишен собственик не променят сами предназначението. Обратното, различно кадастрално описание не трябва да се тълкува изолирано от одобрения проект и последващите актове.

        „Предназначение“, „начин на трайно ползване“ на земята и устройствена зона са свързани, но различни понятия.
      importance: |-
        За купувача предназначението може да влияе върху законното ползване, банковото кредитиране, данъчното третиране, преустройства и бъдеща продажба. Ако целта е постоянно жилище, несъответствието трябва да бъде разбрано преди капаро или договор, а не след нотариалното прехвърляне.

        То помага и да се открият разлики между обещаното в офертата и одобреното за сградата.
      related: |-
        Сравни предназначението в схемата, проекта, разрешението, документа за въвеждане в експлоатация и документа за собственост. Попитай дали е имало промяна на предназначението и поискай актовете, с които тя е одобрена и отразена.

        Обсъди конкретните последици с архитект, адвокат и кредитор според планираното ползване; не разчитай на общото уверение „няма проблем“.

  - key: term.property_areas
    slug: chista-zastroena-obshta-plosht
    kind: term
    category: cadastre_identity
    locale: bg
    title: "Чиста, застроена и обща площ"
    summary: "Квадратурата може да е изчислена по различни начини. Провери какво точно е измерено и кои общи или прилежащи части са включени в обявената площ."
    aliases: ["чиста площ", "застроена площ", "обща площ", "площ с общи части", "квадратура"]
    keywords: ["кв.м", "общи части", "нетна площ", "продаваема площ"]
    related_stage_keys: [building.land_planning, building.handover]
    related_document_keys: [document.cadastral_sketch_scheme, document.preliminary_contract, document.handover_protocol]
    related_term_keys: [term.ideal_shares, term.appurtenant_parts, term.gross_floor_area]
    source_ids: [zut, cadastre_services, property_law]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      definition: |-
        „Чиста“, „застроена“, „полезна“, „обща“ и „продаваема“ площ могат да следват различни нормативни, проектни или договорни методики. При апартамент най-важно е да се установи какво точно е измерено, по кои контури и кои идеални или прилежащи части са добавени.

        Кадастралната площ, проектната площ и площта в документа за собственост могат да идват от различни документи и моменти. Разликата не се обяснява автоматично с фразата „общи части“.
      example: |-
        Оферта може да представя 92 кв.м „обща площ“, съставени от 78 кв.м застроена площ на жилището и добавени идеални части. Отделно може да има мазе от 4 кв.м. Купувачът трябва да знае кое число определя цената и как всяка част ще бъде описана в договора и нотариалния акт.

        Цената на квадратен метър не позволява надеждно сравнение, ако площта е изчислена по различен начин.
      confusion: |-
        По-голямата рекламна квадратура не означава повече използваема жилищна площ. Процентът идеални части не се превръща непременно в очертани квадратни метри, а РЗП на сградата не е площ на апартамента.

        Разлика между проект и кадастър не доказва сама по себе си нарушение, но трябва да има ясно техническо и документално обяснение.
      importance: |-
        За купувача площта влияе пряко върху цената, сравняването на оферти, обзавеждането, банковата оценка и бъдещата продажба. Неясна методика може да създаде усещане за липсващи квадратни метри дори когато договорът формално използва друго число.

        Най-големият риск е цената да е изчислена по една площ, а купувачът да очаква съвсем различна използваема площ.
      related: |-
        Поискай таблица, която разделя площта на самостоятелния обект, общите части, прилежащите помещения и другите продавани права. Сравни архитектурния проект, схема, договор, ценообразуване и проект на нотариален акт, включително допустимия ред при окончателно измерване.

        Задай простия въпрос: „Колко квадратни метра мога да използвам вътре и кои останали квадратни метри или проценти придобивам като право?“

  - key: term.ideal_shares
    slug: idealni-chasti
    kind: term
    category: ownership_rights
    locale: bg
    title: "Идеални части"
    summary: "Дял от общо право, а не конкретна стая, част от двора или паркомясто. За самостоятелното ползване е нужно отделно основание."
    aliases: ["идеална част", "идеални части", "общи части", "съсобственост", "квота"]
    keywords: ["дял", "земя", "общи части", "разпределение на ползване"]
    related_stage_keys: [building.handover]
    related_document_keys: [document.title_deed, document.cadastral_sketch_scheme]
    related_term_keys: [term.condominium, term.garage_parking, term.property_areas]
    source_ids: [property_law, cadastre_services, condominium_law]
    source_checked_at: "2026-09-05"
    content_version: 2
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      definition: |-
        Идеалната част е математическа квота от право върху обща вещ или обща част. Собственикът има дял в цялото, а не автоматично отделена физическа зона. При етажна собственост към апартамента обичайно принадлежат идеални части от общите части на сградата, а понякога и от земята или правото на строеж.

        При обикновена съсобственост квотата определя участието в общото право. Конкретното ползване може да бъде уредено отделно, без да променя собствеността.
      example: |-
        Нотариалният акт може да посочи апартамент заедно с 2,35% идеални части от общите части и съответни идеални части от терена. Тези проценти не очертават 2,35% от стълбището или определен правоъгълник в двора.

        При подземен гараж дялът може да бъде комбиниран с разпределено ползване на номерирано място.
      confusion: |-
        Идеални части, рекламни „общи части“ в квадратурата и физически общи помещения не са едно и също. Договорено изключително ползване на зона също не я превръща непременно в самостоятелен имот.

        Съсобственикът не може да посочи произволна реална част като изцяло своя само защото квотата му е голяма.
      importance: |-
        За купувача квотата влияе върху предмета и цената на сделката, гласуването, разходите за поддръжка, ползването на земята и бъдещите решения за общите части. Липсващи или различни проценти могат да затруднят финансиране и следваща продажба.

        Особено важно е да се разбере дали обещаното паркомясто или двор е собственост, общ дял или само режим на ползване.
      related: |-
        Сравни квотите в документа за собственост, проекта, схемата и договора и провери към коя обща вещ се отнася всеки процент. Поискай отделно документа, който урежда конкретното ползване, ако продавачът обещава физически определено място.

        Ако сборът, основанието или описанието изглеждат неясни, потърси правен и технически преглед преди плащане.

  - key: term.right_to_build
    slug: pravo-na-stroezh
    kind: term
    category: ownership_rights
    locale: bg
    title: "Право на строеж"
    summary: "Ограничено вещно право да се изгради и притежава постройка върху чужд терен в определен обхват; различно е от разрешението за строеж и обещанието за бъдещ апартамент."
    aliases: ["суперфиция", "право на строеж", "вещно право на строеж", "отстъпено право на строеж"]
    keywords: ["земя", "собственик на терена", "възложител", "сграда"]
    related_stage_keys: [building.land_planning, building.authorization, building.act14]
    related_document_keys: [document.title_deed, document.building_permit, document.act14]
    related_term_keys: [term.land_property, term.off_plan, term.individual_object]
    source_ids: [property_law, zut, registration_rules]
    source_checked_at: "2026-09-05"
    content_version: 2
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      definition: |-
        Правото на строеж е ограничено вещно право, което позволява на носителя да построи и притежава сграда или определени обекти върху земя на друго лице. То се учредява в изискуемата форма, вписва се и има конкретен предмет, обхват и условия.

        Собственикът на земята и носителят на правото на строеж могат да са различни лица. Разрешението за строеж е административен акт и не замества вещното основание.
      example: |-
        Собственик на ПИ учредява на дружество право да построи жилищна сграда срещу бъдещи обекти. Дружеството може да продава права, свързани с бъдещи апартаменти, но купувачът трябва да проследи точното учредяване, разпределението и връзката с проекта.

        Общо обещание „инвеститорът има право да строи“ не показва дали твоят обект е включен.
      confusion: |-
        Правото на строеж не е разрешение за строеж, собственост върху целия терен или предварителен договор. Не всяко договорно право срещу инвеститора е вещно право, което може да се противопостави по същия начин на трети лица.

        Издаденото разрешение също не доказва само по себе си, че заявителят разполага с всички обещани частноправни права.
      importance: |-
        При покупка в ново строителство основна част от проверката е връзката между собственика на земята, носителя на правото на строеж и конкретния бъдещ обект. Проблем с обхвата, представителството или вписването може да попречи на продавача да изпълни обещаното.

        Правото е важно и за това какво получава собственикът на апартамента спрямо земята след изграждането.
      related: |-
        Поискай нотариалния акт или договора за учредяване и провери вписването, страните, имота, проекта, обектите, сроковете и насрещните задължения. Съпостави ги с разрешението за строеж и своя договор.

        Независим адвокат трябва да отговори: „Продавачът има ли точното право да обещае и прехвърли този бъдещ обект, а не само участие в проекта?“

  - key: term.garage_parking
    slug: garazh-sreshtu-parkomyasto
    kind: term
