    professionally_reviewed_at:
    sections:
      definition: |-
        Вписаната искова молба дава публичност на съдебна претенция в случаите, предвидени от закона - например иск, който оспорва, отменя или засяга акт или право върху имота. Вписването позволява спорът да бъде видим за последващи приобретатели.

        То не доказва, че ищецът ще спечели, но не може да бъде пренебрегнато като обикновена бележка без последствия.
      example: |-
        Собственик продава апартамент, но е вписан иск за обявяване на предходна сделка за недействителна. Дори продавачът да твърди, че делото е неоснователно, купувачът трябва да получи материалите и оценка как евентуалното решение би засегнало неговото право.

        Номерът на делото е начало на проверката, не нейният край.
      confusion: |-
        Исковата молба не е съдебно решение, възбрана или автоматично доказателство за чужда собственост. Обратното също е грешно: фактът, че „още няма решение“, не означава, че покупката е без риск.

        Устно обяснение за делото не заменя прегледа на самата искова молба, последващите вписвания и текущия статус.
      importance: |-
        За купувача резултатът от спора може да засегне собствеността или противопоставимостта на придобиването. Банка и нотариус могат да изискат допълнителни документи, но тяхното участие не заменя независимата оценка на личния риск.

        Откриването преди капаро позволява да се поставят условия или да не се влиза в сделката.
      related: |-
        Изискай препис от вписаната искова молба, номер и съд на делото, отговор, определения, решения и отбелязвания. Нека адвокатът провери точния иск, страните, имота, етапа и възможното действие спрямо бъдещ купувач.

        Не приемай заличаване или приключване без официално доказателство и проверка на последващите вписвания.

  - key: term.deposit
    slug: zadatak-kaparo-rezervatsionna-taksa
    kind: term
    category: transaction_risk
