    sections:
      definition: |-
        „По БДС“ е широко използван пазарен етикет за степен на вътрешна завършеност, но сам по себе си не е достатъчна техническа спецификация на апартамента. Различни продавачи включват различни стени, замазки, входна врата, инсталации, изводи, отопление, уреди и обработки.

        За купувача обещаното изпълнение трябва да бъде описано точно в приложение към договора - с материали, количества, обхват и допустими отклонения.
      example: |-
        Една оферта „по БДС“ включва монтирана входна врата, гипсова мазилка и изводи до тапа. Друга използва същия израз, но предвижда различна стенна обработка и не включва отоплителни тела или индивидуални уреди.

        Ако сравниш офертите само по този етикет, можеш погрешно да приемеш, че срещу двете цени получаваш еднаква степен на завършеност.
      confusion: |-
        Съкращението не гарантира конкретен национален пакет за предаване на жилище и не доказва качество на изпълнението. „До ключ“ също е търговско понятие, ако няма приложена спецификация.

        Завършената обща част на сградата и завършеността вътре в апартамента трябва да се разглеждат отделно.
      importance: |-
        За купувача пропуснат елемент се превръща в непланиран разход и забавяне преди нанасяне. Точната спецификация позволява сравнение на оферти, бюджет за довършване и обективен приемо-предавателен оглед.

        Тя определя и срещу какво може да се заяви дефект или неизпълнение, вместо спорът да остане на ниво общо рекламно обещание.
      related: |-
        Поискай подписано приложение по помещения и системи: стени, подове, тавани, врати, дограма, ВиК, електро, отопление, вентилация, измервателни уреди, тераси и общи части. Добави марки или класове, когато са обещани, и процедура за равностойна замяна.

        При предаване използвай спецификацията ред по ред с технически специалист и впиши отклоненията в протокола.

