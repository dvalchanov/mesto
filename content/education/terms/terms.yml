    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      definition: |-
        Вписването дава публичност на актове и обстоятелства за недвижими имоти в предвидените от закона случаи. Имотната партида организира данни за имота, правата, актовете и свързаните вписвания, отбелязвания и заличавания.

        Кадастърът и Имотният регистър имат свързани, но различни функции: единият описва пространствената идентичност, другият публикува актове и права.
      example: |-
        Кадастралната схема показва актуален идентификатор, но старата собственост е придобита с акт по предходен план. За надеждна проверка трябва да се проследи връзката между старото описание, лицата, последващите сделки и актуалния обект.

        Търсенето само по днешния идентификатор може да пропусне част от историята на имота.
      confusion: |-
        Вписването не е държавна гаранция, че всяко твърдение в акта е материално вярно, а липсата на резултат от една електронна заявка не доказва липса на акт. Партиден номер, кадастрален идентификатор и номер на нотариален акт са различни означения.

        „Заличено“ трябва да бъде свързано с точното предходно вписване, не само да се види дума в списък.
      importance: |-
        За купувача правилното проследяване показва веригата на придобиванията и публичните права или ограничения. Непълно търсене може да пропусне стар акт, промяна на идентификатор, съпруг, наследник или вписване срещу предишен собственик.

        Това е основата, върху която адвокатът оценява собствеността и тежестите, но не е автоматичен заместител на правния анализ.
      related: |-
        Събери актуален идентификатор, стари номера, точен адрес и данни за собствениците по веригата. Поискай справки и удостоверения с подходящ имотен и времеви обхват и прочети самите актове, а не само заглавията им.

        Съпостави регистъра с кадастъра и документите на продавача непосредствено преди сделката.

