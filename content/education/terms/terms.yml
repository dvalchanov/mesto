    sections:
      definition: |-
        „Груб строеж“ е състояние на изпълнена носеща конструкция заедно с ограждащите елементи и покрива според законовото определение. Приемането на конструкцията се документира с Акт образец 14, но актът и достигнатата степен не са едно и също.

        За различни правни и договорни действия може да е необходимо допълнително удостоверяване на достигнатия етап и точното индивидуализиране на бъдещия обект.
      example: |-
        Сградата има подписан Акт 14, но апартаментът още няма инсталации, замазки, дограма или завършени общи части. Договорът на купувача може да изисква плащане не само при „Акт 14“, а след представяне на конкретен документ и уведомяване по определен ред.

        Трябва да се провери и дали актът обхваща целия строеж или отделен етап.
      confusion: |-
        Акт 14, груб строеж, кадастрално нанасяне, възникване на самостоятелен обект и възможност за нотариално прехвърляне не са пет названия на едно действие. Нито едно от тях само по себе си означава завършеност или разрешено ползване.

        Процентът „70% готовност“ в реклама също няма автоматична връзка с това понятие.
      importance: |-
        За купувача грубият строеж често е свързан с голямо плащане, промяна на вида на придобиваното право или подготовка за банково финансиране. Ако етапът се тълкува по-широко от договора, средства могат да бъдат платени преди изискуемото доказателство.

        Физическият риск остава значителен, защото голяма част от работите и приемането предстоят.
      related: |-
        Поискай Акт 14, необходимото удостоверяване за груб строеж и информация за точния строеж, блок, секция и етап. Сравни ги с клаузата за плащане. Нека архитект или инженер прегледа физическото състояние, а адвокат - договора и правните последици.

        Следващият въпрос е: „Кое точно доказателство, за кой обхват и след какво уведомяване прави плащането дължимо?“

