    title: "Етажна собственост"
    summary: "Съчетава индивидуална собственост върху апартаменти и други обекти с общи части и общо управление на сградата."
    aliases: ["етажна собственост", "ЕС", "общо събрание", "домоуправител", "общи части"]
    keywords: ["управление", "поддръжка", "фонд ремонт", "идеални части"]
    related_stage_keys: [building.handover]
    related_document_keys: [document.title_deed, document.handover_protocol]
    related_term_keys: [term.ideal_shares, term.individual_object, term.warranty_period]
    source_ids: [condominium_law, property_law]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      definition: |-
        Етажна собственост възниква, когато в една сграда има самостоятелни обекти на различни собственици и общи части, които ги обслужват. Всеки собственик притежава своя обект и съответен дял от общите части, а управлението се осъществява по специални правила.

        Общото събрание, управителят, бюджетът, фондът за ремонт и решенията за поддръжка са част от този режим; те не принадлежат еднолично на инвеститора след продажбите.
      example: |-
        Купувачът придобива апартамент и процент от покрива, стълбището, конструкцията и други общи части. След заселване участва в решенията за асансьор, охрана, ремонти и месечни разходи според приложимите правила и квоти.

        В комплекс може да има и отделен договор за услуги, който трябва да се разграничи от решенията на етажната собственост.
      confusion: |-
        Етажната собственост не е фирма и не е равна на „затворен комплекс“. Таксата, написана в офертата, не доказва кой има право да я определя, какво включва и по какъв договор се дължи.

        Общите части не могат да се третират просто като остатъчни площи на инвеститора, когато законът и документите за собственост им дават общ режим.
      importance: |-
        За купувача управлението определя реалната месечна цена на обитаване, състоянието на сградата и възможността за големи ремонти. Неплатени задължения, спорни договори за поддръжка или неработещо управление могат да намалят качеството и стойността на имота.

        При нова сграда е важно как управлението ще премине от инвеститора към собствениците.
      related: |-
        Преди покупка поискай протоколи на общото събрание, бюджет, размер и основание на таксите, наличност на фонд „Ремонт и обновяване“, договори за управление и информация за планирани ремонти. При нов проект прочети предварително предложените правила и договори за услуги.

        Сравни обещаните удобства с това кой ще ги притежава, управлява и заплаща.

  - key: term.possession_ownership
    slug: vladenie-sreshtu-sobstvenost
    kind: term
    category: ownership_rights
    locale: bg
    title: "Владение и право на собственост"
    summary: "Да държиш ключовете и да си собственик са две различни неща. Владението не прехвърля собственост, а собствеността не гарантира, че имотът е освободен."
    aliases: ["владение", "собственост", "предаване на владение", "ключове", "въвод"]
    keywords: ["нотариален акт", "предаване", "ползване", "обитател"]
    related_stage_keys: [building.handover]
    related_document_keys: [document.title_deed, document.handover_protocol, document.preliminary_contract]
    related_term_keys: [term.right_of_use, term.registered_claim, term.defects]
    source_ids: [property_law, obligations_contracts]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      definition: |-
        Правото на собственост е вещното право да владееш, ползваш и се разпореждаш с имота в рамките на закона. Владението е фактическата власт върху него - кой държи ключовете, контролира достъпа и го използва с поведение на владелец.

        Прехвърлянето на собственост и предаването на владение могат да настъпят в различни моменти, ако договорът и фактическата ситуация го предвиждат.
      example: |-
        Сделката се изповядва на 15 юни, но продавачът трябва да освободи жилището и да предаде ключовете до 30 юни. Купувачът вече може да е собственик, но още не разполага фактически с имота.

        При ново строителство ранното даване на достъп за довършване не е само по себе си нотариално прехвърляне.
      confusion: |-
        Приемо-предавателният протокол не е документ за собственост, а нотариалният акт не удостоверява непременно фактическото състояние и свободния достъп в деня след сделката. Адресна регистрация, плащане на сметки или дългогодишно обитаване също не трябва да се използват като единствено доказателство за собственост.

        Владение и обикновено държане имат допълнителни правни различия, които изискват конкретен анализ.
      importance: |-
        Купувачът трябва да знае кога получава правото, кога може реално да влезе и какво става, ако имотът не бъде освободен. Неяснотата може да доведе до разходи за временно жилище, спор с обитатели или трудности при ремонт и застраховане.

        Отделното планиране на сделката и предаването прави задълженията измерими.
      related: |-
        В договора запиши точна дата, състояние и процедура за предаване, лицата, които трябва да освободят имота, ключовете, показанията на уредите и последиците при забава. Провери вписаните права на ползване и договорите или фактите, които могат да обвържат новия собственик.

        При самото предаване състави подробен протокол; той допълва, но не заменя проверката на собствеността.

  - key: term.right_of_use
    slug: pravo-na-polzvane
    kind: term
    category: ownership_rights
    locale: bg
    title: "Право на ползване"
    summary: "Право на друго лице да използва имота и да получава доходите от него, въпреки че собственикът е различен."
    aliases: ["вещно право на ползване", "пожизнено право на ползване", "ползвател", "запазено право"]
    keywords: ["ограничено вещно право", "обитаване", "тежест", "вписване"]
    related_stage_keys: [building.handover]
    related_document_keys: [document.title_deed, document.encumbrance_certificate]
    related_term_keys: [term.encumbrance, term.possession_ownership, term.property_record]
    source_ids: [property_law, registration_rules, property_registry]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      definition: |-
        Правото на ползване е ограничено вещно право, отделно от собствеността. Носителят може да използва вещта според предназначението ѝ и при условията на учредяването, а собственикът запазва собствеността, но не непременно свободното фактическо ползване.

        Правото може да бъде учредено или запазено с вписан акт и да има срок или връзка с живота на ползвателя според конкретния случай.
      example: |-
        Родител прехвърля апартамент на дете, но си запазва пожизнено право на ползване. Ако детето после продава имота, купувачът не трябва да предполага, че ще може веднага да го обитава, освен ако правото е надлежно прекратено и заличено.

        Празното жилище в деня на огледа не доказва липсата на такова право.
      confusion: |-
        Правото на ползване не е обикновен наем, адресна регистрация или устно разрешение за живеене. То е вещно право и може да има действие спрямо последващ собственик. Обратно, всяко фактическо обитаване не означава, че съществува вписано право на ползване.

        „Собственикът продава“ не означава непременно „имотът се предава свободен от ползвател“.
      importance: |-
        За купувача правото може да ограничи основната цел на сделката - лично ползване, отдаване под наем или свободна препродажба. То влияе и върху оценката, финансирането и приемливата цена.

        Непроверено право на ползване може да се превърне в дългосрочен конфликт, който не се решава с получаването на нотариален акт.
      related: |-
        Провери актовете и вписванията за носител, предмет, срок и условия за прекратяване. Ако е договорено заличаване преди или при сделката, изискай точна последователност и доказателство, а не само обещание в разговор.

        Съгласувай с адвокат и нотариус дали купувачът ще придобие имота свободен от правото и кога ще получи владението.

  - key: term.easement
    slug: servitut-pravo-na-preminavane
    kind: term
    category: ownership_rights
    locale: bg
    title: "Сервитут и право на преминаване"
    summary: "Право или ограничение, което позволява достъп, преминаване или инфраструктура през чужд имот и може да ограничи начина, по който засегнатият терен се ползва и застроява."
    aliases: ["сервитут", "сервитутна ивица", "право на преминаване", "право на прокарване", "достъп през чужд имот"]
    keywords: ["достъп", "инфраструктура", "ограничение", "трасе"]
    related_stage_keys: [building.land_planning, building.installations]
    related_document_keys: [document.cadastral_sketch_scheme, document.pup, document.title_deed]
    related_term_keys: [term.land_property, term.upi, term.utility_connection]
    source_ids: [property_law, zut, cadastre_law, registration_rules]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      definition: |-
        Сервитутът е право или законово ограничение върху един имот в полза на друг имот, лице или инфраструктура. Той може да осигурява преминаване, достъп, прокарване и поддържане на мрежи или да създава зона, в която определени дейности и строителство са ограничени.

        Основанието може да произтича от закон, административен акт, договор или съдебно решение; конкретният вид определя съдържанието му.
      example: |-
        Къща няма директен излаз на улица и достъпът е уреден през съседен ПИ. Друг имот може да е засегнат от сервитутна ивица за електропровод или водопровод, която преминава през част от двора.

        И в двата случая е важна не само думата „сервитут“, а точното трасе и разрешените действия.
      confusion: |-
        Фактически използвана пътека не доказва безсрочно право на преминаване, а нанесена линия на карта не показва сама пълното правно основание. Сервитутът не означава непременно загуба на собственост върху засегнатата площ, но може съществено да ограничи ползването ѝ.

        Достъпът до имота и достъпът на оператор за инфраструктура са различни права.
      importance: |-
        За купувача сервитутът може да реши дали имотът има сигурен правен достъп и дали планираното строителство, ограда или озеленяване са възможни. Невидимо подземно трасе може да засегне голяма част от използваемия двор.

        Липсата на ясно право на преминаване може да превърне ежедневния достъп в зависимост от съсед.
      related: |-
        Поискай акта, плана и координатите на трасето, провери в чия полза е правото, какъв е срокът, кой поддържа зоната и какви ограничения носи. Направи оглед на реалния достъп, но сравни видяното с кадастъра, ПУП и вписванията.

        При строителни намерения възложи на архитект и геодезист да нанесат сервитута върху конкретната проектна ситуация.

  - key: term.marital_community
    slug: supruzheska-imushtestvena-obshtnost
    kind: term
    category: ownership_rights
    locale: bg
    title: "Съпружеска имуществена общност"
    summary: "При законов режим вещни права, придобити по време на брака със съвместен принос, могат да принадлежат общо на двамата съпрузи независимо на чие име е документът."
    aliases: ["СИО", "съпружеска общност", "семейна собственост", "имот придобит по време на брак"]
    keywords: ["брак", "съвместен принос", "брачен режим", "съгласие"]
    related_stage_keys: []
    related_document_keys: [document.title_deed, document.encumbrance_certificate]
    related_term_keys: [term.ideal_shares, term.property_record, term.possession_ownership]
    source_ids: [family_code, registration_rules, cadastre_services]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      definition: |-
        Съпружеската имуществена общност е бездялова общност при законовия режим: вещни права, придобити по време на брака със съвместен принос, принадлежат общо на двамата съпрузи независимо на чие име са придобити. Законът допуска и режим на разделност или брачен договор.

        За да се определи кой има права върху имота, трябва да се проверят моментът и начинът на придобиване, произходът на средствата и избраният имуществен режим.
      example: |-
        Нотариален акт за апартамент, купен по време на брака, може да посочва само единия съпруг като приобретател. Това не е достатъчно, за да се заключи, че той е единствен собственик и може самостоятелно да продаде без допълнителна проверка.

        Имот, получен по наследство или дарение, може да има различен режим.
      confusion: |-
        Името в кадастъра или един стар документ за собственост не решава само въпроса за брачната собственост. СИО не е обикновена съсобственост с предварително определени квоти, докато общността трае.

        Не трябва и автоматично да се приема, че всеки имот, купен по време на брак, е общ - изключенията и доказателствата са конкретни.
      importance: |-
        Ако не са установени всички собственици, сделката може да бъде оспорена или да не прехвърли цялото право. Когато само единият съпруг е посочен в документа за придобиване, трябва да се провери приложимият имуществен режим и дали е необходимо участието на другия.

        Проверката е важна и за самия купувач, когато трябва да изясни дали придобива имота лично или заедно със съпруг или съпруга.
      related: |-
        Установи семейното положение към момента на придобиването, приложимия режим, основанието и евентуален брачен договор. Съпостави документа за собственост с регистрите и изискай документите, които нотариусът и независимият адвокат считат за нужни.

        Не прави извод само от текущото семейно положение или от това кой живее в имота.

  - key: term.encumbrance
    slug: veshtna-tezhest
    kind: term
    category: transaction_risk
    locale: bg
    title: "Вещна тежест"
    summary: "Общо название за права, ограничения и вписвания, които могат да засегнат имота. Важно е винаги да се уточни точният им вид и действие."
    aliases: ["тежест", "тежести върху имот", "обременен имот", "ограничение"]
    keywords: ["ипотека", "възбрана", "право на ползване", "вписване"]
    related_stage_keys: []
    related_document_keys: [document.encumbrance_certificate, document.title_deed]
    related_term_keys: [term.mortgage, term.attachment, term.right_of_use, term.registered_claim]
    source_ids: [property_registry, registry_certificates, registration_rules]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      definition: |-
        „Вещна тежест“ е широко практическо понятие за права, ограничения и вписани обстоятелства, които могат да засегнат собствеността, ползването или разпореждането с имота. То може да насочва към ипотека, възбрана, право на ползване, сервитут, вписан иск или друго конкретно основание.

        Самата дума не показва какъв е рискът за купувача. Това зависи от конкретния акт, датата и реда на вписване, страните, имота и последващите вписвания или заличавания.
      example: |-
        Удостоверението показва ипотека и по-късно вписано заличаване. Купувачът не трябва да се задоволи с „ипотеката е стара“, а да провери дали заличаването се отнася до същия акт, кредитор и точен имот.

        При право на ползване въпросът не е размерът на дълг, а кой може да използва имота след сделката.
      confusion: |-
        „Без тежести“ не означава автоматично „без всякакъв правен риск“, а „има тежест“ не означава непременно, че сделка е невъзможна. Част от рисковете идват от собственост, представителство, невписани факти или непълна проследена история.

        Един резултат от търсене не трябва да се превръща в окончателен извод без проверка на обхвата и документите зад него.
      importance: |-
        За купувача конкретната тежест може да засегне свободното придобиване, финансирането, владението и бъдещата продажба. Някои вписвания изискват заличаване преди плащане, други - договорна организация или отказ от сделката според професионалната оценка.

        Когато знаеш точния вид на тежестта, можеш навреме да зададеш правилния въпрос, вместо всичко да се свежда до общото „чист ли е имотът“.
      related: |-
        Поискай актуално удостоверение с подходящ период и имотен обхват, но предостави и актовете на независим адвокат. За всяко вписване запиши вид, номер, дата, страни, сума или право, точен имот и наличие на последващо заличаване или отбелязване.

        Съгласувай освобождаването на тежестта с плащането и нотариалната сделка, когато това е приложимо.

  - key: term.mortgage
    slug: ipoteka
    kind: term
    category: transaction_risk
    locale: bg
    title: "Ипотека"
    summary: "Вписано обезпечение върху недвижим имот, което дава на кредитора предпочитание от цената му и не изчезва само защото собственикът се сменя."
    aliases: ["договорна ипотека", "законна ипотека", "ипотекиран имот", "банкова ипотека"]
    keywords: ["кредитор", "обезпечение", "заличаване", "погасяване"]
    related_stage_keys: []
    related_document_keys: [document.encumbrance_certificate, document.title_deed, document.preliminary_contract]
    related_term_keys: [term.encumbrance, term.attachment, term.property_record]
    source_ids: [obligations_contracts, property_registry, registration_rules]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      definition: |-
        Ипотеката е обезпечение върху недвижим имот в полза на кредитор. Тя се учредява или възниква при предвидено основание и се вписва, като описва кредитор, собственик, имот и обезпечено вземане.

        Кредиторът може да се удовлетвори предпочитително от цената на ипотекирания имот, независимо в чия собственост се намира той. Затова последващата продажба сама по себе си не е заличаване.
      example: |-
        Продавачът има ипотечен кредит и обещава част от продажната цена да бъде преведена директно на банката. Без ясна банкова сметка, точна сума, съгласие и последователност за заличаване купувачът не знае дали ще придобие имота свободен от ипотеката.

        Устно уверение „кредитът почти е изплатен“ не е достатъчно.
      confusion: |-
        Остатъкът по кредита и размерът, за който ипотеката е вписана, не са непременно едно число. Погасяването на задължението и заличаването на вписването също са отделни действия, които трябва да бъдат доказани.

        Ипотека на земята може да изисква анализ как обхваща построеното и продавания обект; не се прави автоматичен извод само от адреса.
      importance: |-
        За купувача незаличената ипотека може да позволи изпълнение върху вече придобития имот. Тя влияе върху собственото банково финансиране и налага синхрон между кредитори, плащане, документи и вписване.

        Сделка с ипотека не е непременно невъзможна, но изисква точна, професионално прегледана процедура вместо обещание след плащането.
      related: |-
        Изискай актуално удостоверение, ипотечния акт в необходимия обхват и официален документ от кредитора за остатъка и условията за заличаване. Нека адвокатът и нотариусът подредят кой плаща, по коя сметка, какво се подписва и кога се подава заличаването.

        Провери отново вписванията непосредствено преди сделката и получи доказателство след изпълнение на договорената процедура.

  - key: term.attachment
