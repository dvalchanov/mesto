    title: "Категория на строежа"
    summary: "Законовата категория определя част от контрола и процедурата за строежа. Тя не е оценка за качество, цена или луксозност."
    aliases: ["категория строеж", "трета категория", "четвърта категория", "пета категория", "категоризация"]
    keywords: ["ДНСК", "община", "разрешение за ползване", "удостоверение"]
    related_stage_keys: [building.authorization, building.commissioning]
    related_document_keys: [document.building_permit, document.commissioning]
    related_term_keys: [term.gross_floor_area, term.construction_roles, term.construction_papers]
    source_ids: [zut, dnsk_commissioning, dnsk_construction_control]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      definition: |-
        Категорията на строежа е нормативна класификация, определена според вида, предназначението, параметрите, сложността и риска на строежа. Тя влияе върху компетентните органи, участниците, контрола и формата на окончателното въвеждане в експлоатация.

        Категорията се отнася до конкретния строеж или етап, а не до маркетинговия клас на сградата.
      example: |-
        За една жилищна сграда окончателният документ може да е удостоверение за въвеждане в експлоатация от органа, издал разрешението, а за друг приложим строеж - разрешение за ползване след различна процедура. Популярното „Акт 16“ скрива тази разлика.

        Отговорът започва от категорията, посочена в строителните книжа.
      confusion: |-
        По-висока категория не означава по-качествено строителство, по-висока цена или по-надежден инвеститор. Ниският номер не е сертификат за лукс, а административна класификация.

        Категорията на цял комплекс може да изисква разграничаване между сгради, инфраструктура и отделни етапи.
      importance: |-
        За купувача категорията помага да разбере кой издава окончателния акт, какъв документ трябва да търси и защо две сгради имат различни процедури. Без нея лесно се иска грешен документ или се приема, че липсващото разговорно „Акт 16“ означава липса на законно въвеждане.

        Категорията помага да разбереш коя процедура се прилага, но сама не доказва текущия етап на строежа.
      related: |-
        Провери категорията в разрешението за строеж и последващите книжа за точния обхват. Съпостави я с компетентния орган и окончателния документ, без да разчиташ на общото име, използвано от продавача.

        Ако проектът е на етапи или включва отделна инфраструктура, поискай ясен списък кой акт и коя категория за коя част се отнасят.

  - key: term.warranty_period
    slug: garantsionen-srok
    kind: term
    category: handover_operation
    locale: bg
    title: "Гаранционен срок"
    summary: "Периодът, в който се носи отговорност за определени строителни работи или обекти. Законовият минимум и допълнителната договорна гаранция не са едно и също."
    aliases: ["гаранция на строителя", "строителна гаранция", "гаранционни срокове", "дефекти в гаранция"]
    keywords: ["Наредба 2", "строител", "продавач", "рекламация"]
    related_stage_keys: [building.commissioning, building.handover]
    related_document_keys: [document.commissioning, document.handover_protocol, document.preliminary_contract]
    related_term_keys: [term.defects, term.construction_roles, term.bds_finish]
    source_ids: [construction_warranties, obligations_contracts, zut]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      definition: |-
        Гаранционният срок е период, през който за определени строителни и монтажни работи, съоръжения или строителни обекти се прилага съответна отговорност за проявени недостатъци. Нормативната уредба предвижда минимални срокове за различни видове работи, а договорът може да съдържа допълнителни обещания.

        Началният момент, предметът, отговорното лице и процедурата за уведомяване трябва да се установят за конкретния случай.
      example: |-
        След предаването се появява теч от обща тераса. Купувачът трябва да установи кой отговаря за общата част, кой е изпълнил работата, какво обещава договорната гаранция на продавача и какъв е минималният приложим срок.

        Общото съобщение „имате пет години гаранция“ не показва за кои елементи и от коя дата.
      confusion: |-
        Един срок не важи еднакво за конструкция, хидроизолация, инсталации, настилки и оборудване. Гаранционният срок не е същото като срок за отстраняване след уведомяване, нито освобождава купувача от нуждата да документира проблема.

        Изтичането му също не решава автоматично всички възможни договорни или законови претенции - конкретният анализ остава необходим.
      importance: |-
        Гаранцията помага на купувача да разбере кого и в какъв срок трябва да уведоми за строителен проблем. Ако отговорното дружество, адресът за уведомяване и процедурата са неясни, дори основателен сигнал може да остане нерешен месеци.

        При етажна собственост общите дефекти изискват координация между собственици и управление, преди щетата да се разрасне.
      related: |-
        Събери гаранционни условия по вид работа, начална дата, отговорно лице, контакт и срок за реакция. Пази договори, протоколи, снимки, кореспонденция и документи за въвеждане и предаване.

        При дефект изпрати проследимо уведомление с описание, дата и доказателства и не възлагай разрушителен ремонт преди подходящ технически оглед, освен при необходима аварийна мярка.

