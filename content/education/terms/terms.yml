    title: "Задатък, капаро и резервационна такса"
    summary: "Плащания преди сделката с различни възможни функции; правните последици идват от договора и условията, а не само от заглавието на сумата."
    aliases: ["задатък", "капаро", "депозит", "резервационна такса", "стоп капаро"]
    keywords: ["връщане", "двоен размер", "резервация", "предварителен договор"]
    related_stage_keys: []
    related_document_keys: [document.preliminary_contract]
