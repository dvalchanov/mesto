  content_version: 1
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    what: |-
      The energy performance certificate presents an assessment of the building's energy performance according to the applicable methodology. It can show class, specific cost, systems used and recommendations according to the type of certificate and the building.
      The certificate is for the building or clearly stated scope, not a personal estimate of the monthly expenses of a particular household. Actual consumption also depends on mode of occupancy, prices, exposure and condition.
    when: The certificate is important for a new building, sale, rental or inspection of a building in operation. Check its
      date and expiry date as repairs, changes to systems or expiry may mean a new document is required.
    who: It is prepared by a person with legal capacity under the energy efficiency regime. Certification data and registered
      certificates can be verified through AUER, but the originator and the specific document remain part of the verification.
    why: Energy performance affects comfort, expected costs and future condominium decisions. A difference between advertised
      and certified class is a signal to clarify the version used and the scope.
    establishes: Establishes the calculated and certified indicators for the specific building as of the specified date and
      with the methodology used. Shows the officially documented class when the document is valid and properly linked.
    not_establish: It does not guarantee a specific heating bill, trouble-free installations, good execution of every detail
      or future energy prices. Does not prove individual utility account, ownership or commissioning.
    compare: Check building address and identity, certificate type, registration details, issuer, date and validity, energy
      class, systems and recommendations. Compare with the advertisement, the technical passport and the actual common installations.
    before_after: Step on design or survey data for the building. After its release, there may be repairs, resurvey or update;
      decisions on improvements are made separately and require a budget and technical design.
    payment: It is usually not a standalone basis for payment on the purchase. If the class is an expressly promised feature,
      include accurate documentation, minimum score, and consequences for nonconformity in the contract rather than relying
      on an advertising claim.
    availability: Mesto does not automatically retrieve a certificate for each building. The buyer can use AUER's public reference,
      but a township or similar address match should be checked carefully.
    where: Ask for a copy from the seller, investor or building management and check the available registration data in the
      AUER portal. In case of discrepancy, contact the compiler or a legally competent specialist.
    professional_review: An energy auditor or engineer can explain the methodology, systems and realistic implications. A
      lawyer is needed when the energy class is contractually promised and the discrepancy affects acceptance, price or compensation.
    buyer_checks:
    - Confirm the exact building, certificate type, date and validity.
    - Compare the certified class with the advertising and contract claims.
    - Read the systems and recommendations, not just the class letter.
    - Do not turn the certificate into a promise of a specific monthly bill.
- key: document.tolerance_certificate
  slug: udostoverenie-za-tarpimost
  kind: document
