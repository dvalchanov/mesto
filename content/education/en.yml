  source_checked_at: '2026-09-05'
  content_version: 1
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    definition: |-
      An easement is a right or legal restriction on one property for the benefit of another property, person or infrastructure. It may provide passage, access, laying and maintenance of networks or create an area where certain activities and construction are restricted.

      The ground may derive from a law, an administrative act, a contract or a court decision; the specific type determines its content.
    example: |-
      The house does not have a direct exit to the street and access is arranged through a neighboring PI. Another property may be affected by an easement for a power line or water line that runs through part of the yard.

      In both cases, not only the word "easement" is important, but the exact route and permitted actions.
    confusion: |-
      A path actually used does not prove a perpetual right of way, and a line drawn on a map does not by itself show the full legal basis. An easement does not necessarily mean a loss of ownership of the affected area, but it can significantly limit its use.

      Property access and infrastructure operator access are different rights.
    importance: |-
      For the buyer, the easement can decide whether the property has secure legal access and whether planned construction, fencing or landscaping is possible. An invisible underground route can affect a large part of a usable yard.

      The lack of a clear right-of-way can make everyday access dependent on a neighbor.
    related: |-
      Ask for the deed, plan and route coordinates. Check who benefits from the right, its term, who maintains the area and which restrictions apply. Inspect the physical access, then compare what you see with the cadastre, PUP and registry entries.

      In the case of construction intentions, assign an architect and a surveyor to apply the easement on the specific design situation.
- key: term.marital_community
  slug: supruzheska-imushtestvena-obshtnost
  kind: term
  category: ownership_rights
  locale: en
  title: Matrimonial property community
  summary: Under the statutory regime, property rights acquired during the marriage with joint contribution may belong jointly
    to both spouses, regardless of whose name the document is in.
  aliases:
  - SIO
  - conjugal union
  - family property
  - property acquired during marriage
  keywords:
  - marriage
  - joint contribution
  - marital status
  - consent
  related_stage_keys: []
  related_document_keys:
  - document.title_deed
  - document.encumbrance_certificate
  related_term_keys:
  - term.ideal_shares
  - term.property_record
  - term.possession_ownership
  source_ids:
  - family_code
  - registration_rules
  - cadastre_services
  source_checked_at: '2026-09-05'
  content_version: 1
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    definition: |-
      Conjugal property community is a non-participatory community under the legal regime: property rights acquired during the marriage with joint contribution belong jointly to both spouses regardless of whose name they were acquired. The law also allows for a regime of separation or a marriage contract.

      In order to determine who has rights to the property, the time and method of acquisition, the origin of the funds and the chosen property regime must be checked.
    example: |-
      A notarial deed for an apartment bought during marriage may name only one spouse as the buyer. This alone is not enough to conclude that the named spouse is the sole owner and may sell without further checks.

      Property received by inheritance or donation may have a different regime.
    confusion: |-
      The name in the cadastre or an old property document does not solve the issue of marital property alone. The SIO is not a simple co-ownership with predetermined quotas for the duration of the community.

      Nor should it be automatically assumed that any property bought during a marriage is joint - the exceptions and evidence are specific.
    importance: |-
      If not all owners are identified, the transaction may be contested or may not transfer all title. When only one spouse is named in the acquisition document, the applicable property regime must be checked and whether the participation of the other is necessary.

      The check also matters when a buyer needs to establish whether they are acquiring the property individually or jointly with a spouse.
    related: |-
      Establish the marital status at the time of acquisition, the applicable regime, the basis and any marriage contract. Compare the title deed with the records and request the documents that the notary and the independent lawyer deem necessary.

      Do not draw conclusions solely from current marital status or from who lives in the property.
