# English edition of the buyer education catalog.
# Stable keys, slugs and legal source references intentionally match the Bulgarian edition.
entries:
- key: document.reservation_agreement
  slug: dogovor-za-rezervatsiya-imot
  kind: document
  locale: en
  category: agreements_finance
  title: Property reservation agreement
  summary: An agreement to take a property off the market temporarily in exchange for a payment. It should state clearly
    when that payment will be refunded, deducted from the price or retained.
  aliases:
  - reservation contract
  - reservation agreement
  - reservation deposit
  - reservation fee
  keywords:
  - down payment
  - deposit
  - return
  - term
  - broker
  - preliminary contract
  related_stage_keys:
  - building.land_planning
  - building.authorization
  - building.act14
  related_document_keys:
  - document.brokerage_agreement
  - document.preliminary_contract
  - document.title_deed
  related_term_keys:
  - term.deposit
  - term.off_plan
  - term.encumbrance
  source_ids:
  - obligations_contracts
  - property_law
  source_checked_at: '2026-09-05'
  content_version: 1
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    what: |-
      A reservation contract is a private agreement by which the property is usually suspended from being actively offered for a specified period in return for a payment and specific obligations. There is no one mandatory content for every such contract, so the rights and obligations depend on the exact wording.
      The amount may be payable to an owner, investor or intermediary and may be called a fee, deposit, down payment or down payment. The name does not decide when it is returned, held, or deducted.
    when: It appears early - before the full legal and technical due diligence and before the preliminary contract. This is
      precisely why the deadline should allow for checks, financing and negotiations, rather than turning a quick payment
      into a pressure.
    who: It is signed by the person undertaking the reservation and the paying buyer. Check if it is the owner, authorized representative,
      investor or just a broker and has the right to receive the amount and bind the seller.
    why: The buyer pays before seeing all the documents. A well-drafted contract allows plenty of time for inspection and
      explains when the buyer can back out and get the money back-for example, if there's a problem with the title, encumbrances,
      credit, project, or contract terms.
    establishes: 'It establishes the agreement between the parties: which property is reserved, for how long, for what amount,
      what actions follow and in which events the amount is returned, deducted or withheld.'
    not_establish: Does not prove title, clear encumbrances, approved credit, construction stage or obligation to final sale
      beyond what is expressly agreed upon. It is not automatically a preliminary contract and the amount paid is not automatically
      a legal deposit.
    compare: Check parties and representation, exact identity of the property, price, payee and account, term, checks, draft
      of the next contract, credit terms, returns, retention and deduction, commission and dispute resolution.
    before_after: Before signing there should be at least a basic check on who is offering the property and on what grounds.
      After the reservation, the agreed checks and negotiations follow; it should not replace the detailed preliminary contract.
    payment: The reservation itself is related to payment, so the payment basis must exactly match the contract. Clarify who
      holds the amount, when they transfer it onward, and whether the commission is withheld even in the event of a failed
      transaction.
    availability: Mesto does not receive, store or interpret the private reservation contract. The availability of public property
      data does not mean that the clauses have been verified or that the amount is protected.
    where: Request the project before payment from the seller, investor or intermediary. Don't just rely on a payment order
      or receipt; keep the signed version, attachments and proof of payment.
    professional_review: A lawyer is needed before a non-refundable payment, especially for new construction, an unclear recipient,
      short deadlines, dependence on credit or an automatic reference to an unreceived preliminary contract.
    buyer_checks:
    - Confirm who is entitled to reserve the property and receive the amount.
    - Describe the exact property and price, not just an ad number.
    - Write down objective reasons and a deadline for returning the amount.
    - Obtain the draft of the next contract before making an irrevocable payment.
- key: document.preliminary_contract
  slug: predvaritelen-dogovor
  kind: document
  locale: en
  category: agreements_finance
  title: Preliminary contract
  summary: The contract in which the parties commit to a future transaction. It should clearly set out the property, price,
    payments, deadlines and protections for the buyer.
  aliases:
  - preliminary contract of sale
  - PD
  - off-plan contract
  - contract for future property
  keywords:
  - price
  - payments
  - penalty
  - term
  - notarial deed
  - construction stage
  related_stage_keys:
  - building.authorization
  - building.act14
  - building.act15
  - building.commissioning
  related_document_keys:
  - document.reservation_agreement
  - document.title_deed
  - document.encumbrance_certificate
  - document.investment_project
  - document.handover_protocol
  related_term_keys:
  - term.off_plan
  - term.deposit
  - term.bds_finish
  - term.property_areas
  - term.appurtenant_parts
  source_ids:
  - obligations_contracts
  - property_law
  - registration_rules
  source_checked_at: '2026-09-05'
  content_version: 2
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    what: |-
      With the preliminary contract, the parties undertake to conclude a final transaction under the agreed essential conditions. It must clearly state what will be transferred, at what price, when and after the presentation of what evidence.
      With an off-plan purchase, the contract covers far more than a promise to sign a notarial deed: it describes the future property, construction specifications, payments, permitted changes, deadlines, handover and the consequences of non-performance.
    when: It is signed after sufficient due diligence and before the final notarial transfer. It may predate construction
      and cadastral registration, which makes precise project appendices and safeguards against changes especially important.
    who: Signed by the prospective parties to the final transaction or duly authorized representatives. Check that the seller
      owns the property or holds the relevant right, that the company is properly represented, and that all necessary spouses or co-owners
      are involved.
    why: This is the document on which the buyer actually owes large payments and can seek performance or compensation. An
      unclear subject matter, a unilateral change, a weak deadline or inadequate liability for the seller may remain a problem
      until the end of the project.
    establishes: It establishes the obligations that the parties have actually assumed - the property and rights, the price,
      the method of payment, the term for the final contract and any additional conditions. Appendices and annexes are part
      of the agreement.
    not_establish: It does not automatically transfer ownership, is not a permit to build or occupy, and does not guarantee
      that the seller will remain solvent. Does not prove absence of encumbrances, actual milestone achievement or credit
      approval.
    compare: Check the parties, representation and title documents; the land parcel, the right to build and the future unit;
      the project, areas and accessories; the price and VAT; stages and evidence; deadlines; the changes; the penalties; the
      encumbrances; financing; the notarial transfer; handover; warranties; and termination.
    before_after: Before it come the reservation and the legal, technical and financial checks. After signing, only
      the agreed events and documents are monitored, and before the final transaction, an up-to-date check of ownership and
      encumbrances is made.
    payment: This is the main source of the private payment schedule. Each stage must have a precise definition, document,
      scope and notification procedure; the market words "Act 14", "Act 15" and "Act 16" are not sufficient without clarification.
    availability: Mesto does not receive, store, interpret or track private contracts and does not calculate maturities. Educational
      pages help you ask questions, but they don't confirm your specific clause.
    where: Obtain the project documentation and all appendices from the seller or developer well before signing. Keep signed versions,
      annexes, notices and proofs of every payment and acceptance.
    professional_review: An independent attorney should review the contract prior to signing and significant payment. An architect
      or engineer verifies the design and technical applications, and the lender must separately validate its own process.
    buyer_checks:
    - Customize the item by right, project, object, areas and accessories.
    - Associate each payment with an accurate document, scope and procedure.
    - Add a deadline and working consequences for delay or change.
    - Arrange encumbrances, financing, final transaction and delivery separately.
- key: document.brokerage_agreement
  slug: dogovor-s-broker
  kind: document
  locale: en
  category: agreements_finance
  title: Contract with a broker or intermediary
  summary: It sets out the broker's services, commission, payment terms and any exclusivity. Bear in mind that a viewing form
    may also contain contractual terms.
  aliases:
  - mediation agreement
  - agency contract
  - brokerage contract
  - inspection protocol
  - commission
  keywords:
  - an intermediary
  - remuneration
  - exclusivity
  - view
  - commission
  - service
  related_stage_keys:
  - building.land_planning
  - building.authorization
  related_document_keys:
  - document.reservation_agreement
  - document.preliminary_contract
  - document.title_deed
  related_term_keys:
  - term.deposit
  - term.possession_ownership
  source_ids:
  - commercial_law
  - obligations_contracts
  source_checked_at: '2026-09-05'
  content_version: 1
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    what: |-
      The contract with a broker or agency governs what intermediary service is provided, what remuneration is due and in what event. Sometimes part of the conditions is in the general conditions, declaration or inspection protocol, although the document looks like a simple visit registration.
      An intermediary can work for the seller, for the buyer, or have a relationship with both parties. The contract should clearly show who it represents and what obligations it has towards you.
    when: It should be read even before the first viewing and remains important in the reservation, negotiation and transaction.
      An exclusivity or long term clause can bind the buyer even after finding a property on their own or switching agents.
    who: It is signed by the client and the intermediary or its duly authorized representative. Check the exact
      company, UIC, registered office, address and whether the person receiving payment is the contractual party.
    why: Commission is often a significant expense and can be claimed at various events - viewing, reservation, preliminary contract or
      final transaction. The buyer should know which services the fee covers and what is not included.
    establishes: Establishes the assigned actions, term, remuneration, terms of payment, exclusivity and other assumed obligations.
      The inspection protocol can link a specific property to the agreed commission.
    not_establish: Does not prove seller's ownership, accuracy of offer, absence of encumbrances or independent due diligence
      performed. The payment of the commission does not mean that the transaction is certain or that the broker is acting
      as an attorney or appraiser.
    compare: Check company and representative, specific services, term and termination, exclusivity, amount and VAT, exact
      trigger for the fee, properties viewed, dealings with the other party, reimbursement of expenses and penalties.
    before_after: Before signing, clarify whose interests the intermediary represents and what services they will provide. After each viewing,
      keep a copy of the signed agreement, and before reservation, separate the broker's commission from the amount to the seller.
    payment: The commission follows the agreed event, not a general market habit. Check if it is due in the event of a failed
      transaction, bank refusal, document problem or direct contact with the owner, and when an accounting document is issued.
    availability: Mesto does not retrieve or analyze brokerage agreements or viewing records. Public property data alone
      cannot show whether you owe a commission.
    where: Ask in advance for the contract, the general conditions, the tariff and a copy of each protocol you sign. Check
      the company and the representative in the Commercial Register when the intermediary is a company.
    professional_review: A lawyer is useful in cases of exclusivity, high penalties, an unclear commission liability condition,
      work for both parties, or an attempt to make the inspection report a substitute for a detailed agreement.
    buyer_checks:
    - Find out which party the intermediary represents and what services they undertake to provide.
    - Read when exactly the commission occurs and whether it includes VAT.
    - Check Term, Exclusivity, Termination and Penalties.
    - Do not sign an inspection report without reading its contractual clauses.
- key: document.bank_valuation
  slug: pazarna-otsenka-za-ipotechen-kredit
  kind: document
  locale: en
  category: agreements_finance
  title: Market valuation for a mortgage loan
  summary: Appraisal of the property as collateral for the bank. It affects financing but does not guarantee sale price, legal
    status or future value.
  aliases:
  - bank assessment
  - property valuation
  - market valuation
  - mortgage appraisal
  - evaluation report
  keywords:
  - bank
  - mortgage
  - collateral
  - appraiser
  - credit
  - LTV
  related_stage_keys:
  - building.act14
  - building.commissioning
  - building.handover
  related_document_keys:
  - document.tax_assessment
  - document.title_deed
  - document.cadastral_sketch_scheme
  - document.preliminary_contract
  related_term_keys:
  - term.mortgage
  - term.property_areas
  - term.object_designation
  - term.rough_construction
  source_ids:
  - bnb_mortgage_guide
  - registry_certificates
  - cadastre_services
  source_checked_at: '2026-09-05'
  content_version: 1
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    what: |-
      A mortgage market appraisal is an appraisal report used by the lender to determine the value of the property as collateral according to its methodology and requirements. It describes the object, the data used, and the approach to the value.
      The bank appraisal serves the credit process. It does not confirm that the agreed price is profitable and does not oblige the bank to finance a certain part of it.
    when: Usually assigned after initial review of credit and property documents, before final approval and mortgage. For
      construction in development, the bank may have separate rules for allowable grade and subsequent assessments.
    who: It is prepared by an appraiser accepted or commissioned by the creditor according to its process. The buyer may pay
      the expense, but the recipient and user of the appraisal is often the bank; verify your access to the entire report.
    why: If the appraised value is below the purchase price, the co-payment may increase or the loan may not be approved in
      the expected amount. The report may reveal a different purpose, area, condition or limited liquidity.
    establishes: Establishes the professional opinion on the value as of the specified date and with the described assumptions,
      documents and methodology. For the bank, the report is the basis for the assessment of collateral and credit risk.
    not_establish: It does not guarantee future sales price, credit approval, ownership, freedom from encumbrances, construction
      legality or technical soundness. The assessment accepted by the bank does not replace the legal verification and inspection.
    compare: Check contractor and appraiser, date, purpose, identifier, address, area, purpose, degree of completion, documents,
      inspection, comparable transactions, assumptions, restrictions and final value. Compare with the contract and the cadastral
      scheme.
    before_after: Prior to the assessment, documents for ownership, cadastre and construction are collected. After that, the
      creditor makes a separate credit and legal assessment. A positive evaluation in itself is not a final offer or approval
      for credit.
    payment: Paying the appraisal is an expense, not a loan guarantee. Do not make any irrevocable obligations to the seller
      before clarifying how a lower rating, disapproval or bank delay affects the reservation and preliminary contract.
    availability: Mesto does not commission bank appraisals, does not obtain credit decisions and does not calculate financing.
      Public data in a Mesto report is not an appraisal report for a bank.
    where: The process is arranged through the selected lender or an appraiser approved by it. Ask to see the report and
      the list of missing documents, not just the reported final value.
    professional_review: The loan officer explains the bank requirements, the appraiser explains the assumptions and value,
      and the lawyer explains the legal terms. If technical problems or limitations are noted in the report, include an engineer
      or architect.
    buyer_checks:
    - Check that the rating is for the correct object, purpose and grade.
    - Read the assumptions, limitations and documents used.
    - Calculate the out-of-pocket costs and costs at a lower valuation.
    - Do not treat the appraisal as credit approval or legal verification.
- key: document.handover_protocol
  slug: priemo-predavatelen-protokol-imot
  kind: document
  locale: en
  category: handover_operation
  title: Property handover record
  summary: Records the property's condition at handover, the keys and documents received, meter readings and any defects found.
  aliases:
  - receive handover protocol
  - handover protocol
  - handover of keys
  - apartment protocol
  keywords:
  - defects
  - remarks
  - possession
  - keys
  - meter readings
  - photos
  related_stage_keys:
  - building.handover
  related_document_keys:
  - document.title_deed
  - document.commissioning
  - document.warranty_documents
  - document.maintenance_agreement
  related_term_keys:
  - term.possession_ownership
  - term.defects
  - term.warranty_period
  - term.utility_connection
  - term.garage_parking
  source_ids:
  - obligations_contracts
  - construction_warranties
  source_checked_at: '2026-09-05'
  content_version: 2
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    what: |-
      The handover record is signed by both parties and describes the property and its condition at the time of handover. It can list rooms, appurtenances, keys, appliances, meter readings, documents, visible defects and agreed follow-up actions.
      The protocol proves what has been transmitted, but does not transfer ownership. The notarial transfer, commissioning and transfer of possession may be on different dates.
    when: Signed upon handover of possession or keys as per contract. Its draft must be seen in advance, and the inspection
      must be done in daylight and with sufficient time, not immediately before formal signing.
    who: It is signed by the transmitting and receiving parties or by their respective representatives. A technical specialist
      may participate in the inspection and prepare an application with remarks, but does not sign for the parties.
    why: The protocol is the main evidence of what was received and what problems were reported in the handover. A "no
      objection" wording can make it difficult to dispute visible defects, missing items or undelivered documents.
    establishes: Establishes what the parties specifically described as delivered, accepted, missing or disputed on the date.
      May fix a time limit and person responsible for removal if clearly recorded.
    not_establish: It does not replace a notarial deed, use permit, cadastral scheme or warranty rights. It does not
      prove the absence of hidden defects and does not automatically mean that all contractual obligations have been finally
      fulfilled.
    compare: Check identifier and contract number, premises and accessories, agreed degree of completion, flooring and installations,
      common parts, parking space/garage, keys, remotes, appliances, readings, photos, documents, defects, deadlines and contacts.
    before_after: Prior to the protocol, a technical inspection and comparison with the contract, the project and the specification
      are made. It is followed by tracking of defects, warranty notices, utility accounts, charges and actual use of the property.
    payment: The signing may be related to a final payment or release of a withheld amount under the contract only. Do not
      sign an unremarked acceptance or payment confirmation that does not match the facts.
    availability: Mesto does not retrieve or store the private protocol. The education page and the sample list do not prove
      that the handover has taken place or that a particular defect has been claimed in a timely manner.
    where: Request the project from the seller or investor and prepare your own list. The signed copy, photos and attachments
      must remain with you in legible and dated form.
    professional_review: A technician is most helpful for inspections and accurate descriptions. A lawyer is needed for refusal
      to list defects, pressure for a general release of claims, or a payment and possession dispute.
    buyer_checks:
    - Inspect and describe each room, fixture and common area being transferred.
    - Write down the defects specifically with a photo, place, deadline and responsible person.
    - Count keys, remotes, appliances and documents handed over.
    - Do not sign a general "no comments" if the factual situation is different.
- key: document.warranty_documents
  slug: garantiyni-dokumenti-i-defekti
  kind: document
  locale: en
  category: handover_operation
  title: Warranty documents and defect report
  summary: Contracts, warranty cards, reports and correspondence show when a defect was discovered and reported and what was
    done about it.
  aliases:
  - warranty card
  - warranty conditions
  - defective protocol
  - list of defects
  - complaint to builder
  keywords:
  - warranty
  - defect
  - notification
  - term
  - repair
  - acceptance
  related_stage_keys:
  - building.handover
  related_document_keys:
  - document.handover_protocol
  - document.technical_passport
  - document.maintenance_agreement
  related_term_keys:
  - term.warranty_period
  - term.defects
  - term.bds_finish
  source_ids:
  - construction_warranties
  - obligations_contracts
  - ordinance_3
  source_checked_at: '2026-09-05'
  content_version: 1
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    what: |-
      There is no one standard form called "warranty documents". The kit may include contract warranty clauses, regulatory terms, equipment warranty cards, instructions, handover protocols, defect lists, and follow-up correspondence.
      It is important for the buyer that the documents clearly link the specific problem, the date of its establishment, the written notification, the person responsible and the repair performed.
    when: Preparation begins before delivery, when the contract and warranty conditions are read. Documentation continues
      at inspection and whenever a defect occurs, without waiting for the problem to get bigger or the deadline to expire.
    who: Depending on the problem and the contract, the seller, the builder, the investor, the supplier or the repairer may
      be liable. The buyer should notify the correct person, and a technician can help describe the cause.
    why: Verbal "we'll fix it" hardly proves when and what was stated. Good documentation proves that you gave timely notice,
      shows the development of the defect, and helps distinguish poor performance from improper operation or a general part
      problem.
    establishes: 'Each document establishes a specific fact: contractual term, equipment handed over, visible defect, date
      of notification, repair performed or failure. Together, they indicate the sequence of events, but do not guarantee the
      outcome of a possible dispute.'
    not_establish: A warranty card does not prove that the construction defect is recognized; the record does not prove guilt
      if it is one-sided and unclear. Expiration of one contractual term does not automatically resolve all possible rights
      and responsibilities.
    compare: Check who is responsible for which items, from which start date, term and exceptions; how to notify; addresses
      and contacts; response time; access for repair; acceptance of repairs and impact on common areas and insurance.
    before_after: Before the defect, there are the specification, the technical inspection and the handover protocol. After
      the notification, the answers, visits, photos and acceptance of the repair are kept; in case of inaction, proceed to
      professional evaluation and legal action.
    payment: Whether you can keep part of the last payment depends on the contract and applicable law. If there are defects,
      do not unilaterally decide to deduct amounts - check the contractual procedure and seek legal advice.
    availability: Mesto does not accept complaints and does not monitor warranty periods for a specific property. It cannot
      ascertain from public data whether a defect has been claimed, acknowledged or corrected.
    where: Collect the documents from the seller, the investor, the manager and the suppliers at the handover. Send notifications
      via the provable channel of the contract and keep copies, photos, incoming numbers and visit protocols.
    professional_review: An engineer or construction specialist determines the nature and probable cause of the defect. A
      lawyer is needed for a significant damage, refusal, warranty period dispute, common part or action that may affect the
      evidence.
    buyer_checks:
    - Collect the contract terms, warranty cards and contacts before handing over.
    - Document the defect with date, location, photos and measurables.
    - Send a notification via the provable contractual channel.
    - Accept the repair with a new protocol and note the remaining issues.
- key: document.condominium_documents
  slug: dokumenti-etazhna-sobstvenost
  kind: document
  locale: en
  category: handover_operation
  title: Condominium documents
  summary: The rules, minutes, budget, contracts and condominium register show how the building is managed and which decisions
    and costs affect you.
  aliases:
  - protocols at the entrance
  - home book
  - condominium book
  - decisions of the general assembly
  - entrance fee
  keywords:
  - general assembly
  - manager
  - budget
  - repair
  - common parts
  - obligations
  related_stage_keys:
  - building.handover
  related_document_keys:
  - document.technical_passport
  - document.maintenance_agreement
  - document.title_deed
  - document.handover_protocol
  related_term_keys:
  - term.condominium
  - term.ideal_shares
  - term.appurtenant_parts
  - term.warranty_period
  source_ids:
  - condominium_law
  - property_law
  - obligations_contracts
  source_checked_at: '2026-09-05'
  content_version: 1
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    what: |-
      Condominium documents include bylaws, minutes and resolutions of the general meeting, budget and reports, condominium book, contracts with the manager and suppliers, and documents for repairs according to the specific building.
      There is no single sheet that tells the whole story. The buyer should read a sequence of decisions and ongoing obligations, especially with a major renovation or a professional manager coming up.
    when: They must be reviewed before buying a ready-made home and when moving into a new building. After the acquisition,
      the new owner must become involved in the management and know the applicable rules, fees and decisions.
    who: They are compiled and kept by different authorities and participants in the condominium according to the type of
      document - the general meeting, the manager or the management board, the control body or the professional manager. The
      seller should facilitate access to the relevant information.
    why: Fees, accrued repairs, disputes, roof, facade and elevator condition and management contracts can change the real
      cost of ownership. The beautiful apartment does not show the financial and technical condition of the common areas.
    establishes: Each document establishes a specific decision, report, rule, contract, or written information within its
      scope. Regularly adopted decisions can bind the owners according to the law and the specific circumstances.
    not_establish: A record does not prove that the decision has been fulfilled, that there are no other obligations, or that
      all procedures are lawful. A confirmation from the seller "there are no problems in the entrance" does not replace the
      documents and a conversation with the manager.
    compare: Check recent minutes, budgets and reports, amount and basis of fees, Repair and Renewal Fund, arrears, planned
      repairs, contracts, litigation, insurance, technical passport and rules for the use of common parts.
    before_after: Before the transaction, up-to-date information is collected and the obligations of the seller are specified.
      After the acquisition, the buyer notifies management accordingly and receives information on how to send messages, pay
      fees and receive decisions.
    payment: Management and repair fees are separate from the purchase price. The preliminary or notarial contract should
      clearly allocate old obligations, already voted installments and expenses due around the date of surrender.
    availability: Mesto does not retrieve documents from the private condominium and does not know whether a particular apartment
      is in arrears. A public property report cannot replace this inspection.
    where: Request the documents through the seller and the manager/management board, keeping the personal details of the
      other owners safe. For key statements and obligations, ask for written, up-to-date information.
    professional_review: A lawyer is needed for controversial decisions, large liabilities, long-term management contracts
      or lawsuits. An engineer reviews scheduled repairs and common area technical issues.
    buyer_checks:
    - Read the latest decisions, budget, reports and renovation plan.
    - Determine the amount, basis and arrears of current fees.
    - Check contracts with manager, maintenance, elevator and key suppliers.
    - Distribute old obligations and already voted installments in writing.
