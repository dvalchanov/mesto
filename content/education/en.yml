  - term.utility_connection
  source_ids:
  - cadastre_law
  - zut
  - property_law
  - registry_certificates
  - egov_tolerance
  source_checked_at: '2026-09-05'
  content_version: 2
  editorial_status: published
  professional_review_status: pending
  sections:
    understand: |-
      A house or lot should not be checked against an apartment listing. In addition to ownership and encumbrances, the boundaries of the land, legal and actual access, structural conditions, all buildings and outbuildings, water, electricity, sewage, easements and restrictions on future use are important.

      A house has at least two related objects - the land and the building - and sometimes several buildings of different status. With a plot of land, the main question is not only "can it be built", but what, under what conditions, with what access and infrastructure and after what additional procedures.
    verify: |-
      Compare the cadastral boundaries with the property document, the terrain situation and the fences. Check whether the access is via a public road, private property, common areas or other people's terrain and how it is arranged. Establish the purpose, regulation, effective plan, restrictions and possible easements.

      For each building and annex, check its identity, building documents and legal status according to the time of construction. The fact that the building is visible in the cadastre or has been in use for a long time does not in itself prove legality or the right to redevelopment.
    documents: |-
      The basic kit includes the documents and history of ownership, an up-to-date sketch, a certificate of registration, layout information, the applicable PUP and access and network data. For a house, add permits, projects, introduction documents, technical passport or other available construction documents for each building.

      If a toleration, right of way, right of construction or annexation is claimed, ask for the correct document and read its subject matter. A promise "there is electricity and water nearby" does not indicate technical possibility, price, capacity or right of connection.
    money: |-
      The total budget may include surveying, design and engineering studies, strengthening, roof and installation repairs, access provision, connection to networks, septic system, removal or legalization of buildings and future construction. Their amount depends on the specific property and cannot be reliably estimated with a general percentage.

      When financing, confirm how the lender treats the land, buildings, documentation and necessary repairs. A credit assessment does not prove that the proposed development is permissible or that access is arranged.
    risks: |-
      Caution signals are a fence that does not follow the boundary; access "by appointment"; building without clear documents; different areas; network without a joining document; an easement or restriction that crosses the construction zone; and a promise of future change of plan as a sure outcome.

      In case of co-ownership, determine what is actually acquired and used. An ideal piece of land is not automatically a physically separate yard, and a distribution of use is not the same as a change of ownership.
    professionals: |-
      The lawyer checks rights, history, access, encumbrances and contracts. The surveyor works with boundaries and surveying; the architect - with the structural possibilities and projects; the engineers - with structure, soils and networks. The municipality and operators provide official information within their competence.

      Choose the specialists according to the purpose: the purchase of an existing house, renovation, extension and new construction are different tasks. Mesto gives a general orientation, but does not replace a specialized survey of the terrain and buildings.
    act: |-
      Formulate in advance how you intend to use the property. Give this objective to the solicitor, surveyor and designer to check not only the current status, but also whether your plan is realistic according to the available rights and restrictions.

      Visit the property with an appropriate specialist when boundaries, slope, drainage, construction or networks are essential. Write down any claims the seller makes that need to be proven before payment.
    next: |-
      When the documents and specialized checks outline the real object and the possible use, move to the chronological direction of your moment - before the deposit, contract or notarial transfer.

      If a key issue depends on a future permit, plan, or accession, treat it as an unknown. Set out explicitly in the contract what happens if the expected event does not occur.
    buyer_checks:
    - Compare the title deed, the cadastre, land boundaries, fences and every building.
    - It established the legal and factual basis for access to a public road.
    - Check the regulation, purpose, restrictions, easements and your actual purpose of use.
    - Ask for separate evidence of building documents and networks, instead of relying on the visible.
    - Make a specialized budget and review with a lawyer, surveyor, architect or engineer as appropriate.
- key: building.land_planning
  slug: zemya-planirane-proekt
  kind: stage
  locale: en
  position: 1
  title: Land, planning and design
  summary: Before construction begins, clarify the rights over the land, the planning rules and the proposed design.
  aliases:
  - project
  - terrain
  - planning
  related_stage_keys:
  - building.authorization
  related_document_keys:
  - document.design_visa
  - document.pup
  related_term_keys:
  - term.upi
  - term.right_to_build
  source_ids:
  - zut
  - nag
  source_checked_at: '2026-09-04'
  content_version: 2
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    concise_answer: This is the preparatory stage. Here it is clarified who has the right to build, what the current plan
      allows and how these conditions are reflected in the building design. No single reference alone answers all questions.
    key_points:
    - The land parcel and the UPI do not always have the same boundaries and designations.
    - A design visa is not a building permit.
    - The right to the land and the right to build must be considered separately.
    physical: |-
      Before the excavation, there is work that is almost invisible from the street: geodetic surveying, field surveys, baseline data, assignments and development of the project parts. The architectural solution is coordinated with construction, installations, access, fire safety and other requirements for the specific construction.

      During this period, the advertisement preview may change because not every solution shown is necessarily part of a final approved project. Lack of physical activity does not necessarily mean lack of preparation, and a fence or clearing of the field does not in itself prove a permitted construction.
    documents: |-
      The planning basis may include a valid PUP and design permit. Documents establishing rights over the land or a right to build, and the subsequently approved investment projects, must be checked separately. Each answers a different question.

      Compare the cadastral PI with the regulated property, the neighborhood, the purpose and the building regime. If the project is in phases, identify which document relates to the particular phase and whether access, parking or external links are part of the same scope.
    importance: |-
      This is where the basic conditions for future construction are defined: what may be built, how access will be provided, which restrictions apply and on what basis the developer has the right to build. A discrepancy in the site, phase or project version may mean that the advertised layout does not match the approved project.

      It is also important for the buyer to know what has not yet been decided. The early draft carries more unknowns; they should be reflected in the way you compare bids, review contracts, and plan timelines and costs.
    not_meaning: |-
      An approved PUP or an issued visa is not a building permit. It does not prove that construction can begin immediately, that the final design has been approved or that the apartment shown will be executed exactly as visualized.

      A title document for the land does not automatically establish rights to the future unit, while the cadastral map does not guarantee ownership or absence of encumbrances. None of these early documents says when construction will be completed.
    discover: |-
      Identify the exact land parcel, the developer and the legal basis for the right to build. Ask for a clear distinction between the PI, the UPI, the individual phases and the unit being offered.

      Find out which version of the project you're seeing and which parts have already been approved. Ask how access, parking, common areas and external connections are dealt with, rather than taking it from the ad scheme.
    verify:
    - Compare PI, UPI, address, neighborhood, boundaries and purpose; note any difference that needs to be explained.
    - Ask for the documents that show the ownership of the land or the right to build, and review them with an independent
      lawyer.
    - Determine whether the offer is for a specific phase, block and future unit, rather than only a trade name for the complex.
    - Compare the advertised layout and specification with the current project version, and keep the version that will be attached
      to the contract.
    - Ask which elements - access, landscaping, parking and connections - are in the same project and which depend on separate
      procedures.
    helpers: |-
      An architect or engineer can read layout specifications and design constraints and tell the difference between an idea, an approved part, and an actual implementation. A land surveyor is suitable for boundary and land identity issues.

      An independent lawyer verifies the real rights and conditions in the contract. The municipality maintains the relevant planning and construction files, but the administrative reference does not replace the legal verification of the specific case.
    next: |-
      The next step is authorization of the specific construction based on the approved documents. When a permit is presented, check the issuer, developer, property, description, phase and effective date.

      Do not assume that the early documents and permit cover the same scope: one marketing name may span several separate permits or stages.
  actions_by_buyer_stage:
    researching: Compare the location and layout conditions without accepting the renderings as part of the approved project.
    before_deposit: Before payment, ask for the exact identity of the land, the right to build and the project version to
      which the offer refers.
    default: Ensure that the contract and appendices refer to the same project, phase and future unit.
- key: building.authorization
  slug: razreshenie-za-stroezh
  kind: stage
  locale: en
  position: 2
  title: Building permit
  summary: The permit states what may be built, identifies the developer and lists the approved designs. It does not prove
    that construction has started or been completed.
  aliases:
  - building permit
  - building permit
  related_stage_keys:
  - building.land_planning
  - building.commencement
  related_document_keys:
  - document.building_permit
  related_term_keys:
  - term.right_to_build
  source_ids:
  - zut
  - nag
  source_checked_at: '2026-09-04'
  content_version: 2
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    concise_answer: The building permit is the administrative act authorizing the described construction under the approved
      conditions. Read its scope, developer, property, phase and dates - not just its number.
    key_points:
    - Check whether the permit has entered into force and whether it was amended later.
    - A document can only cover a phase, block or infrastructure element.
    - Issuing it does not prove that construction has started or finished.
    physical: |-
      The permit creates the administrative possibility to carry out the described construction, but there may not yet be substantial work on the ground. Organization of the site, determination of the participants and fulfillment of the requirements for a lawful start are pending.

      Visible clearing, fencing or delivery of machinery does not in itself indicate that construction has commenced in accordance with the applicable order. Also, the permit date does not allow the current physical progress to be calculated.
    documents: |-
      The construction permit and the approved investment projects are reviewed, as well as the entry into force data. If there is a supplement, amendment, revalidation or change of participants and scope, these subsequent acts are part of the picture.

      The title "building permit" is not enough. The document can be for a specific building, block, stage, underground part or infrastructure. Check whether the apartment from the offer actually falls into the described construction.
    importance: |-
      The permit sets the legal and design identity of the permitted construction. A difference in developer, UPI, block, phase, purpose or project number may make the document inapplicable to the property you are looking at.

      For an early stage purchase, this document is the starting point for the contract and attachments. It helps to ask the right questions, but it should be linked to the rights of the seller, the project specification and the terms of payment.
    not_meaning: |-
      The permit does not prove that the seller owns the promised future object or that there are no encumbrances on the land and the right to build. It does not certify that construction has already begun or that what has been completed corresponds to the design.

      It is not evidence of rough construction, Act 14, Act 15 or commissioning. Neither the date nor an elapsed period from it allows one to reliably assume completion.
    discover: |-
      Find out who the developer is, how the construction is described and which project sections have been approved. Trace the link to the exact UPI/PI and to the block or phase containing the future unit.

      Ask if there are subsequent orders or changes and how they affect the layout, area, purpose, common areas and terms described in the offer and contract.
    verify:
    - Compare the developer, UPI/PI, address, construction description, block, stage and construction category.
    - Request verifiable entry into force data and a list of any subsequent additions, amendments or recertifications.
    - Link the number and date to the design version that describes the specific apartment and will be attached to the contract.
    - Check who the builder, designers and construction supervisor are without confusing their responsibilities.
    - If the document is found by cadastral identifier, read the scope itself; a search match does not in itself prove applicability.
    helpers: |-
      The issuing authority and the municipality maintain the administrative file. An architect or engineer can compare the permit with the design parts and recognize changes in the technical scope.

      An independent lawyer monitors the rights of the developer and the seller and the relationship between the permitted construction and the contract. Neither the broker nor the investor's employee is a substitute for this independent verification.
    next: |-
      Next come the formal opening of the construction site and, where required, the setting of the construction line and level. Separate documents record these steps - a building permit alone does not prove that the site has been opened.

      Then the excavation, strengthening and foundations begin. Track completed work and documents separately, as they may appear at different times.
  actions_by_buyer_stage:
    researching: Check that there is a permit for the exact project and don't infer current physical progress from its date
      alone.
    before_preliminary_contract: Have the authorization and amendments identified in the applications or verified before signing.
    default: Compare the permitted scope with the subject of your contract.
