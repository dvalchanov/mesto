  - term.garage_parking
  - term.appurtenant_parts
  source_ids:
  - cadastre
  - registry_certificates
  - property_law
  source_checked_at: '2026-09-05'
  content_version: 1
  editorial_status: published
  professional_review_status: pending
  sections:
    understand: |-
      Shortlisting is when ad options need to become specific properties. For each option, find out exactly what is being sold: a detached property, undivided shares, building rights, accessories and possibly a parking space. The same word in two advertisements may describe different rights.

      Compare not only the features, but also the unknowns. A property with a lower price but an unclear area, in need of major repairs or an uncertain deadline may be a bigger commitment. Separate the verifiable fact from the promise and from the personal evaluation after inspection.
    verify: |-
      Match the address, ID, floor, site number, area, purpose and fixtures between the scheme, title deed, project and offer. During construction, check to which block, entrance and phase the permit and announced stage apply. For a completed home, compare the actual layout with the plan and ask about significant remodeling.

      Do more than one inspection when the decision is serious. Check common areas, access, elevator, moisture, installations, exposure, noise and signs of repairs. Visible status is not a substitute for a technical review, but it helps you formulate the right questions.
    documents: |-
      For each option in the short list, ask for a diagram or a precise description of the object in the project, a document of ownership or basis for the future right, up-to-date information on encumbrances and relevant construction documents. If the offer includes a warehouse, garage or parking space, request a separate description of what right you will acquire.

      Don't compare a document by title alone. Record the issuer, number, date, scope and its relationship to the exact property. If the seller does not provide a document before payment, this is a fact that should play a part in your decision.
    money: |-
      Make a budget for each option with the same lines: price, taxes and fees, financing, repair or finishing, furnishings, professional inspections, parking and maintenance. If you can't move in right away, add the cost of rent or another temporary solution.

      Don't use the bank valuation as proof that the price is good or that the property has no legal problems. It serves a specific credit purpose and may be based on assumptions other than those relevant to your decision.
    risks: |-
      Common warnings are a discrepancy in areas, a parking space without a clear right, promised changes without a contractual application, a seller or intermediary with unclear representation and a request for payment before the document package. A discrepancy does not necessarily prove a problem, but it does require explanation and proof.

      Also beware of "comparable" offers that are at different stages of construction, with different degrees of completion, or with incomparable common parts. Level the playing field before deciding which price is actually lower.
    professionals: |-
      An independent attorney reviews rights, burdens, representation and contractual risk. An architect or engineer can assess layout, condition, alterations and finishes. The lender confirms its own terms and conditions.

      Turn on the specialists before irrevocable payment. An oral comment on an inspection is not equivalent to a review of the specific documents and does not create responsibility for matters outside the assigned task.
    act: |-
      Put together for each option a one-page file: exact subject, basic evidence, total budget, unknowns and reason for remaining on the list. Set a deadline for receiving the missing documents that does not depend on artificial urgency.

      Then choose not just your favorite property, but the option for which you understand what you are acquiring, what you are paying and what risks you are taking. If two options remain close, prefer the one for which there is more complete and verifiable information.
    next: |-
      Next is a reservation or down payment only if you already have an exact subject, a draft of the conditions and enough information to assess what happens in the event of a problem. If there is no payment, proceed to the preparation of the preliminary contract.

      Returning to study is not a failure. It is the right move when no option meets the mandatory conditions or the seller does not provide the necessary information.
    buyer_checks:
    - For each option, write down the exact cadastral identifier or a sufficiently clear description of the project.
    - Compare the offer, scheme, title deed and actual allotment in one table.
    - Record separately the right to a parking space, warehouse, yard and other accessories.
    - Calculate the total cost and time to actual use for each option.
    - Remove from the list options where a key unknown remains without a verifiable answer.
- key: guide.before_deposit
  slug: predi-rezervatsiya-ili-kaparo
  kind: guide
  category: buyer_journey
  buyer_stage: before_deposit
  locale: en
  title: Before reservation or deposit
  summary: Before you pay, check to whom and for what you are paying, what each party takes on and in which cases the amount
    is returned.
  aliases:
  - before caparo
  - reservation deposit
  - reservation fee
  keywords:
  - reservation
  - down payment
  - assignment
  - return
  - payment
