  content_version: 1
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    what: |-
      A certificate of tolerance refers to certain older structures built without the necessary building permits, which fall under a specific transitional regime and were permissible under the applicable rules. It certifies an assessment of the tolerability of the described construction.
      "Tolerated" does not mean "regularly permitted as new construction". The document has a limited function and should be read together with the year of construction, scope and all other rights and facts.
    when: It most often appears when buying an older home, house, extension, outbuilding, garage or alteration for which there
      are no complete building documents. Not every old or unposted object can receive such a certificate.
    who: It is issued by the competent municipal administration after application and evidence according to the applicable
      regime. The owner presents facts and documents, but the administration does the certification for the specific construction
      described.
    why: The buyer must establish whether the building or alteration they see and are paying for has a documented legal status. An outbuilding or terrace
      may increase the advertised area without forming part of the legally described property.
    establishes: Determines that the precisely described construction is accepted as tolerable under the specified legal regime
      and based on the data presented. The object may be only part of the visible development.
    not_establish: It is not a building permit, a legalization act or a commissioning certificate. It does not prove ownership,
      structural safety to date, correct use of all premises or automatic cadastral registration.
    compare: Check the issuer, number and date, legal basis, year and description of the construction, area, location and owner
      on file. Compare with sketch/diagram, notarial deed, architectural survey and the actual situation.
    before_after: Evidence of construction time and eligibility is collected prior to issuance. Separate cadastral, real property
      or technical actions may then be necessary; the certificate does not do them automatically.
    payment: Don't pay extra for acreage or building just because the seller promises a future certificate. If the document
      is a condition of the transaction, describe who provides it, for which object and what happens in case of refusal or
      narrower scope.
    availability: Mesto does not automatically retrieve tolerance certificates from a single national register. The absence
      of a digital record is not proof of either the absence or presence of status.
    where: Request the document and all relevant files from the seller and confirm with the competent municipality. Checking
      only in the cadastre is not enough, because the application is not an independent guarantee of construction legality.
    professional_review: An architect or engineer compares the visible building with the survey and assesses compliance. A lawyer checks
      that the document covers the subject matter of the transaction and how the residual uncertainty is settled before payment.
    buyer_checks:
    - Determine exactly which construction or alteration is covered by the certificate.
    - Compare the actual situation with the scheme, the notarial deed and the recording.
    - Do not equate tolerance with a building or entry permit.
    - Request a professional inspection if you are buying an area that is missing from the title deed.
