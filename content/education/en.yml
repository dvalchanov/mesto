  professionally_reviewed_at: null
  sections:
    what: |-
      The property certificate shows the entries, markings and deletions for the specified property for the requested period according to the data in the registry office. In it, you can see title deeds, mortgages, foreclosures, claims and other recordable circumstances.
      The colloquial "clean certificate" is a dangerous acronym. The output depends on which property is described, which owners are traced, from which starting date and to which date the inquiry is made.
    when: It is necessary before a significant non-refundable payment and immediately around the notarial transfer according
      to the organization of the inspection. With a long period between the preliminary and final contract, it is reasonable
      to monitor for new entries.
    who: It is issued by the Registration Agency through the relevant registration office. The applicant specifies the property,
      the persons and the period. Therefore, a certificate may be regularly issued, but not cover the entire property or the
      required period.
    why: A registered mortgage, foreclosure or dispute may affect the acquisition and payment method. The buyer needs to see
      not only if there is a record, but if it is expunged, what part it weighs on, and how it will be settled before or concurrently
      with the transaction.
    establishes: Officially establishes the result of the inquiry for the accurately described scope and period as of the
      date of issue. If it contains entries, they should be parsed by type, order, subject, and status.
    not_establish: It does not guarantee the absolute absence of any legal risk, does not investigate unrecordable relationships,
      and does not correct wrong ID or incomplete history. The old certificate does not cover new entries after its expiry
      date.
    compare: Check the applicant, office, property and identifier, owners and previous descriptions, start and end date, all
      deeds and notes. Compare the data with the ownership documents and request the registered deeds themselves in case of
      an unclear entry.
    before_after: Identity and ownership history are clarified prior to certification so that the correct scope is claimed.
      After the result, deletions, bank consents, simultaneous payments or rejection of a deal are planned according to the
      specific risk.
    payment: It does not make a meaningful payment only for a promise of future deletion. If there is a mortgage or other
      encumbrance, the contract and payment mechanism must precisely address the payee, amount, discharge document and sequence.
    availability: Mesto does not issue a certificate of encumbrances and does not carry out an official ownership check. Data
      from a public report or cadastre must not be presented as a certificate from the Property Registry.
    where: It is applied through the Registration Agency according to the applicable procedure. The lawyer or the notary can
      organize the current reference and request copies of the specific registered acts.
    professional_review: A lawyer must determine the correct period and persons, read the entries and build a safe sequence
      for deletion and payment. The notary checks the transaction, but does not arrange protection only for the buyer.
    buyer_checks:
    - Check the exact property, all previous descriptions and the period being checked.
    - Ask for copies of the registered acts that are not clear only by title.
    - Update the reference close enough to the transaction.
    - Arrange the deletion and payment as one clear sequence.
- key: document.tax_assessment
  slug: udostoverenie-danachna-otsenka
  kind: document
  locale: en
