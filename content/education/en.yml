  sections:
    what: |-
      The sketch is an official document from the cadastre for a land parcel or a building, and the scheme for an self-contained unit in a building, for example an apartment, garage or studio. They visualize and describe the data from the cadastral map and registers at the time of issue.
      Choice is not a matter of preference. If you are buying an apartment, the usual document for the object itself is a plan; the land and the building have their own separate identifiers and documents.
    when: They are used when verifying an offer, preparing a deal, mortgage financing, inheritance, partition or established
      discrepancy. In the case of new construction, there may first be only design designations, and the self-contained unit
      may be registered in the cadastre later.
    who: They are issued by the Agency for Geodesy, Cartography and Cadastre through the offices and electronic services according
      to the applicable order. A copy from a seller or broker must retain the number, date and issuer so that it can be verified.
    why: The buyer sees the identifier, location, floor, designated use, area and adjoining properties recorded in the cadastre.
      This allows real comparison with the notarial deed, contract and inspection, instead of just buying by address or extension
      number.
    establishes: Establishes the cadastral data for the precisely specified object at the moment and the scope of the service.
      It may contain data on registered owners and deeds, but these are part of the cadastral register, not a stand-alone
      resolution of a title dispute.
    not_establish: It does not guarantee title, freedom from encumbrances, legality of construction, actual interior area
      or identity with advertising layout. A registered object is not automatically authorized for use, and a missing online
      document does not mean that a right does not exist.
    compare: Check the document type, number and date, identifier, address, floor, unit number, designated use, area, appurtenant parts
      and adjoining properties. Trace previous identifiers and changes, and make sure the title deed describes the same property.
    before_after: The current cadastral map or the amendment procedure is available before the issue. Once the identity is
      confirmed, the title documents, entries, encumbrances, building documents and actual condition are checked separately.
    payment: A sketch or scheme alone is not sufficient reason to pay a deposit. If the contract requires cadastral registration before
      transaction or payment, describe the exact object, the permissible differences and what happens with a different use
      or area.
    availability: Mesto can work with public cadastral data and an identifier provided, but does not issue an official sketch
      or scheme and does not guarantee that the displayed record is the current transaction document.
    where: The official document is declared through KAIS or the relevant SGKK. Ask the seller for the copy, but for a transaction
      or dispute, use an up-to-date official document and compare it with the other papers.
    professional_review: A surveyor is suitable when borders, area or objects diverge. An architect verifies the purpose and
      alterations, and the lawyer and the notary compare the cadastral data with the title deed and the project of the transaction
      within their roles.
    buyer_checks:
    - 'Choose the right document: a sketch for land or a building, and a scheme for a self-contained unit.'
    - Match the ID, purpose and neighbors with the deed.
    - Check previous IDs and recent changes.
    - Research ownership, encumbrances and building status separately.
- key: document.title_deed
  slug: notarialen-akt
  kind: document
  locale: en
  category: property_identity
  title: Notarial deed
  summary: An official deed that transfers or certifies rights to property. Read it together with previous title deeds and
    current registry entries.
  aliases:
  - notarial deed of purchase and sale
  - title deed
  - title to property
  - ascertaining notarial deed
  keywords:
