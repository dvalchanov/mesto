  source_checked_at: '2026-09-05'
  content_version: 1
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    definition: |-
      A mortgage is a security on real estate in favor of a creditor. It is established or comes into being on a prescribed basis and is entered by describing the creditor, owner, property and secured claim.

      The creditor can be satisfied preferentially from the price of the mortgaged property, regardless of whose ownership it is. Therefore, the subsequent sale is not in itself a deletion.
    example: |-
      The seller has a mortgage loan and proposes that part of the sale price be paid directly to the bank. Without a verified bank account, exact amount, lender confirmation and clear cancellation sequence, the buyer cannot know whether the property will be acquired free of the mortgage.

      Verbal assurance "the loan is almost paid off" is not enough.
    confusion: |-
      The balance on the loan and the amount for which the mortgage is entered are not necessarily a single number. Repayment of the obligation and deletion of the entry are also separate actions that must be proven.

      A land mortgage may require an analysis of how it covers the built and sold object; no automatic inference is made from the address alone.
    importance: |-
      For the buyer, the outstanding mortgage may allow foreclosure on the property already acquired. It affects own bank financing and enforces synchronization between creditors, payment, documents and entry.

      A mortgage deal isn't necessarily impossible, but it does require an accurate, professionally reviewed process instead of a post-payment promise.
    related: |-
      Request an up-to-date certificate, the mortgage deed to the required extent and an official document from the creditor for the balance and conditions for cancellation. Let the lawyer and the notary sort out who pays, to which account, what is signed and when the expungement is filed.

      Recheck the entries immediately before the transaction and receive proof after the agreed procedure has been completed.
