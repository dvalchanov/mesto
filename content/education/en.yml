  - term.condominium
  source_ids:
  - zut
  - dnsk_commissioning
  - ordinance_3
  source_checked_at: '2026-09-05'
  content_version: 1
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    definition: |-
      A utility connection involves the technical and contractual steps through which a building or unit gains access to the electricity, water, sewerage, heating or another network. A completed service branch, an installed meter, an active supply and an individual customer account are separate milestones.

      For each service, the operator, conditions and documents are different and should be checked separately.
    example: |-
      An apartment may have an electricity meter and working lights while its temporary supply is still arranged through the builder and an individual household account cannot yet be opened. In another case, the building may already be commissioned, but the owner must personally submit documents to transfer or open an account.

      The presence of electricity does not prove that the supply is permanent or that an individual account can be opened.
    confusion: |-
      "There is electricity and water", "the building is connected", "there are separate meters" and "you can open an individual account on a household tariff" are different statements. A shared construction supply does not prove the final status of every unit.

      The commissioning document is important but does not replace the specific procedure with each operator.
    importance: |-
      For the buyer, unclear status can delay move-in, renovation or rental and create temporary conditions and dependency on the investor. Missing infrastructure around the project can remain a problem even when the internal installations appear complete.

      individual utility accounts also help to clearly allocate consumption and delivery obligations.
    related: |-
      Request a separate status for each utility: connection contract and conditions, completed service branch, acceptance records, permanent supply, meter and documents for an individual account. Find out who must pay the remaining fees and take the next step.

      When handing over, write down the numbers and readings of the devices and do not accept the general "it's done" without a specific operator and document.
sources:
