  sections:
    definition: |-
      "Rough construction" is a state of completed supporting structure together with the enclosing elements and the roof according to the legal definition. The acceptance of the construction is documented by Act form 14, but the act and the degree achieved are not the same.

      For various legal and contractual actions, additional verification of the stage reached and the exact individualization of the future object may be required.
    example: |-
      The building has signed Act 14, but the apartment does not yet have installations, screeds, joinery or finished common parts. The buyer's contract may require payment not only under "Act 14", but upon presentation of a specific document and notification in a specific order.

      It should also be checked whether the act covers the entire construction or a separate stage.
    confusion: |-
      Act 14, rough construction, cadastral registration, creation of an self-contained unit and possibility of notarial transfer are not five names of one action. None of these by themselves imply completion or authorized use.

      The percentage "70% ready" in advertising also has no automatic connection with this concept.
    importance: |-
      For the buyer, rough construction is often associated with a large payment, changing the type of acquired right or preparing for bank financing. If the stage is interpreted more broadly than the contract, funds may be paid before the required proof.

      Physical risk remains significant because much of the work and adoption is still to come.
    related: |-
      Ask for Act 14, the necessary certification for rough construction and information about the exact construction, block, section and stage. Compare them with the payment clause. Have an architect or engineer review the physical condition, and a lawyer review the contract and legal implications.

      The next question is, "What exact evidence, to what extent, and after what notice makes payment due?"
- key: term.off_plan
  slug: na-zeleno-badesht-imot
  kind: term
  category: construction
  locale: en
  title: Off-plan purchase and future property
  summary: A common term for buying before a property is completed. It is not a legal status and may involve different contracts
    and rights.
  aliases:
  - on green
  - future property
  - apartment under construction
  - purchase from an investor
  - new construction
  keywords:
  - preliminary contract
  - right of construction
  - payments
  - project
  related_stage_keys:
  - building.land_planning
  - building.authorization
  - building.act14
  related_document_keys:
  - document.preliminary_contract
  - document.building_permit
  - document.act14
  related_term_keys:
  - term.right_to_build
  - term.deposit
  - term.individual_object
  source_ids:
  - obligations_contracts
  - property_law
  - zut
  source_checked_at: '2026-09-05'
  content_version: 1
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    definition: |-
      A "green purchase" is a market term for a commitment to a property before the building or site is completed. It does not determine by itself what the buyer acquires today: there may be a preliminary contract, a transferred or promised right of construction, a future transfer of a site or another structure.

      What the buyer actually acquires depends on the parties, the ownership of the land, the registered rights, the project and the contracts.
    example: |-
      Two buyers are reservation apartments at the planning permission stage. One only signs a preliminary contract for future sale, and the right of construction is transferred to the other with a notarial deed. They both say "I bought on the green", but the rights vested and the time of vesting are different.

      Physical progress does not equalize contracts.
    confusion: |-
      Paying a price and signing a preliminary contract does not automatically make the buyer the owner of the apartment. A building permit does not guarantee completion, and the popularity of the investor does not replace the verification of the company, the land and the specific contract.

      "Reserved flat" can only mean a contractual promise, not a separate conveyed property.
    importance: |-
      The buyer assumes both construction, financial and contractual risk, as well as risk related to the rights to the property, because the payments precede the completed object. It should understand how the funds contributed are protected in the event of delay, project change, encumbrances or default.

      The earlier the stage, the more important are vendor verification and measurable milestones.
    related: |-
      Clearly state who owns the land, who holds the right to build, who the seller is, how the future unit is identified, which documents trigger payment and when title is transferred. Check encumbrances and financial dependencies before the first non-refundable payment.

      Contract consequences for delay, modification, suspension and inability to complete with independent counsel.
- key: term.bds_finish
  slug: po-bds-stepen-na-zavarshenost
  kind: term
  category: construction
  locale: en
  title: '"BDS finish" and level of completion'
  summary: Trade name for unfinished interior. What exactly will be performed depends on the technical specification to the
    contract, not the abbreviation.
  aliases:
  - according to BDS
  - BDS
  - degree of completion
  - putty and screed
  - on the cork
  keywords:
  - finishing works
  - specification
  - installations
  - handover
  related_stage_keys:
  - building.installations
  - building.handover
  related_document_keys:
  - document.preliminary_contract
  - document.handover_protocol
  related_term_keys:
  - term.defects
  - term.property_areas
  - term.utility_connection
  source_ids:
  - zut
  - obligations_contracts
  - construction_warranties
  source_checked_at: '2026-09-05'
  content_version: 1
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    definition: |-
      "By GST" is a widely used market label for the degree of internal completion, but in itself is not a sufficient technical specification of the apartment. Various vendors include various wall, screed, front door, fixtures, outlets, heating, appliances and finishes.

      For the buyer, the promised performance must be accurately described in an appendix to the contract - with materials, quantities, scope, and tolerances.
    example: |-
      A 'VAT' offer includes a fitted front door, plaster and socket outlets. Another uses the same expression but provides for a different wall treatment and does not include heaters or individual appliances.

      If you compare the bids by this tag alone, you may mistakenly assume that you are getting the same degree of completion for both prices.
    confusion: |-
      The abbreviation does not guarantee a specific national housing transfer package and does not prove quality of implementation. "Turnkey" is also a trade term if no specification is attached.

      The completed common part of the building and the completion inside the apartment must be considered separately.
    importance: |-
      For the buyer, a missed item becomes an unplanned expense and delay before moving in. An accurate specification allows for a comparison of bids, a completion budget and an objective handover inspection.

      It also defines what a defect or non-performance can be claimed against, instead of the dispute remaining at the level of a general advertising promise.
    related: |-
      Request a signed application for premises and systems: walls, floors, ceilings, doors, joinery, plumbing, electricity, heating, ventilation, measuring devices, terraces and common areas. Add brands or grades when promised and equivalent exchange procedure.

      When handing over, use the specification line by line with a technical specialist and enter the deviations in the protocol.
- key: term.gross_floor_area
  slug: rzp
  kind: term
  category: construction
  locale: en
  title: GFA - gross floor area
  summary: A measure of the building's area calculated under the applicable rules. It is not the area of a particular apartment
    and should not be confused with saleable floor area.
  aliases:
  - RZP
  - gross floor area
  - total area of ​​the building
  - built-up area of ​​the floors
  keywords:
  - building
  - floors
  - project
  - area
  related_stage_keys:
  - building.land_planning
  - building.authorization
  related_document_keys:
  - document.pup
  - document.design_visa
  - document.building_permit
  related_term_keys:
  - term.property_areas
  - term.upi
  - term.construction_category
  source_ids:
  - zut
  - mrrb_rzp
  source_checked_at: '2026-09-05'
  content_version: 1
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    definition: |-
      GFA means the unfolded built-up area and describes the sum of the built-up areas of the floors included according to the applicable regulatory definition. This is a design and layout indicator for a building or development, and not automatically the sum of the areas that are sold to individual buyers.

      Depending on the specific question, it should be checked which above-ground, under-roof and other areas are included in the calculation.
    example: |-
      The project may indicate a built-up area of ​​8,500 sq.m for the entire building, while the apartment in the offer is 92 sq.m "with common parts". The first number describes the scale and parameters of the building. For the second, it must be specified what the area of ​​the dwelling is and what common or appurtenant parts have been added.

      Dividing the total price by the living space does not give a price per square meter for the home.
    confusion: |-
      The built-up area is not the built-up area of ​​the building footprint, the net area of ​​the apartment or the cadastral area of ​​the stand-alone site. The colloquial "total square footage" can refer to an entirely different number.

      Do not assume by default that a certain level is on or off - this should be verified according to the regulatory methodology and the project.
    importance: |-
      For the buyer, the zoning plan helps explain the project's scale, development parameters, category and overall density, but it does not define what the buyer is acquiring. Confusing these figures with the home's area can distort a price comparison.

      When reviewing a project change, the RFP is one of the indicators that the architect can compare between the individual documents.
    related: |-
      Find out for which building, stage or permit the RZP is indicated and from which approved project the number comes. For the apartment, request a separate table for the area of ​​the object, undivided shares and accessories.

      Do not use the RZP as a substitute for checking the subject matter and square footage in your contract.
- key: term.construction_roles
  slug: investitor-vazlozhitel-stroitel
  kind: term
  category: construction
  locale: en
  title: Investor, developer and builder
  summary: 'Roles with different rights and responsibilities: who organizes and has the right to commission, who executes
    the construction and who makes the promises to the buyer.'
  aliases:
  - investor
  - developer
  - builder
  - entrepreneur
  - general contractor
  keywords:
  - seller
  - owner of the land
  - contract
  - construction participant
  related_stage_keys:
  - building.land_planning
  - building.authorization
  - building.commencement
  related_document_keys:
  - document.building_permit
  - document.site_opening
  - document.preliminary_contract
  related_term_keys:
  - term.right_to_build
  - term.off_plan
  - term.construction_papers
  source_ids:
  - zut
  - ordinance_3
  - dnsk_construction_control
  source_checked_at: '2026-09-05'
  content_version: 1
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    definition: |-
      The assignor is the participant who has the legal basis to assign and organize the investment process according to the specific construction. The builder performs the construction and installation works according to the contract and construction documents. "Investor" is a widely used business word and can refer to the sponsor, funder or related company.

      The seller under the contract with the buyer may be one of these persons or a separate company.
    example: |-
      The land is owned by company A, the right to build is established by company B, the permit lists B as the developer, the builder is company C, and the preliminary contract is offered by company D. The common mark of the project does not prove the authority between them.

      The buyer must trace the contractual and material connection to the promised object.
    confusion: |-
      The "investor builds" often mixes at least three different roles. The builder does not issue a building permit and is not necessarily the owner or seller; the developer does not necessarily perform the works with its own team.

      Similar names, a common site or one manager do not make the companies one legal party.
    importance: |-
      For the buyer, the roles show who can transfer title to the property, who gets paid, who makes construction claims, and who signs the individual deeds. A promise by a person who has not made a clear commitment may prove to be of no practical value.

      The representation, financial status and dependencies of the particular seller are also checked, not only the reputation of the brand.
    related: |-
      Compile a table with the EIC and the role of each participant: land owner, construction right holder, contractor, builder, supervisor, seller and payee. Associate each role with a specific act or contract.

      Ask who is responsible for delay, defect, project change, and non-transferability-and where it's signed off.
- key: term.construction_papers
  slug: stroitelni-knizha
  kind: term
  category: construction
  locale: en
  title: Construction documents
  summary: The collective term for approved designs, permits, orders, acts and protocols for a construction project. One document
    does not replace the others.
  aliases:
  - construction documents
  - construction documentation
  - construction file
  - approved projects
  keywords:
  - permission
  - project
  - act
  - protocol
  related_stage_keys:
  - building.authorization
  - building.commencement
  - building.act15
  related_document_keys:
