  professionally_reviewed_at: null
  sections:
    definition: |-
      "Clear", "built-up", "usable", "total" and "marketable" area can follow different statutory, design or contractual methodologies. With an apartment, the most important thing is to find out exactly what was measured, along which contours and which ideal or appurtenant parts were added.

      The cadastral area, the project area and the area in the title document can come from different documents and times. The difference is not automatically explained by the phrase "common parts".
    example: |-
      The offer may represent 92 sq.m of "total area", composed of 78 sq.m of built-up area of ​​the dwelling and added undivided shares. Separately, there can be a basement of 4 sq.m. The buyer should know which number determines the price and how each part will be described in the contract and deed.

      The price per square meter does not allow a reliable comparison if the area is calculated differently.
    confusion: |-
      Larger advertising square footage does not mean more usable living space. The percentage of undivided shares does not necessarily translate into outlined square meters, and the building's gross floor area is not the area of ​​the apartment.

      A difference between a project and a cadastre does not in itself prove a violation, but there must be a clear technical and documentary explanation.
    importance: |-
      For the buyer, the area directly affects the price, comparing offers, furnishings, bank valuation and the future sale. Unclear methodology can create a sense of missing square meters even when the contract formally uses a different number.

      The biggest risk is that the price is calculated for one area, and the buyer expects a completely different usable area.
    related: |-
      Ask for a table that divides the area of ​​the self-contained unit, the common parts, the adjoining premises and other sold rights. Compare the architectural design, scheme, contract, pricing and draft deed, including the allowable line at final measurement.

      Ask the simple question: "How many square meters can I use inside and what remaining square meters or percentages do I acquire as a right?"
