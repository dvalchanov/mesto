  content_version: 1
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    definition: |-
      "Encumbrance" is a broad practical term for rights, restrictions and encumbrances that may affect the ownership, use or disposal of property. It may refer to a mortgage, foreclosure, usufructuary, easement, registered claim, or other specific ground.

      The word itself does not indicate what the risk is for the buyer. This depends on the specific deed, the date and order of entry, the parties, the property and subsequent entries or deletions.
    example: |-
      The certificate shows a mortgage and a later entered deletion. The buyer should not settle for "the mortgage is old", but check that the deletion refers to the same deed, lender and exact property.

      With right of use, the question is not the amount of debt, but who can use the property after the transaction.
    confusion: |-
      "No encumbrances" does not automatically mean "free of any legal risk," and "encumbered" does not necessarily mean that a deal is impossible. Some of the risks come from ownership, representation, unrecorded facts or incomplete tracked history.

      A search result should not become a definitive conclusion without checking the scope and documents behind it.
    importance: |-
      For the buyer, the specific burden may affect free acquisition, financing, possession and future sale. Some entries require deletion prior to payment, others require contractual organization or rejection of the transaction at the discretion of the professional.

      When you know the exact type of burden, you can ask the right question in time, instead of everything coming down to the general "is the property clean".
    related: |-
      Ask for an up-to-date certificate with an appropriate period and property scope, but also provide the acts of an independent lawyer. For each entry, record the type, number, date, parties, amount or right, exact property and presence of subsequent deletion or marking.

      Coordinate release of encumbrance with payment and notarial transfer when applicable.
- key: term.mortgage
  slug: ipoteka
  kind: term
  category: transaction_risk
  locale: en
  title: Mortgage
  summary: A registered security interest on real property that gives the lender preference over its price and does not disappear
    simply because the owner changes.
  aliases:
  - contractual mortgage
  - legal mortgage
  - mortgaged property
  - bank mortgage
  keywords:
  - creditor
  - collateral
  - deletion
  - repayment
  related_stage_keys: []
