  - zut
  source_checked_at: '2026-09-05'
  content_version: 2
  editorial_status: published
  professional_review_status: pending
  sections:
    understand: |-
      The preliminary contract is not an administrative formality. It creates key obligations before the final transaction: what will be transferred, at what price, by which deadlines and what happens if the agreement is not followed. For a property under construction, it will often need to describe the future unit, project and level of completion.

      It divided four different events: construction stage, payment, notarial transfer and actual delivery. They may be linked by contract, but they are not the same and do not automatically occur together.
    verify: |-
      Check the parties, the representation and the right of the seller to promise the right right. Match the subject to the title deed, plan or approved project, including areas, common areas, storage, garage or parking space. For a future object, determine on which terrain and building right the project is based.

      Read the terms, conditions for extension, proof of milestones, notification procedure, penalties, grounds for termination and refund policy. Check how design changes, variances, encumbrances, financing, notarial transfer and handover are handled.
    documents: |-
      View the contract with all attachments at once: schematic or architectural plan, specification of materials and finish, payment schedule or terms, description of fixtures and powers of attorney. If an important application will be added "later", part of the stipulation remains unclear at the time of signing.

      For the legal and construction basis, ask for the applicable title documents, encumbrance certificate, building permit, approved design part and other documents according to the stage. A single public record found does not prove the entire set or contents of a private contract.
    money: |-
      Make your own table for each payment: amount or formula, currency, payee, maturity, condition, proof and right of objection. Don't assume that a contribution is due just because of a trade name like 'Act 14' - it's the specific clause and document with the right scope that guides you.

      Check how VAT, indexation, additional works, maintenance charges, parking and credit terms affect the final price. Mesto does not determine the schedule, the amount of the installments or what kind of advance is acceptable in your case.
    risks: |-
      Unilateral change rights, general property descriptions, unlimited extensions, payment upon unclear proof, disproportionate buyer-only effects, and applications without a version or signature require particular attention. A marketing brochure does not automatically become a contractual promise.

      A risk is also the lack of clear rules for termination and return of the payment in the event of a problem with ownership, encumbrances, permits or credit. Don't assume that a blanket "documents in order" clause covers every possible case.
    professionals: |-
      An independent lawyer should review the entire project, the rights check and the payment mechanism in your interest. An architect or engineer looks at the design applications, the technical specification and the measurability of the promised performance.

      The notary will have a role in the final transaction, but does not negotiate the preliminary contract for you. The lender checks its own financing terms, not all the risks of the purchase.
    act: |-
      Leads negotiations on a list of outstanding issues and keeps versions. When text changes, compare the entire document, not just the last edited paragraph. Require all attachments to be clearly named, dated and signed along with the contract.

      Before signing, summarize in your own words: what you acquire, when you pay, what you should receive and what rights you have in case of default. If you can't explain it clearly, the contract still needs clarification.
    next: |-
      After signing, create a calendar based on the final text only and keep contract notices separate from advertising updates. Mark which document you need to receive before each action.

      If an important inspection remains conditional, write down who performs it, in what time frame and what right you have in the event of an unfavorable result.
    buyer_checks:
    - Match the parties, representation and seller's right with current evidence.
    - Describe the exact item and all accessories equally in the contract and attachments.
    - Link each payment to a specific condition, proof and notification procedure.
    - Read the terms, extensions, terminations, refunds and penalties as one system.
    - Sign only final versions of all applications after independent legal and technical review.
- key: guide.after_signing
  slug: sled-podpisvane
  kind: guide
  category: buyer_journey
  buyer_stage: preliminary_contract_signed
  locale: en
  title: After signing
  summary: Keep all versions of documents, monitor contractual terms and check any changes before the next payment.
  aliases:
  - signed preliminary contract
  - after the contract
  - what comes next after signing
  keywords:
  - deadlines
  - notifications
  - annex
  - payments
  - evidence
  related_stage_keys:
  - building.authorization
  - building.act14
  - building.act15
  - building.commissioning
  related_document_keys:
  - document.preliminary_contract
  - document.investment_project
  - document.executive_documentation
  related_term_keys:
  - term.material_deviation
  - term.construction_papers
  - term.off_plan
  source_ids:
  - obligations_contracts
  - ordinance_3
  - registry_certificates
  source_checked_at: '2026-09-05'
  content_version: 2
  editorial_status: published
  professional_review_status: pending
  sections:
    understand: |-
      The signature does not end the verification. From that point on, there is a version of the agreement against which deadlines, notifications, design changes, construction documents and payment requests must be evaluated. General project news is helpful but not a substitute for the contractual procedure.

      Monitor separately what is happening with the construction and what is happening according to your contract. Physical progress may be visible without the agreed proof being presented, and an issued document may refer to another block, stage or site.
    verify: |-
      Keep the signed version, any attachments, proof of payment and official correspondence. Check that all pages and attachments are signed or clearly signed and that names, dates and bank accounts match.

      For each event reported, compare the specific clause, evidence required, date, issuer, and scope. If there is a delay or change, find out how the contract requires you to be notified and how long you can respond.
    documents: |-
      Maintain a file with four sections: contract and annexes; design and technical applications; construction and administrative documents; payments and correspondence. Don't replace an old file with a new one - versions can be important for tracking a change.

      For new construction, follow the documents according to the actual stage, but do not expect the same set every time. When a document is used as a basis for action under the contract, ask for a full copy and an explanation of how it relates to your subject.
    money: |-
      Don't just schedule a payment based on an approximate date from a call or ad schedule. Maintain your own calendar with the agreed due date, condition, recipient, required document and review time. Separate the amount due from additional requests or changes.

      In the case of a loan, coordinate in advance the deadline for the bank documents and the absorption, but do not allow the banking process to replace the verification of the contractual basis. If an account or payee changes, confirm the change through a trusted independent channel.
    risks: |-
      Watch out for verbal changes, unsigned annexes, documents for another block or phase, requesting payment without the agreed notification and accumulating important communication only in chat. Your silence may matter according to the text, so don't delay seeking professional advice in a dispute.

      Another danger is the gradual acceptance of many small deviations without overall evaluation. Collect them in one place and see if together they change the object, term, value or future use.
    professionals: |-
      The lawyer helps you read a notice, annex, delay or request for payment against the contract. An engineer or architect evaluates technical changes and their compatibility with applications. The lender confirms its terms and documents.

      Get help before you sign an addendum, accept a variance, or miss an objection deadline. Timely consultation is more useful than trying to recover missing documents and correspondence later.
    act: |-
      Turn the contract into a calendar and evidence list. For each future event, write down how you will know it has occurred, which document you expect and what you need to check before taking action. Respond in writing to important notices.

      If you receive a new document, keep the original file, date and method of receipt. Name it so that you can later distinguish between a draft, an unsigned copy, and a final version.
    next: |-
      Before each payment, open the specific stage payment guideline and compare the contract with the actual proof. Do not use the mention of the negotiation instead of the signed text.

      When the notarial transfer or transfer approaches, refresh the checks because an old certificate or early scheme may no longer reflect the current situation.
    buyer_checks:
    - Save the signed contract, every application and every subsequent version without overwriting files.
    - Create a calendar of deadlines, notifications, proofs and payments according to the exact text.
    - Confirm changes to a payee, account, project or deadline before taking action.
    - Match construction documents with the correct block, entrance, phase and contract clause.
    - Seek advice before annexation, waiver of right or expiration of objection period.
- key: guide.milestone_payment
  slug: predi-plashtane-po-etap
  kind: guide
  category: buyer_journey
  buyer_stage: waiting_or_payment
  locale: en
  title: Before stage payment
  summary: Before the next installment, see exactly what the contract requires, which document proves the stage and whether
    you have been notified in the agreed manner.
  aliases:
  - next payment
  - contribution under act 14
  - contribution under act 15
  keywords:
  - installment
  - due date
  - construction stage
  - notification
  - evidence
  related_stage_keys:
  - building.act14
  - building.act15
  - building.commissioning
  related_document_keys:
  - document.act14
  - document.act15
  - document.commissioning
  - document.preliminary_contract
  related_term_keys:
  - term.rough_construction
  - term.construction_papers
  - term.construction_category
  source_ids:
  - obligations_contracts
  - ordinance_3
  - zut
  source_checked_at: '2026-09-05'
  content_version: 2
  editorial_status: published
  professional_review_status: pending
  sections:
    understand: |-
      The construction document and the payment obligation are different matters. The document has a normative function and specific scope, while the amount, maturity and notification procedure come from your contract. The same market name may be defined differently in different contracts.

      Start with the clause, not the "we've reached the milestone" message. Determine what the contract calls the event, who must certify it, and whether issuance, signature, provision of a copy, or expiration of a certain period is sufficient.
    verify: |-
      Compare the number and date of the document, the construction, the building permit, the block, the entrance, the stage and the participants. A document for another subsite or infrastructure link may be genuine, but not prove the condition of your payment.

      Check that the agreed method of notification and the deadline for review or objection are respected. If the document contains notes, attachments, or incomplete signatures, request a full copy and a professional review before judging their significance.
    documents: |-
      Collect the signed contract and annexes, the payment notice, the milestone document with attachments and any earlier evidence that the clause refers to. Also keep correspondence about scope or deadline changes.

      For Act 14, Act 15 or commissioning, read the explanation for the relevant document. A colloquial name is not enough - the exact type, subject and role in the construction process are important.
    money: |-
      Calculate the amount using the contract formula and compare the currency, tax treatment, already paid and bank account. Do not use an invoice or invitation as the only evidence that the condition has occurred; they must correspond to the contract and the applicable evidence.

      If you pay with credit, confirm the repayment period and the bank's requirements. The contractual maturity does not change, unless the contract expressly provides otherwise.
    risks: |-
      Alerts are document sample only, missing attachments, different block, general message to all buyers, new account without reliable confirmation and pressure to pay before reasonable review. A public record with a similar title does not by itself prove the contractual term.

      Don't delay reacting to a discrepancy. The contract may contain deadlines and procedures that must be followed even when you are still gathering technical information.
    professionals: |-
      The lawyer compares the payment request with the contract, procedure and your rights in a dispute. An engineer, architect or construction specialist can assess the document, appendices and physical scope. The lender confirms its own disbursement requirements.

      Send the whole package, not just a picture of the first page. The professional opinion must be related to the specific contract and object.
    act: |-
      Make a brief comparison in four columns: what the contract requires, what is received, what matches and what remains unclear. Send specific written questions and keep the answer with the rest of the evidence.

      Pay only by the confirmed mechanism and save the payment document. If there is a dispute, follow professional advice and contractual procedure rather than improvising with retention or partial payment.
    next: |-
      After payment, add the document, notice and proof of payment to the file and update the calendar. Note what the next contract event is, but don't assume that construction will progress on a fixed schedule.

      When a notarial transfer or commissioning follows, go to the relevant guideline and update the legal and documentary checks.
    buyer_checks:
    - Read the exact payment clause and any definitions it refers to.
    - Match the document with the permit, block, input, phase and subject of the contract.
    - Check the notification, due date, recipient, account, amount and currency.
    - Request the full proof with signatures, attachments and notes where applicable.
    - Keep the professional review, correspondence and proof of payment on file.
- key: guide.before_transfer
  slug: predi-notarialna-sdelka
  kind: guide
  category: buyer_journey
  buyer_stage: before_notarial_transfer
  locale: en
  title: Before the notarial transfer
  summary: Perform up-to-date checks on ownership, encumbrances, property and representation. Specify the method of payment
    and delivery.
  aliases:
  - before a notary public
  - before transaction
  - notarial transfer
  keywords:
  - notarial deed
  - weights
  - tax valuation
  - property
  - payment
  related_stage_keys:
  - building.commissioning
