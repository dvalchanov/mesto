  sections:
    definition: |-
      The cadastral identifier is a unique number given by the Agency for Geodesy, Cartography and Cadastre, which uniquely identifies the real estate for the country. Its fields follow a hierarchy: settlement, cadastral district, land parcel, building and self-contained unit.

      The shorter code can only point to the ground, and the added fields to a specific building and a specific object within it. In case of changes in the cadastre, there may be an old identifier that must be traced to the current one.
    example: |-
      68134.1609.3263 may be a land parcel identifier. 68134.1609.3263.1 would point to a building within it, and 68134.1609.3263.1.10 would point to a standalone object within the building.

      If the offer indicates only the first three fields, it does not yet unambiguously identify the apartment that the buyer expects to acquire.
    confusion: |-
      The identifier is not an address, apartment number, notarial deed number, property register account or UPI designation. Two documents can use different old and new notations without this automatically being an error-but the connection must be provable.

      The presence of a code in the cadastre also does not in itself certify who is the owner, whether there is a mortgage or whether the object can be legally used as a residence.
    importance: |-
      For the buyer, the full identifier is the most reliable way to verify that the plan, deed, contract, building documents and references refer to the same property. An omitted field may direct the inspection to the lot or building instead of the specific apartment.

      Exact identity is especially important in payment, mortgage security, and notarial transfer because the promised and verified must be the same object.
    related: |-
      Compare all the code in each available document and note which level it describes: land, building or self-contained unit. In the case of an old identifier, ask for an official link with the current one, and in case of a discrepancy in address, floor, purpose or area, do not assume that only the same name of the project is enough.

      The next question is: "Does this document refer exactly to the object that will be the subject of the contract and the notarial deed?"
