  source_checked_at: '2026-09-05'
  content_version: 1
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    definition: |-
      A registered claim gives publicity to a legal claim in the cases provided by law - for example, a claim that disputes, cancels or affects a deed or right to property. Registration allows the dispute to be visible to subsequent acquirers.

      It does not prove that the claimant will win, but it cannot be dismissed as a mere note of no consequence.
    example: |-
      An owner is selling an apartment, but a claim has been filed seeking to invalidate an earlier transaction. Even if the seller says the claim has no merit, the buyer should obtain the case documents and advice on how a possible judgment could affect the title being acquired.

      The case number is the beginning of the check, not the end.
    confusion: |-
      A claim is not a judgment, foreclosure, or automatic proof of ownership. The reverse is also wrong: the fact that there is "no decision yet" does not mean that the purchase is without risk.

      A verbal explanation of the case does not replace a review of the claim itself, subsequent entries and current status.
    importance: |-
      For the buyer, the outcome of the dispute may affect ownership or the countervailability of the acquisition. A bank and a notary may request additional documents, but their involvement does not replace an independent assessment of personal risk.

      Pre-caparo discovery allows conditions to be set or not entered into the deal.
    related: |-
      Request a copy of the filed claim, case number and court, response, determinations, decisions and comments. Have the attorney check the exact claim, parties, property, stage and possible action against a prospective buyer.

      Do not accept deletion or termination without official proof and verification of subsequent entries.
- key: term.deposit
  slug: zadatak-kaparo-rezervatsionna-taksa
  kind: term
  category: transaction_risk
  locale: en
  title: Earnest money, deposit and reservation fee
  summary: Pre-transaction payments with various possible functions; the legal effects come from the contract and terms, not
    just the title of the amount.
  aliases:
  - assignment
  - down payment
  - deposit
  - reservation fee
  - reservation deposit
  keywords:
  - return
  - double size
  - reservation
  - preliminary contract
  related_stage_keys: []
