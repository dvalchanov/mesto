  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    definition: |-
      Foreclosure is a measure on immovable property, which is entered in the prescribed order and limits the objectionable disposal of it. It may be related to securing a claim, enforcement, public claim or other legal basis.

      From the entry, the authority, the case, the date, the affected property and the subsequent actions, including possible deletion, must be traced.
    example: |-
      An inspection before a preliminary contract reveals a foreclosure imposed by a bailiff. The seller says the debt is paid, but that's not enough. The case and the proper removal of the lien must be verified.

      The foreclosure can be on an ideal part, an entire PI, or a specific object - scope is crucial.
    confusion: |-
      A foreclosure is not a mortgage and does not by itself indicate the amount or validity of the claim. Colloquial "foreclosure" may mask inaccurate terminology; the official act and entry is what should be read.

      Elapsed time or a promise of future recovery does not equal proven erasure.
    importance: |-
      For the buyer, the foreclosure can seriously affect the acquisition of the property and the financing of the transaction. Paying the seller without a pre-agreed procedure may increase the risk of loss rather than solve the problem.

      Early detection allows the deal to be stopped or restructured before an irreversible commitment.
    related: |-
      Get the deed of foreclosure and up-to-date references, identify the enforcement or court proceedings and request a lawyer's assessment of the effect. If delisting is discussed, negotiate precise pre-conditions and evidence before releasing funds.

      Don't just use a note from the seller or a screenshot as confirmation that the measure has dropped.
- key: term.registered_claim
  slug: vpisana-iskova-molba
  kind: term
  category: transaction_risk
  locale: en
  title: Registered legal claim
  summary: Entry that a claim has been filed relating to the property or a deed to it. This is not yet a court decision, but
    may affect a subsequent buyer.
  aliases:
  - claim request
  - registered claim
  - property litigation
  - pending case
  keywords:
  - court
