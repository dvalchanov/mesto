  - technical_passport_ordinance
  - zut
  - dnsk_commissioning
  source_checked_at: '2026-09-05'
  content_version: 1
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    what: |-
      The technical passport is a construction document that systematizes basic technical characteristics, compliance data, changes made and maintenance instructions or measures according to the applicable regime. It refers to the building as a technical system, not just to an apartment.
      In new construction, it is part of the documentation environment surrounding the introduction; in the case of an existing building, it may have been compiled after a survey. The content and rationale must be read specifically.
    when: The technical passport is important for commissioning, purchase in a more complex or old building, upcoming major
      renovation and condominium management. Check its date, as changes may have occurred since it was drafted.
    who: It is compiled by the designated legal participants or consultants according to whether it is a new construction
      or an existing building and in accordance with Ordinance No. 5. The owner or condominium keeps it and updates it with
      applicable changes.
    why: The buyer gets a more structured picture of the construction, installations, major repairs and maintenance measures.
      This may point to future costs, limitations or the need for additional surveying that are not apparent from the interior
      inspection.
    establishes: Establishes the data and ratings included in the specific passport as of its date and scope. It may contain
      baseline characteristics, examinations performed and recommended or mandatory measures.
    not_establish: It does not prove that the building is free of defects today, that all recommendations are met, that the
      common areas are well maintained, or that the particular apartment has no illegal alterations. It does not replace a
      technical inspection.
    compare: Check the identity and address of the building, date and basis, compiler, construction system, installations,
      changes made, prescribed measures and deadlines. Compare with condominium protocols and visible condition.
    before_after: For new construction, it is based on the design and acceptance documentation. Significant changes, repairs
      and inspections should then be recorded so that the passport is not treated as a permanent snapshot.
    payment: The technical passport does not automatically give rise to a payment obligation. When buying a ready-made home,
      its absence or content may require additional verification, but the consequences for the price, rejection or term must
      be explicitly agreed upon.
    availability: Mesto does not automatically extract the technical passport and cannot determine its content from the final
      act of use. Public references do not replace the document held for the specific building.
    where: Ask the seller, investor or condominium management for it. For new construction, it may be part of the documentation
      with the developer and the competent administration according to the regime.
    professional_review: A structural engineer or architect can assess the significance of the features and measures described.
      A lawyer is needed if access is denied or the document reveals outstanding contractual obligations.
    buyer_checks:
    - Check that the passport is for the correct building and when it was drawn up or updated.
    - Read the measures, deadlines and data for significant repairs.
    - Compare the document with the state of the common areas and the decisions of the owners.
    - In case of technical doubts, commission a separate inspection, and do not rely only on the passport.
- key: document.energy_certificate
  slug: sertifikat-energiyni-harakteristiki
  kind: document
  locale: en
