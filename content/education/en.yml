  sections:
    what: |-
      This certificate reflects that the construction has reached the stage of "rough construction" for the purposes of the applicable regime under Art. 181 ZUT. It is of particular importance when, after this degree, the constructed building or individual parts of it are transferred, instead of just the right to build.
      The document is not just another name for Act 14. Act 14 accepts the construction between the participants in the construction, while the certificate serves before third parties and in transactions to prove the degree reached according to the competent certification.
    when: The certificate is important after the completion of the building in rough construction and before a notarial transfer
      with a specific unfinished object, when the type of transferable right depends on the degree reached.
    who: It is issued or certified by the competent administration according to the applicable order based on the construction
      documents and the established degree. The specific form and authority should be checked for the relevant building and
      municipality.
    why: Prior to rough construction, the buyer often acquires or is promised a right to build; after the degree reached,
      the subject may be treated differently. An inaccurate description can result in a contract for a different right than
      what the buyer thinks they are acquiring.
    establishes: Establishes the officially certified degree of completion for the specified construction and scope as of
      a specified date. The exact text indicates whether it refers to the whole building, a stage or another part.
    not_establish: It does not prove commissioning, habitability, completed installations, cadastral registration, ownership
      by the seller or the absence of encumbrances. It does not decide by itself what is written in the preliminary contract.
    compare: Compare the construction, permit, block and stage, date, issuer, legal basis, Act 14 and details of the future unit. Check how the
      property and the right to it are described in the preliminary contract and the draft deed.
    before_after: It is preceded by construction and acceptance of the structural frame. Once this stage is certified, a
      notarial transfer and cadastral procedures may be possible while work continues towards Act 15 and commissioning.
    payment: The contract may link payment or notarial transfer to "Act 14" or "rough construction". Clarify whether it requires
      this particular certificate, who presents it and whether it covers your block.
    availability: Mesto cannot reliably obtain this rough-construction certificate in every case. Information about Act 14
      or visible progress does not prove that the separate certificate has been issued.
    where: Ask for a certified copy from the seller or contractor and confirm with the competent administration. For a notarial
      transaction, check with the notary in advance which document and form will be required.
    professional_review: A lawyer and a notary must compare the certificate with the property right and the draft transaction.
      An engineer is helpful if there is doubt as to whether the physical and documentary degrees match.
    buyer_checks:
    - Do not accept Act 14 as an automatic substitute for the certificate.
    - Verify that the authenticated scope includes the correct block and stage.
    - Compare the document with the subject of the notarial transfer.
    - Clarify whether you are acquiring the right to build or an already built self-contained unit.
- key: document.executive_documentation
  slug: ekzekutivna-dokumentatsiya
  kind: document
  locale: en
  category: planning_construction
  title: As-built documentation
  summary: It reflects the permissible insignificant deviations between the approved project and the actual construction.
  aliases:
  - executives
  - executive project
  - as-built
  - documentation of the performance
  keywords:
  - completed construction
  - deviations
  - certification
  - cadastre
  - Act 15
  related_stage_keys:
  - building.installations
  - building.act15
  related_document_keys:
  - document.investment_project
  - document.act15
  - document.commissioning
  related_term_keys:
  - term.material_deviation
  - term.construction_papers
  - term.property_areas
  source_ids:
  - zut
  - ordinance_3
  - dnsk_qa
  - dnsk_commissioning
  source_checked_at: '2026-09-05'
  content_version: 1
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    what: |-
      The as-built documentation reflects non-essential deviations from the approved investment projects, when such have occurred during implementation. It shows what was built against what was originally approved and is included in the construction documentation.
      The as-built documentation cannot be used to legitimize any change after its implementation. Significant deviations have a separate regime and may require prior approval and amendment of the permit.
    when: As-built documentation matters whenever changes are made during construction, especially before Act 15 and commissioning.
      The buyer must review it if the apartment, common areas or installations do not match the annex to the contract.
    who: It is prepared and certified by the legally required participants for the relevant project sections. The developer
      submits it with the acceptance documentation; a verbal explanation from the builder is not a substitute.
    why: The difference between design and execution can affect area, distribution, openings, vertical risers, common parts
      and usability. The buyer must know whether the change is admissibly reflected and how it relates to what was promised
      in the contract.
    establishes: Records the completed deviations shown in the relevant certified project sections. Where there are no
      deviations, the applicable procedure may require a different confirmation; the conclusion depends on the full file.
    not_establish: It does not legitimize material deviations, does not prove defect-free quality and does not automatically
      amend the private contract with the buyer. It does not replace the cadastral scheme, Act 15 or the final approval.
    compare: Compare the approved project, as-built documentation, change orders, Act 15 and cadastral data. For your unit, check
      boundaries, dimensions, areas, purpose, accessories, openings and installation elements.
    before_after: It follows the approved design and documents changes made during construction. The changes should be reflected
      in Act 15 and the acceptance procedure, while the relevant data are submitted for archiving and cadastral recording.
    payment: If the contract allows for changes or links payment to Act 15, ask to see how the performance is reflected before
      assuming that the event has occurred without deviations. A private contract may give separate rights upon modification.
    availability: Mesto does not automatically retrieve the as-built project documentation. Public access to Act 15 or
      a use permit does not mean that Mesto has compared the completed work with the plan in your contract.
    where: Request the relevant sections from the builder, seller or supervisor. If there is a significant difference, check
      the construction file and ask a specialist to compare the approved, amended and executed version.
    professional_review: An architect and the relevant engineer must evaluate the technical change. A lawyer considers whether
      it is permissible under the contract, whether it affects the subject matter or the price, and what remedies are available.
    buyer_checks:
    - Request a list of all changes to the layout agreed in the contract.
    - Distinguish insignificant from significant deviation with the help of a specialist.
    - Compare the completed areas, boundaries and installations with the project.
    - Do not take Act 15 as proof that the contract has been executed without changes.
- key: document.act15
  slug: akt-15
  kind: document
  locale: en
  category: planning_construction
  title: Act Form 15
  summary: A record stating that the construction is ready for acceptance. It describes the work and supporting documents, but does not authorize use of the building.
  aliases:
  - act 15
  - Act 15
  - sample 15
  - finding act 15
  keywords:
  - acceptance of construction
  - as-built documentation
  - remarks
  - handover
  related_stage_keys:
