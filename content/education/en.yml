  sections:
    definition: |-
      The garage can be a separate self-contained unit with its own identifier. A delineated parking space is often not a separate immovable property: the right may represent undivided shares of an underground garage or lot, combined with an agreed distribution of use.

      Approaches, ramps and maneuvering areas are normally of general mode and are not part of the site-specific outline.
    example: |-
      An offer of "parking space #12" may legally mean a 1/30 ideal part of an underground garage and an agreement for the owner to use zone #12. Another project may contain a separate garage #12 with its own cadastral identifier.

      The price may be similar, but the right and method of transfer are different.
    confusion: |-
      The paint, sign, columns, or individual door does not necessarily create a piece of real estate on its own. "Exclusive use" does not automatically mean a separate property, and an ideal lot does not by itself delineate a specific location.

      Nor should it be assumed that every open space in the yard can freely be the subject of a separate sale.
    importance: |-
      For the buyer, the difference affects notarial form, mortgage, access, costs, co-ownership decisions and future sale. In case of dispute, the protection depends on the right actually acquired, not on the number in the advertising brochure.

      The practical value of the site also depends on the dimensions, maneuverability and general access. These must be checked on the spot because they cannot be judged from the legal document alone.
    related: |-
      Compare the cadastral scheme, the project, the title deed, the quotas and the shared use agreement. Find out who owns the ramp and common areas, how costs are allocated and whether the title can be transferred or mortgaged with the home.

      When transferring, measure and photograph the place, but check the legal status before reservation or deposit.
