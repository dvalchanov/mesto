  - term.construction_papers
  source_ids:
  - zut
  - dnsk_commissioning
  - dnsk_construction_control
  source_checked_at: '2026-09-05'
  content_version: 1
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    definition: |-
      The construction category is a normative classification determined according to the type, purpose, parameters, complexity and risk of the construction. It affects the competent authorities, the participants, the control and the form of the final commissioning.

      The category refers to the specific construction or stage, not the marketing class of the building.
    example: |-
      For a residential building, the final document may be a certificate of commissioning from the authority that issued the permit, and for another applicable building, a permit for use after a different procedure. The popular "Act 16" hides this difference.

      The answer starts from the category specified in the construction documents.
    confusion: |-
      A higher category does not mean a better quality construction, a higher price or a more reliable investor. The low number is not a certificate of luxury, but an administrative classification.

      The category of a whole complex may require a distinction between buildings, infrastructure and individual stages.
    importance: |-
      For the buyer, the category helps to understand who issues the final deed, what document to look for and why two buildings have different procedures. Without it, it's easy to ask for the wrong document or assume that the missing colloquial "Act 16" means no legal entry.

      The category helps to understand which procedure is applied, but it does not prove the current stage of construction.
    related: |-
      Check the category in the building permit and subsequent documents for the exact scope. Match it with the competent authority and the final document without relying on the common name used by the seller.

      If the project is in stages or includes separate infrastructure, ask for a clear list of which act and which category apply to which part.
- key: term.warranty_period
  slug: garantsionen-srok
  kind: term
  category: handover_operation
  locale: en
  title: Warranty period
  summary: The period during which responsibility applies to specified construction work. The statutory minimum
    and the additional contractual guarantee are not the same.
  aliases:
  - builder's warranty
  - construction warranty
  - warranty periods
  - warranty defects
  keywords:
  - Regulation 2
  - builder
  - seller
  - complaint
  related_stage_keys:
  - building.commissioning
  - building.handover
  related_document_keys:
  - document.commissioning
  - document.handover_protocol
  - document.preliminary_contract
  related_term_keys:
  - term.defects
  - term.construction_roles
  - term.bds_finish
  source_ids:
  - construction_warranties
  - obligations_contracts
  - zut
  source_checked_at: '2026-09-05'
  content_version: 1
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    definition: |-
      The warranty period is a period during which, for certain construction and assembly works, facilities or construction sites, the corresponding responsibility for manifested deficiencies is applied. The regulatory framework provides for minimum terms for various types of work, and the contract may contain additional promises.

      The starting point, the subject matter, the responsible person and the notification procedure should be established on a case-by-case basis.
    example: |-
      After the handover, a leak appears from a common terrace. The buyer must find out who is responsible for the common part, who performed the work, what the seller's contractual warranty promises and what the minimum applicable term is.

      The general message "you have a five year warranty" does not indicate which items and from which date.
    confusion: |-
      One term does not apply equally to construction, waterproofing, installations, flooring and equipment. The warranty period is not the same as a remedy period after notice, nor does it relieve the buyer of the need to document the problem.

      Nor does its expiration automatically resolve all possible contractual or statutory claims-specific analysis remains necessary.
    importance: |-
      The warranty helps the buyer understand who and when to notify of a construction problem. If the responsible company, the notification address and the procedure are unclear, even a valid report can go unsolved for months.

      In condominiums, common defects require coordination between owners and management before the damage escalates.
    related: |-
      Collect warranty conditions by type of work, start date, responsible person, contact and response time. Keeps contracts, minutes, photos, correspondence and documents for entry and handover.

      In the event of a defect, send a traceable notification with a description, date and evidence, and do not undertake destructive repairs before an appropriate technical inspection, except as a necessary emergency measure.
- key: term.defects
  slug: yavni-skriti-defekti
  kind: term
  category: handover_operation
  locale: en
  title: Obvious and hidden defects
  summary: Defects that may be visible on a normal inspection or appear later; acceptance must document the facts without
    turning into a hasty waiver of rights.
  aliases:
  - obvious defect
  - hidden defect
  - shortcoming
  - note on acceptance
  - construction defect
  keywords:
  - view
  - protocol
  - notification
  - repair
  related_stage_keys:
  - building.act15
  - building.handover
  related_document_keys:
  - document.act15
  - document.handover_protocol
  related_term_keys:
  - term.warranty_period
  - term.bds_finish
  - term.possession_ownership
  source_ids:
  - obligations_contracts
  - construction_warranties
  - ordinance_3
  source_checked_at: '2026-09-05'
  content_version: 1
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    definition: |-
      A defect is a non-conformity or shortcoming from the due quality, design, specification or normal use. Practically obvious is the problem that can be detected on proper inspection, and hidden is not reasonably recognizable then and manifests itself later.

      Qualification and legal consequences depend on the contract, type of work, timing, notice and evidence, not just the buyer's label.
    example: |-
      Scratched woodwork and missing contact are visible on delivery and described. A leak behind a lining or improperly executed waterproofing can appear after the first heavy rain.

      In both cases, the photo is useful, but establishing the technical cause and the person responsible may require a specialist.
    confusion: |-
      Signing a handover protocol should not automatically be understood as a confirmation that there are no hidden problems. Conversely, the notice list does not necessarily mean that the buyer can unilaterally refuse any payment or acceptance.

      Aesthetic defect, incomplete contract work and structural defect have different consequences and require different response.
    importance: |-
      For the buyer, early detection and accurate documentation reduces cost and cause dispute. Missing a visible defect can make it harder to prove, and improperly addressing a hidden problem can destroy evidence.

      The common parts deserve a separate look, because a defect there can affect many objects and the future budget of the condominium.
    related: |-
      Perform technical inspection against project and contract specification, describe location, size and symptom and attach dated photographs. Clear timelines for removal, access and re-examination in the protocol, without vague phrases about a complete waiver of future claims.

      If a problem occurs later, document prior to repair, reportable and seek independent technical and legal assistance as appropriate.
- key: term.utility_connection
  slug: prisaedinyavane-individualni-partidi
  kind: term
  category: handover_operation
  locale: en
  title: Utility connections and individual accounts
  summary: A utility network nearby, a connected building, an active service and an individual account are not the same thing.
    Check each step separately.
  aliases:
  - accession
  - individual utility account
  - household current
  - water lot
  - separate electricity meter
  keywords:
  - electro
  - Plumbing
  - heating
  - operator
  - measuring device
  related_stage_keys:
