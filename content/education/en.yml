  content_version: 2
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    what: |-
      The notarial deed is an official deed drawn up in a notarial proceeding, through which real rights to real estate are transferred or certified according to the type of proceeding. In case of purchase and sale, it contains the declarations of intent of the parties and the exact subject of the transaction.
      Not every notarial deed records a sale: it may certify ownership, a donation, the establishment of a right to build, a mortgage or another legal act. Read the title and legal basis, not just the words "notarial deed".
    when: It is also necessary during the initial verification of the seller, during the preparation of the preliminary contract
      and during the final transaction. For new construction, separate deeds for the land, the right to build and the future
      site can be considered.
    who: The notary with jurisdiction over the location of the property performs the notarial act, and the parties or proper
      representatives express their will. The notary is impartial and does not replace the buyer's independent lawyer.
    why: This is the main document from which you understand on what basis the seller claims to have rights, and what exactly
      you will acquire - ownership, common parts, appurtenances, a right to build or a right of use. A missing appurtenance or a different
      identifier can materially change the deal.
    establishes: Establishes the transaction or right certified in the specific deed, the parties, the property, the basis
      and the stated conditions. Once registered, the deed becomes part of the public registration history for the property
      and persons.
    not_establish: An old deed does not independently prove that the seller is still the owner, that there is no subsequent
      mortgage, foreclosure or dispute, that the cadastre matches or that the property is free of illegal alterations and
      defects.
    compare: Check the type and date, notary, deed/volume/case and entry, parties and representation, acquisition basis, identifier,
      address, purpose, area, boundaries, common parts, accessories, encumbrances and price. Trace the previous acts and the
      subsequent entries.
    before_after: Before the final deed, the seller, property and transaction terms require legal and factual checks.
      After signing, the deed is registered, payments are made according to the pre-arranged mechanism and possession is transferred
      separately, if this is provided for.
    payment: The deed may contain statements of price and payment, but the actual mechanism must be agreed in advance. Do
      not confirm a received price, delivery or no claim if the actual event did not occur or the text is not accurate.
    availability: Mesto does not issue notarial deeds or carry out a full title investigation. Public cadastral
      or registry data may contain a reference, but do not replace the review of the deed itself and the series of acquisitions.
    where: Ask for a legible copy from the seller and verify the entry through the Land Registry under the applicable service.
      The draft of the future act should be received early enough for independent review.
    professional_review: An independent attorney examines title documents, the chain of title, representation and the risk of
      dispute. The notary performs legal due diligence on the transaction, but does not negotiate for the buyer on the most
      appropriate contractual protections.
    buyer_checks:
    - Track how the seller acquired the right and whether older deeds are needed.
    - Match ID, area, purpose, undivided shares and accessories.
    - Check subsequent entries and encumbrances at appropriate time.
    - Review the draft of the new act before the day of the transaction.
- key: document.encumbrance_certificate
  slug: udostoverenie-za-tezhesti
