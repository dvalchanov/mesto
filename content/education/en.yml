  sections:
    definition: |-
      Condominium ownership exists when a building contains self-contained units owned by different people together with common areas serving those units. Each owner holds their unit and a corresponding share of the common areas, while the building is managed under specific rules.

      The general assembly, manager, budget, repair fund and maintenance decisions are part of this regime; they do not belong solely to the investor after the sales.
    example: |-
      The buyer acquires an apartment and a percentage of the roof, staircase, structure and other common parts. After occupancy, participates in decisions about elevator, security, repairs and monthly expenses according to applicable rules and quotas.

      A complex may also have a separate service contract, which must be distinguished from condominium decisions.
    confusion: |-
      A condominium is not a company and does not equal a "gated complex". The fee written in the offer does not prove who has the right to determine it, what it includes and under what contract it is due.

      The common parts cannot be treated simply as residual areas of the investor when the law and title documents give them common treatment.
    importance: |-
      For the buyer, the management determines the real monthly cost of living, the condition of the building and the possibility of major repairs. Unpaid debts, disputed maintenance contracts or dysfunctional management can reduce the quality and value of the property.

      With a new building, it is important how the management will pass from the investor to the owners.
    related: |-
      Before buying, ask for minutes of the general meeting, budget, amount and basis of fees, availability of the "Repair and renovation" fund, management contracts and information about planned repairs. For a new project, read the pre-proposed rules and service agreements.

      Compare the promised amenities with who will own, manage and pay for them.
- key: term.possession_ownership
  slug: vladenie-sreshtu-sobstvenost
  kind: term
  category: ownership_rights
  locale: en
  title: Possession and ownership
  summary: Holding the keys and owning the property are two different things. Possession does not transfer title, and title
    does not guarantee vacant possession.
  aliases:
  - possession
  - property
  - transfer of possession
  - keys
  - introduction
  keywords:
  - notarial deed
  - handover
  - usage
  - inhabitant
  related_stage_keys:
  - building.handover
  related_document_keys:
  - document.title_deed
  - document.handover_protocol
  - document.preliminary_contract
  related_term_keys:
  - term.right_of_use
  - term.registered_claim
  - term.defects
  source_ids:
  - property_law
  - obligations_contracts
  source_checked_at: '2026-09-05'
  content_version: 1
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    definition: |-
      The right of ownership is the real right to possess, use and dispose of the property within the limits of the law. Possession is the actual authority over it-who holds the keys, controls access, and uses it with owner behavior.

      The transfer of ownership and transfer of possession may occur at different times if the contract and the factual situation provide for it.
    example: |-
      The deal was announced on June 15, but the seller must vacate the home and hand over the keys by June 30. The buyer may already be the owner, but not yet actually own the property.

      In the case of new construction, the early granting of access for completion is not in itself a notarial transfer.
    confusion: |-
      The handover protocol is not a document of ownership, and the notarial deed does not necessarily certify the factual situation and free access the day after the transaction. Address registration, bill payment or long-term residence should also not be used as sole proof of ownership.

      Possession and ordinary possession have additional legal differences that require specific analysis.
    importance: |-
      The buyer needs to know when they get the right, when they can actually move in and what happens if the property is not released. Ambiguity can lead to temporary housing costs, a dispute with tenants, or difficulties with repairs and insurance.

      The separate planning of the transaction and the handover makes the obligations measurable.
    related: |-
      In the contract, write down the exact date, condition and procedure for handover, the persons who must vacate the property, the keys, the meter readings and the consequences of delay. Check registered rights of use and contracts or facts that may bind the new owner.

      At handover, draw up a detailed record; it supplements, but does not replace, the checks on the property.
- key: term.right_of_use
  slug: pravo-na-polzvane
  kind: term
  category: ownership_rights
  locale: en
  title: Right of use
  summary: The right of another person to use the property and receive the income from it, even though the owner is different.
  aliases:
  - real right of use
  - lifetime right of use
  - user
  - right reserved
  keywords:
  - limited property right
  - habitation
  - burden
  - entry
  related_stage_keys:
