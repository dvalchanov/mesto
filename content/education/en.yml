  content_version: 2
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    definition: |-
      A building right is a limited right in rem that allows the holder to build and own a building or certain objects on another person's land. It is established in the required form, entered and has a specific subject, scope and conditions.

      The owner of the land and the holder of the building right may be different persons. The building permit is an administrative act and does not replace the real basis.
    example: |-
      The owner of the PI grants the company the right to build a residential building against future objects. The company can sell rights related to future apartments, but the buyer must follow the exact incorporation, distribution and connection to the project.

      A general statement that "the developer has the right to build" does not show whether your particular unit is included.
    confusion: |-
      The right to build is not a building permit, ownership of the entire land or a preliminary contract. Not every contractual right against the investor is a right in rem that can be opposed in the same way against third parties.

      Nor does the issued permit prove by itself that the applicant has all the promised private rights.
    importance: |-
      When buying in a new construction, a major part of the inspection is the relationship between the owner of the land, the holder of the right to build and the specific future object. A scope, representation, or entry problem can prevent a seller from delivering on what was promised.

      The right is also important for what the flat owner gets in relation to the land after construction.
    related: |-
      Request the notarial deed or the contract of incorporation and check the entry, the parties, the property, the project, the objects, the terms and the counter obligations. Compare them with the building permit and your contract.

      An independent attorney should answer, "Does the seller have the exact right to pledge and transfer this future object, not just an interest in the project?"
