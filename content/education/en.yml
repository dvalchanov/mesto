  sections:
    what: |-
      The certificate of marital status, spouse and children shows registered circumstances of the person's civil status. In a real estate transaction, it helps determine whether a spouse may have rights and involvement in the acquisition or sale.
      The mere existence of a marriage does not automatically mean that any property is joint, and the absence of a spouse in an old deed does not settle the matter. The dates, the acquisition basis and the chosen property regime are important.
    when: It is necessary when verifying the seller and the acquisition history, especially if the property was bought during
      marriage or there is a gift, inheritance, prenuptial agreement, divorce or several successive marriages.
    who: It is issued by the relevant municipal administration based on civil status registers. The seller provides the document,
      but the conclusion about the rights to the property is made after comparison with the other documents.
    why: An omitted spouse or improper qualification of the property may result in a dispute or inability to transfer the
      entire title. The buyer must understand who must sign and on what basis.
    establishes: Establishes the reflected marital status and the named persons to the issue. It helps to build a chronology
      around the date of acquisition and direct the inspection to the applicable mode.
    not_establish: It does not prove by itself whether the property is marital or personal property, whether there is a marriage
      contract, transformation of personal property or judgment. It is not a title deed and does not show encumbrances.
    compare: Compare the dates of marriage, acquisition, divorce and subsequent transactions, the names of the spouses and
      the acquisition basis. Check the marriage contract or chosen regime and the necessary consents for a family home according
      to the specific case.
    before_after: First, the marital status at the important dates is established, and then the method of acquisition and
      the applicable property regime are analyzed. This is how it is determined which persons and statements are necessary
      in the preliminary and notarial contract.
    payment: Don't pay a significant down payment if the seller claims the spouse is "no relation" without documentary and
      legal verification. The contract must regulate participation or necessary consent before payment and transaction.
    availability: Mesto does not retrieve civil status documents and does not infer family status from public property data.
      This remains part of the parties' confidential review.
    where: Ask the seller for the current document and, if necessary, additional documents for marriage, divorce or regime.
      The application is made through the competent municipality or the available electronic service.
    professional_review: The lawyer should compare the dates, the method of acquisition and the family regime. The notary
      verifies the necessary participation for the transaction, but the disputed facts must be clarified in advance.
    buyer_checks:
    - Match the acquisition date with the seller's marriages and divorces.
    - Check the acquisition basis and the applicable property regime.
    - Determine if a spouse's signature or consent is required.
    - Do not take the administrative certificate as a stand-alone proof of ownership.
- key: document.property_power_of_attorney
  slug: palnomoshtno-imotna-sdelka
  kind: document
  locale: en
  category: property_identity
  title: Power of Attorney for a property transaction
  summary: The document authorizing a representative to act for a party to the transaction. It must accurately cover the property, actions and required form, but is not proof of ownership.
  aliases:
