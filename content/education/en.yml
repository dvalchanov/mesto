  title: Self-contained unit in a building
  summary: A separate part of a building with its own purpose - for example, an apartment, studio, shop or garage. Not every
    detached room is a self-contained property.
  aliases:
  - SOS
  - self-contained unit
  - object in a building
  - apartment in the cadastre
  keywords:
