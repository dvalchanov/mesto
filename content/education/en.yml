  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    definition: |-
      Purpose describes the function for which a property is approved and listed - for example, a home, studio, office, shop or garage. It is tracked through the layout and construction documents, the commissioning document and cadastral data.

      The buzzword "statute" often brings together various questions; therefore it is more accurate to ask what purpose is approved and where it is recorded.
    example: |-
      A premises can look and sell like a small flat, but in the scheme it is a 'studio' or an 'office'. This does not automatically mean that it cannot be used, but the buyer's requirements, financing and expectations should be checked against the specific purpose.

      Address registration is not the only and sufficient test.
    confusion: |-
      Furnishing a kitchen and bathroom, paying for household electricity or being used by a previous owner do not in themselves change the purpose. The opposite, different cadastral description should not be interpreted in isolation from the approved project and subsequent acts.

      "Purpose", "sustainable use" of land and development area are related but different concepts.
    importance: |-
      For the buyer, the purpose can affect legal use, bank lending, tax treatment, alterations and future sale. If the goal is a permanent residence, the discrepancy must be understood before the down payment or contract, not after the notarial transfer.

      It also helps to detect differences between what was promised in the bid and what was approved for the building.
    related: |-
      Compare the purpose in the scheme, project, permit, commissioning document and title document. Ask if there has been a change of purpose and ask for the acts by which it was approved and reflected.

      Discuss the specific implications with the architect, attorney and lender according to the intended use; don't rely on the general assurance "no problem".
