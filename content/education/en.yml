  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    what: |-
      The tax valuation certificate is issued by the municipal administration for declared immovable property, unfinished construction or real property according to the requested service. It contains value for tax and notary purposes and data from the municipal tax lot.
      A tax valuation is not an expert assessment of market value. A low or high value on the document does not automatically indicate the true value, quality or fairness of the agreed price.
    when: It is necessary for the preparation of a notarial transfer, the determination of the tax base and some administrative
      or inheritance proceedings. For an unfinished object, data on the degree of completion may also be needed.
    who: It is issued by the municipality of the location of the property based on the tax lot and the data submitted. The
      seller usually provides the document, but the buyer must compare its contents with the property and rights described
      in the transaction.
    why: A discrepancy in owner, address, area, purpose or undivided shares can delay the transaction and show that the tax, cadastral
      and real estate identities are not in sync. This does not resolve the dispute, but it is a signal to check.
    establishes: Determines the tax valuation and the declared data for the specific object to the document and service.
      It is used for the intended tax and notarial calculations according to the current regime.
    not_establish: It does not prove market price, ownership, absence of encumbrances, legality of construction or actual
      area. The registration of a person as a taxable person is not an independent document of ownership.
    compare: Check the municipality, outgoing number and date, owners and quotas, address, identifier, type and purpose, area,
      undivided shares, right of construction or use and validity period for the planned transaction. Compare the data with the
      notarial deed and the scheme.
    before_after: Before the application, the seller must have declared the property and clarified the discrepancies. After
      the document is issued, it is part of the transaction package, but ownership checks and entries remain separate.
    payment: The tax valuation can affect the basis for tax and charges, but does not itself determine the contract price
      or the amount of the credit. Do not use the document as the sole justification for an advance or to assess profitability.
    availability: Mesto does not claim or receive a tax valuation automatically because it is an official municipal service
      related to a specific property and applicant. Data from the cadastre are not its replacement.
    where: Ask for the current certificate from the seller and check the issuance through the relevant municipality or the
      single portal when the service is available. For the transaction, the notary specifies the required up-to-dateness and
      set.
    professional_review: A notary or lawyer checks that the document is appropriate for the transaction and that it matches
      the title document. A tax professional is only necessary for atypical subject matter, corporate structure or more complex
      tax implications.
    buyer_checks:
    - Match owner, quotas, identifier, area and purpose.
    - Differentiate tax value from market valuation and contract price.
    - Check if the document is for the right type of right and degree of completion.
    - Clarify inconsistencies before scheduling the deal.
- key: document.heir_certificate
  slug: udostoverenie-za-naslednitsi
  kind: document
  locale: en
  category: property_identity
  title: Certificate of heirs
  summary: Official document for the heirs of a deceased person. It is important for inherited property, but does not by itself
    show who owns the particular item.
  aliases:
  - heirs
  - certificate of legal heirs
  - inherited property
  keywords:
  - inheritance
  - testator
  - quotas
  - testament
  - sellers
  related_stage_keys:
