  - egov_tax_assessment
  source_checked_at: '2026-09-05'
  content_version: 2
  editorial_status: published
  professional_review_status: pending
  sections:
    understand: |-
      The notarial transfer is separate from the preliminary contract, commissioning, payment and handover of keys. Preparation must coordinate these events without assuming that they occur simultaneously or that one document proves everything.

      Checks must be current to the transaction. A title deed or certificate reviewed months earlier is important history, but it does not alone answer the question of what the situation was immediately before signing.
    verify: |-
      Check chain of ownership and representation, including marital status, succession or power of attorney where applicable. The certificate of encumbrances must be for the correct property, period and person according to the approach chosen and read together with the recorded deeds.

      Compare the cadastral scheme, the draft notarial deed, the preliminary contract and the real object. Pay attention to the identifier, area, purpose, floor, accessories, common parts and the right to a parking space or storage.
    documents: |-
      The specific set is determined with the lawyer and the notary. Commonly considered are the title deed and previous deeds, current scheme, tax valuation, marital or inheritance documents, powers of attorney, registration certificates and applicable entry or building status document.

      Do not treat the mere existence of a document as enough. Check its validity, issuer, date, scope, signatures and whether it reflects current circumstances. Read the draft notarial deed in advance, not for the first time at signing.
    money: |-
      Coordinate the exact sequence between signing, bank transfer, loan disbursement, deletion or creation of collateral and registration. There is no one-size-fits-all rule-the mechanism depends on the parties, the contract, the credit, and the specific burdens.

      Find out in advance the taxes, notary and registration fees and all agreed costs. Confirm amounts and bills through a trusted channel and don't change the basis at the last minute without legal review.
    risks: |-
      Risks are the discrepancy between the scheme and the title deed, incomplete ownership history, encumbrance with unclear scope, limited power of attorney, family or inheritance rights, unsettled cancellation of mortgage and draft deed that differs from what was agreed.

      For new construction, check that the correct block or site falls within the applicable final document. "The complex has Act 16" is not enough when the construction is in phases.
    professionals: |-
      An independent lawyer organizes the inspection in your interest and coordinates the unresolved issues. The notary performs notarial proceedings and legal checks, but does not replace the buyer's preliminary legal and technical preparation.

      A creditor and an appraiser are involved in a mortgage; if there is a discrepancy in the site, a surveyor or architect may be needed. Specify who is responsible for each check and when the result should be ready.
    act: |-
      Prepare a final list of documents, their issuer, date of receipt, expiration date and responsible person. Send the questions about the draft of the notarial deed in advance and ask for a corrected text before the day of the transaction.

      Make a separate plan for payment and delivery. Write down when you will receive possession, keys, depositions, documents and access to common areas, rather than leaving these matters for verbal agreement after signing.
    next: |-
      After registration and payment proceed to the actual delivery. The transaction does not prove the condition of the property and does not automatically record all keys, defects, appliances or readings.

      Save the notarial deed, payment documents and proof of entry. Follow specific instructions for tax obligations, utility bills, insurance and building management.
    buyer_checks:
    - Renew the title, agency and encumbrance check immediately prior to the transaction.
    - Compare the scheme, the title deed, the preliminary contract, the draft deed and the real object.
    - Read the draft of the notarial deed and the payment mechanism before the day of signing.
    - Confirm how existing and new collateral will be settled and who is tracking the entry.
    - Arrange in writing the time and content of the handover if it does not coincide with the transaction.
- key: guide.handover_owner
  slug: predi-predavane
  kind: guide
  category: buyer_journey
  buyer_stage: before_handover
  locale: en
  title: Before handing over the property
  summary: Prepare the technical inspection and handover record. List the keys, meter readings and documents, and agree how
    any defects will be remedied.
  aliases:
  - before keys
  - apartment acceptance
  - receive handover protocol
  keywords:
  - handover
  - view
  - defects
  - keys
  - meter readings
  - guarantees
  related_stage_keys:
  - building.handover
  related_document_keys:
  - document.handover_protocol
  - document.warranty_documents
  - document.commissioning
  - document.maintenance_agreement
  related_term_keys:
