  content_version: 1
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    definition: |-
      The land parcel is a part of the earth's surface, defined with boundaries according to the right of ownership. It is the main unit of the cadastre and receives its own cadastral identifier, area, address, permanent purpose and method of permanent use.

      PI describes the cadastral object. The planning rules for development are read separately through the current development plan and the corresponding UPI.
    example: |-
      A residential building may be registered in PI 68134.1609.3263. A flat buyer does not usually automatically acquire the entire PI: they may receive undivided shares of the land, undivided shares of a building right or another precisely described scope.

      Therefore, the expression "apartment with land" must be translated into specific rights and quotas.
    confusion: |-
      "PI", "UPI", "yard", "plot of the complex" and the administrative address do not mean the same thing. One UPI may include parts of more cadastral properties. If cadastral and regulatory boundaries diverge, surveyor verification may be required.

      A building in a PI also does not prove that the owner of the apartment owns the land under it.
    importance: |-
      For the buyer, the PI is the basis for verifying ownership of the land, access, building rights and scope of permits. An inaccurate understanding of the land may hide a dependency on someone else's property, a lack of promised undivided shares, or a different subject matter of the transaction.

      In the case of new construction, the relationship between the PI, the client, the right to build and the future object is part of the chain of rights.
    related: |-
      Ask for an up-to-date sketch of the PI and compare the identifier, boundaries and area with the title document, PUP, visa and building permit. Find out who owns the land and what exactly you get: a share of the land, a share of the right to build or just the self-contained unit with accessories.

      In case of discrepancy between cadastre and regulation, involve surveyor, architect and independent lawyer according to the question.
