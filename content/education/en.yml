  content_version: 1
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    what: |-
      The certificate of heirs lists the persons registered as heirs of a deceased person based on the population registers and the applicable rules. It helps to establish the circle of persons who may have acquired inheritance rights.
      The document does not distribute the property itself and does not necessarily indicate all the factors - a will, disinheritance, subsequent partition, sale or litigation must be examined separately.
    when: It is necessary when the seller or previous owner has died and the property is being sold as a probate, as well
      as when the property has passed through several inheritances. An old document may not reflect subsequent data changes.
    who: It is issued by the competent municipal administration at the last permanent address of the testator according to
      the applicable procedure. Sellers must provide an up-to-date document and additional deeds for the specific inheritance.
    why: If not all entitled persons participate or the quotas are mistakenly accepted, the buyer may acquire less than the
      entire property or enter into a dispute with a co-owner. Particular attention is needed in the case of deceased heirs
      and inheritance by substitution.
    establishes: Determines which persons are named as heirs of the specific testator in the administrative certificate. It
      is an important starting point for calculating and verifying the chain of inheritance.
    not_establish: It does not prove that the testator owned the property, that all the heirs accepted or reserved their rights,
      that there was no will, renunciation, partition, subsequent transaction or encumbrance. It does not independently determine
      quotas in each complex case.
    compare: Check testator, date of death, issuer and date, all heirs and deceased persons noted. Link the document to notarial
      acts, civil status acts, wills, waivers, divisions and subsequent entries.
    before_after: First, the testator's right is proven. Then the chain of succession and quotas are established, and then
      whether each heir has made dispositions. Only then is a deal prepared with the right parties.
    payment: Don't pay a down payment to one heir for the "whole estate" before it's clear who should sign and what rights
      they have. The reservation or advance contract must bind the proper persons and govern the impossibility of general
      transfer.
    availability: Mesto does not extract certificates for heirs and does not process the personal data in them. This is a
      document that is provided by the parties and reviewed within the specific legal review.
    where: Ask for an up-to-date certificate from the sellers and confirm it through the competent municipality or the electronic
      service when applicable. In the case of a complex hereditary history, ask for all related documents.
    professional_review: A lawyer should calculate quotas and check wills, disclaimers, divisions and subsequent transactions.
      The notary verifies the parties for the particular transaction, but prior independent verification remains important.
    buyer_checks:
    - Prove first that the testator was the owner of the correct property.
    - Track each deceased heir and each subsequent succession.
    - Check wills, renunciations, divisions and subsequent dispositions.
    - Ensure that all necessary persons are involved in the contracts.
