  - notaries_law
  source_checked_at: '2026-09-05'
  content_version: 2
  editorial_status: published
  professional_review_status: pending
  sections:
    understand: |-
      "Reservation fee", "holding deposit", "deposit" and "earnest money" are not automatically interchangeable. Their effect depends on the exact wording, the parties, the purpose of the payment and the surrounding facts. The title of a form or an explanation over the phone is not enough to determine whether and when the amount will be refunded.

      The first question is what you get for paying. This may be a temporary suspension of the offer, a commitment to prepare a contract, part of the price or another stipulation. It must be clear which property is being reserved, for how long and what actions each party is required to take.
    verify: |-
      Check who will receive the money and on what basis. If you are paying an intermediary or another person, find out whom they represent, whether they have authority to receive the payment and when the money reaches the seller. Match the exact property, seller and underlying rights with the available documents before the transfer.

      Read all cases of return, detention and interception. Include seller refusal, legal or technical due diligence problem, unapproved financing, non-attainment of contract text and expiry. Don't rely on a verbal promise that is missing from the document.
    documents: |-
      Ask for the draft reservation agreement, the seller's bill of rights, a schematic or accurate description of the project property, up-to-date information on encumbrances and relevant building documents. If the intermediary has its own contract or terms and conditions, these are also part of the decision.

      In the payment document, it looks for the exact recipient, bank account, currency, amount, basis, term, subject and signatories. Keep the signed copy and proof of payment in the same version of the file.
    money: |-
      There is no one correct amount or time for such a payment. Assess how much of the funds you are putting at risk, how long they can remain blocked and whether the conditions allow you to complete the necessary checks before the next commitment.

      For a mortgage, specify which banking steps can actually be completed within the term. Advertising consultation or preliminary calculation does not guarantee credit. If the return is dependent on financing, the condition should be specific enough for your case.
    risks: |-
      Red flags are payment to a different person without a clear reason, blank fields, undescribed property, withholding of amount for almost any reason for refusal, very short contract period and refusal to provide basic documents. The "now or lose" pressure doesn't change the need to understand the terms.

      There is also a risk when the document blocks only the buyer, but does not contain a verifiable commitment of the seller not to negotiate or prepare a contract. Check how a violation is proven and how in practice the refund is requested.
    professionals: |-
      An independent attorney should read the specific document and related contracts before payment, especially when the amount is substantial or the terms are unclear. The lender only confirms their financial process, and the broker does not replace the review in your interest.

      If the property description or construction documents are unclear, an architect or engineer can help compare them. Specify in writing exactly what each specialist checks.
    act: |-
      Submit all terms and conditions and documents for review as one package. Put your questions in writing and ask for a revised draft if the answer changes the arrangement. Do not transfer to a different account or on a different basis than agreed upon without an explanation and a new check.

      If the seller does not give a reasonable time for inspection or clear conditions for cancellation and refund, do not pay with the idea of ​​working out the details later. This in itself is important information about the proposed transaction.
    next: |-
      After making a reservation, prepare the preliminary contract with all its appendices and continue any checks that could not be completed before payment. Keep track of the exact deadline and who is responsible for providing the first draft.

      If there is no reservation, proceed directly to the preparation before a preliminary contract. Missing a payment does not mean missing checks.
    buyer_checks:
    - Confirm who receives the money, for whom it acts and on what basis.
    - Describe the exact property, amenities and reservation period without blank fields.
    - Read each case of return, hold and termination separately.
    - Ensure that the timeframe allows for legal, technical and financial review.
    - Keep the signed version, attachments, correspondence and proof of payment.
- key: guide.before_preliminary_contract
  slug: predi-predvaritelen-dogovor
  kind: guide
  category: buyer_journey
  buyer_stage: before_preliminary_contract
  locale: en
  title: Before the preliminary contract
  summary: Make sure the contract clearly describes the property, rights, appendices, payments and termination terms.
  aliases:
  - before preliminary contract
  - draft contract
