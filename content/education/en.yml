  - term.warranty_period
  - term.bds_finish
  - term.utility_connection
  source_ids:
  - obligations_contracts
  - construction_warranties
  - condominium_law
  source_checked_at: '2026-09-05'
  content_version: 2
  editorial_status: published
  professional_review_status: pending
  sections:
    understand: |-
      The actual handover may be on a different date than the notarial transfer or commissioning. It must follow the specific contract and record what you actually get: condition, keys, access, appliances, documents and meter readings.

      Handing over is not just signing a protocol. This is the best opportunity to describe in writing the original condition, defects and absences. A generic "accepted without objection" can make subsequent communication difficult if it doesn't reflect the real view.
    verify: |-
      Compare the property with the contract annexes and the promised degree of completion. Check premises, dimensions if in doubt, joinery, flooring, doors, installations, appliances, terraces, storage, parking space and access to common areas. Separate the visible defect from a matter that requires measurement or specialist.

      Check the number and purpose of keys, cards and remotes, meter readings and numbers, available utility accounts and warranty and service documents. Photos should be able to link to a specific point of the protocol.
    documents: |-
      Prepare a draft of the handover protocol in advance. It provided for the date, participants, basis, exact property, accessories, keys, meter readings, received documents, defects, term and person responsible for removal and method for re-inspection.

      Ask for the applicable introduction document, warranty documents, instructions, technical passport or access to it, energy documents and rules or management and maintenance contracts as applicable.
    money: |-
      Check whether the contract links the handover to a final payment, retainer, maintenance fee or other commitment. Do not assume that the presence of defects automatically creates a right to withhold payment; this depends on the specific text and applicable law.

      Record the initial readings and the date from which you carry current costs. Clarify deposits, common area, parking and service fees without accepting a verbal monthly amount as a permanent one.
    risks: |-
      Risks are inspection in insufficient light, pre-filled protocol, pressure for immediate signature, refusal to enter remarks and promise to clarify defects later. A cosmetic appearance does not prove the operation of the installations or the condition of hidden elements.

      Also be careful when the common areas, access or infrastructure are not in the promised condition, but the protocol only describes the apartment. Specify what is part of your contract and how it is tracked.
    professionals: |-
      An independent engineer or technical specialist can carry out a systematic inspection and measurements. The attorney reviews the meaning of the protocol, deadlines, and default rights. The seller's representative must be authorized to sign and take the recorded actions.

      Arrange the specialist and access in advance. If technical inspection requires time or equipment, a brief formal inspection on the day of handover may not be sufficient.
    act: |-
      Send a list of viewing points and participants before the date. During the delivery, number the defects, take pictures, describe the location and arrange a verifiable time and method for confirming the repair.

      Do not sign text that does not reflect what you saw or contains empty fields. Receive a signed copy immediately and keep the next communication on the same list without losing the link between defect, photo and reply.
    next: |-
      After delivery, track defects, warranties, utility accounts, insurance and common parts management. Open the separate guideline for the first months as an owner, because some of the tasks start after the keys.

      If delivery is refused or incomplete, document the facts and seek legal advice on the specific contractual procedure.
    buyer_checks:
    - Compare the property and fixtures with the signed plans and technical specification.
    - Engage an independent technical specialist and ensure sufficient time and access for inspection.
    - Record each defect with a photo, location, person responsible, deadline and method of re-inspection.
    - Describe all keys, cards, remotes, appliances, readings and documents received.
    - Keep the signed copy and continue tracking defects against the same numbered list.
- key: guide.owner
  slug: parvi-mesetsi-kato-sobstvenik
  kind: guide
  category: buyer_journey
  buyer_stage: owner
  locale: en
  title: The first months as an owner
  summary: Organize the documents, utility accounts, warranties and insurance, then get to know how the building is managed.
  aliases:
  - I'm already an owner
  - after purchase
  - after receiving keys
  keywords:
  - accounts
  - insurance
  - guarantees
  - condominium
  - maintenance
  related_stage_keys:
  - building.handover
  related_document_keys:
  - document.warranty_documents
  - document.condominium_documents
  - document.maintenance_agreement
  - document.technical_passport
  related_term_keys:
  - term.condominium
  - term.warranty_period
  - term.defects
  - term.utility_connection
  source_ids:
  - condominium_law
  - construction_warranties
  - property_law
  source_checked_at: '2026-09-05'
  content_version: 1
  editorial_status: published
  professional_review_status: pending
  sections:
    understand: |-
      The purchase process does not end with receiving the keys. In the first months you have to sort out the documents, the utility accounts, the guarantees and the relationships in the building. Different deadlines can start from different events, so check the start date for each one.

      Separate personal property from common areas. A problem in a roof, facade, elevator, yard or general installation may require action through the condominium or management company, not just an individual report to the seller.
    verify: |-
      Check that you have the notarial deed, proof of registration, cadastral scheme, handover record, warranty documents and any management or maintenance contracts. Match the initial meter readings and utility-account transfer or opening dates.

      For unfinished defects, maintain the status by the protocol number. In case of a new problem, write down the date, the manifestation, the photos and who you notified. Do not perform repairs that may eliminate the cause before documenting the condition and obtaining proper advice.
    documents: |-
      Create a permanent archive for the property: ownership documents and cadastre; transaction and payments; technical and warranty documents; condominium and maintenance; utility accounts, taxes and insurance. Keep originals separate from working copies.

      Request minutes and decisions of the general meeting, regulations, budget, known obligations and contracts that affect general expenses. The document shows a specific decision as of a certain date, it does not guarantee the future amount of fees.
    money: |-
      Sort running costs by category: utilities, condominium, management, maintenance, insurance, tax and reserve for repairs. Confirm who is charging the amount, on what grounds and for what period, instead of paying on an unverified verbal instruction.

      For general repairs or new fees, ask for the decision and the method of distribution. Mesto does not calculate your individual liability and is not a substitute for reviewing condominium documents.
    risks: |-
      Risks are lost warranty periods, phone-only alerts, unclear utility accounts, condominium decisions not received, and automatic fee payment without a contract or decision. A small leak or defect can become more difficult to prove if it is not documented in time.

      Also be careful with finishing repairs that affect common parts, construction or installations. Ownership of the apartment does not mean a free right to change everything around it.
    professionals: |-
      Technical specialist helps with defects and planned repairs; lawyer - in case of a dispute, warranty claim or condominium decision; accountant or local administration - for specific tax matters. The house manager organizes general processes, but does not automatically represent your personal interest.

      For insurance, check coverage, exclusions and connection to common areas. Choose help according to the specific problem, not just who is most readily available.
    act: |-
      Create a calendar for utility accounts, tax steps, insurance, warranty periods and defect tracking. Save the relevant contacts and reporting procedures, including proof that each notice was received.

      Present yourself to the building management and ask for basic documents and a notification channel. Check out how meetings are held and how you can get the decisions instead of learning about them after an expense is incurred.
    next: |-
      After the initial arrangement, move on to a periodic review of documents, insurance and technical condition. Update the file in case of renovation, rental, new condominium decision or change of ownership.

      If you plan to sell or refinance later, a well-organized file will make future verification easier. However, it does not guarantee its result.
    buyer_checks:
    - Collect the title deed, plan, protocol, warranties and contracts in your permanent archive.
    - Transfer or locate accounts and keep opening readings and dates.
    - Check condominium rules, decisions, budget and contacts.
    - Describe the defects and declare them in writing before the expiration of the relevant terms.
    - Sort out insurance, ongoing costs and a periodic review calendar.
- key: guide.completed_home
  slug: zavarsheno-zhilishte
  kind: guide
  category: property_type
  property_types:
  - completed_home
  locale: en
  title: Purchase of a completed home
  summary: Check the title and encumbrances, the exact property, its actual condition, the common areas and the entire budget
    for the purchase.
  aliases:
