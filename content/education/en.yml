  content_version: 2
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    what: |-
      Act Form 15 records whether the construction is ready for acceptance. In it, the statutory participants describe the completed works against the approved design and certified as-built documentation, as well as the builder's handover of the construction and its documents to the developer.
      This is an important late documentary stage, but it is not the colloquial "permission to move in". The act itself may contain remarks and refer only to a certain phase, block or part.
    when: Compiled after completion of acceptance construction and prior to the applicable commissioning procedure. Between
      Act 15 and the final act there may be additions of documents, checks and troubleshooting.
    who: It is signed by the intended participants - developer, builder, designers, construction supervision and
      others according to the category and the case. Signatures and representation are part of the verification, not a formal
      detail.
    why: The buyer understands that the project has reached the acceptance phase, but needs to see exactly what has been accepted
      and with what caveats. This affects expectations for final clearance, contract payments and handover preparations.
    establishes: Establishes the described condition, the suitability for acceptance and the completion of the documentation
      for the specific construction, part or stage. What exactly it proves depends on its content and applications.
    not_establish: It does not authorize occupancy, is not a permit to occupy or a certificate of occupancy and does not prove
      ownership, absence of encumbrances, payment, quality without defects or delivery of a particular apartment to the buyer.
    compare: Check the permit, category, PI and UPI, block, stage and description of construction, date, participants, signatures,
      remarks, attachments and as-built documentation. Compare them with the subsequent final deed - both documents must
      actually include your building.
    before_after: Before it are the implementation, Act 14, the tests and the documentation of what was done. It is followed
      by the applicable checks and Protocol form 16/use permit or entry certificate according to the category.
    payment: It may be a condition of payment, but only the specific clause determines when it is fulfilled and how it is
      proved. Check if the contract requires a signed deed for the exact block, if it allows certain comments and how you
      should be notified.
    availability: Mesto cannot get Act 15 itself in any case. A public record of another administrative act or allegation
      of the seller does not mean that Act 15 has been found and reviewed.
    where: Request the complete deed and attachments from the contractor, seller or construction supervisor. If necessary,
      consult the competent construction file.
    professional_review: An engineer reviews comments, tests and technical readiness. A lawyer compares the subject matter and
      the date with the contract, the payment clauses and the transaction being prepared.
    buyer_checks:
    - Read the notes, applications and the exact scope of the reception.
    - Check if the deed is for your block and not for infrastructure or another phase.
    - Distinguish Act 15 from final commissioning.
    - Check which condition in the contract gives rise to an obligation to pay.
- key: document.commissioning
  slug: akt-16-vavezhdane-v-eksploatatsiya
  kind: document
  locale: en
  category: planning_construction
  title: '"Act 16" and commissioning'
  summary: '"Act 16" is a colloquial name for various documents. It is important to distinguish between the Form 16 Protocol,
    the use permit and the commissioning certificate.'
  aliases:
  - act 16
  - Act 16
  - protocol 16
  - permission to use
  - commissioning
  - entry certificate
  keywords:
  - DPC
  - DNSK
  - construction category
  - usage
  - municipality
  related_stage_keys:
  - building.commissioning
  related_document_keys:
  - document.act15
  - document.executive_documentation
  - document.technical_passport
  - document.energy_certificate
  related_term_keys:
  - term.construction_category
  - term.utility_connection
  - term.defects
  source_ids:
  - zut
  - dnsk_commissioning
  - ministry_act15_16
  - construction_warranties
  source_checked_at: '2026-09-05'
  content_version: 2
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    what: |-
      In everyday language, "Act 16" often means that the building is commissioned. Legally, the Form 16 Protocol, the use permit and the commissioning certificate must be distinguished - they are not the same document.
      The applicable procedure depends on the construction category. The buyer should therefore look for the exact final document, issuing authority and scope, not just the phrase used in the listing.
    when: After Act 15 and fulfillment of the prerequisites for the specific construction. The final act may cover a separate
      stage or part of a complex, and another building on the same terrain may follow a different procedure or date.
    who: For first- to third-category construction, the use permit is issued by the DNSK after the state acceptance
      commission and the Form 16 Protocol. For fourth- and fifth-category construction, the commissioning certificate is issued by the
      authority that issued the permit.
    why: The document determines whether the specific building is allowed to be used under the applicable regime. This is
      separate from ownership, keys, individual utility accounts and apartment quality - four topics that are often mistakenly conflated.
    establishes: The final act establishes that the use of the precisely described construction, part or stage is permitted.
      The number, date, category and description indicate which parts of the project are actually covered.
    not_establish: It does not prove the seller's ownership, the absence of mortgages or foreclosures, the transfer of possession,
      the opening of individual utility accounts, the performance of a private contract or the absence of manifest and latent defects.
    compare: Check the document type, issuer, number and date, category, building permit, PI/UPI, block, entrance, stage and
      purpose. Compare applications and amendments and be careful that a document for a substation, street or neighboring
      block is not accepted for the residential building.
    before_after: It is preceded by Act 15 and the acceptance documentation. The notarial transfer, the actual
      handover, warranties, maintenance arrangements and utility connections still need to be dealt with separately.
    payment: If the contract says "Act 16", make it clear which legal document it is referring to and when it is considered
      to have been received - on issue, entry into force or notification. Do not take the colloquial title as a sufficiently
      accurate payment term.
    availability: Mesto is looking for records in the maintained public registers, including the NAG for Sofia. The absence
      of a record does not prove that the document is missing, while any record found still requires verification of its scope and
      the relationship to the building.
    where: According to the category, check the DNSK register for the use permit or the relevant municipality or regional
      administration for the commissioning certificate. Also ask for a full copy from the contractor or seller.
    professional_review: A lawyer checks the category, scope, effect and contractual consequences. An engineer is needed for
      technical remarks, phasing or inconsistency between the document and the actually implemented infrastructure.
    buyer_checks:
    - Determine whether you are looking at a protocol, a license to use, or a certificate.
    - Check the category and relevant publisher.
    - Match the item with the exact block, entry and purchase phase.
    - Check ownership, encumbrances, conveyance and utility accounts separately.
- key: document.technical_passport
  slug: tehnicheski-pasport-na-sgrada
  kind: document
  locale: en
  category: planning_construction
  title: Technical passport of the building
  summary: It collects the main technical characteristics, the inspections carried out and the measures for maintaining the
    building. Does not guarantee that it is free of defects.
  aliases:
