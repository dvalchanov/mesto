  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    definition: |-
      The appurtenant part serves the main self-contained unit and is described to it - for example, a cellar or an attic. It can be present in cadastral and ownership documents without having an independent identifier and a separate real estate status.

      The exact regime depends on the approved projects, the title document and the relationship with the main object, not just on the number placed or actual use.
    example: |-
      A notarial deed may transfer an apartment together with "basement No. 7, measuring 4.20 sq m". If the offer promises storage room No. 7 but it is missing from the project or title document, a handover record cannot create a property right to it.

      A storage unit with its own identifier must be assessed separately.
    confusion: |-
      Adjacent, common, and detached are different categories. The locking of a premises and its exclusive use does not prove separate ownership, and the inclusion of its area in an advertising "total area" does not automatically indicate how it is transferred.

      Don't assume that a basement or attic can always be sold separately from the home.
    importance: |-
      For the buyer, the attached parts are often a material part of the price and daily use. A vague description can lead to missing premises, dispute over number or boundaries, impossibility of separate disposal and discrepancy between contract and deed.

      A bank or prospective buyer may also require clearly traceable ownership of the underlying object.
    related: |-
      Compare the description in the offer, architectural design, cadastral scheme and draft deed. Record the number, location, area, boundaries and legal status: appurtenant unit, self-contained unit, common area or allocated use.

      When handing over, check the physical premises, but do not use only the key as proof of the acquired right.
