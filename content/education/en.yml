  - document.site_opening
  - document.act14
  - document.act15
  related_term_keys:
  - term.material_deviation
  - term.construction_roles
  - term.object_designation
  source_ids:
  - zut
  - ordinance_3
  - dnsk_construction_control
  source_checked_at: '2026-09-05'
  content_version: 1
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    definition: |-
      "Construction documents" is a general term for the documents on the basis of which construction is permitted, executed, controlled and accepted. It may include approved investment projects, building permit, order book, acts and protocols, as-built documentation and other applicable documents.

      Each document has a specific function, date, issuer, participants and scope; having one does not automatically prove the entire process.
    example: |-
      A seller shows a building permit and claims that "all building documents are in order." However, the buyer must find out if the permit is valid, what amendments there are, which block it covers and how the project apartment connects to it.

      Act 14 later proves a different matter from the permit itself.
    confusion: |-
      A folder with utility accounts of documents does not equal a proven and consistent construction process. Informal drawings, advertising spreads and unsigned tables do not become approved designs just because they look technical.

      The fact that the document is public does not mean that Mesto or a municipal portal shows all applications and up-to-date amendments.
    importance: |-
      The building documents help the buyer to check whether the promised object is part of the permitted construction, what changes have been made and what events have been authenticated. If the documents are not complete, the section, stage, purpose or subsequent amendment may remain unclear.

      They are also often linked to contractual payments, so a title without content is not enough.
    related: |-
      Made a timeline from PUP and visa through permit, site opening, construction acts and acceptance to commissioning. For each document, check the number, date, entry into force, construction, stage, participants, annexes and amendments.

      Let an architect or engineer read the technical scope and the lawyer read the legal and contractual effect.
- key: term.material_deviation
  slug: sashtestveno-otklonenie
  kind: term
  category: construction
  locale: en
  title: Significant deviation from the project
  summary: A change compared to the approved investment project, for which ZUT may require a special procedure. An arrangement
    between a buyer and a seller is not an administrative approval.
  aliases:
  - significant deviation
  - project change
  - executive
  - amendment of the investment project
  keywords:
  - approved project
  - distribution
  - purpose
  - permission
  related_stage_keys:
  - building.authorization
  - building.installations
  - building.act15
  related_document_keys:
  - document.building_permit
  - document.act15
  - document.cadastral_sketch_scheme
  related_term_keys:
  - term.construction_papers
  - term.object_designation
  - term.property_areas
  source_ids:
  - zut
  - dnsk_qa
  - dnsk_construction_control
  source_checked_at: '2026-09-05'
  content_version: 1
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    definition: |-
      A deviation is a difference between the implemented or planned change and the approved investment project. ZUT distinguishes significant deviations with different consequences and procedures; the exact qualification depends on the nature and timing of the change.

      Not every change is prohibited, but its authorization is not evidenced by verbal consent or a new advertising scheme.
    example: |-
      The buyer wants to move a wall and combine rooms. The developer shows an updated drawing, but it must be established whether the change affects construction, installations, purpose, common parts or indicators and in what order it is reflected.

      In the event of a general floor change, other objects may be affected.
    confusion: |-
      as-built documentation cannot subsequently legitimize any change. The signature of the buyer under a new distribution is not an administrative approval, and the reflection in the cadastre does not replace the building documents.

      A small visual difference can have a big legal effect, and a visible big change can be duly approved - the deeds are checked.
    importance: |-
      For the purchaser, the deviation may change the area, purpose, adjacency, common areas and the possibility of commissioning. If the promised apartment does not correspond to the approved and executed object, the notarial deed does not resolve the technical discrepancy.

      Early inspection reduces the risk of expensive repairs or the desired change being unacceptable.
    related: |-
      Compare the annex to the contract with the last approved design and the one executed on site. Ask for the orders, drafts and approvals for any change. Have a designer or independent architect explain whether it is material and in what order it is approved and reflected.

      Record who bears the cost and responsibility if the promised change cannot be approved or put into operation.
