  related_term_keys:
  - term.condominium
  - term.ideal_shares
  - term.appurtenant_parts
  - term.utility_connection
  source_ids:
  - condominium_law
  - obligations_contracts
  - property_law
  source_checked_at: '2026-09-05'
  content_version: 1
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    what: |-
      The maintenance and management contract regulates services for common areas, infrastructure, security, landscaping, cleaning, reception or other activities according to the building or complex. It may be separate from the condominium rules and from the title itself.
      Especially in a closed-end complex or with an associated company of the investor, the contract may be long-term and contain automatic renewal, indexation and termination restrictions.
    when: Must be reviewed prior to reservation or preliminary contract if purchase is related to mandatory management. It is important
      again at the handover, when the charges and the actual provision of the services start.
    who: It is signed between the owner/buyer and the company or person providing the services, and in some cases it is related
      to the investor or condominium. Check the dealership and who controls the contractor.
    why: The fee can significantly increase the annual cost of the property and is payable regardless of whether you live
      in it. A vague description of services can lead to payment without a measurable standard, accountability or easy termination.
    establishes: Establishes the agreed services, area or basis for the fee, term, method of payment, indexation, reporting,
      access, sanctions and termination. Budget and standard applications are an essential part.
    not_establish: It does not prove that all common areas are owned by the condominium, that the services are performed in
      a quality manner or that the charge cannot be disputed. It does not replace condominium management decisions and obligations.
    compare: Check parties, term and continuation, services and measurable standard, which areas are served, basis and currency
      of the fee, VAT, indexation, budget and report, control, termination, penalties, transfer on sale and connection with
      the general meeting.
    before_after: Before the contract, it should be clear who owns and manages the infrastructure and what has already been
      promised in the purchase contract. After signing, request service reports and protocols and monitor condominium decisions.
    payment: Clarify from which date the fee begins - notarial transfer, conveyance, entry or calendar date - and how it
      is calculated for an incomplete year. Do not allow first invoice payment before you have received the contract and attachments.
    availability: Mesto does not retrieve maintenance contracts, invoices or private budgets. The public information about
      the complex does not automatically show the real cost and the contractual obligation of the apartment.
    where: Request the draft contract, tariff, budget, standards and recent reports from the seller, investor, manager or
      service company. Talking to existing owners can provide useful information, but is no substitute for reviewing the contract
      itself.
    professional_review: An attorney should review long term, automatic continuation, indexation, penalties, and property
      relationship. An accountant or technical professional can assess the budget and the realism of the services.
    buyer_checks:
    - Calculate the full annual cost, including VAT, indexation and additional services.
    - Check the term, auto-renew and actual termination method.
    - Demand a measurable standard, budget, accountability and control over the contractor.
    - Distinguish private contract from condominium decisions.
- key: document.design_visa
  slug: viza-za-proektirane
  kind: document
  locale: en
  category: planning_construction
  title: Design permit (visa)
  summary: An extract from the current development plan with design parameters for a particular property. It is an important
    starting point, but does not authorize construction.
  aliases:
  - visa
  - visa sketch
  - design visa
  keywords:
  - construction lines
  - structural indicators
  - project
  - chief architect
  related_stage_keys:
  - building.land_planning
  related_document_keys:
  - document.pup
  - document.investment_project
  - document.building_permit
  related_term_keys:
  - term.upi
  - term.land_property
  - term.gross_floor_area
  source_ids:
  - zut
  - nag
  source_checked_at: '2026-09-05'
  content_version: 2
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    what: |-
      The design visa is a sample of the current detailed development plan, supplemented with data and prescriptions for the design in a specific property. It shows the initial conditions for the project: the permissible development, lines, heights and other restrictions for the property.
      The visa is not a promise of exactly what kind of building will be approved. For the buyer, it is a way to understand on what planning basis the idea was developed, and not a ready-made substitute for the investment project and the building permit.
    when: The visa is important in the early phase - before the approval of the investment project and the issuance of a building
      permit. There may be a subsequent visa or a change in the structural basis, so check the date and link with the current
      project.
    who: It is issued by the chief architect of the competent administration under the order of ZUT. The designer uses her
      data, but does not issue her; a brokerage offer or scheme prepared by the investor is not the administrative visa itself.
    why: When buying in the green, ad previews often precede final approvals. The visa helps to verify that the project refers
      to real property and complies with the zoning conditions, as well as whether later documents indicate the same PI, UPI
      and development.
    establishes: Establishes the contents of the sample and the instructions as of the date of issue, for the specified property
      and the plan then in effect. It can show restrictive and mandatory lines, construction method and other explicitly reflected
      conditions.
    not_establish: It does not establish that the investment project has been approved, that the building permit has entered
      into force, that the project will not be amended, or that the seller owns the future apartment. Nor does it prove ongoing
      physical progress.
    compare: Match the number and date, the issuer, the identifier and boundaries of the property, the number of the UPI and
      the district, the current PUP, the lines and indicators of development. Then check that the permit and the approved
      project refer to the same structural basis.
    before_after: Before the visa is the current development plan or the procedure for its amendment. After that, the project
      parts are developed and evaluated, and only after the applicable agreements and approvals can a construction permit
      be obtained.
    payment: A visa is rarely a reasonable stand-alone basis for a substantial payment. If the contract mentions it, check
      whether it requires only the issuance of a visa or an approved project, a valid permit and the exact identity of the
      future object.
    availability: Mesto can display a public reference when available in a supported administrative source, but cannot download
      a certified copy from each municipality. The presence of this educational page does not mean that the visa has been
      found for the particular property.
    where: Ask for a copy from the investor or the seller and compare it with the file in the relevant municipality or regional
      administration. For Sofia, part of the information may be visible through the NAG public services, but this depends
      on the specific file.
    professional_review: An architect or structural engineer can read the constraints and link to the project. A lawyer is
      appropriate when the contract presents the visa as a guarantee of future authorization or links it to payment and right
      of refusal.
    buyer_checks:
    - Check that the property and RPI match those in the offer and the project.
    - Ask for the current document, not just a cropped image without a number and date.
    - Compare the visa with the approved project and building permit.
    - Clarify whether there is an amendment to the PUP or a new visa after its issuance.
- key: document.pup
  slug: podroben-ustroystven-plan
  kind: document
  locale: en
  category: planning_construction
  title: Detailed development plan (PUP)
  summary: The plan that governs the boundaries, purpose and development of a given territory. It is a basis for design, but
    does not endorse a specific building.
  aliases:
  - PUP
  - regulation plan
  - building plan
  - PRZ
  keywords:
  - regulation
  - construction
  - layout plan
  - UPI
  - entry into force
  related_stage_keys:
  - building.land_planning
  related_document_keys:
  - document.design_visa
  - document.investment_project
  - document.building_permit
  related_term_keys:
  - term.upi
  - term.land_property
  - term.easement
  - term.gross_floor_area
  source_ids:
  - zut
  - nag
  source_checked_at: '2026-09-05'
  content_version: 2
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    what: |-
      The detailed development plan governs how a specific territory is organized. According to its type, it can determine regulatory limits, purpose, way and lines of construction, access and other planning solutions.
      The PUP is a plan basis, not the set of apartment drawings. What matters most to the buyer is which order or decision approved the applicable plan, whether it became effective, and whether it was later amended.
    when: It is most important before the design and construction permit, but it can also be necessary when buying a ready-made
      property - especially in case of a dispute about boundaries, access, future development or discrepancy between the cadastre
      and the regulation.
    who: It is approved by the competent administrative authority according to the scope and type of the plan. The designer
      makes it, but the final status comes from the act of approval and its operation, not from an unaccepted design or marketing
      scheme.
    why: The PUP helps to understand whether the property has the planned development regime and how the project fits into
      it. This is important for access, density, height, building placement and the relationship between the colloquial 'parcel'
      and the legal RPI.
    establishes: The current plan establishes the development solutions that are expressly approved for the specified territory.
      The order, the graphic and the text must be read together and for the correct scope.
    not_establish: It does not prove that the specific investment project has been approved, that the building permit is valid,
      that the owner has indisputable rights, or that the building has been completed according to plan. The PUP is not a
      cadastral map and differences are not resolved by looking at a single drawing.
    compare: Check the type of plan, the act of approval, the date and the entry into force, the properties covered, the neighborhood
      and the RPI, the purpose, the lines and indicators, the access to the street and subsequent amendments. Compare with
      the visa, the project, the permit and the current cadastral card.
    before_after: The plan precedes the visa and the investment design. It is followed by design parts, conformity assessment
      and authorization. If the PUP has been amended, check which subsequent documents were issued on the old and which on
      the new basis.
    payment: The mere approval of the PUP does not mean that construction can begin or that a future apartment is already
      individualized. If payment is subject to "settlement" or "approved PPA", the contract should specify the exact act,
      scope and consequences of an appeal or change.
    availability: Mesto can display found public records for some of the planning procedures, mainly according to supported
      local sources. It is not assumed that the absence of an online record means the absence of a plan or that the map shown
      is the complete file.
    where: Check with the relevant municipality or regional administration and request the order together with the relevant
      graphic and textual parts. Public portals are useful for orientation, but if status is unclear, an official reference
      or copy is required.
    professional_review: An architect or urban planner is needed for complex lines, metrics, related development, access or
      divergence with the project. An attorney should evaluate the enactment, appeal, and contractual promises based on a
      future planned change.
    buyer_checks:
    - Find the act of approval and check if the plan has gone into effect.
    - Match the PI, UPI and neighborhood numbers in all documents.
    - Check for subsequent changes that affect construction or access.
    - Do not accept a colorful situational diagram for the full operational PUP.
- key: document.investment_project
  slug: odobren-investitsionen-proekt
  kind: document
  locale: en
  category: planning_construction
  title: Approved investment project
  summary: The approved design documents on which the building permit is based and against which construction must be carried out. They show the layout and technical solutions.
  aliases:
  - investment project
  - approved project
  - architectural project
  - working project
  - technical project
  keywords:
  - architecture
  - constructions
  - installations
  - distribution
  - project parts
  related_stage_keys:
  - building.land_planning
  - building.authorization
  related_document_keys:
  - document.design_visa
  - document.pup
  - document.building_permit
  - document.executive_documentation
  related_term_keys:
  - term.property_areas
  - term.object_designation
  - term.material_deviation
  - term.bds_finish
  source_ids:
  - zut
  - dnsk_construction_control
  - nag
  source_checked_at: '2026-09-05'
  content_version: 1
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    what: |-
      The approved investment project is a set of interconnected project parts - architectural, structural, installation and others according to construction. It specifies what is allowed to be built and is the basis of the building permit.
      For the buyer, the architectural part with floors and layouts is the most recognizable, but the important promises of common parts, installations, accessibility, parking and technical solutions may be in other parts and applications.
    when: The design must be reviewed before the permit is issued, when selecting a off-plan property, when features are
      negotiated, when changes are made during construction, and when compared with what was actually done before acceptance.
    who: It is made by legally competent designers for the relevant parts and is approved by the competent authority according
      to the applicable procedure. The developer may provide copies, but advertising distribution without approval marks is
      not equivalent to an approved project.
    why: Area, purpose, exposure, openings, common areas, parking and installation routes can directly affect what you buy.
      If the contract refers to an application, check that it corresponds to the approved version and that it allows unilateral
      changes.
    establishes: Establishes the approved project solution for the specific construction and the version of the individual
      parts to the approval. Along with the permission, it shows the permitted range, but the specific conclusion depends
      on the exact part and the markings in it.
    not_establish: It does not prove that everything has already been completed exactly according to the drawings, that there
      are no approved changes, that the area in the advertisement is legally guaranteed, or that the seller has the right
      to transfer the described property. It does not replace a technical inspection.
    compare: Compare title page, number and date of approval, building permit, designer and phase, entrance, floor, site number
      and purpose, axes and boundaries, areas, appurtenant parts, common parts and parking. Check orders and approved amendments
      under Art. 154 ZUT.
    before_after: Stands on valid PUP and visa when applicable. After its approval, the permit is issued and the construction
      is carried out according to it. Permissible changes are tracked through approved changes and as-built documentation,
      not verbal assurance.
    payment: The project can individualize the subject of the preliminary contract and participate in the determination of
      the contractual stage. However, payment follows the specific clause and proof; "approved project" does not mean an automatically
      issued and effective permit.
    availability: Mesto does not automatically retrieve the full set of project parts. A public registry may confirm an administrative
      act or reference without providing the drawings against which the buyer must make the specific comparison.
    where: Ask the investor or seller for the relevant certified parts and a list of subsequent modifications. If necessary,
      they are also checked in the construction file with the competent administration under the applicable access order.
    professional_review: Architect compares apartment, areas, common parts and alterations; an engineer reviews specific technical
      parts. A lawyer checks how the project is included in the contract and what happens in case of a permissible or material
      change.
    buyer_checks:
    - Ask for the approved version to which the building permit refers.
    - Identify the apartment by entrance, floor, number and purpose, not just by marketing name.
    - Match the contract applications with the architectural part and the area table.
    - Check if there are approved changes and how they affect your property and common areas.
- key: document.building_permit
  slug: razreshenie-za-stroezh
  kind: document
  locale: en
  category: planning_construction
  title: Building permit
  summary: The administrative act authorizing a precisely described construction project under specified conditions and approved designs. It is important, but not sufficient for a complete check.
  aliases:
  - building permit
  - building permit
  - RS
  keywords:
  - entry into force
  - developer
  - project
  - stage
  - recertification
  related_stage_keys:
  - building.authorization
  related_document_keys:
  - document.investment_project
  - document.site_opening
  - document.executive_documentation
  related_term_keys:
  - term.upi
  - term.right_to_build
  - term.construction_roles
  - term.construction_category
  source_ids:
  - zut
  - nag
  - dnsk_construction_control
  source_checked_at: '2026-09-05'
  content_version: 2
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    what: |-
      The construction permit is an individual administrative act that allows the implementation of a specifically described construction based on approved investment projects and the applicable legal prerequisites. It should be read in conjunction with the projects on which it is issued.
      The title "has permission" is not enough: the entry into force, the dates for commencement and completion, the construction and stages, the developer, the category and any subsequent additions or recertifications are important.
    when: It is necessary before the construction begins according to the legal order. It remains important throughout the
      process because the site, construction, acceptance and commissioning acts must relate to the same permitted building
      or to a clearly described part of it.
    who: It is issued by the competent authority under ZUT - usually by the chief architect of the municipality or region,
      and for certain objects by another designated authority. The builder and the investor cannot create the administrative
      permit themselves.
    why: For the buyer, the document links the project with the right to build. It helps to check that the advertised entrance,
      block, phase and use are within the permitted scope, rather than relying on a general permit for a large complex or
      neighboring building.
    establishes: Establishes that at the time of issuance, the competent authority permitted the described construction under
      the specified projects and conditions. Contains data about the assignor, the property, the category and other elements
      as appropriate.
    not_establish: It does not demonstrate current physical performance, construction acceptance, Act 15 or commissioning.
      It does not prove the seller's ownership, the absence of encumbrances, the identity of a specific future apartment or
      the performance of your contract.
    compare: Compare number, date, authority, notification and entry into force, developer, PI/UPI, address, name
      and stages, category, project parts and conditions. Track orders for additions, amendments, recertifications and their
      connection to the correct block.
    before_after: It is preceded by structural and project preparation, rights on the terrain and approved projects. After
      that comes the opening of the site, the determination of the construction line and level, the implementation and the
      relevant acts under Ordinance No. 3.
    payment: It can only be a condition of payment if the contract expressly provides for it and states how it is to be proved
      - for example, by issuance or entry into force. The law does not set a general payment schedule, and permission for
      another phase does not automatically create your obligation.
    availability: Mesto is looking for references in the supported public administrative sources, including the NAG for Sofia.
      This does not guarantee full national availability, a certified copy, or that the record found covers the selected subject.
    where: Request a complete copy with notes from the developer or seller and check it in the register or file
      of the competent administration. When disputing an action or appeal, use an official reference.
    professional_review: An architect or engineer can track project scope and modifications. A lawyer examines the operation
      of the deed, the rights of the assignor and how the permission was converted into a contractual promise or condition
      to pay.
    buyer_checks:
    - Confirm that the permit is for the correct block, phase and purpose.
    - Check entry into force, deadlines and possible re-certification.
    - Request all supplemental orders and approved amendments.
    - Compare the permit with the project, Act 14, Act 15 and the final document.
- key: document.site_opening
  slug: protokol-otkrivane-stroitelna-ploshtadka
  kind: document
  locale: en
  category: planning_construction
  title: Construction site opening protocol
  summary: Certifies the opening of the construction site and the determination of the construction line and level when this
    protocol is required for the construction.
  aliases:
  - Act 2
  - sample 2
  - construction line and level
  - site opening
  keywords:
  - start of construction
  - tracing
  - level
  - construction site
  related_stage_keys:
  - building.commencement
  related_document_keys:
  - document.building_permit
  - document.act14
  related_term_keys:
  - term.construction_papers
  - term.construction_roles
  source_ids:
  - zut
  - ordinance_3
  - dnsk_construction_control
  source_checked_at: '2026-09-05'
  content_version: 2
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    what: |-
      The protocol, drawn up using the applicable statutory form, records the opening of the construction site and the setting of the construction line and level for a precisely identified project. In practice it is often called "Act 2", but that shorthand can obscure which version of the form was used and what it actually certifies.
      The document links the authorized project to the place from which the implementation begins. It does not simply note a date for the "start of construction", but describes the participants, the actions performed and the specific construction.
    when: It is drawn up after the availability of a valid permit and upon commencement in accordance with the applicable
      procedure. The exact timing and form depend on the type of construction; in a large complex, different stages may have separate
      protocols.
    who: It is signed by the legally defined participants - developer, builder, supervisor, designer, municipal
      representative or other persons according to the model and the case. Their names and quality must match the specific
      construction.
    why: The buyer can verify that the physical start is related to the correct permit, property and phase. This is particularly
      important when the offer uses a general "start of complex" date and the contract is for a later block.
    establishes: Establishes the actions and findings expressly recorded in the protocol - for example, the opening of the
      construction site and the setting of the line and level. It applies only to the specified construction and date.
    not_establish: Does not prove completed foundations, accepted construction, "rough construction", Act 15 or commissioning.
      It does not confirm that any future building on the property has begun or that payment is already due.
    compare: Check the form, date, building permit, PI/UPI, project name, block and stage, specified elevations, participants, signatures,
      remarks and attached diagrams. Compare with subsequent acts and with the construction schedule only as an agreed, non-official
      guide.
    before_after: The permit and approved projects come first. The documented construction process then begins,
      and acts are drawn up for works that will be closed, as well as subsequent protocols for the construction and acceptance.
    payment: If the contract uses "Act 2" as a payment condition, check which form and block it refers to and whether it requires
      a signature, certification, or other event. Mere excavation of the field or protocol for another phase is not enough.
    availability: Mesto does not usually extract the protocol itself automatically. A public record may contain a date or
      reference, but this is no substitute for reviewing a copy and verifying the construction and participants.
    where: Ask the contractor, construction supervisor or seller for it. If necessary, check the construction file in the
      competent administration according to the access rules.
    professional_review: An engineer or architect can check the technical markings, elevations and the connection to the project.
      A lawyer is needed when the protocol is a condition of payment, termination or other important contractual effect.
    buyer_checks:
    - Find out exactly which form was signed and which phase it covers.
    - Match the permit number, property, block and participants.
    - Do not replace the copy of the protocol with a photo from the construction site.
    - Check the contract definition before related payment.
- key: document.act14
  slug: akt-14
  kind: document
  locale: en
  category: planning_construction
  title: Act Form 14
  summary: Certifies acceptance of the building's structural frame. It is not final acceptance and does not, on its own,
    confirm that every condition for the legally defined rough-construction stage has been met.
  aliases:
  - act 14
  - Act 14
  - sample 14
  - construction act
  keywords:
  - rough construction
  - construction
  - constructor
  - acceptance
  related_stage_keys:
  - building.act14
  related_document_keys:
  - document.site_opening
  - document.rough_construction_certificate
  - document.act15
  related_term_keys:
  - term.rough_construction
  - term.right_to_build
  - term.construction_roles
  source_ids:
  - ordinance_3
  - zut
  - dnsk_qa
  source_checked_at: '2026-09-05'
  content_version: 2
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    what: |-
      Act Form 14 is the act of acceptance of the construction. With it, the participants describe the supporting structure of the specific construction in relation to the approved construction project and note the established circumstances.
      The market uses "has Act 14" as a shorthand tag for advanced construction. However, it is important for the buyer whether the act is for the exact block and the entire construction, what remarks it contains and how it is related to the separate certification of the degree of "rough construction" in real transactions.
    when: It is drawn up once the structural frame has been completed to the approved design and before the next acceptance
      stages. The facade, installations and finishes may be on a different physical level.
    who: It is signed by the legally required participants for the specific construction, including the relevant design, construction
      and supervision professionals. A statement from the developer or broker does not replace the signed act.
    why: This is often the milestone to which a contract links payment or a possible transfer of a property under construction. However,
      the act does not automatically prove the exact identity or ownership of the future unit, readiness for use or absence
      of deviations from the project.
    establishes: Establishes the acceptance of the supporting structure in the described scope and according to the specified
      project documentation. For its correct understanding, the notes, the appendices and the exact description of the construction
      should also be read.
    not_establish: Does not establish completed installations and facade, Act 15, commissioning, quality of finish, title
      or lack of encumbrances. It should not be automatically equated to a certificate under Art. 181 ZUT.
    compare: Compare the permit, property, construction, stage and block, construction design, date, participants, signatures,
      attachments and notes. Check whether a later amendment affects the construction, layout or your unit.
    before_after: It is preceded by the permit, the site, the foundations and the intermediate acceptance of hidden works.
      Enclosing elements, installations, finishing, as-built documentation and Act 15 follow.
    payment: It triggers payment only if your contract says so. Check whether a signature is sufficient, whether a rough-construction
      construction, no objection or specific scope is required, and who notifies the buyer.
    availability: There is no one public source from which Mesto can always obtain a copy of Act 14. A reference or date
      in another document does not mean that the act itself has been found and reviewed.
    where: Request a full copy from the builder, seller or construction supervisor and check how it relates to the construction
      file. If you are going to transfer a unit at the rough-construction stage, ask for the documents required for that specific
      transaction.
    professional_review: A designer or engineer reviews the technical scope and notes. A lawyer and a notary check the property
      status of the future object and the sufficiency of the documents for the promised transaction.
    buyer_checks:
    - Confirm that the deed covers the correct block and all the construction that is important to your site.
    - Read the notes and appendices, not just the first page.
    - Distinguish Act 14 from the "rough construction" degree certificate.
    - Check the exact contractual condition before payment or transfer.
