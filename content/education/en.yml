  professionally_reviewed_at: null
  sections:
    concise_answer: Here, the administrative preparation turns into real construction. The protocol certifies the discovery
      of the site and the determination of a line and level for the specific construction, but does not show how far the execution
      went after that.
    key_points:
    - The protocol is related to the exact construction and permission.
    - Excavation and foundations are physical activities different from documentary beginnings.
    - Progress does not automatically follow from elapsed time.
    physical: |-
      The site is organized, the building is laid out according to the determined lines and levels, and earthworks begin. Depending on the terrain, strengthening, drainage, excavation, sub-layers, foundations and underground parts can be performed.

      Some of the works soon become invisible under subsequent layers. Therefore, the construction process uses specialized acts and protocols for hidden works and controlled levels; the site visitor cannot replace them with just a photo.
    documents: |-
      The protocol for opening the construction site and determining the construction line and level connects the beginning with the specific permit and construction. The order book and the subsequent applicable acts document individual circumstances of the execution.

      Not every preparatory step requires the same document, and public access to these records varies. The buyer should request the relevant documents from the developer or seller and check how the milestone is defined in the contract.
    importance: |-
      The exact positioning and construction of the foundations affect the entire building. The opening protocol helps identify which permit is being implemented and when, but it must refer to the correct block or phase.

      If the contract links payment to "commencement of construction", check how this term is defined. A marketing announcement, ground breaking and the applicable building protocol can be different events.
    not_meaning: |-
      Opening the construction site does not mean that the structural frame has been accepted, that the building has reached the rough-construction stage or that the specific apartment already exists as a separate cadastral unit.

      It does not confirm when Act 14 or commissioning will be reached and does not in itself give rise to an obligation to pay. The absence of the protocol in a verified public source also does not prove that construction did not begin.
    discover: |-
      Determine which event has occurred: an open site, defined line and level, excavation started or foundations completed. Then check how this event relates to the permit and phase of your property.

      If the contract uses this stage, read which document must be presented, who notifies the buyer and whether there is a deadline or right to check before further action.
    verify:
    - Compare the permit number, developer, construction description and phase in the protocol.
    - Check the date and scope of the opening without assuming that a document for one building covers the entire complex.
    - Ask who exercises construction supervision, who keeps the order book and where applicable construction documents are
      kept.
    - On inspection, distinguish the visible work from the authenticated event and note what cannot be seen after its closure.
    - If there is a payment, read the exact contract clause and ask for the exact proof specified in it.
    helpers: |-
      The construction supervisor and technical supervisor have roles in the construction process and documentation. An independent engineer can explain the visible works and what should normally be documented.

      The lawyer reviews the contractual meaning of the event and whether the evidence presented conforms to the clause. Don't expect the technical specialist to give a legal opinion or the lawyer to accept the quality of the foundations.
    next: |-
      The supporting structure is built in stages from the underground part to the slabs, the vertical elements and the roof structure. The visible height of the building is not in itself an acceptance of the structure.

      The next important document is Act 14 for the specific construction or stage. When you check it, compare the specified building permit, scope and participants.
  actions_by_buyer_stage:
    waiting_or_payment: 'Check your contract: the protocol found alone is not enough to determine whether you owe payment.'
    default: Ask for the documentary link between the permit, the site and the exact phase.
- key: building.act14
  slug: akt-14
  kind: stage
  locale: en
  position: 4
  title: Construction and Act 14
  summary: Act Form 14 certifies acceptance of the structural frame. It is related to the concept of "rough construction",
    but the two do not always mean the same thing.
  aliases:
  - act 14
  - Act 14
  - rough construction
  - construction
  related_stage_keys:
  - building.commencement
  - building.installations
  related_document_keys:
  - document.act14
  related_term_keys:
  - term.rough_construction
  source_ids:
  - zut
  - ordinance_3
  - dnsk_qa
  source_checked_at: '2026-09-04'
  content_version: 2
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    concise_answer: Act Form 14 certifies acceptance of the structural frame of the specified building. It is not final acceptance
      of the building and does not replace any separate evidence required to certify the rough-construction stage.
    key_points:
    - It refers to the structural frame of the specified construction.
    - Rough construction, cadastral registration and Act 14 are related but not the same document.
    - Installations, facades, common areas and connections may be forthcoming.
    physical: |-
      By this point, the building's structural system has been completed to the extent recorded in the act: foundations, load-bearing vertical elements, slabs, stair flights and the designed roof structure. This is a structural, not a finishing, stage. The apartment may not yet have screeds, plaster, completed building systems, a façade, a working lift or usable common areas.

      Appearance alone does not establish that the structure has been accepted. Two buildings may look equally advanced while their documents cover different blocks, sections or stages. Work may also continue after the act is drawn up, so the act is not a live record of the current physical condition.
    documents: |-
      The central document is Act Form 14 for acceptance of the structural frame. Read it together with the building permit, approved structural design, amendment orders and other applicable construction documents. Check the exact construction, participants, date and whether the act covers the entire building or only a separate stage.

      Act 14, certification of the rough-construction stage and cadastral registration of the building or future unit are related, but they are not interchangeable. If the contract or upcoming transaction requires specific proof of rough construction, ask for that document rather than assuming any reference to Act 14 is enough.
    importance: |-
      This milestone is often used in offers, preliminary contracts and payment schedules because it marks significant construction progress. It does not automatically mean that a payment is due or that the particular unit can now be transferred. The answer depends on the contract, the subject of the transaction and the legal requirements.

      For the buyer, the practical question is not only "is there an Act 14", but "for which building exactly is the act and what follows from it for my particular contract". Check that the block, entrance, phase and description correspond to the promised property and that subsequent modifications have not altered the design.
    not_meaning: |-
      Act 14 does not mean ready-to-move-in housing. It does not confirm completed installations, facade, common parts, connection to networks, successful tests or fixed defects. It is not Act 15 and it is not a permit to use or a certificate of commissioning.

      Its presence does not prove who owns the land or future unit, that the seller has the right to transfer it, that there are no encumbrances or that the contractual terms have been met. Nor does the absence of an Act 14 record from Mesto's verified public sources prove that the document does not exist.
    discover: |-
      Start with the scope. Find out whether the act covers the entire building or a specific block, section or stage, and whether the offered unit is within that scope. Then match the document to the building permit and the current project version.

      If Act 14 is specified as a condition of payment or transaction, find out how the contract defines the milestone, who must notify you and what document you must receive. The generic trade name does not supersede the specific clause.
    verify:
    - Ask for a copy or a verifiable reference and compare the number, date, construction, block/section and building permit.
    - Check which participants have signed the document and whether there are any noted remarks, limited scope or subsequent
      amendments.
    - If necessary for the transaction, ask for the separate applicable proof of completed rough construction and do not just
      replace it with an advertising claim.
    - Compare the scheme and description of the future unit with the current project documentation; cadastral registration
      in itself does not prove ownership.
    - Read the exact contractual payment or transfer clause with an independent attorney before assuming that the condition
      has been met.
    helpers: |-
      A designer or structural engineer can explain what technical scope has been adopted and whether the description corresponds to the design documentation. The building inspector can guide the building documents but is not a substitute for the buyer's independent adviser.

      The attorney reviews the property rights, contract and significance of the milestone for a particular payment or transfer. The notary has a separate role in the notarial proceedings; the buyer's independent review should not be left until the day of the transaction.
    next: |-
      Enclosing elements, facades, installations, elevators, common areas, finishing and external connections usually follow. These works may overlap and progress differently along entrances or blocks.

      Next comes the preparation for acceptance with Act 15. Between the two acts, there is not one publicly available document that shows an exact percentage of readiness. So keep checking visible progress and documented events separately.
  actions_by_buyer_stage:
    researching: Use the stage as a guide to your questions, not as proof that a particular property is ready to buy.
    before_deposit: Ask for a copy or a verifiable reference and establish the exact scope before linking the down payment
      to this stage.
    waiting_or_payment: Check the exact wording of the contract and the documents it requires. Do not calculate a payment
      just by the general name "Act 14".
    default: Match the act with the correct block, phase and future self-contained unit.
- key: building.installations
  slug: dovurshitelni-raboti-prisaedinyavane
  kind: stage
  locale: en
  position: 5
  title: Finishing works and utility connections
  summary: Work continues on the façades, building systems, common areas and utility connections. Even if the building looks
    finished, that does not mean it has been authorized for use.
  aliases:
  - facade
  - installations
  - finishing works
  - accession
  related_stage_keys:
  - building.act14
  - building.act15
  related_document_keys: []
  related_term_keys: []
  source_ids:
  - zut
  - ordinance_3
  source_checked_at: '2026-09-04'
  content_version: 2
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    concise_answer: Once the structural frame is complete, many finishing activities begin in parallel. The building may look almost ready, but this does not
      mean that it has reached the relevant administrative stage or that its use is already permitted.
    key_points:
    - Different activities can run simultaneously and in different order.
    - Electricity, water, sewerage, roads and access involve separate parties and documents.
    - A photo of a finished facade does not prove commissioning.
    physical: |-
      Once the structural frame is complete, work continues in parallel on masonry and partition walls, roof and façade layers, windows and doors, and the electrical, plumbing, heating, ventilation and other building systems. Lifts, stairways, corridors, garages, landscaping and access may progress at different rates.

      Different blocks and parts can be at different levels of readiness. A visibly finished facade can coexist with unfinished common parts or untested installations, and the works in the particular apartment do not show the state of the entire construction.
    documents: |-
      During this period, records are drawn up for concealed works, inspections, tests and acceptance of individual building systems. Some of this information remains in the construction file and is not readily available in public records.

      External connections for electricity, water, sewer, heat supply, street or other access may have separate contractors, permits and deadlines. An infrastructure element document does not automatically prove the progress or commissioning of the residential building.
    importance: |-
      Here the promised quality starts to become visible. The agreed degree of completion should describe not only floors and walls in the apartment, but also common areas, installations, facade, parking and surrounding environment.

      Vague terms such as "turnkey" or "luxury common areas" have little value without a detailed specification. Differences may result in extra costs, delay or disputes at handover.
    not_meaning: |-
      A finished façade, fitted windows, working lights or a temporary power supply do not automatically mean that Act 15 has been signed or that use is permitted. Physical completion and the administrative procedure are separate matters.

      The absence of a public document for a work does not prove that it was not done. At the same time, photos, inspection and assurance of the seller do not replace reports and tests when they are important for a specific decision.
    discover: |-
      Clarify exactly what will be done in the home, the common areas and the outdoor environment and who will cover the cost of the rest. Compare the description in the contract, the technical specification and the current condition on site.

      Ask which utility connections are permanent, which procedures remain incomplete and whether any infrastructure serves more than one phase. Do not treat a promised deadline as an established fact without documentary evidence.
    verify:
    - Compare the technical specification, design solutions and visible performance for the housing, common areas and parking.
    - Record which works are complete, which are in progress, and which cannot be judged by visual inspection alone.
    - Ask which utility connections are permanent, which procedures remain incomplete and who is responsible for them.
    - Distinguish the documents for the residential building from the permits and protocols for the substation, street, water
      supply or other infrastructure.
    - Check how the contract describes the permissible changes, the quality, the deadline for fixing defects and the proof
      of the stage.
    helpers: |-
      An independent structural engineer or relevant installation specialist can assess the apparent performance and indicate what requires separate testing. Operators and competent authorities only confirm procedures within their scope.

      The lawyer compares the agreed specification, terms and remedies. The technical and legal assessments must align, especially when payment is linked to a broadly described physical stage.
    next: |-
      As completion approaches, the participants assemble the relevant test results, records and construction documents and prepare for acceptance. This leads to Act 15, although individual works may finish on different dates.

      Before assuming that Act 15 is imminent, check which works and documents remain and whether they relate to the correct phase of your unit.
  actions_by_buyer_stage:
    before_preliminary_contract: Record the exact level of completion and specifications rather than relying on advertising
      wording.
    before_handover: Prepare a detailed inspection and handover protocol; do not confuse this with administrative commissioning.
    default: Ask for an up-to-date, dated specification and the status of utility connections.
- key: building.act15
  slug: akt-15
  kind: stage
  locale: en
  position: 6
  title: Preparation for acceptance and Act 15
  summary: With Act Form 15, the builder hands the construction and its documents to the developer, and its readiness for
    acceptance is recorded. This is not the final authorization for use.
  aliases:
  - act 15
  - Act 15
  - sample 15
  related_stage_keys:
  - building.installations
  - building.commissioning
  related_document_keys:
  - document.act15
  - document.commissioning
  related_term_keys: []
  source_ids:
  - ordinance_3
  - ministry_act15_16
  - dnsk_commissioning
  source_checked_at: '2026-09-04'
  content_version: 2
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    concise_answer: Act Form 15 records that the construction is ready to be handed over by the builder and accepted by the developer. It is part
      of the path to final commissioning, but does not in itself authorize use.
    key_points:
    - Check the exact construction, part or stage covered by the act.
    - Act 15 is different from the Form 16 Protocol and from the final administrative approval.
    - Whether payment is due depends on your contract, not just on the availability of Act 15.
    physical: |-
      The construction has reached a stage at which the participants can compare the completed work with the approved designs, as-built documentation and applicable requirements. They also review the required inspections and test results for building systems and equipment.

      Unfulfilled, incomplete or poorly executed works may be described in the act. Therefore, "has Act 15" should not be read as "no objections" or "everything is ready to move in". The text itself and the appendices are more important than the short message about the milestone.
    documents: |-
      The central document is Act Form 15. It is linked to the building permit, approved designs, as-built documentation, records drawn up during construction, test results and the other documents required for the next procedure.

      The final report of the construction supervision has a separate role. The composition of the dossier and the competent authority depend on the category and specifics of the construction. Do not assume that the same trade term "Act 16" describes the same procedure for every project.
    importance: |-
      Act 15 is important because it shows that the construction has been presented for acceptance by the relevant participants and that the final administrative procedure is being prepared. For the buyer, the exact scope, signatures, recorded comments and any outstanding documents remain decisive.

      If the contract links payment to Act 15, check whether the condition is defined as signing the act, receiving a copy, having no specified objections or something else. A public record alone cannot determine the amount or due date.
    not_meaning: |-
      Act 15 is not the Form 16 Protocol or the final administrative authorization for use. It does not itself permit occupancy, prove that every external connection and common area is in the promised condition, or guarantee that the competent authority will not require additional documents or work.

      It does not transfer ownership, does not hand over keys to the buyer and does not prove the absence of encumbrances. Neither drawing it up nor posting about it automatically means you owe payment.
    discover: |-
      Find out whether the act was signed for the entire construction or for a specific block, section, stage or sub-project. Check the date, participants, building permit and any recorded comments or outstanding work.

      Then identify which procedure applies to the construction category and which steps remain. Ask whether an application has been submitted and what it covers; a submitted file is not the same as an issued final approval.
    verify:
    - Ask for the pages and attachments that show the subject, participants, date, signatures and any comments.
    - Compare identifiers, building permit, block/stage, category and construction description.
    - Ask which outstanding works are recorded, who must complete them and how completion will be documented.
    - Find out what final document is applicable and whether a procedure has actually started for the exact scope.
    - For payment, read your clause and request the specified proof before irreversible action.
    helpers: |-
      The construction supervisor, builder, developer and designers have different roles in preparing the act and accepting the work. An independent engineer can help the buyer understand the comments and actual condition.

      The lawyer reviews the contractual meaning and your rights in case of incomplete or disputed performance. The competent authority conducts the closing procedure, but does not verify the contract for the buyer.
    next: |-
      The applicable procedure for a use permit or commissioning certificate follows, depending on the construction category. For some construction it includes a state acceptance commission and the Form 16 Protocol; for others, the final document and competent authority differ.

      Track the exact type, issuer and scope of the final document. The colloquial phrase "we received Act 16" is not a sufficient description.
  actions_by_buyer_stage:
    researching: Learn the difference between Act 15 and the final commissioning document before comparing offers.
    before_preliminary_contract: Clarify exactly what the seller is promising after Act 15 and how the contract treats objections
      and final clearance.
    waiting_or_payment: Check your contract - the mere presence of Act 15 does not determine the amount, maturity or your
      obligation to pay.
    before_notarial_transfer: Check which final document applies, what it covers and whether the transaction, commissioning
      and delivery are separately regulated.
    default: Match the scope and date and do not use Act 15 as a substitute for the final act.
- key: building.commissioning
  slug: vavezhdane-v-eksploatatsiya
  kind: stage
  locale: en
  position: 7
  title: Commissioning
  summary: According to the category, the final document is a permit to use or a certificate of commissioning. The colloquial
    "Act 16" can mean a variety of things.
  aliases:
  - act 16
  - Act 16
  - permission to use
  - commissioning certificate
  related_stage_keys:
  - building.act15
  - building.handover
  related_document_keys:
  - document.commissioning
  related_term_keys: []
  source_ids:
  - zut
  - dnsk_commissioning
  - ministry_act15_16
  source_checked_at: '2026-09-04'
  content_version: 2
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    concise_answer: The final document is not always called "Act 16". For first- to third-category construction,
      DNSK issues a use permit after the applicable acceptance procedure; for fourth- and fifth-category construction, the competent
      authority issues a commissioning certificate.
    key_points:
    - Check the category, issuer and type of the final document.
    - It may cover only a part, stage, block or separate item of infrastructure.
    - Commissioning, notarial transfer and handover of the keys are different events.
    physical: |-
      For the commissioning procedure, the construction must have been completed to the applicable scope and the necessary inspections and tests have been carried out. This includes not only the dwellings, but also the common areas, facilities and conditions for safe use according to the approved design.

      After the final act, there may still be individual finishing works, adjustments or defect removal. The administrative authorization of the use is not a technical guarantee that the particular apartment has been handed over without objections.
    documents: |-
      The colloquial term "Act 16" may refer to different documents. The Form 16 Protocol is part of the procedure involving a state acceptance commission, but the final administrative result is a use permit. For other categories, the competent authority issues a commissioning certificate.

      Check the construction category, issuing authority, number, date and exact scope - not only the title. The document may cover one block, stage, entrance, sub-project or item of infrastructure rather than the entire complex.
    importance: |-
      This is the main document showing that the building may be used legally. In a particular purchase, it may affect the transaction, mortgage, handover or payment, but the consequences depend on the law and the parties' contracts.

      The buyer must confirm that the document covers the correct block, entrance or property. There can be several buildings and phases on one plot, and a substation or external connection document does not mean that the apartment block is put into operation.
    not_meaning: |-
      The final document does not independently prove who owns the apartment, that the seller can transfer it, or that there are no mortgages, foreclosures or other entries. These matters require a separate legal and registry check.

      It does not guarantee defect-free quality, certify keys handed over, bills paid, individual utility accounts opened or condominium management organized. It also does not eliminate contractual disputes about terms and specifications.
    discover: |-
      Identify the correct final document - a use permit or commissioning certificate - who issued it and under which procedure. Compare the construction category, building permit and description of the approved building or stage.

      Check that your block, entrance, stage and destination are included. If a document is found through a parcel search, do not automatically assume that it refers to every building on it.
    verify:
    - Compare the number, date, issuer, category, building permit and full description of the approved building.
    - Determine if the document is final and in effect and if it is limited to a part, stage, block or specific purpose.
    - Separate the residential building from a substation, street, networks, garage building or neighboring block on the same
      plot.
    - Compare the document with the cadastral scheme and the title deed without assuming that either alone guarantees ownership.
    - Check the ownership, encumbrances, contract, technical condition and terms of delivery separately.
    helpers: |-
      DNSK or the authority that issued the building permit has competence according to the category and regime. It or the official file confirms the type and scope of the administrative act.

      A lawyer checks the legal significance of the transaction, ownership and encumbrances. The engineer assesses the technical condition and the lender has its own requirements; approval by one participant does not replace checks by others.
    next: |-
      The property must then be handed over, defects recorded and remedied, documents and warranties delivered, and management of the common areas organized. The commissioning date is not necessarily the date of the notarial transfer or receipt of the keys.

      Plan early responsibilities: utility accounts, insurance, condominium management, maintenance, and tracking warranty issues.
  actions_by_buyer_stage:
    researching: Check what exactly the expression "Act 16" used in the ad means and which block it refers to.
    before_deposit: Even with a listed building, ask for the earlier key papers and check ownership and encumbrances separately.
    before_notarial_transfer: Ask for a copy of the applicable closing document and compare its scope with the property and
      contract before the transaction.
    owner: Keep the documentation, warranty contacts and defect reports; commissioning does not settle every practical matter.
    default: Check the type, issuer and exact subject of the document.
- key: building.handover
  slug: predavane-poddrazhka
  kind: stage
  locale: en
  position: 8
  title: Property handover and maintenance
  summary: At handover, the parties record the keys, the property's condition, meter readings and any observations. Maintenance
    and condominium obligations follow.
  aliases:
  - handover
  - keys
  - maintenance
  - defects
  related_stage_keys:
  - building.commissioning
  related_document_keys:
  - document.handover_protocol
  - document.title_deed
  related_term_keys:
  - term.ideal_shares
  - term.garage_parking
  source_ids:
  - obligations_contracts
  - property_law
  source_checked_at: '2026-09-04'
  content_version: 2
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    concise_answer: At handover, record what you receive, when and in what condition, including keys, meter readings,
      documents and defects. It is not equivalent to the notarial transfer or commissioning.
    key_points:
    - Inspect in detail and write down the defects specifically.
    - Separate ownership, possession, use and contractual maintenance.
    - Ask for rules, contacts, guarantees and documents for the common areas.
    physical: |-
      The inspection covers not only floors and walls, but also windows, doors, plumbing fixtures, electrical outlets, heating and ventilation, terraces, storage, a garage or parking space, and access to common areas. Compare the actual condition with the agreed specification and appendices.

      Some problems are immediately apparent, while others require measurement, sampling, or time. Therefore, the inspection should be organised, with sufficient lighting and access, rather than a quick signing on receiving the keys.
    documents: |-
      The handover record states the date, parties, delivered rooms and appurtenances, keys, remotes, devices, meter readings and noted defects. It may include photographs, deadlines and a method for confirming that defects have been remedied.

      Ask for warranty documents, instructions, emergency contacts, equipment records and information about common areas and maintenance. Keep the notarial deed, final administrative document, utility-account documents and management records separately.
    importance: |-
      A clearly recorded initial condition reduces disputes about what was present at handover and who assumed each obligation. Wording such as "accepted without remarks" can be problematic if it does not reflect the actual inspection.

      Handover often starts ongoing costs and responsibilities. Clarify when maintenance charges begin, who bears the risk, how warranty claims are submitted and who manages the common areas.
    not_meaning: |-
      The protocol for the keys does not replace the notarial deed and does not prove ownership or lack of encumbrances. It is also not a permit to use or a certificate of commissioning.

      Signing does not mean you have to give up accurately describing visible defects. Conversely, a recorded defect does not automatically mean a specific term or compensation - review the contract, warranty conditions and applicable rules.
    discover: |-
      Specify who will attend, how much time is available and whether you may bring an independent technical specialist. Prepare the contract specification, plans and earlier correspondence for comparison on site.

      Find out how a defect is registered, who confirms the fix and what costs start from what date. Ask for a clear separation between seller, builder, maintenance and condominium commitments.
    verify:
    - Make a measurable list with a photo, exact location, description and agreed time frame for each identified defect.
    - Compare the areas, layout, fixtures, degree of completion and materials with the contract and attachments.
    - Record the number of keys and remotes, the serial numbers of appliances and the readings of all available meters.
    - Ask for the warranty conditions, contacts and reporting procedure, as well as the available documentation for the common
      parts and equipment.
    - Specify the start date and basis for fees, utility accounts, insurance, access and maintenance.
    helpers: |-
      An independent technical specialist can inspect and describe defects systematically and precisely. A specialist in a particular building system may be needed where the issue cannot be assessed visually.

      The lawyer reviews the clauses, the record and the implications of the remarks. The seller or investor, the builder, the maintenance company and the building management may have different responsibilities - ask for a specific person responsible for each topic.
    next: |-
      Track the repair of recorded defects with dates and evidence from follow-up inspections. Organize warranties, records and correspondence so that every promise can be followed up.

      Organize utility accounts, insurance, participation in the condominium and ongoing maintenance. The purchase does not end with the keys; ownership also brings responsibility for the property and common areas.
  actions_by_buyer_stage:
    before_handover: Prepare a template, an independent review and a demonstrable way to track defects.
    owner: Organize warranties, handover records, utility accounts and decisions concerning the common areas.
    default: Specify when and under what protocol possession, keys and documentation are transferred.
