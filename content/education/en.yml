  sections:
    definition: |-
      UPI means regulated land parcel: a territorial unit defined by a detailed development plan, for which the plan sets regulatory boundaries and a development regime. The designation may contain a Roman plot number, a district number and the number of properties to which it is assigned.

      UPI is a concept from urban planning, and PI is an object from the cadastre. Data from the two systems should be compared-don't assume that their boundaries match.
    example: |-
      In the PUP it may be written "UPI IV-3263, quarter 12", and the cadastral sketch should indicate the PI with a digital identifier. If the boundaries do not match perfectly, the architect and surveyor should explain which part is regulated and how this affects the project.

      A Roman-numeral planning designation alone is not enough to identify a specific self-contained unit.
    confusion: |-
      The RPI does not automatically mean that the property is ready for immediate development, that access and infrastructure are in place or that any desired development is permissible. The current plan, the purpose, the indicators, the limitations and the necessary follow-up acts are important.

      "Regulated" is not the same as "no boundary or ownership dispute."
    importance: |-
      For the buyer, the difference between an EIA and a PI can affect access, parts of the land, the right to build and the exact scope of the permit. If the promised building steps on a different range than the verified one, the risk is not resolved with the same address or business name.

      When buying a house or land, the planning regime directly affects the future use and development.
    related: |-
      Read the PUP, the visa, the building permit and the cadastral sketch together. For different boundaries, ask a surveyor for a graphic comparison. Also check street access, zoning, development metrics and any easements or restrictions.

      The next question is: "Do the current IMP and the verified IMP cover the same ground for the purposes of the particular project?"
