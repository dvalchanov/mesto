  content_version: 1
  editorial_status: published
  professional_review_status: pending
  professional_reviewer: null
  professionally_reviewed_at: null
  sections:
    definition: |-
      The registration gives publicity to acts and circumstances for real estate in the cases provided for by law. The property register account organizes data about the property, rights, deeds and related entries, markings and deletions.

      The Cadastre and the Property Register have related but different functions: one describes the spatial identity, the other publishes deeds and rights.
    example: |-
      The cadastral scheme shows an up-to-date identifier, but the old property was acquired by a previous deed. For reliable verification, the relationship between the old description, the persons, the subsequent transactions and the current object must be traced.

      Searching only by today's ID may miss some of the property's history.
    confusion: |-
      Registration is not a state guarantee that every statement in the deed is materially true, and the absence of a result from an electronic request does not prove the absence of a deed. Lot number, cadastral identifier and deed number are different designations.

      "Deleted" should be associated with the exact preceding entry, not just seeing a word in a list.
    importance: |-
      For the buyer, proper tracking shows the chain of acquisitions and public rights or restrictions. An incomplete search may miss an old deed, change of ID, spouse, heir, or entry against a previous owner.

      This is the basis upon which a lawyer assesses ownership and encumbrances, but is not an automatic substitute for legal analysis.
    related: |-
      Collect current ID, old numbers, exact address and chain owner details. Ask for references and certificates with appropriate property and time scope and read the deeds themselves, not just their titles.

      Compare the registry with the cadastre and the seller's documents immediately before the transaction.
