rules:
- key: rule.research
  priority: 10
  when:
    buyer_stage:
    - researching
    - unknown
  then:
    lesson_keys:
    - guide.research
    - term.cadastral_identifier
    - document.cadastral_sketch_scheme
    task_keys:
    - task.define_needs
    - task.compare_identity
    reason: Because you are still arranging the criteria and the way you will compare.
  locale: en
- key: rule.shortlisting
  priority: 8
  when:
    buyer_stage:
    - shortlisting
  then:
    lesson_keys:
    - guide.shortlisting
    - document.cadastral_sketch_scheme
    - term.property_areas
    task_keys:
    - task.define_needs
    - task.compare_identity
    reason: Because you are already comparing specific properties and you have to check the same facts for each of them.
  locale: en
- key: rule.before_deposit
  priority: 5
  when:
    buyer_stage:
    - before_deposit
  then:
    lesson_keys:
    - guide.before_deposit
    - document.title_deed
    - document.encumbrance_certificate
    task_keys:
    - task.request_document_pack
    - task.review_deposit_terms
    - task.verify_seller_rights
    reason: Because you are before a reservation or deposit.
  locale: en
- key: rule.before_preliminary
  priority: 5
  when:
    buyer_stage:
    - before_preliminary_contract
  then:
    lesson_keys:
    - guide.before_preliminary_contract
    - document.preliminary_contract
    - document.building_permit
    task_keys:
    - task.verify_seller_rights
    - task.review_preliminary_contract
    - task.request_document_pack
    reason: Because you are before a preliminary contract.
  locale: en
- key: rule.signed
  priority: 5
  when:
    buyer_stage:
    - preliminary_contract_signed
  then:
    lesson_keys:
    - guide.after_signing
    - document.preliminary_contract
    task_keys:
    - task.archive_signed_versions
    - task.compare_milestone_scope
    reason: Because you already have a signed preliminary contract.
  locale: en
- key: rule.payment
  priority: 5
  when:
    buyer_stage:
    - waiting_or_payment
  then:
    lesson_keys:
    - guide.milestone_payment
    - document.act14
    - document.act15
    task_keys:
    - task.check_payment_clause
    - task.compare_milestone_scope
    reason: Because you are waiting for the next stage or payment; leading is your contract.
  locale: en
- key: rule.transfer
  priority: 5
  when:
    buyer_stage:
    - before_notarial_transfer
  then:
    lesson_keys:
    - guide.before_transfer
    - document.encumbrance_certificate
    - document.commissioning
    task_keys:
    - task.obtain_encumbrance_check
    - task.prepare_transfer
    - task.verify_commissioning_scope
    reason: Because you are preparing the notarial transfer.
  locale: en
- key: rule.handover
  priority: 5
  when:
    buyer_stage:
    - before_handover
  then:
    lesson_keys:
    - guide.handover_owner
    - document.handover_protocol
    - term.defects
    task_keys:
    - task.prepare_handover
    reason: Because the handover requires a separate inspection, a detailed protocol and a clear way to track the defects.
  locale: en
- key: rule.owner
  priority: 5
  when:
    buyer_stage:
    - owner
  then:
    lesson_keys:
    - guide.owner
    - document.warranty_documents
    - document.condominium_documents
    task_keys:
    - task.organize_owner_documents
    - task.transfer_utilities
    - task.review_condominium_documents
    reason: Because the first months as an owner have separate tasks for documents, services, warranties and common parts.
  locale: en
- key: rule.new_build
  priority: 20
  when:
    property_type:
    - new_build
  then:
    lesson_keys:
    - building.authorization
    - building.act14
    - building.act15
    - building.commissioning
    task_keys:
    - task.compare_milestone_scope
    reason: Because you are looking at new construction.
  locale: en
- key: rule.completed_home
  priority: 8
  when:
    property_type:
    - completed_home
  then:
    lesson_keys:
    - guide.completed_home
    - document.title_deed
    - document.encumbrance_certificate
    task_keys:
    - task.completed_home_inspection
    - task.compare_identity
    reason: Because you are looking at a finished home.
  locale: en
- key: rule.house_land
  priority: 8
  when:
    property_type:
    - house
    - land
  then:
    lesson_keys:
    - guide.house_land_limits
    - document.pup
    - term.upi
    task_keys:
    - task.house_land_specialists
    - task.compare_identity
    reason: Because a house or land requires checks that are not applied in the same way to an apartment.
  locale: en
- key: rule.financing
  priority: 15
  when:
    financing_context:
    - mortgage
  then:
    lesson_keys:
    - guide.before_deposit
    task_keys:
    - task.financing_plan
    reason: Because you are considering mortgage financing; conditions must be confirmed individually.
  locale: en
- key: rule.commissioning_evidence
  priority: 3
  when:
    property_connected:
    - 'yes'
    evidenced_milestone:
    - commissioning
  then:
    lesson_keys:
    - document.commissioning
    - building.commissioning
    task_keys:
    - task.verify_commissioning_scope
    reason: Because a commissioning record has been found that appears to be related to the property, but its exact scope
      has yet to be verified.
  locale: en
- key: rule.no_evidence
  priority: 30
  when:
    property_connected:
    - 'yes'
    source_coverage:
    - unavailable
    - partial
  then:
    lesson_keys:
    - document.building_permit
    - document.commissioning
    task_keys:
    - task.request_document_pack
    reason: Because verified public sources are incomplete or unavailable; this does not prove the absence of a document.
  locale: en
checklist_items:
- key: task.define_needs
  title: Define your priorities and total budget
  reason: This way you compare all options according to the same criteria and don't let the pressure surrounding a specific
    offer decide for you.
  relevant_stage: researching
  responsible: you
  related_content_keys:
  - guide.research
  default_evidence: user_reported
  question: Which five conditions are mandatory for me and which costs outside of the price have I budgeted for?
  content_version: 1
  locale: en
- key: task.compare_identity
  title: Check exactly which property is for sale
  reason: The address or advertising name does not reliably distinguish between PI, building, entrance and stand-alone site.
  relevant_stage: shortlisting
  responsible: seller / AGCC
  related_content_keys:
  - term.cadastral_identifier
  - document.cadastral_sketch_scheme
  default_evidence: separate_official_check_needed
  question: What is the full cadastral identifier and in which documents can I check it?
  content_version: 1
  locale: en
- key: task.request_document_pack
  title: Ask for the basic set of documents
  reason: Pre-payment verification requires specific documents, not just assurance that everything is in order.
  relevant_stage: before_deposit
  responsible: seller / investor
  related_content_keys:
  - document.title_deed
  - document.building_permit
  - document.cadastral_sketch_scheme
  default_evidence: requested_from_seller
  question: Can I receive the title deed, current layout and relevant building documents with all amendments in advance?
  content_version: 1
  locale: en
- key: task.review_deposit_terms
  title: Review the conditions of the reservation or deposit
  reason: The payment name does not automatically determine when the amount is returned or held.
  relevant_stage: before_deposit
  responsible: independent lawyer
  related_content_keys:
  - guide.before_deposit
  default_evidence: professional_review_needed
  question: To whom do I pay, what exactly is reserved and in which cases is the amount refunded?
  content_version: 1
  locale: en
- key: task.verify_seller_rights
  title: Check the seller's rights and representation
  reason: The offer and the cadastral scheme do not independently prove who can transfer the promised right.
  relevant_stage: before_preliminary_contract
  responsible: lawyer / notary public
  related_content_keys:
  - document.title_deed
  - term.right_to_build
  default_evidence: professional_review_needed
  question: On what basis does the seller own, or expect to acquire, the right being promised to me?
  content_version: 1
  locale: en
- key: task.review_preliminary_contract
  title: Review the contract and all attachments
  reason: The exact property, stages, payments, terms and conditions of termination depend on the specific text.
  relevant_stage: before_preliminary_contract
  responsible: independent attorney / technical specialist
  related_content_keys:
  - document.preliminary_contract
  - guide.before_preliminary_contract
  default_evidence: professional_review_needed
  question: Which versions of the design, specification and schematics are an integral part of the contract?
  content_version: 1
  locale: en
- key: task.archive_signed_versions
  title: Organize signed documents and proof of payment
  reason: Subsequent actions should be compared with the final text, appendices and correspondence.
  relevant_stage: preliminary_contract_signed
  responsible: you / lawyer
  related_content_keys:
  - guide.after_signing
  - document.preliminary_contract
  default_evidence: user_reported
  question: Do I have a signed copy of each application and keep correspondence about the changes?
  content_version: 1
  locale: en
- key: task.check_payment_clause
  title: Check the clause before next payment
  reason: A found construction document does not independently determine your amount, maturity or obligation.
  relevant_stage: waiting_or_payment
  responsible: you / independent lawyer
  related_content_keys:
  - guide.milestone_payment
  - document.act14
  - document.act15
  default_evidence: professional_review_needed
  question: Exactly which document and what method of notification does my contract require for this installment?
  content_version: 1
  locale: en
- key: task.compare_milestone_scope
  title: Compare the scope of the found construction document
  reason: A plot, other block, phase or infrastructure document may not apply to the selected building.
  relevant_stage: waiting_or_payment
  responsible: source / technical specialist
  related_content_keys:
  - document.act14
  - document.act15
  - document.commissioning
  default_evidence: separate_official_check_needed
  question: Which block, stage and construction are described and do they match my site?
  content_version: 1
  locale: en
- key: task.verify_commissioning_scope
  title: Check the type and scope of the final document
  reason: '"Act 16" can mean different documents, and an individual block or infrastructure object has its own scope.'
  relevant_stage: before_notarial_transfer
  responsible: competent authority / seller / lawyer
  related_content_keys:
  - document.commissioning
  - building.commissioning
  evidenced_milestone: commissioning
  default_evidence: separate_official_check_needed
  question: Who is the issuer and are my input, block and phase included correctly?
  content_version: 1
  locale: en
- key: task.obtain_encumbrance_check
  title: Arrange for an up-to-date title and encumbrance check
  reason: It has a specific subject, period and date and is not replaced by a cadastral certificate.
  relevant_stage: before_notarial_transfer
  responsible: lawyer / notary / Registry Agency
  related_content_keys:
  - document.encumbrance_certificate
  - document.title_deed
  default_evidence: separate_official_check_needed
  question: What is the exact scope of the certificate and when will it be updated before the deal?
  content_version: 1
  locale: en
- key: task.prepare_transfer
  title: Agree the draft deed and payment process
  reason: Transfer, payment, entry and keys may occur on different dates.
  relevant_stage: before_notarial_transfer
  responsible: lawyer / notary public
  related_content_keys:
  - guide.before_transfer
  - document.title_deed
  default_evidence: professional_review_needed
  question: How are the current checks, signing, payment and handover arranged?
  content_version: 1
  locale: en
- key: task.prepare_handover
  title: Arrange an independent inspection and handover record
  reason: A specific record of defects and the condition as delivered is more useful than a general "accepted without objection".
  relevant_stage: before_handover
  responsible: technical specialist / seller
  related_content_keys:
  - document.handover_protocol
  - guide.handover_owner
  default_evidence: professional_review_needed
  question: Who will be involved in the inspection and how will the defects be recorded, photographed and tracked?
  content_version: 1
  locale: en
- key: task.completed_home_inspection
  title: Check the actual condition and the significant alterations
  reason: The completed home has current technical features that are not visible on the title deed or listing.
  relevant_stage: shortlisting
  responsible: independent technical specialist
  related_content_keys:
  - guide.completed_home
  - document.cadastral_sketch_scheme
  default_evidence: professional_review_needed
  question: Does the actual distribution match the scheme and are there signs of problems or significant alterations?
  content_version: 1
  locale: en
- key: task.financing_plan
  title: Clarify financing before making an irrevocable commitment
  reason: Terms, valuation, required own contribution and conditions vary; an advertised offer is not an approval.
  relevant_stage: before_deposit
  responsible: lender / appraiser / lawyer
  related_content_keys:
  - guide.before_deposit
  - guide.before_preliminary_contract
  default_evidence: separate_official_check_needed
  question: What terms and conditions do I need to meet according to the specific lender, appraisal and contract?
  content_version: 1
  locale: en
- key: task.house_land_specialists
  title: Identify the specialist checks needed for a house or land
  reason: Boundaries, access, buildings, easements and networks are not reliably covered by an apartment listing.
  relevant_stage: researching
  responsible: surveyor / architect / engineer / lawyer
  related_content_keys:
  - guide.house_land_limits
  - document.pup
  default_evidence: professional_review_needed
  question: Which checks of the boundaries, access, building permits, utility networks and restrictions does this property require?
  content_version: 1
  locale: en
- key: task.organize_owner_documents
  title: Organize the property's permanent records
  reason: The title deed, scheme, minutes, warranties and contracts should remain accessible and in good order after the transaction.
  relevant_stage: owner
