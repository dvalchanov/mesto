  sections:
    what: |-
      A power of attorney is a unilateral declaration by which one person authorizes another to perform specified actions on their behalf. For a property transaction, its form and content must cover the actions the representative will perform.
      A broad general power of attorney and a specific power of attorney for a single property carry different practical risks. The buyer must know exactly what the attorney can agree, sign, receive or claim.
    when: It is necessary when a seller, buyer, heir, spouse or representative of a company will not appear in person. It
      is checked before reservation, preliminary contract, receipt of payment and notarial transfer.
    who: The authorizer signs the document with the necessary notarizations according to the action. The notary certifies
      the foreseen circumstances, and the representative acts only within the given authority.
    why: Even if the owner has undisputed rights, the transaction can be problematic if the representative does not have the
      right to sell the right property, negotiate a price, receive the amount, or if the power of attorney is revoked. Representation
      is a separate check.
    establishes: Establishes the delegated authority within the text, form and effective status. May include specific properties,
      minimum price, bank account, right of subrogation and other restrictions.
    not_establish: It does not prove that the authorizer is the owner, that the document has not been revoked, that the agent
      has followed the internal instructions, or that the specified account is safe. The notarization does not replace the
      verification of ownership.
    compare: Verify identity, date, notary and registration number, signature and content authentication when applicable,
      exact property and rights, price, receipt of funds, reauthorization, term and restrictions. Confirm current status as
      appropriate.
    before_after: The principal's title document and the validity of the representation are checked before use. After signing,
      the payment and entry must follow the verified mechanism, and the original is presented in the notarial proceedings.
    payment: Do not transfer funds to a representative's account merely because they hold a general power of attorney. The
      text must clearly admit receipt, and the lawyer and notary must confirm the method of payment and the relationship with
      the seller.
    availability: Mesto does not retrieve, validate or store proxies. Public data about the property and the company do not
      prove the private representative power of a specific natural person.
    where: Ask for a complete legible copy and the original for the notarial proceedings. The verification of the notarization
      and possible withdrawal is organized by a notary and a lawyer according to the applicable procedure.
    professional_review: An independent attorney should read the scope and payment rights before a contract or transfer. The
      notary verifies the suitability for the specific notarial act and the identity of the persons appearing.
    buyer_checks:
    - Check the exact property, action, price and right to receive funds.
    - Confirm the form, notarization and current status.
    - Check the principal's ownership separately.
    - Avoid paying a representative without express and professionally verified authority.
- key: guide.research
  slug: prouchvane-i-sravnyavane
  kind: guide
  category: buyer_journey
  buyer_stage: researching
  locale: en
  title: Research and compare
  summary: Sort out your needs and overall budget. Choose how you will compare properties before a specific ad prompts you
    to make a hasty decision.
  aliases:
  - I'm researching properties
  - start of purchase
  - how to start
  keywords:
  - criteria
  - budget
  - comparison
  - announced
  - area
  related_stage_keys:
  - building.land_planning
  related_document_keys:
  - document.cadastral_sketch_scheme
  - document.title_deed
  - document.bank_valuation
  related_term_keys:
  - term.property_areas
  - term.garage_parking
  - term.individual_object
  source_ids:
  - cadastre
  - registry_certificates
  - bnb_mortgage_guide
  source_checked_at: '2026-09-05'
  content_version: 2
  editorial_status: published
  professional_review_status: pending
  sections:
    understand: |-
      In the beginning, the task is not to find the "perfect" listing, but to build a way to make a decision. Divide your conditions into mandatory, desirable and those for which you would compromise. Include the daily route, access, floor, lift, light, noise, degree of completion and the timeframe in which you can realistically move.

      Also distinguish the type of purchase. An apartment under construction, a newly commissioned home, and an old home may look similar in a listing, but have different uncertainties, paperwork, and future costs. If you're still undecided, compare scenarios, not just prices per square meter.
    verify: |-
      Compare the same quantities. Ask how the area is calculated, what common areas are included, how a parking space or storage is acquired, and whether the price shown includes all agreed components. The address and advertising name are not sufficient to identify the property; for a specific option, ask for a diagram, an exact identifier and a seller's rights document.

      For the area, check the facts that affect your daily life - transport, access, planned construction, noise and services - and note the date and source. A single visit or ad description does not indicate what the environment is in the morning, evening or during any other season.
    documents: |-
      A complete set is not needed for each listing at this stage. For the options that remain on the short list, ask for at least a document showing who is offering the property, a cadastral scheme or sufficiently accurate project identification and a clear description of the accessories. For new construction, add the applicable building documents and the project version.

      The goal is to establish early whether the listing, documents and physical property all refer to the same thing. A copy without a visible number, date, issuer or scope is a reason to ask further questions, not a completed check.
    money: |-
      The total budget is more than the advertised price. Allow for local taxes and fees, notary and registration costs, legal and technical assistance, credit costs, finishing or repair, furnishing, parking, maintenance and a reasonable reserve. Don't add an arbitrary general percentage - collect specific offers and conditions for your case.

      If you're going to use a mortgage, an early conversation with a lender helps you understand the process, but a preliminary indication is not a final approval. A bank valuation also has a specific purpose and is not a substitute for a legal or technical due diligence.
    risks: |-
      Be careful when the comparison comes down to a single figure, when the areas are described differently, or when important components such as parking space and storage remain "to be specified". The pressure to pay immediately before exact identity and draft terms is a reason to delay the decision.

      Another risk is to accumulate many ads without clear criteria. So the newer or more emotional offer looks better just because it's fresh. A short table with identical fields makes missing information visible.
    professionals: |-
      A credit counselor or lender can clarify the financial process, a realtor about access to offers and inspections, and an architect or engineer about technical limitations. The lawyer becomes important before you commit or pay, not after the terms have already been accepted.

      None of these contributors automatically covers the work of the others. Specify who the specialist is, what the task is and what result you will receive in writing.
    act: |-
      Make a comparison table of no more than ten important indicators and mark "unknown" instead of filling in the blanks with a guess. After each viewing, write down the facts separately from the impressions and add the questions the seller needs to answer.

      When there are two or three real options left, move from general research to verifying correct identity, rights and documents. This is the time to start shortlisting, not paying to "stop" the listing.
    next: |-
      The next step is to compare the specific options. Move to it when you can explain why a property is on your shortlist, what the overall budget is, and what information is still missing.

      If they are already pressuring you for a reservation or down payment, go directly to the appropriate direction and do not assume that early research is a substitute for pre-payment verification.
    buyer_checks:
    - Write down five conditions without which the property does not work for you, and separately five desirable qualities.
    - Compare the total budget, not just the advertised price or price per square meter.
    - Use the same definitions for area, parking, warehouse, degree of completion and term.
    - Note which statements come from a document, which from the seller, and which are a personal impression.
    - Do not pay to stop the offer before you see exactly which property is being reserved and under what conditions you can
      cancel and get the amount back.
- key: guide.shortlisting
  slug: sravnyavane-na-konkretni-imoti
  kind: guide
  category: buyer_journey
  buyer_stage: shortlisting
  locale: en
  title: Comparing specific properties
  summary: Compare selected properties by title, condition, outstanding issues and total cost - not just by photos and advertised
    price.
  aliases:
  - I compare options
  - short list properties
  - choose between properties
  keywords:
  - view
  - an offer
  - identifier
  - area
  - comparison
  related_stage_keys:
  - building.land_planning
  - building.authorization
  - building.act14
  related_document_keys:
  - document.cadastral_sketch_scheme
  - document.title_deed
  - document.encumbrance_certificate
  - document.preliminary_contract
  related_term_keys:
  - term.cadastral_identifier
