  source_checked_at: '2026-09-05'
  content_version: 2
  editorial_status: published
  professional_review_status: pending
  sections:
    understand: |-
      With a finished home, you don't have to play the entire construction process. The main questions are who owns the property now, what exactly the right includes, whether there are entries or third party rights, whether the actual condition matches the documents and what costs come after the purchase.

      The age of the building changes the available documents and the applicable administrative regime. The absence of a contemporary document with the same name does not automatically prove illegality, but it does require establishing how the building was created and used and what subsequent changes were made.
    verify: |-
      Track ownership and seller's basis, family and inheritance circumstances, agency, encumbrances, rights of use and possession. Compare the layout and title deed with the address, floor, area, purpose, basement, attic, common areas and parking space.

      Performed a technical inspection of the home and common areas. Check for moisture, cracks, installations, joinery, heating, roof or basement according to the position of the property. Ask about conversions and compare the actual layout with the available plans and scheme.
    documents: |-
      Ask for the title deed and relevant previous deeds, an up-to-date scheme, a certificate of encumbrances, family or inheritance documents, the necessary commissioning or legal document and evidence of significant alterations. The exact set depends on the history of the property.

      Review condominium documents: important decisions, planned repairs, known liabilities, management or maintenance contracts. Verbal assurance "no problems in the entrance" does not indicate future costs or decisions already made.
    money: |-
      The budget includes the price, transaction and financing costs, necessary repairs, furnishings, upcoming general repairs and ongoing maintenance. Estimate reserve based on actual condition instead of adding an arbitrary percentage.

      With a mortgage, the bank evaluation and approval are separate from your inspection. Clarify whether established rezonings, designations, or documents affect funding and timing before making an irrevocable commitment.
    risks: |-
      Beware of discrepancy between actual distribution and scheme, annexed or utilized areas, parking space without clear right, occupant without arranged release, incomplete hereditary history and encumbrances that will be deleted around the transaction.

      Technical risks are often common to the building, not just inside the apartment. New renovations can cover up marks, so look around the adjacent common areas and look for a history of recurring problems.
    professionals: |-
      The lawyer checks title, registry entries, representation and the contract. An engineer or architect assesses the condition, alterations and necessary repairs. The notary has a separate role in the transaction and does not carry out a technical inspection.

      An older or altered building may require additional architectural, surveying or administrative review. The assignment should be specific and use available documents.
    act: |-
      Make a general file in which each identified discrepancy has an answer, proof and responsible specialist. Agreements on how and when the property will be vacated and handed over, what furnishings are left and how statements and keys are recorded.

      Don't let good looks override background checks or vice versa. Before making a decision, you must understand both the legal and technical condition of the property well enough, as well as their impact on your budget.
    next: |-
      When you choose the specific property, follow the chronological guidelines according to your moment: before the deposit, before the preliminary contract or before the notarial transfer. Property type does not replace buyer stage.

      After the deal, use the separate guidelines for handover and first months as an owner.
    buyer_checks:
    - Track current ownership, representation, encumbrances and third party rights.
    - Compare the title deed, the scheme, the actual distribution, the fittings and the purpose.
    - Perform an independent technical inspection of the home and the relevant common areas.
    - Check condominium decisions, repairs, obligations and contracts.
    - Include repair, financing, transaction and running costs in the total budget.
- key: guide.house_land_limits
  slug: kashta-ili-partsel
  kind: guide
  category: property_type
  property_types:
  - house
  - land
  locale: en
  title: Buying a house or a plot of land
  summary: Check boundaries, access, rights, building documents, planning conditions and network connections with the appropriate
    professionals.
  aliases:
  - I'm buying a house
  - I am buying a plot of land
  - courtyard
  - land
  keywords:
  - borders
  - access
  - regulation
  - easement
  - networks
