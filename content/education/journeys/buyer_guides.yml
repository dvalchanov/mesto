entries:
  - key: guide.research
    slug: prouchvane-i-sravnyavane
    kind: guide
    locale: bg
    title: "Проучване и сравняване"
    summary: "Определи нуждите, бюджета и правилните сравними факти, преди конкретен имот да създаде усещане за спешност."
    source_ids: [cadastre, registry_certificates]
    source_checked_at: "2026-09-04"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    sections:
      understand: "Раздели нуждите от предпочитанията: местоположение, ежедневен маршрут, площ, етаж, достъп, степен на завършеност и срок."
      verify: "Сравнявай еднакви величини — чиста площ, общи части, цена с включени данъци/такси, паркиране и необходим бюджет за довършване."
      act: "Направи кратък списък с пет задължителни условия и пет въпроса за всяка обява."
      next: "Когато останат няколко варианта, поискай точна идентичност и основен документен пакет."
  - key: guide.before_deposit
    slug: predi-rezervatsiya-ili-kaparo
    kind: guide
    locale: bg
    title: "Преди резервация или капаро"
    summary: "Установи на кого, за какво, при какви условия и с какъв изход плащаш — преди да преведеш сума."
    source_ids: [obligations_contracts, property_law]
    source_checked_at: "2026-09-04"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    sections:
      understand: "„Резервация“, „капаро“ и „задатък“ не са автоматично взаимозаменяеми; действието на сумата зависи от текста и фактите."
      verify: "Провери получателя, представителната власт, точния имот, срока, условията за връщане и какво става при отказ или проблем в проверката."
      act: "Поискай проекта на документ и основните имотни/строителни книжа преди плащането."
      next: "Организирай независим правен и при нужда технически преглед преди предварителен договор."
  - key: guide.before_preliminary_contract
    slug: predi-predvaritelen-dogovor
    kind: guide
    locale: bg
    title: "Преди предварителен договор"
    summary: "Свържи точния предмет, правата, проектните приложения, плащанията и изходите от договора с проверими доказателства."
    source_ids: [obligations_contracts, property_law, registry_certificates]
    source_checked_at: "2026-09-04"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    sections:
      understand: "Това не е административна формалност, а източникът на ключови частни задължения преди окончателната сделка."
      verify: "Провери страните, титула/правото на строеж, предмета, приложенията, цената, доказателствата за етапи, сроковете, тежестите, прекратяването и предаването."
      act: "Дай пълния проект и приложенията на независим адвокат; техническите спецификации — на инженер/архитект."
      next: "След подписване води календар само по договорените събития и пази доказателствата за всяко действие."
  - key: guide.after_signing
    slug: sled-podpisvane
    kind: guide
    locale: bg
    title: "След подписването"
    summary: "Пази версията, приложенията и доказателствата; следи договорните събития отделно от общите строителни названия."
    source_ids: [obligations_contracts]
    source_checked_at: "2026-09-04"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    sections:
      understand: "Подписът не приключва проверката: промени по проекта, срокове, уведомления и документи за етапи трябва да се проследяват."
      verify: "Съхрани окончателната версия, всички приложения, платежни доказателства и официалната кореспонденция."
      act: "Запиши как договорът определя всяко следващо събитие и кой документ трябва да получиш."
      next: "Преди всяко плащане сравни искането с договора и действителното доказателство."
  - key: guide.milestone_payment
    slug: predi-plashtane-po-etap
    kind: guide
    locale: bg
    title: "Преди плащане по етап"
    summary: "Провери твоята клауза, точния етап и доказателството; Mesto не изчислява сума или падеж без договора."
    source_ids: [obligations_contracts, ordinance_3]
    source_checked_at: "2026-09-04"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    sections:
      understand: "Строителният документ и платежното задължение са различни въпроси. Договорът може да дефинира собствени условия и процедура за уведомяване."
      verify: "Сравни клауза, процент/сума, получател, срок, изискан документ, точен блок/етап и евентуални условия за възражение."
      act: "Поискай доказателството и при неяснота го прегледай с адвокат преди плащането."
      next: "Запази документа, уведомлението и платежното доказателство към досието на сделката."
  - key: guide.before_transfer
    slug: predi-notarialna-sdelka
    kind: guide
    locale: bg
    title: "Преди нотариалната сделка"
    summary: "Актуализирай титула, тежестите, идентичността, данните на страните, плащането и условията за предаване."
    source_ids: [property_law, registry_certificates, cadastre_law]
    source_checked_at: "2026-09-04"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    sections:
      understand: "Предварителният договор, въвеждането в експлоатация, нотариалното прехвърляне и ключовете са отделни събития."
      verify: "Провери актуалната собственост и представителство, тежести с точен обхват, кадастрални данни, данъчни и други изискуеми документи и проекта на нотариален акт."
      act: "Съгласувай с независим адвокат и нотариуса организацията на плащането и проверките непосредствено преди сделката."
      next: "Уреди ясно владението, ключовете, показанията, дефектите и оставащите документи."
  - key: guide.handover_owner
    slug: predavane-i-ranna-sobstvenost
    kind: guide
    locale: bg
    title: "Предаване и първи месеци като собственик"
    summary: "Документирай състоянието, дефектите, ключовете и показанията; подреди гаранции, партиди и общи части."
    source_ids: [obligations_contracts, property_law]
    source_checked_at: "2026-09-04"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    sections:
      understand: "Фактическото предаване може да е на различна дата от сделката или въвеждането и трябва да следва конкретния договор."
      verify: "Огледай имота и принадлежностите, общите части, уредите, документите, показанията и видимите/измерими дефекти."
      act: "Подпиши подробен протокол със снимки и проследим списък; организирай гаранции, застраховане, партиди и управление."
      next: "Следи сроковете и доказателствата за отстраняване на дефекти и решенията за общите части."
  - key: guide.completed_home
    slug: zavarsheno-zhilishte
    kind: guide
    locale: bg
    title: "Покупка на завършено жилище"
    summary: "Започни от собствеността, тежестите, кадастралната идентичност, реалното състояние и разходите — без да проиграваш целия строителен процес."
    source_ids: [registry_certificates, cadastre_law, property_law]
    source_checked_at: "2026-09-04"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    sections:
      understand: "При завършено жилище фокусът е текущият титул, обектът, ползването, преустройствата, техническото състояние, общите части и реалните разходи."
      verify: "Съпостави схема, титул и реално разпределение; провери тежести, основание на продавача, история на значими преустройства и приложим документ за въвеждане според възрастта и режима."
      act: "Направи правна проверка и технически оглед; поискай информация за етажната собственост, ремонти, задължения и партиди."
      next: "Планирай общия бюджет с резерв за ремонт, местни данъци/такси, нотариални разходи и финансиране без да разчиташ на универсален процент."
  - key: guide.house_land_limits
    slug: kashta-ili-partsel
    kind: guide
    locale: bg
    title: "Къща или парцел: обща отправна точка"
    summary: "Mesto покрива общите проверки, но специализираните теми за граници, достъп, мрежи, сервитути и самостоятелно строителство изискват отделен маршрут."
    source_ids: [cadastre_law, zut, property_law]
    source_checked_at: "2026-09-04"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    sections:
      understand: "Не прилагай списък за апартамент към терен или къща без адаптация. Граници, достъп, инфраструктура, строителни книжа и фактическо ползване са особено важни."
      verify: "Установи точния имот, права и тежести; осигурен достъп; регулация и предназначение; сгради и пристройки; мрежи, сервитути и ограничения."
      act: "Включи геодезист/архитект или инженер и адвокат според конкретния въпрос преди плащане."
      next: "Специализираният пълен маршрут за къщи и земя не е покрит във v1; Mesto показва само приложимите общи материали."
