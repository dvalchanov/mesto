    source_checked_at: "2026-09-05"
    content_version: 2
    editorial_status: published
    professional_review_status: pending
    sections:
      understand: |-
        Нотариалното прехвърляне е отделно от предварителния договор, въвеждането в експлоатация, плащането и предаването на ключове. Подготовката трябва да координира тези събития, без да приема, че настъпват едновременно или че един документ доказва всичко.

        Проверките трябва да са актуални към сделката. Документ за собственост или удостоверение, прегледани месеци по-рано, са важна история, но не отговарят сами на въпроса какво е положението непосредствено преди подписване.
      verify: |-
        Провери веригата на собственост и представителството, включително семейно положение, наследяване или пълномощно, когато са приложими. Удостоверението за тежести трябва да е за точния имот, период и лице според избрания подход и да бъде прочетено заедно с вписаните актове.

        Съпостави кадастралната схема, проекта на нотариален акт, предварителния договор и реалния обект. Обърни внимание на идентификатор, площ, предназначение, етаж, принадлежности, идеални части и правото върху паркомясто или склад.
      documents: |-
        Конкретният комплект се определя с адвоката и нотариуса. Обичайно се разглеждат документът за собственост и предходните актове, актуална схема, данъчна оценка, документи за семейно или наследствено положение, пълномощни, удостоверения за вписвания и приложим документ за въвеждане или строителен статус.

        Не приемай наличието на документ за достатъчно. Провери валидност, издател, дата, предмет, подписи и дали има по-ново обстоятелство. Проектът на нотариален акт трябва да се чете предварително, а не за първи път при подписване.
      money: |-
        Съгласувай точната последователност между подписването, банковия превод, усвояването на кредита, заличаването или учредяването на обезпечения и вписването. Няма един ред, който е подходящ за всяка сделка — механизмът зависи от страните, договора, кредита и конкретните тежести.

        Разбери предварително данъците, нотариалните и регистрационните такси и всички договорени разходи. Потвърди сумите и сметките по надежден канал и не променяй основанието в последния момент без правен преглед.
      risks: |-
        Рискове са разминаването между схемата и документа за собственост, непълната история на собствеността, тежест с неясен обхват, ограничено пълномощно, семейни или наследствени права, неуредено заличаване на ипотека и проект на акт, който се различава от уговореното.

        При ново строителство провери дали точният блок или обект попада в приложимия окончателен документ. „Комплексът има Акт 16“ не е достатъчно, когато строежът е на фази.
      professionals: |-
        Независим адвокат организира проверката в твой интерес и координира нерешените въпроси. Нотариусът извършва нотариалното производство и законовите проверки, но не замества предварителната правна и техническа подготовка на купувача.

        При ипотека участват кредитор и оценител; при разминаване в обекта може да е нужен геодезист или архитект. Уточни кой носи отговорност за всяка проверка и кога трябва да е готов резултатът.
      act: |-
        Подготви окончателен списък с документите, техния издател, дата на получаване, срок на валидност и отговорен човек. Изпрати предварително въпросите по проекта на нотариалния акт и поискай коригиран текст преди деня на сделката.

        Направи отделен план за плащането и за предаването. Запиши кога ще получиш владение, ключове, показания, документи и достъп до общите части, вместо да оставяш тези въпроси за устна уговорка след подписването.
      next: |-
        След вписването и плащането премини към фактическото предаване. Сделката не доказва състоянието на имота и не записва автоматично всички ключове, дефекти, уреди или показания.

        Съхрани нотариалния акт, платежните документи и доказателствата за вписване. Следвай конкретните указания за данъчните задължения, партидите за услуги, застраховането и управлението на сградата.
      buyer_checks:
        - "Обнови проверката за собственост, представителство и тежести непосредствено преди сделката."
        - "Съпостави схемата, документа за собственост, предварителния договор, проекта на нотариален акт и реалния обект."
        - "Прочети проекта на нотариалния акт и механизма на плащане преди деня на подписване."
        - "Потвърди как ще се уредят съществуващи и нови обезпечения и кой проследява вписването."
        - "Уреди писмено момента и съдържанието на предаването, ако не съвпада със сделката."

  - key: guide.handover_owner
    slug: predi-predavane
    kind: guide
    category: buyer_journey
    buyer_stage: before_handover
    locale: bg
    title: "Преди предаването на имота"
    summary: "Подготви техническия оглед и приемо-предавателния протокол. Опиши ключовете, показанията и документите и уговори как ще се отстраняват дефектите."
    aliases: ["преди ключове", "приемане на апартамент", "приемо предавателен протокол"]
    keywords: ["предаване", "оглед", "дефекти", "ключове", "показания", "гаранции"]
    related_stage_keys: [building.handover]
    related_document_keys: [document.handover_protocol, document.warranty_documents, document.commissioning, document.maintenance_agreement]
    related_term_keys: [term.defects, term.warranty_period, term.bds_finish, term.utility_connection]
    source_ids: [obligations_contracts, construction_warranties, condominium_law]
    source_checked_at: "2026-09-05"
    content_version: 2
    editorial_status: published
    professional_review_status: pending
    sections:
      understand: |-
        Фактическото предаване може да е на различна дата от нотариалната сделка или въвеждането в експлоатация. То трябва да следва конкретния договор и да запише какво реално получаваш: състояние, ключове, достъп, уреди, документи и показания.

        Предаването не е само подписване на протокол. Това е най-добрата възможност да опишеш писмено първоначалното състояние, дефектите и липсите. Общото „прието без възражения“ може да затрудни последващата комуникация, ако не отразява реалния оглед.
      verify: |-
        Сравни имота с договорните приложения и обещаната степен на завършеност. Провери помещения, размери при съмнение, дограма, настилки, врати, инсталации, уреди, тераси, склад, паркомясто и достъп до общите части. Отдели видимия дефект от въпрос, който изисква измерване или специалист.

        Провери броя и предназначението на ключовете, картите и дистанционните, показанията и номерата на измервателните уреди, наличните партиди и документите за гаранции и експлоатация. Снимките трябва да могат да се свържат с конкретна точка от протокола.
      documents: |-
        Подготви проект на приемо-предавателния протокол предварително. В него предвиди дата, участници, основание, точен имот, принадлежности, ключове, показания, получени документи, дефекти, срок и отговорник за отстраняване и начин за повторна проверка.

        Поискай приложимия документ за въвеждане, гаранционни документи, инструкции, технически паспорт или достъп до него, енергийни документи и правила или договори за управление и поддръжка според случая.
      money: |-
        Провери дали договорът свързва предаването с последно плащане, задържана сума, такса за поддръжка или друг ангажимент. Не приемай, че наличието на дефекти автоматично създава право да задържиш плащане; това зависи от конкретния текст и приложимото право.

        Запиши началните показания и датата, от която носиш текущи разходи. Изясни депозитите, таксите за общи части, паркиране и услуги, без да приемаш устна месечна стойност за постоянна.
      risks: |-
        Рискове са оглед при недостатъчна светлина, предварително попълнен протокол, натиск за незабавен подпис, отказ да се впишат забележки и обещание дефектите да се уточнят по-късно. Козметичен вид не доказва работата на инсталациите или състоянието на скрити елементи.

        Внимавай и когато общите части, достъпът или инфраструктурата не са в обещаното състояние, но протоколът описва само апартамента. Уточни кое е част от твоя договор и как се проследява.
      professionals: |-
        Независим инженер или технически специалист може да проведе систематичен оглед и измервания. Адвокатът преглежда значението на протокола, сроковете и правата при неизпълнение. Представителят на продавача трябва да има право да подпише и да поеме записаните действия.

        Уговори специалиста и достъпа предварително. Ако техническата проверка изисква време или оборудване, кратък формален оглед в деня на предаването може да е недостатъчен.
      act: |-
        Изпрати списък с точките за оглед и участниците преди датата. По време на предаването номерирай дефектите, направи снимки, опиши местоположението и уговори проверим срок и начин за потвърждение на ремонта.

        Не подписвай текст, който не отразява видяното или съдържа празни полета. Получи подписано копие веднага и пази следващата комуникация по същия списък, без да губиш връзката между дефект, снимка и отговор.
      next: |-
        След предаването проследи дефектите, гаранциите, партидите, застраховането и управлението на общите части. Отвори отделната насока за първите месеци като собственик, защото част от задачите започват след ключовете.

        Ако предаването е отказано или непълно, документирай фактите и потърси правен съвет за конкретната договорна процедура.
      buyer_checks:
        - "Сравни имота и принадлежностите с подписаните планове и техническата спецификация."
        - "Включи независим технически специалист и осигури достатъчно време и достъп за оглед."
        - "Запиши всеки дефект със снимка, място, отговорник, срок и начин за повторна проверка."
        - "Опиши всички ключове, карти, дистанционни, уреди, показания и получени документи."
        - "Получи подписаното копие и продължи проследяването по същия номериран списък."

  - key: guide.owner
    slug: parvi-mesetsi-kato-sobstvenik
    kind: guide
    category: buyer_journey
    buyer_stage: owner
    locale: bg
    title: "Първите месеци като собственик"
    summary: "Подреди документите, партидите, гаранциите и застраховката, а след това се запознай с управлението на сградата."
    aliases: ["вече съм собственик", "след покупката", "след получаване на ключове"]
    keywords: ["партиди", "застраховка", "гаранции", "етажна собственост", "поддръжка"]
    related_stage_keys: [building.handover]
    related_document_keys: [document.warranty_documents, document.condominium_documents, document.maintenance_agreement, document.technical_passport]
    related_term_keys: [term.condominium, term.warranty_period, term.defects, term.utility_connection]
    source_ids: [condominium_law, construction_warranties, property_law]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    sections:
      understand: |-
        Работата по покупката не приключва с получаването на ключовете. През първите месеци трябва да подредиш документите, партидите за услуги, гаранциите и отношенията в сградата. Различните срокове могат да започват от различни събития, затова провери началната дата за всеки от тях.

        Раздели личния имот от общите части. Проблем в покрив, фасада, асансьор, двор или обща инсталация може да изисква действие през етажната собственост или управляващото дружество, а не само индивидуален сигнал до продавача.
      verify: |-
        Провери дали разполагаш с нотариалния акт, вписването, схемата, протокола за предаване, гаранционните документи и всички договори за управление или поддръжка. Съпостави началните показания и датите на прехвърляне или откриване на партиди.

        За незавършени дефекти поддържай статуса по номера от протокола. При нов проблем запиши датата, проявлението, снимките и кого си уведомил. Не извършвай ремонт, който може да заличи причината, преди да документираш състоянието и да получиш подходящ съвет.
      documents: |-
        Направи постоянен архив за имота: документи за собственост и кадастър; сделка и плащания; технически и гаранционни документи; етажна собственост и поддръжка; партиди, данъци и застраховане. Пази оригиналите отделно от работните копия.

        Поискай протоколи и решения на общото събрание, правилник, бюджет, известни задължения и договори, които засягат общите разходи. Документът показва конкретно решение към определена дата, не гарантира бъдещ размер на таксите.
      money: |-
        Подреди текущите разходи по категории: комунални услуги, етажна собственост, управление, поддръжка, застраховка, данък и резерв за ремонти. Потвърди кой начислява сумата, на какво основание и за кой период, вместо да плащаш по непроверена устна инструкция.

        При общи ремонти или нови такси поискай решението и начина на разпределение. Mesto не изчислява индивидуалното ти задължение и не замества прегледа на документите на етажната собственост.
      risks: |-
        Рискове са загубени гаранционни срокове, сигнали само по телефон, неясни партиди, неполучени решения на етажната собственост и автоматично плащане на такса без договор или решение. Малък теч или дефект може да стане по-труден за доказване, ако не е документиран навреме.

        Внимавай и при довършителни ремонти, които засягат общи части, конструкция или инсталации. Собствеността върху апартамента не означава свободно право да променяш всичко около него.
      professionals: |-
        Технически специалист помага при дефекти и планирани ремонти; адвокат — при спор, гаранционна претенция или решение на етажната собственост; счетоводител или местна администрация — при конкретни данъчни въпроси. Домоуправителят организира общи процеси, но не представлява автоматично личния ти интерес.

        При застраховане провери покритието, изключенията и връзката с общите части. Избирай помощ според конкретния проблем, а не само според това кой е най-лесно достъпен.
      act: |-
        Направи календар за партиди, данъчни действия, застраховка, гаранционни срокове и проследяване на дефекти. Запази контактите и правилата за подаване на сигнали, включително доказателство за получаването им.

        Представи се пред управлението на сградата и поискай основните документи и канал за уведомяване. Провери как се свикват събрания и как можеш да получаваш решенията, вместо да научаваш за тях след възникване на разход.
      next: |-
        След първоначалното подреждане премини към периодичен преглед на документите, застраховането и техническото състояние. Актуализирай досието при ремонт, отдаване, ново решение на етажната собственост или промяна в собствеността.

        Ако по-късно планираш продажба или ново финансиране, добре подреденото досие ще улесни бъдещата проверка. То обаче не гарантира нейния резултат.
      buyer_checks:
        - "Събери документа за собственост, схемата, протокола, гаранциите и договорите в постоянния си архив."
        - "Прехвърли или открий партидите и пази началните показания и датите."
        - "Провери правилата, решенията, бюджета и контактите на етажната собственост."
        - "Описвай дефектите и ги заявявай писмено преди изтичането на съответните срокове."
        - "Подреди застраховката, текущите разходи и календар за периодичен преглед."

  - key: guide.completed_home
    slug: zavarsheno-zhilishte
    kind: guide
    category: property_type
    property_types: [completed_home]
    locale: bg
    title: "Покупка на завършено жилище"
    summary: "Провери собствеността и тежестите, точния имот, реалното му състояние, общите части и целия бюджет за покупката."
    aliases: ["старо строителство", "готов апартамент", "жилище с акт 16"]
    keywords: ["оглед", "собственост", "тежести", "преустройство", "ремонт"]
    related_stage_keys: [building.commissioning, building.handover]
    related_document_keys: [document.title_deed, document.encumbrance_certificate, document.cadastral_sketch_scheme, document.tolerance_certificate, document.condominium_documents]
    related_term_keys: [term.property_record, term.marital_community, term.right_of_use, term.condominium]
    source_ids: [registry_certificates, cadastre_law, property_law, condominium_law, egov_tolerance]
    source_checked_at: "2026-09-05"
    content_version: 2
    editorial_status: published
    professional_review_status: pending
    sections:
      understand: |-
        При завършено жилище не е нужно да проиграваш целия строителен процес. Основните въпроси са кой притежава имота сега, какво точно включва правото, има ли вписвания или чужди права, съвпада ли реалното състояние с документите и какви разходи идват след покупката.

        Възрастта на сградата променя наличните документи и приложимия административен режим. Липсата на съвременен документ със същото название не доказва автоматично незаконност, но изисква да се установи как е създадена и ползвана сградата и какви последващи промени са правени.
      verify: |-
        Проследи собствеността и основанието на продавача, семейни и наследствени обстоятелства, представителство, тежести, права на ползване и владение. Съпостави схемата и документа за собственост с адреса, етажа, площта, предназначението, мазето, тавана, идеалните части и паркомястото.

        Направи технически оглед на жилището и общите части. Провери за влага, пукнатини, инсталации, дограма, отопление, покрив или сутерен според позицията на имота. Попитай за преустройства и сравни реалното разпределение с наличните планове и схема.
      documents: |-
        Поискай документа за собственост и относимите предходни актове, актуална схема, удостоверение за тежести, документи за семейно или наследствено положение, необходимия документ за въвеждане в експлоатация или законност и доказателства за значими преустройства. Точният комплект зависи от историята на имота.

        Прегледай документите на етажната собственост: важни решения, планирани ремонти, известни задължения, договори за управление или поддръжка. Устно уверение „няма проблеми във входа“ не показва бъдещите разходи или вече взети решения.
      money: |-
        Бюджетът включва цената, разходите по сделката и финансирането, необходимите ремонти, обзавеждането, предстоящите общи ремонти и текущата поддръжка. Предвиди резерв според действителното състояние, вместо да добавяш произволен процент.

        При ипотека банковата оценка и одобрението са отделни от твоята проверка. Изясни дали установените преустройства, предназначение или документи влияят на финансирането и срока преди да поемеш необратим ангажимент.
      risks: |-
        Внимавай при разминаване между реално разпределение и схема, пристроени или усвоени площи, паркомясто без ясно право, обитател без уредено освобождаване, непълна наследствена история и тежести, които ще се заличават около сделката.

        Техническите рискове често са общи за сградата, а не само вътре в апартамента. Новият ремонт може да прикрива следи, затова огледай и съседните общи зони и потърси история за повтарящи се проблеми.
      professionals: |-
        Адвокатът проверява собствеността, вписванията, представителството и договора. Инженер или архитект оценява състоянието, преустройствата и необходимите ремонти. Нотариусът има собствена роля при сделката, но не извършва технически оглед.

        При по-стара или променяна сграда може да е нужен допълнителен архитектурен, геодезически или административен преглед. Задачата трябва да е конкретна и да използва наличните документи.
      act: |-
        Направи общо досие, в което всяко установено разминаване има отговор, доказателство и отговорен специалист. Договори как и кога имотът ще бъде освободен и предаден, какво обзавеждане остава и как се записват показанията и ключовете.

        Не допускай добрият външен вид да измести правната проверка или обратното. Преди решение трябва да разбираш достатъчно добре и правното, и техническото състояние на имота, както и отражението им върху бюджета ти.
      next: |-
        Когато избереш конкретния имот, следвай хронологичните насоки според своя момент: преди капаро, преди предварителен договор или преди нотариална сделка. Видът на имота не заменя етапа на купувача.

        След сделката използвай отделните насоки за предаване и първи месеци като собственик.
      buyer_checks:
        - "Проследи текущата собственост, представителството, тежестите и чуждите права."
        - "Съпостави документа за собственост, схемата, реалното разпределение, принадлежностите и предназначението."
        - "Направи независим технически оглед на жилището и относимите общи части."
        - "Провери решенията, ремонтите, задълженията и договорите на етажната собственост."
        - "Включи ремонта, финансирането, сделковите и текущите разходи в общия бюджет."

  - key: guide.house_land_limits
    slug: kashta-ili-partsel
    kind: guide
    category: property_type
    property_types: [house, land]
    locale: bg
    title: "Покупка на къща или парцел"
    summary: "Провери границите, достъпа, правата, строителните книжа, устройствените условия и връзките към мрежите с подходящите специалисти."
    aliases: ["купувам къща", "купувам парцел", "дворно място", "земя"]
    keywords: ["граници", "достъп", "регулация", "сервитут", "мрежи", "пристройка"]
    related_stage_keys: [building.land_planning, building.authorization]
    related_document_keys: [document.cadastral_sketch_scheme, document.title_deed, document.pup, document.building_permit, document.tolerance_certificate]
    related_term_keys: [term.land_property, term.upi, term.easement, term.right_to_build, term.utility_connection]
    source_ids: [cadastre_law, zut, property_law, registry_certificates, egov_tolerance]
    source_checked_at: "2026-09-05"
    content_version: 2
    editorial_status: published
    professional_review_status: pending
    sections:
      understand: |-
        Къща или парцел не трябва да се проверяват със списък за апартамент. Освен собствеността и тежестите важни са границите на терена, законният и реалният достъп, устройствените условия, всички сгради и пристройки, водата, електрозахранването, канализацията, сервитутите и ограниченията за бъдещо ползване.

        При къща има поне два свързани обекта — земята и сградата — а понякога и няколко постройки с различен статус. При парцел основният въпрос не е само „може ли да се строи“, а какво, при какви условия, с какъв достъп и инфраструктура и след какви допълнителни процедури.
      verify: |-
        Съпостави кадастралните граници с документа за собственост, положението на терен и оградите. Провери дали достъпът е през публичен път, собствен имот, идеални части или чужд терен и как е уреден. Установи предназначението, регулацията, действащия план, ограниченията и евентуалните сервитути.

        За всяка сграда и пристройка провери идентичността, строителните книжа и законовия ѝ статут според времето на изграждане. Фактът, че постройката се вижда в кадастъра или се използва отдавна, сам по себе си не доказва законност или право на преустройство.
      documents: |-
        Основният комплект включва документите и историята на собствеността, актуална скица, удостоверение за вписвания, устройствена информация, приложим ПУП и данни за достъп и мрежи. При къща добави разрешения, проекти, документи за въвеждане, технически паспорт или други налични строителни книжа за всяка постройка.

        Ако се твърди търпимост, право на преминаване, право на строеж или присъединяване, поискай точния документ и прочети неговия предмет. Обещание „има ток и вода наблизо“ не показва техническа възможност, цена, капацитет или право на присъединяване.
      money: |-
        Общият бюджет може да включва геодезическо заснемане, проектантски и инженерни проучвания, укрепване, ремонт на покрив и инсталации, осигуряване на достъп, присъединяване към мрежи, септична система, премахване или узаконяване на постройки и бъдещо строителство. Размерът им зависи от конкретния имот и не може надеждно да се оцени с общ процент.

        При финансиране потвърди как кредиторът третира земята, сградите, документацията и необходимите ремонти. Оценката за кредит не доказва, че планираното строителство е допустимо или че достъпът е уреден.
      risks: |-
        Сигнали за внимание са ограда, която не следва границата; достъп „по уговорка“; постройка без ясни книжа; различни площи; мрежа без документ за присъединяване; сервитут или ограничение, което пресича зоната за строеж; и обещание за бъдеща промяна на плана като сигурен резултат.

        При съсобственост установи какво реално се придобива и използва. Идеална част от терен не е автоматично физически обособен двор, а разпределението на ползването не е същото като промяна на собствеността.
      professionals: |-
        Адвокатът проверява правата, историята, достъпа, тежестите и договорите. Геодезистът работи с граници и заснемане; архитектът — с устройствените възможности и проектите; инженерите — с конструкция, почви и мрежи. Общината и операторите дават официална информация в своята компетентност.

        Избери специалистите според целта: покупката на съществуваща къща, ремонтът, пристрояването и новото строителство са различни задачи. Mesto дава обща ориентация, но не замества специализираното проучване на терена и сградите.
      act: |-
        Формулирай предварително как възнамеряваш да използваш имота. Дай тази цел на адвоката, геодезиста и проектанта, за да проверят не само текущото състояние, а и дали планът ти е реалистичен според наличните права и ограничения.

        Посети имота с подходящ специалист, когато границите, наклонът, отводняването, конструкцията или мрежите са съществени. Запиши всяко твърдение на продавача, което трябва да бъде доказано преди плащане.
      next: |-
        Когато документите и специализираните проверки очертаят реалния предмет и възможното ползване, премини към хронологичната насока за своя момент — преди капаро, договор или нотариална сделка.

        Ако ключов въпрос зависи от бъдещо разрешение, план или присъединяване, приеми го за неизвестност. Уреди изрично в договора какво следва, ако очакваното събитие не настъпи.
      buyer_checks:
        - "Съпостави документа за собственост, кадастъра, границите на терен, оградите и всяка постройка."
        - "Установи правното и фактическото основание за достъп до публичен път."
        - "Провери регулацията, предназначението, ограниченията, сервитутите и реалната си цел за ползване."
        - "Изискай отделни доказателства за строителните книжа и мрежите, вместо да разчиташ на видимото."
        - "Направи специализиран бюджет и преглед с адвокат, геодезист, архитект или инженер според случая."
