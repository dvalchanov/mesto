entries:
  - key: guide.research
    slug: prouchvane-i-sravnyavane
    kind: guide
    category: buyer_journey
    buyer_stage: researching
    locale: bg
    title: "Проучване и сравняване"
    summary: "Подреди нуждите си и общия бюджет. Избери как ще сравняваш имотите, преди конкретна обява да те подтикне към прибързано решение."
    aliases: ["проучвам имоти", "начало на покупка", "как да започна"]
    keywords: ["критерии", "бюджет", "сравнение", "обяви", "район"]
    related_stage_keys: [building.land_planning]
    related_document_keys: [document.cadastral_sketch_scheme, document.title_deed, document.bank_valuation]
    related_term_keys: [term.property_areas, term.garage_parking, term.individual_object]
    source_ids: [cadastre, registry_certificates, bnb_mortgage_guide]
    source_checked_at: "2026-09-05"
    content_version: 2
    editorial_status: published
    professional_review_status: pending
    sections:
      understand: |-
        В началото задачата не е да намериш „перфектната“ обява, а да изградиш начин за вземане на решение. Раздели условията си на задължителни, желателни и такива, за които би направил компромис. Включи ежедневния маршрут, достъпа, етажа, асансьора, светлината, шума, степента на завършеност и срока, в който реално можеш да се преместиш.

        Разграничи и вида на покупката. Апартамент в строеж, въведено в експлоатация ново жилище и старо жилище могат да изглеждат сходно в обява, но имат различни неизвестности, документи и бъдещи разходи. Ако още не си решил, сравнявай сценарии, а не само цени на квадратен метър.
      verify: |-
        Сравнявай еднакви величини. Попитай как е изчислена площта, какви общи части са включени, как се придобиват паркомясто или склад и дали показаната цена включва всички договорени компоненти. Адресът и рекламното име не са достатъчни за идентифициране на имота; при конкретен вариант поискай схема, точен идентификатор и документ за правата на продавача.

        За района провери фактите, които влияят на твоето ежедневие — транспорт, достъп, планирани строежи, шум и услуги — и отбележи датата и източника. Еднократно посещение или рекламно описание не показват каква е средата сутрин, вечер или през друг сезон.
      documents: |-
        На този етап не е нужен пълен комплект за всяка обява. За вариантите, които остават в краткия списък, поискай поне документ, от който личи кой предлага имота, кадастрална схема или достатъчно точна проектна идентификация и ясно описание на принадлежностите. При ново строителство добави приложимите строителни книжа и версията на проекта.

        Целта е да откриеш рано дали обявата, документите и реалният обект говорят за едно и също нещо. Копие без видим номер, дата, издател или обхват е отправна точка за допълнителен въпрос, не завършена проверка.
      money: |-
        Общият бюджет е повече от обявената цена. Предвиди местни данъци и такси, нотариални и регистрационни разходи, правна и техническа помощ, кредитни разходи, довършване или ремонт, обзавеждане, паркиране, поддръжка и разумен резерв. Не добавяй произволен общ процент — събери конкретни оферти и условия за своя случай.

        Ако ще ползваш ипотека, ранният разговор с кредитор помага да разбереш процеса, но предварителна индикация не е окончателно одобрение. Банковата оценка също има конкретна цел и не заменя правната или техническата проверка.
      risks: |-
        Внимавай, когато сравняването се свежда до една цифра, когато площите са описани различно или когато важни компоненти като паркомясто и склад остават „за уточняване“. Натискът за незабавно плащане преди точна идентичност и проект на условията е причина да забавиш решението.

        Друг риск е да натрупаш много обяви без ясни критерии. Така по-новата или по-емоционална оферта изглежда по-добра само защото е прясна. Кратка таблица с еднакви полета прави липсващата информация видима.
      professionals: |-
        Кредитен консултант или кредитор може да изясни финансовия процес, брокерът — достъпа до оферти и огледи, а архитект или инженер — технически ограничения. Адвокатът става важен преди да поемеш задължение или да платиш, не след като условията вече са приети.

        Никой от тези участници не покрива автоматично работата на останалите. Уточни кого представлява специалистът, каква задача има и какъв резултат ще получиш писмено.
      act: |-
        Направи таблица за сравнение с не повече от десет важни показателя и отбелязвай „неизвестно“, вместо да допълваш липсващото с предположение. След всеки оглед запиши фактите отделно от впечатленията и добави въпросите, на които продавачът трябва да отговори.

        Когато останат два или три реални варианта, премини от общо проучване към проверка на точната идентичност, правата и документите. Това е моментът да започнеш кратък списък, а не да плащаш, за да „спреш“ обявата.
      next: |-
        Следващата стъпка е да сравниш конкретните варианти. Премини към нея, когато можеш да обясниш защо даден имот е в краткия ти списък, какъв е общият бюджет и коя информация още липсва.

        Ако вече те притискат за резервация или капаро, премини директно към съответната насока и не приемай, че ранното проучване замества проверката преди плащане.
      buyer_checks:
        - "Запиши пет условия, без които имотът не работи за теб, и отделно пет желателни качества."
        - "Сравни общия бюджет, а не само обявената цена или цена на квадратен метър."
        - "Използвай еднакви определения за площ, паркиране, склад, степен на завършеност и срок."
        - "Отбележи кои твърдения идват от документ, кои от продавача и кои са лично впечатление."
        - "Не плащай за спиране на офертата, преди да видиш точно кой имот се резервира и при какви условия можеш да се откажеш и да получиш сумата обратно."

  - key: guide.shortlisting
    slug: sravnyavane-na-konkretni-imoti
    kind: guide
    category: buyer_journey
    buyer_stage: shortlisting
    locale: bg
    title: "Сравняване на конкретни имоти"
    summary: "Сравни избраните имоти по права, състояние, неизяснени въпроси и общ разход — не само по снимки и обявена цена."
    aliases: ["сравнявам варианти", "кратък списък имоти", "избирам между имоти"]
    keywords: ["оглед", "оферта", "идентификатор", "площ", "сравнение"]
    related_stage_keys: [building.land_planning, building.authorization, building.act14]
    related_document_keys: [document.cadastral_sketch_scheme, document.title_deed, document.encumbrance_certificate, document.preliminary_contract]
    related_term_keys: [term.cadastral_identifier, term.property_areas, term.garage_parking, term.appurtenant_parts]
    source_ids: [cadastre, registry_certificates, property_law]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    sections:
      understand: |-
        Краткият списък е моментът, в който рекламните варианти трябва да станат конкретни имоти. За всеки вариант установи какво точно се продава: самостоятелен обект, идеални части, право на строеж, принадлежности и евентуално паркомясто. Една и съща дума в две обяви може да описва различни права.

        Сравнявай не само характеристиките, а и неизвестностите. Имот с по-ниска цена, но неясна площ, необходим сериозен ремонт или несигурен срок може да е по-голям ангажимент. Отдели проверимия факт от обещанието и от личната оценка след огледа.
      verify: |-
        Съпостави адреса, идентификатора, етажа, номера на обекта, площта, предназначението и принадлежностите между схемата, документа за собственост, проекта и офертата. При строеж провери за кой блок, вход и фаза се отнасят разрешението и обявеният етап. При завършено жилище сравни реалното разпределение със схемата и попитай за значими преустройства.

        Направи повече от един оглед, когато решението е сериозно. Провери общите части, достъпа, асансьора, влагата, инсталациите, изложението, шума и следите от ремонти. Видимото състояние не заменя технически оглед, но помага да формулираш правилните въпроси.
      documents: |-
        За всеки вариант в краткия списък поискай схема или точно описание на обекта в проекта, документ за собственост или основание за бъдещото право, актуална информация за тежести и относимите строителни документи. Ако офертата включва склад, гараж или паркомясто, изискай отделно описание какво право ще придобиеш.

        Не сравнявай документ само по заглавие. Запиши издател, номер, дата, обхват и връзката му с точния имот. Ако продавачът не предоставя документ преди плащане, това е факт, който трябва да участва в решението ти.
      money: |-
        Направи бюджет за всеки вариант с еднакви редове: цена, данъци и такси, финансиране, ремонт или довършване, обзавеждане, професионални проверки, паркиране и поддръжка. Ако не можеш да се нанесеш веднага, добави и разхода за наем или друго временно решение.

        Не използвай банковата оценка като доказателство, че цената е изгодна или че имотът няма правни проблеми. Тя служи за конкретна кредитна цел и може да се основава на допускания, различни от важните за твоето решение.
      risks: |-
        Чести предупреждения са разминаване в площите, паркомясто без ясно право, обещани промени без договорно приложение, продавач или посредник с неясно представителство и искане за плащане преди документния пакет. Едно разминаване не доказва непременно проблем, но изисква обяснение и доказателство.

        Внимавай и със „сравними“ оферти, които са на различен строителен етап, с различна степен на завършеност или с несравними общи части. Уеднакви условията, преди да решиш коя цена действително е по-ниска.
      professionals: |-
        Независим адвокат проверява правата, тежестите, представителството и договорния риск. Архитект или инженер може да оцени разпределение, състояние, преустройства и довършване. Кредиторът потвърждава собствените си условия и срокове.

        Включи специалистите преди необратимо плащане. Устен коментар на оглед не е равностоен на преглед на конкретните документи и не създава отговорност за въпроси извън възложената задача.
      act: |-
        Събери за всеки вариант едностранично досие: точен предмет, основни доказателства, общ бюджет, неизвестности и причина да остане в списъка. Постави срок за получаване на липсващите документи, който не зависи от изкуствена спешност.

        След това избери не просто любимия имот, а варианта, за който разбираш какво придобиваш, какво плащаш и кои рискове поемаш. Ако два варианта останат близки, предпочети този, за който има по-пълна и проверима информация.
      next: |-
        Следва резервация или капаро само ако вече имаш точен предмет, проект на условията и достатъчно информация да оцениш какво става при проблем. Ако няма плащане, продължи към подготовката на предварителния договор.

        Връщането към проучване не е провал. То е правилният ход, когато нито един вариант не покрива задължителните условия или продавачът не дава необходимата информация.
      buyer_checks:
        - "Запиши за всеки вариант точния кадастрален идентификатор или достатъчно ясно описание по проекта."
        - "Съпостави офертата, схемата, документа за собственост и реалното разпределение в една таблица."
        - "Запиши отделно правото върху паркомясто, склад, двор и други принадлежности."
        - "Изчисли общия разход и времето до реално ползване за всеки вариант."
        - "Отстрани от списъка вариантите, при които ключова неизвестност остава без проверим отговор."

  - key: guide.before_deposit
    slug: predi-rezervatsiya-ili-kaparo
    kind: guide
    category: buyer_journey
    buyer_stage: before_deposit
    locale: bg
    title: "Преди резервация или капаро"
    summary: "Преди да платиш, провери на кого и за какво плащаш, какво поема всяка страна и в кои случаи сумата се връща."
    aliases: ["преди капаро", "стоп капаро", "резервационна такса"]
    keywords: ["резервация", "капаро", "задатък", "връщане", "плащане"]
    related_stage_keys: [building.authorization, building.act14]
    related_document_keys: [document.reservation_agreement, document.brokerage_agreement, document.title_deed, document.encumbrance_certificate]
    related_term_keys: [term.deposit, term.off_plan, term.possession_ownership]
    source_ids: [obligations_contracts, property_law, notaries_law]
    source_checked_at: "2026-09-05"
    content_version: 2
    editorial_status: published
    professional_review_status: pending
    sections:
      understand: |-
        „Резервация“, „капаро“, „депозит“ и „задатък“ не са автоматично взаимозаменяеми. Последиците идват от конкретния текст, страните, целта на плащането и фактите около него. Заглавието на бланката или обяснението по телефона не е достатъчно, за да разбереш дали и кога сумата се връща.

        Първият въпрос е какво получаваш срещу плащането. Това може да е временно спиране на офертата, ангажимент да се подготви договор, част от цена или друга уговорка. Трябва да е ясно кой имот се резервира, за колко време и какви действия дължи всяка страна.
      verify: |-
        Провери получателя и основанието му да приема сумата. Ако плащаш на посредник или друго лице, установи за кого действа, има ли представителна власт и кога парите достигат до продавача. Съпостави точния имот, продавача и основните права с наличните документи преди превода.

        Прочети всички случаи на връщане, задържане и прихващане. Включи отказ на продавача, проблем в правната или техническата проверка, неодобрено финансиране, непостигане на договорен текст и изтичане на срока. Не разчитай на устно обещание, което липсва в документа.
      documents: |-
        Поискай проекта на резервационното споразумение, документа за правата на продавача, схема или точно описание на имота по проекта, актуална информация за тежести и относимите строителни книжа. Ако посредникът има собствен договор или общи условия, те също са част от решението.

        В документа за плащането търси точен получател, банкова сметка, валута, сума, основание, срок, предмет и подписващи лица. Пази подписаното копие и платежното доказателство в една и съща версия на досието.
      money: |-
        Няма един правилен размер или момент за такова плащане. Оцени каква част от средствата поставяш в риск, колко време могат да останат блокирани и дали условията ти позволяват да приключиш необходимите проверки преди следващия ангажимент.

        При ипотека уточни кои банкови стъпки реално могат да приключат в срока. Рекламна консултация или предварително изчисление не гарантира кредит. Ако връщането зависи от финансиране, условието трябва да е достатъчно конкретно за твоя случай.
      risks: |-
        Червени сигнали са плащане към различно лице без ясно основание, празни полета, неописан имот, задържане на сумата при почти всяка причина за отказ, много кратък срок за договор и отказ да се предоставят основни документи. Натискът „сега или губиш имота“ не променя необходимостта да разбереш условията.

        Риск има и когато документът блокира само купувача, но не съдържа проверим ангажимент на продавача да не преговаря или да подготви договор. Провери как се доказва нарушение и как на практика се иска връщане на сумата.
      professionals: |-
        Независим адвокат трябва да прочете конкретния документ и свързаните договори преди плащане, особено когато сумата е съществена или има неясни условия. Кредиторът потвърждава само финансовия си процес, а брокерът не замества прегледа в твой интерес.

        Ако описанието на имота или строителната документация са неясни, архитект или инженер може да помогне при сравняването им. Уточни писмено какво точно проверява всеки специалист.
      act: |-
        Изпрати всички условия и документи за преглед като един пакет. Запиши въпросите си в писмен вид и поискай коригиран проект, ако отговорът променя уговорката. Не превеждай по различна сметка или с различно основание от договореното без обяснение и нова проверка.

        Ако продавачът не дава разумно време за проверка или ясни условия за отказ и връщане на сумата, не плащай с идеята да уточняваш подробностите по-късно. Това само по себе си е важна информация за предложената сделка.
      next: |-
        След резервацията подготви предварителния договор с всички приложения и продължи проверката, която не е могла да приключи преди плащането. Следи точния срок и кой трябва да изпрати първия проект.

        Ако резервация няма, премини директно към подготовката преди предварителен договор. Пропускането на плащане не означава пропускане на проверките.
      buyer_checks:
        - "Потвърди кой получава парите, за кого действа и на какво основание."
        - "Опиши точния имот, принадлежностите и срока на резервиране без празни полета."
        - "Прочети отделно всеки случай на връщане, задържане и прекратяване."
        - "Увери се, че срокът позволява правна, техническа и финансова проверка."
        - "Пази подписаната версия, приложенията, кореспонденцията и платежното доказателство."

