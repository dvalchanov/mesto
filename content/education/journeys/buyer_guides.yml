    locale: bg
    title: "Преди предварителен договор"
    summary: "Увери се, че договорът описва ясно имота, правата, приложенията, плащанията и условията за прекратяване."
    aliases: ["преди предварителен договор", "проект на договор", "договор за имот"]
    keywords: ["страни", "предмет", "цена", "срок", "неустойка", "приложения"]
    related_stage_keys: [building.authorization, building.act14, building.act15]
    related_document_keys: [document.preliminary_contract, document.title_deed, document.investment_project, document.building_permit]
    related_term_keys: [term.off_plan, term.right_to_build, term.property_areas, term.bds_finish]
    source_ids: [obligations_contracts, property_law, registry_certificates, zut]
    source_checked_at: "2026-09-05"
    content_version: 2
    editorial_status: published
    professional_review_status: pending
    sections:
      understand: |-
        Предварителният договор не е административна формалност. Той е източникът на ключови частни задължения преди окончателната сделка: какво ще бъде прехвърлено, при каква цена, в какви срокове и какво става при отклонение. При имот в строеж той често трябва да опише и бъдещия обект, проекта и степента на завършеност.

        Раздели четири различни събития: строителен етап, плащане, нотариално прехвърляне и фактическо предаване. Те могат да са свързани от договора, но не са едно и също и не настъпват автоматично заедно.
      verify: |-
        Провери страните, представителството и правото на продавача да обещае точното право. Съпостави предмета с документа за собственост, схемата или одобрения проект, включително площи, общи части, склад, гараж или паркомясто. При бъдещ обект установи върху кой терен и право на строеж се основава проектът.

        Прочети сроковете, условията за удължаване, доказателствата за етапи, процедурата за уведомяване, неустойките, основанията за прекратяване и правилата за връщане на платеното. Провери как се уреждат проектни промени, отклонения, тежести, финансиране, нотариална сделка и предаване.
      documents: |-
        Преглеждай договора с всички приложения едновременно: схема или архитектурен план, спецификация на материалите и завършеността, график или условия за плащане, описание на принадлежностите и пълномощни. Ако важно приложение ще се добавя „по-късно“, част от уговорката остава неясна в момента на подписването.

        За правната и строителната основа поискай приложимите документи за собственост, удостоверение за тежести, разрешение за строеж, одобрена проектна част и други документи според етапа. Един намерен публичен запис не доказва целия комплект или съдържанието на частния договор.
      money: |-
        Направи собствена таблица за всяко плащане: сума или формула, валута, получател, падеж, условие, доказателство и право на възражение. Не приемай, че се дължи вноска само заради търговско название като „Акт 14“ — ръководи се от конкретната клауза и документа с правилния обхват.

        Провери как ДДС, индексацията, допълнителните работи, таксите за поддръжка, паркирането и кредитните условия влияят на крайната цена. Mesto не определя графика, размера на вноските или какъв аванс е приемлив за твоя случай.
      risks: |-
        Особено внимание изискват едностранни права за промяна, общи описания на имота, неограничени удължавания, плащане при неясно доказателство, несъразмерни последици само за купувача и приложения без версия или подпис. Маркетингова брошура не става автоматично договорно обещание.

        Риск е и липсата на ясни правила за прекратяване и връщане на платеното при проблем със собствеността, тежестите, разрешенията или кредита. Не приемай, че обща клауза за „изрядни документи“ урежда всеки възможен случай.
      professionals: |-
        Независим адвокат трябва да прегледа целия проект, проверката на правата и механизма на плащане в твой интерес. Архитект или инженер разглежда проектните приложения, техническата спецификация и измеримостта на обещаното изпълнение.

        Нотариусът ще има роля при окончателната сделка, но не води преговорите по предварителния договор вместо теб. Кредиторът проверява собствените условия за финансиране, не всички рискове на покупката.
      act: |-
        Води преговорите по списък с нерешени въпроси и пази версиите. Когато текстът се промени, сравни целия документ, а не само последния редактиран параграф. Изискай всички приложения да бъдат ясно наименувани, датирани и подписани заедно с договора.

        Преди подписване обобщи със свои думи: какво придобиваш, кога плащаш, какво трябва да получиш и какви права имаш при неизпълнение. Ако не можеш да го обясниш ясно, договорът още се нуждае от уточнение.
      next: |-
        След подписване създай календар само по окончателния текст и пази договорните уведомления отделно от рекламните актуализации. Отбележи кой документ трябва да получиш преди всяко действие.

        Ако важна проверка остава условна, запиши кой я извършва, в какъв срок и какво право имаш при неблагоприятен резултат.
      buyer_checks:
        - "Съпостави страните, представителството и правото на продавача с актуални доказателства."
        - "Опиши точния предмет и всички принадлежности еднакво в договора и приложенията."
        - "Свържи всяко плащане с конкретно условие, доказателство и процедура за уведомяване."
        - "Прочети сроковете, удължаването, прекратяването, връщането на суми и неустойките като една система."
        - "Подпиши само окончателните версии на всички приложения след независим правен и технически преглед."

  - key: guide.after_signing
    slug: sled-podpisvane
    kind: guide
    category: buyer_journey
    buyer_stage: preliminary_contract_signed
    locale: bg
    title: "След подписването"
    summary: "Пази всички версии на документите, следи договорните срокове и проверявай всяка промяна преди следващото плащане."
    aliases: ["подписан предварителен договор", "след договора", "какво следва след подписване"]
    keywords: ["срокове", "уведомления", "анекс", "плащания", "доказателства"]
    related_stage_keys: [building.authorization, building.act14, building.act15, building.commissioning]
    related_document_keys: [document.preliminary_contract, document.investment_project, document.executive_documentation]
    related_term_keys: [term.material_deviation, term.construction_papers, term.off_plan]
    source_ids: [obligations_contracts, ordinance_3, registry_certificates]
    source_checked_at: "2026-09-05"
    content_version: 2
    editorial_status: published
    professional_review_status: pending
    sections:
      understand: |-
        Подписът не приключва проверката. От този момент има версия на договореното, спрямо която трябва да се оценяват срокове, уведомления, проектни промени, строителни документи и искания за плащане. Общите новини за проекта са полезни, но не заместват договорната процедура.

        Следи отделно какво се случва със строежа и какво се случва по твоя договор. Физическият напредък може да е видим, без да е представено договореното доказателство, а издаден документ може да се отнася до друг блок, етап или обект.
      verify: |-
        Съхрани подписаната версия, всяко приложение, платежно доказателство и официална кореспонденция. Провери дали всички страници и приложения са подписани или ясно приобщени и дали имената, датите и банковите сметки съвпадат.

        При всяко съобщено събитие сравни конкретната клауза, необходимото доказателство, датата, издателя и обхвата. Ако има забавяне или промяна, установи как договорът изисква да бъдеш уведомен и в какъв срок можеш да реагираш.
      documents: |-
        Поддържай досие с четири раздела: договор и анекси; проект и технически приложения; строителни и административни документи; плащания и кореспонденция. Не заменяй стар файл с нов — версиите могат да са важни за проследяване на промяна.

        За ново строителство следи документите според реалния етап, но не очаквай един и същ комплект във всеки момент. Когато документ се използва като основание за действие по договора, поискай пълно копие и обяснение как се отнася до твоя обект.
      money: |-
        Не планирай плащане само по приблизителна дата от разговор или рекламен график. Поддържай собствен календар с договорения падеж, условието, получателя, необходимия документ и време за преглед. Отдели сумата, която е дължима, от допълнителни искания или промени.

        При кредит координирай предварително срока за банковите документи и усвояването, но не допускай банковият процес да замени проверката на договорното основание. Ако сметка или получател се променят, потвърди промяната по надежден независим канал.
      risks: |-
        Внимавай за устни промени, неподписани анекси, документи за друг блок или фаза, искане за плащане без договореното уведомление и натрупване на важна комуникация само в чат. Мълчанието ти може да има значение според текста, затова не отлагай професионален съвет при спор.

        Друга опасност е постепенното приемане на множество малки отклонения без обща оценка. Събирай ги на едно място и провери дали заедно променят предмета, срока, стойността или бъдещото ползване.
      professionals: |-
        Адвокатът помага да прочетеш уведомление, анекс, забавяне или искане за плащане спрямо договора. Инженер или архитект оценява техническите промени и съответствието им с приложенията. Кредиторът потвърждава своите срокове и документи.

        Потърси помощ, преди да подпишеш анекс, да приемеш отклонение или да пропуснеш срок за възражение. Навременната консултация е по-полезна от опитите по-късно да възстановяваш липсващи документи и кореспонденция.
      act: |-
        Превърни договора в календар и списък за доказателства. За всяко бъдещо събитие запиши как ще разбереш, че е настъпило, кой документ очакваш и какво трябва да провериш преди действие. Отговаряй писмено на съществени уведомления.

        Ако получиш нов документ, съхрани оригиналния файл, датата и начина на получаване. Назови го така, че по-късно да различиш проект, неподписано копие и окончателна версия.
      next: |-
        Преди всяко плащане отвори конкретната насока за плащане по етап и сравни договора с действителното доказателство. Не използвай спомена за преговорите вместо подписания текст.

        Когато се приближи нотариалната сделка или предаването, обнови проверките, защото старо удостоверение или ранна схема може вече да не отразява актуалното положение.
      buyer_checks:
        - "Съхрани подписания договор, всяко приложение и всяка следваща версия без да презаписваш файлове."
        - "Направи календар на срокове, уведомления, доказателства и плащания по точния текст."
        - "Потвърждавай промени в получател, сметка, проект или срок преди действие."
        - "Съпоставяй строителните документи с точния блок, вход, фаза и договорна клауза."
        - "Потърси съвет преди анекс, отказ от право или изтичане на срок за възражение."

  - key: guide.milestone_payment
    slug: predi-plashtane-po-etap
    kind: guide
    category: buyer_journey
    buyer_stage: waiting_or_payment
    locale: bg
    title: "Преди плащане по етап"
    summary: "Преди следващата вноска виж какво точно изисква договорът, кой документ доказва етапа и дали си уведомен по уговорения начин."
    aliases: ["следващо плащане", "вноска по акт 14", "вноска по акт 15"]
    keywords: ["вноска", "падеж", "строителен етап", "уведомление", "доказателство"]
    related_stage_keys: [building.act14, building.act15, building.commissioning]
    related_document_keys: [document.act14, document.act15, document.commissioning, document.preliminary_contract]
    related_term_keys: [term.rough_construction, term.construction_papers, term.construction_category]
    source_ids: [obligations_contracts, ordinance_3, zut]
    source_checked_at: "2026-09-05"
    content_version: 2
    editorial_status: published
    professional_review_status: pending
    sections:
      understand: |-
        Строителният документ и платежното задължение са различни въпроси. Документът има нормативна функция и конкретен обхват, докато сумата, падежът и процедурата за уведомяване идват от твоя договор. Едно и също пазарно название може да е дефинирано различно в различни договори.

        Започни от клаузата, а не от съобщението „достигнахме етапа“. Установи как договорът нарича събитието, кой трябва да го удостовери и дали е достатъчно издаване, подписване, предоставяне на копие или изтичане на определен срок.
      verify: |-
        Сравни номера и датата на документа, строежа, разрешението за строеж, блока, входа, етапа и участниците. Документ за друг подобект или инфраструктурна връзка може да е истински, но да не доказва условието за твоето плащане.

        Провери дали са спазени договореният начин на уведомяване и срокът за преглед или възражение. Ако документът съдържа забележки, приложения или непълни подписи, поискай пълното копие и професионален преглед, преди да прецениш значението им.
      documents: |-
        Събери подписания договор и анекси, уведомлението за плащане, документа за етапа с приложенията и всички по-ранни доказателства, към които клаузата препраща. Пази и кореспонденцията за промени в обхвата или срока.

        При Акт 14, Акт 15 или въвеждане в експлоатация прочети обяснението за съответния документ. Разговорното име не е достатъчно — важни са точният вид, предметът и ролята му в строителния процес.
      money: |-
        Пресметни сумата по договорната формула и сравни валутата, данъчното третиране, вече платеното и банковата сметка. Не използвай фактура или покана като единствено доказателство, че условието е настъпило; те трябва да съответстват на договора и приложимото доказателство.

        Ако плащаш с кредит, потвърди срока за усвояване и изискванията на банката. Договорният падеж не се променя, освен ако в договора изрично не е предвидено друго.
      risks: |-
        Сигнали за внимание са само извадка от документ, липсващи приложения, различен блок, общо съобщение до всички купувачи, нова сметка без надеждно потвърждение и натиск за плащане преди разумен преглед. Публичен запис със сходно заглавие не доказва сам по себе си договорното условие.

        Не отлагай реакция при несъответствие. Договорът може да съдържа срокове и процедури, които трябва да бъдат следвани, дори когато още събираш техническа информация.
      professionals: |-
        Адвокатът сравнява искането с клаузата, процедурата и правата ти при спор. Инженер, архитект или строителен специалист може да оцени документа, приложенията и физическия обхват. Кредиторът потвърждава собствените си изисквания за усвояване.

        Изпрати целия пакет, а не само снимка на първата страница. Професионалното мнение трябва да е свързано с конкретния договор и обект.
      act: |-
        Направи кратка съпоставка в четири колони: какво изисква договорът, какво е получено, какво съвпада и какво остава неясно. Изпрати конкретни писмени въпроси и пази отговора с останалите доказателства.

        Плати само по потвърдения механизъм и съхрани платежния документ. Ако има спор, следвай професионалния съвет и договорната процедура, вместо да импровизираш със задържане или частично плащане.
      next: |-
        След плащането добави документа, уведомлението и платежното доказателство към досието и обнови календара. Отбележи кое е следващото договорно събитие, но не приемай, че строителството ще напредва по фиксиран график.

        Когато следва нотариално прехвърляне или въвеждане в експлоатация, премини към съответната насока и обнови правните и документалните проверки.
      buyer_checks:
        - "Прочети точната платежна клауза и всички определения, към които тя препраща."
        - "Съпостави документа с разрешението, блока, входа, фазата и предмета на договора."
        - "Провери уведомяването, срока, получателя, сметката, сумата и валутата."
        - "Изискай пълното доказателство с подписи, приложения и забележки, когато са приложими."
        - "Запази професионалния преглед, кореспонденцията и платежното доказателство в досието."

  - key: guide.before_transfer
    slug: predi-notarialna-sdelka
    kind: guide
    category: buyer_journey
    buyer_stage: before_notarial_transfer
    locale: bg
    title: "Преди нотариалната сделка"
    summary: "Направи актуални проверки на собствеността, тежестите, имота и представителството. Уточни и начина на плащане и предаване."
    aliases: ["преди нотариус", "преди сделка", "нотариално прехвърляне"]
    keywords: ["нотариален акт", "тежести", "данъчна оценка", "собственост", "плащане"]
    related_stage_keys: [building.commissioning, building.handover]
    related_document_keys: [document.title_deed, document.encumbrance_certificate, document.cadastral_sketch_scheme, document.tax_assessment, document.family_status_certificate]
    related_term_keys: [term.encumbrance, term.marital_community, term.possession_ownership, term.property_record]
