    position: 7
    title: "Въвеждане в експлоатация"
    summary: "Крайният режим зависи от категорията: разрешение за ползване или удостоверение за въвеждане в експлоатация. Разговорното „Акт 16“ може да прикрива важни разлики."
    aliases: ["акт16", "акт 16", "разрешение за ползване", "удостоверение за въвеждане в експлоатация"]
    related_stage_keys: [building.act15, building.handover]
    related_document_keys: [document.commissioning]
    related_term_keys: []
    source_ids: [zut, dnsk_commissioning, ministry_act15_16]
    source_checked_at: "2026-09-04"
    content_version: 2
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      concise_answer: "Финалният документ не винаги се нарича „Акт 16“. За строежи от първа до трета категория ДНСК издава разрешение за ползване след процедура с ДПК; за четвърта и пета категория компетентният орган издава удостоверение за въвеждане в експлоатация."
      key_points:
        - "Провери категорията, издателя и вида на крайния документ."
        - "Обхватът може да е част, етап, блок или отделен инфраструктурен обект."
        - "Въвеждането, нотариалното прехвърляне и предаването на ключове са различни събития."
      physical: |-
        За финалната процедура строежът трябва да е завършен в приложимия обхват и да са извършени необходимите проверки и изпитвания. Това включва не само жилищата, а и общите части, съоръженията и условията за безопасно ползване според одобрения проект.

        След крайния акт все още могат да останат индивидуални довършителни работи, настройки или отстраняване на дефекти. Административното разрешаване на ползването не е техническа гаранция, че конкретният апартамент е предаден без забележки.
      documents: |-
        Разговорното „Акт 16“ може да сочи различни неща. Протокол образец 16 е част от процедурата с държавна приемателна комисия при приложимия режим, но крайният административен резултат е разрешение за ползване. За други категории се издава удостоверение за въвеждане в експлоатация от компетентния орган.

        Затова провери не само заглавието, а категорията на строежа, издателя, номера, датата и точния предмет. Документът може да обхваща отделен блок, етап, вход, подобект или инфраструктура, а не целия комплекс.
      importance: |-
        Това е ключовата документална граница за законното ползване по приложимия режим. При конкретна покупка тя може да е важна за сделката, кредита, предаването или плащане, но ефектът върху тези отношения идва от закона и конкретните договори, а не от универсална схема.

        Купувачът трябва да потвърди, че точният имот се намира в въведения обхват. Същият парцел може да съдържа няколко сгради и фази, а разрешение за трафопост или външна връзка не въвежда жилищния блок.
      not_meaning: |-
        Крайният документ не доказва самостоятелно кой е собственикът на апартамента, че продавачът може да го прехвърли или че няма ипотеки, възбрани и други вписвания. Тези въпроси изискват отделна правна и регистърна проверка.

        Той не гарантира качество без дефекти, не удостоверява предадени ключове, платени сметки, открити индивидуални партиди или организирано управление на етажната собственост. Не заличава и договорни спорове за срокове и спецификация.
      discover: |-
        Установи кой е точният финален документ: разрешение за ползване или удостоверение за въвеждане в експлоатация, кой го е издал и въз основа на коя процедура. Сравни строителната категория, разрешението за строеж и описанието на въведения обект.

        Провери дали твоят блок, вход, етап и предназначение са включени. Ако документът е намерен чрез търсене по парцел, не приемай автоматично, че се отнася до всяка сграда върху него.
      verify:
        - "Сравни номера, датата, издателя, категорията, разрешението за строеж и пълното описание на въведения строеж."
        - "Установи дали документът е окончателен и в сила и дали има ограничение до част, етап, блок или конкретно предназначение."
        - "Отдели жилищната сграда от трафопост, улица, мрежи, гаражна сграда или съседен блок на същия парцел."
        - "Съпостави документа с кадастралната схема и титула, без да приемаш, че който и да е от тях самостоятелно гарантира собственост."
        - "Провери собствеността, тежестите, договора, техническото състояние и условията за предаване като отделни линии."
      helpers: |-
        ДНСК или органът, издал разрешението за строеж, има компетентност според категорията и режима. От него или от официалната преписка се потвърждават видът и обхватът на административния акт.

        Адвокат проверява правното значение за сделката, собствеността и тежестите. Инженерът оценява техническото състояние, а кредиторът има собствени изисквания; одобрението от един участник не заменя проверките на останалите.
      next: |-
        Следват конкретното предаване на имота, описването и отстраняването на дефекти, предаването на документация и гаранции и организирането на общите части. Датата на въвеждане не е непременно датата на нотариалната сделка или получаването на ключове.

        Планирай ранните отговорности: партиди, застраховане, управление на етажната собственост, поддръжка и проследяване на гаранционни въпроси.
    actions_by_buyer_stage:
      researching: "Провери какво точно означава използваният в обявата израз „Акт 16“ и към кой блок се отнася."
      before_deposit: "Дори при въведена сграда поискай по-ранните ключови книжа и провери собствеността и тежестите отделно."
      before_notarial_transfer: "Поискай копие от приложимия краен документ и сравни обхвата му с имота и договора преди сделката."
      owner: "Съхрани документацията, гаранционните контакти и протоколите за дефекти; въвеждането не приключва всички практически въпроси."
      default: "Провери вида, издателя и точния предмет на документа."

  - key: building.handover
    slug: predavane-poddrazhka
    kind: stage
    locale: bg
    position: 8
    title: "Предаване на имота и поддръжка"
    summary: "Фактическото предаване урежда ключове, състояние, показания и забележки; ранната собственост носи отделни договорни и общностни отговорности."
    aliases: ["предаване", "ключове", "поддръжка", "дефекти"]
    related_stage_keys: [building.commissioning]
    related_document_keys: [document.handover_protocol, document.title_deed]
    related_term_keys: [term.ideal_shares, term.garage_parking]
    source_ids: [obligations_contracts, property_law]
    source_checked_at: "2026-09-04"
    content_version: 2
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      concise_answer: "Предаването е практическо и доказателствено събитие: описваш какво получаваш, кога, с какви ключове, показания, документи и дефекти. То не е автоматично равнозначно на нотариалната сделка или въвеждането в експлоатация."
      key_points:
        - "Огледай подробно и записвай дефектите конкретно."
        - "Раздели собственост, владение, ползване и договорна поддръжка."
        - "Поискай правила, контакти, гаранции и документи за общите части."
      physical: |-
        Огледът обхваща не само настилки и стени, а дограма, врати, санитарни точки, електрически изводи, отопление и вентилация, тераси, складове, гараж или паркомясто и достъп до общите части. Сравнява се реалното състояние с договорената спецификация и приложенията.

        Някои проблеми се виждат веднага, а други изискват измерване, проба или време. Затова огледът трябва да е организиран, с достатъчно осветление и достъп, а не бързо подписване при получаване на ключовете.
      documents: |-
        Приемо-предавателният протокол описва датата, страните, предадените обекти и принадлежности, ключове, дистанционни, уреди, показания и установени забележки. Към него могат да се приложат снимки, списък със срокове и начин за потвърждаване на отстраняването.

        Поискай гаранционни документи, инструкции, контакти за сигнали, документи за оборудване и информация за общите части и поддръжката. Отделно се пазят нотариалният акт, крайният административен документ и документите за партиди и управление.
      importance: |-
        Добре описаното начално състояние намалява спора кое е било налице при предаването и кой е поел конкретно задължение. Формулировка като „прието без забележки“ може да бъде проблемна, ако не отразява действителния оглед.

        Предаването често активира практически разходи и отговорности. Изясни от коя дата се начислява поддръжка, кой носи риска, как се подават гаранционни сигнали и кой управлява общите части.
      not_meaning: |-
        Протоколът за ключовете не замества нотариалния акт и не доказва собственост или липса на тежести. Той не е и разрешение за ползване или удостоверение за въвеждане в експлоатация.

        Подписването не означава, че трябва да се откажеш от точно описване на видимите дефекти. Обратно, записан дефект не означава автоматично конкретен срок или обезщетение — прегледай договора, гаранционните условия и приложимите правила.
      discover: |-
        Уточни кой ще присъства, колко време е предвидено и дали имаш право да доведеш независим технически специалист. Подготви договорната спецификация, плановете и предходната кореспонденция за сравнение на място.

        Разбери как се регистрира дефект, кой потвърждава отстраняването и какви разходи започват от коя дата. Поискай ясно разделение между ангажиментите на продавача, строителя, поддръжката и етажната собственост.
      verify:
        - "Направи измерим списък със снимка, точно местоположение, описание и договорен срок за всеки установен дефект."
        - "Сравни площите, разпределението, принадлежностите, степента на завършеност и материалите с договора и приложенията."
        - "Запиши броя ключове и дистанционни, серийните номера на уреди и показанията на всички достъпни измервателни устройства."
        - "Поискай гаранционните условия, контакти и процедура за сигнали, както и наличната документация за общите части и оборудването."
        - "Уточни началната дата и основанието за такси, партиди, застраховане, достъп и поддръжка."
      helpers: |-
        Независим технически специалист помага за систематичния оглед и за описване на дефектите без неясни формулировки. Специалист по конкретна инсталация може да е необходим при съмнение, което не се оценява визуално.

        Адвокатът преглежда клаузите, протокола и последиците от забележките. Продавачът или инвеститорът, строителят, фирмата за поддръжка и управлението на сградата могат да имат различни задължения — поискай конкретен отговорник за всяка тема.
      next: |-
        Следи отстраняването на записаните дефекти с дати и доказателства за повторна проверка. Подреди гаранциите, протоколите и кореспонденцията така, че да можеш да проследиш всяко обещание.

        Организирай партидите, застраховането, участието в етажната собственост и текущата поддръжка. Покупката не приключва с ключовете; започва управлението на реален имот и общи части.
    actions_by_buyer_stage:
      before_handover: "Подготви шаблон, независим оглед и доказуем начин за проследяване на дефектите."
      owner: "Подреди гаранциите, протоколите, партидите и решенията за общите части."
      default: "Уточни кога и при какъв протокол се предават владението, ключовете и документацията."
