    professional_reviewer:
    professionally_reviewed_at:
    sections:
      concise_answer: "След конструкцията започва дълъг набор от паралелни работи. Физическата готовност може да изглежда напреднала, но трябва да остане отделена от проверените административни етапи."
      key_points:
        - "Различни дейности могат да вървят едновременно и в различен ред."
        - "Ток, вода, канал, улица и достъп имат отделни участници и документи."
        - "Снимка на готова фасада не доказва въвеждане в експлоатация."
      physical: |-
        След конструкцията започват много успоредни работи: зидарии и преградни стени, покривни и фасадни слоеве, дограма, електро-, ВиК-, отоплителни, вентилационни и други инсталации. Отделно напредват асансьори, стълбища, коридори, гаражи, двор и достъп.

        Различните блокове и части могат да бъдат на различна степен на готовност. Видимо завършена фасада може да съжителства с незавършени общи части или неизпитани инсталации, а работите в конкретния апартамент не показват състоянието на целия строеж.
      documents: |-
        През този период се съставят различни актове и протоколи за скрити работи, проби, изпитвания и приемане на отделни инсталации. Част от информацията остава в строителните книжа и не е налична като удобна публична справка.

        Външните връзки за ток, вода, канал, топлоснабдяване, улица или друг достъп могат да имат отделни възложители, разрешения и срокове. Документ за инфраструктурен елемент не доказва автоматично напредъка или въвеждането в експлоатация на жилищната сграда.
      importance: |-
        Тук обещаното качество започва да става видимо. Договорената степен на завършеност трябва да описва не само настилки и стени в апартамента, а и общите части, инсталациите, фасадата, паркирането и прилежащата среда.

        Неясни изрази като „до ключ“ или „луксозни общи части“ имат ограничена стойност без спецификация. Разликите могат да се превърнат в допълнителен разход, забавяне или спор при предаването.
      not_meaning: |-
        Завършена фасада, монтирана дограма, светещи лампи или временно електрозахранване не означават автоматично Акт 15 или разрешено ползване. Физическата готовност и административната процедура остават отделни.

        Липсата на един публичен документ за дадена работа не доказва, че тя не е извършена. Същевременно снимките, огледът и уверението на продавача не заменят протоколите и изпитванията, когато те са важни за конкретно решение.
      discover: |-
        Изясни какво точно ще бъде изпълнено в жилището, общите части и външната среда и кой поема разхода за останалото. Сравни описанието в договора, техническата спецификация и актуалното състояние на място.

        Попитай кои присъединявания са постоянни, кои процедури още не са приключили и дали отделна инфраструктура обслужва повече от една фаза. Не превръщай обещан срок в установен факт без документиран статус.
      verify:
        - "Сравни техническата спецификация, проектните решения и видимото изпълнение за жилището, общите части и паркирането."
        - "Запиши кои работи са завършени, кои са в ход и кои не могат да бъдат оценени само с визуален оглед."
        - "Попитай кои присъединявания са постоянни, кои процедури още не са приключили и кой е страна по тях."
        - "Разграничи документите за жилищната сграда от разрешенията и протоколите за трафопост, улица, водопровод или друга инфраструктура."
        - "Провери как договорът описва допустимите промени, качеството, срока за отстраняване на дефекти и доказването на етапа."
      helpers: |-
        Независим строителен инженер или специалист по съответната инсталация може да оцени видимото изпълнение и да посочи какво изисква отделно изпитване. Операторите и компетентните органи потвърждават само процедурите в своя обхват.

        Адвокатът сравнява договорената спецификация, срокове и средства за защита. Техническото и правното четене трябва да се срещнат, особено когато плащане е свързано с общо описан физически етап.
      next: |-
        С наближаване на завършването участниците събират резултатите от приложимите проби, протоколи и строителни книжа и подготвят приемането на строежа. Това води към Акт 15, но не всяка отделна работа приключва в една и съща дата.

        Преди да приемеш, че Акт 15 предстои непосредствено, провери кои работи и документи остават и дали се отнасят до точната фаза на твоя обект.
    actions_by_buyer_stage:
      before_preliminary_contract: "Запиши точната степен на завършеност и приложенията, вместо да разчиташ на рекламни формулировки."
      before_handover: "Подготви подробен оглед и приемо-предавателен протокол; не смесвай това с административното въвеждане в експлоатация."
      default: "Поискай актуална, датирана спецификация и статус на присъединяванията."

