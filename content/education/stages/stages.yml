entries:
  - key: building.land_planning
    slug: zemya-planirane-proekt
    kind: stage
    locale: bg
    position: 1
    title: "Терен, планиране и проект"
    summary: "Преди строителството се изясняват правата върху терена, устройствените правила и проектното решение."
    aliases: ["проект", "терен", "планиране"]
    related_stage_keys: [building.authorization]
    related_document_keys: [document.design_visa, document.pup]
    related_term_keys: [term.upi, term.right_to_build]
    source_ids: [zut, nag]
    source_checked_at: "2026-09-04"
    content_version: 2
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      concise_answer: >-
        Това е подготвителният слой: кой има право да строи, какво допуска действащият план и как проектът превръща тези условия в конкретна сграда. Нито една отделна справка не отговаря сама на всички въпроси.
      key_points:
        - "Поземленият имот и УПИ не винаги имат еднакви граници и означения."
        - "Визата за проектиране не е разрешение за строеж."
        - "Правото върху терена и правото да се строи трябва да се разглеждат отделно."
      physical: |-
        Преди изкопа има работа, която почти не се вижда от улицата: геодезическо заснемане, проучвания на терена, изходни данни, задания и разработване на проектните части. Архитектурното решение се координира с конструкция, инсталации, достъп, пожарна безопасност и другите изисквания за конкретния строеж.

        В този период рекламната визуализация може да се променя, защото не всяко показано решение е непременно част от окончателно одобрен проект. Липсата на физическа дейност не означава непременно липса на подготовка, а ограда или разчистване на терена сами по себе си не доказват разрешен строеж.
      documents: |-
        Устройствената основа може да включва действащ ПУП и виза за проектиране. Отделно се проверяват документите за правата върху земята или учреденото право на строеж и по-късно одобрените инвестиционни проекти. Всеки от тези документи отговаря на различен въпрос.

        Съпоставяй кадастралния ПИ с урегулирания имот, квартала, предназначението и режима на застрояване. Ако проектът е на етапи, установи кой документ се отнася до конкретната фаза и дали достъпът, паркирането или външните връзки са част от същия обхват.
      importance: |-
        Тук се задава рамката на бъдещото предложение: какво може да се построи, как ще се осигури достъп, кои ограничения важат и на какво право възложителят основава строителството. Несъответствие в терена, фазата или проектната версия може да означава, че красивото разпределение от офертата не е това, което е одобрено.

        За купувача е важно да знае и какво още не е решено. Ранният проект носи повече неизвестности; те трябва да бъдат отразени в начина, по който сравняваш офертата, преглеждаш договора и планираш срокове и разходи.
      not_meaning: |-
        Одобрен ПУП или издадена виза не е разрешение за строеж. Не доказва, че строителството може да започне незабавно, че финалният проект е одобрен или че показаният апартамент ще бъде изпълнен точно както е визуализиран.

        Документът за земята не доказва автоматично правата върху бъдещия обект, а кадастралната карта не е гаранция за собственост и липса на тежести. Нито един от тези ранни документи не създава универсален срок за завършване.
      discover: |-
        Установи коя е точната площадка на проекта, кой е възложителят и на какво основание има право да строи. Поискай ясно разграничение между ПИ, УПИ, отделните фази и обекта, който ти се предлага.

        Разбери коя версия на проекта виждаш и кои части вече са одобрени. Попитай как са решени достъпът, паркирането, общите части и външните връзки, вместо да ги приемаш от рекламната схема.
      verify:
        - "Съпостави ПИ, УПИ, адрес, квартал, граници и предназначение; отбележи всяко различие, което трябва да бъде обяснено."
        - "Поискай документите, от които следват собствеността върху терена или правото на строеж, и ги прегледай с независим адвокат."
        - "Установи дали предложението е за точна фаза, блок и бъдещ обект, а не само за търговско име на комплекса."
        - "Сравни рекламното разпределение и спецификация с актуалната проектна версия и запази версията, която ще бъде приложение към договора."
        - "Попитай кои елементи — достъп, озеленяване, паркиране и връзки — са в същия проект и кои зависят от отделни процедури."
      helpers: |-
        Архитект или инженер може да прочете устройствените показатели и проектните ограничения и да посочи разликата между идея, одобрена част и фактическо изпълнение. Геодезист е подходящ при въпроси за граници и идентичност на терена.

        Независим адвокат проверява вещните права и договорната рамка. Общината поддържа приложимите устройствени и строителни преписки, но административната справка не замества индивидуалната правна проверка.
      next: |-
        Следва разрешаването на конкретния строеж въз основа на одобрените книжа. Когато бъде представено разрешение, провери издателя, възложителя, имота, описанието, фазата и данните за влизане в сила.

        Не прескачай връзката между ранните документи и разрешението: едно и също рекламно име може да обхваща няколко самостоятелни разрешения или етапа.
    actions_by_buyer_stage:
      researching: "Сравни местоположението и устройствената рамка, без да приемаш визуализациите като одобрен проект."
      before_deposit: "Преди плащане поискай точната идентичност на терена, правото на строеж и проектната версия, към която се отнася офертата."
      default: "Увери се, че договорът и приложенията сочат същия проект, фаза и бъдещ обект."

  - key: building.authorization
    slug: razreshenie-za-stroezh
    kind: stage
    locale: bg
    position: 2
    title: "Разрешаване на строителството"
    summary: "Разрешението за строеж определя разрешения строеж, възложителя и одобрените книжа, но не доказва изпълнение."
    aliases: ["разрешение за строеж", "строително разрешение"]
    related_stage_keys: [building.land_planning, building.commencement]
    related_document_keys: [document.building_permit]
    related_term_keys: [term.right_to_build]
    source_ids: [zut, nag]
    source_checked_at: "2026-09-04"
    content_version: 2
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      concise_answer: "Разрешението за строеж е административният акт, който допуска описания строеж при одобрените условия. Чети предмета, възложителя, имота, фазата и датите — не само номера."
      key_points:
        - "Провери дали разрешението е влязло в сила и дали има последващи изменения."
        - "Един документ може да обхваща само фаза, блок или инфраструктурен елемент."
        - "Издаването му не доказва, че строителството е започнало или завършило."
      physical: |-
        Разрешението създава административната възможност да бъде изпълнен описаният строеж, но на терена може още да няма съществена работа. Предстоят организация на площадката, определяне на участниците и изпълнение на изискванията за законосъобразно начало.

        Видимото разчистване, ограждане или доставка на техника не показва само по себе си дали строежът е започнал по приложимия ред. Също така датата на разрешението не позволява да се изчисли текущият физически напредък.
      documents: |-
        Преглеждат се разрешението за строеж и одобрените инвестиционни проекти, както и данните за влизане в сила. Ако има допълване, изменение, презаверяване или промяна на участници и обхват, тези последващи актове са част от картината.

        Заглавието „разрешение за строеж“ не е достатъчно. Документът може да е за конкретна сграда, блок, етап, подземна част или инфраструктура. Провери дали жилището от офертата действително попада в описания строеж.
      importance: |-
        Разрешението задава правната и проектната идентичност на разрешения строеж. Разлика във възложител, УПИ, блок, фаза, предназначение или номер на проекта може да направи документа неприложим към имота, който разглеждаш.

        При покупка на ранен етап този документ е отправна точка за договора и приложенията. Той помага да зададеш точни въпроси, но трябва да бъде свързан с правата на продавача, проектната спецификация и условията за плащане.
      not_meaning: |-
        Разрешението не доказва, че продавачът притежава обещания бъдещ обект или че няма тежести върху земята и правото на строеж. Не удостоверява, че строителството вече е започнало или че изпълненото съответства на проекта.

        То не е доказателство за груб строеж, Акт 14, Акт 15 или въвеждане в експлоатация. Нито датата, нито изтекъл период от нея позволяват надеждно да се предполага завършване.
      discover: |-
        Установи кой е възложителят, как е описан строежът и кои проектни части са одобрени. Проследи връзката с точния УПИ/ПИ и с блока или фазата, където се намира бъдещият обект.

        Попитай има ли последващи заповеди или изменения и как се отразяват на разпределението, площта, предназначението, общите части и сроковете, описани в офертата и договора.
      verify:
        - "Сравни възложителя, УПИ/ПИ, адреса, описанието на строежа, блока, етапа и строителната категория."
        - "Поискай проверими данни за влизане в сила и списък на всички последващи допълнения, изменения или презаверявания."
        - "Свържи номера и датата с проектната версия, която описва конкретния апартамент и ще бъде приложена към договора."
        - "Провери кои са строителят, проектантите и лицето, упражняващо строителен надзор, без да смесваш отговорностите им."
        - "Ако документът е намерен по кадастрален идентификатор, прочети самия обхват; съвпадението при търсене не доказва само по себе си приложимост."
      helpers: |-
        Издаващият орган и общината поддържат административната преписка. Архитект или инженер може да сравни разрешението с проектните части и да разпознае промени в техническия обхват.

        Независим адвокат проследява правата на възложителя и продавача и връзката между разрешения строеж и договора. Нито брокерът, нито служителят на инвеститора замества тази независима проверка.
      next: |-
        Следва законосъобразното откриване на строителната площадка и определяне на строителна линия и ниво, когато това е приложимо. Този момент има собствен документален контекст и не се извежда само от наличието на разрешение.

        После започват изкопът, укрепването и основите. Следи строителната и документалната линия отделно, защото те могат да напредват с различно темпо.
    actions_by_buyer_stage:
      researching: "Провери дали има разрешение за точния проект и не извеждай текущ физически напредък само от датата му."
      before_preliminary_contract: "Нека разрешението и измененията бъдат идентифицирани в приложенията или проверени преди подписване."
      default: "Сравни разрешения обхват с предмета на твоя договор."

  - key: building.commencement
    slug: otkrivane-stroitelna-ploshtadka
    kind: stage
    locale: bg
    position: 3
    title: "Начало на строежа и основи"
    summary: "Строителната площадка, линия и ниво поставят контролираното начало; физическите основи следват проект и строителни книжа."
    aliases: ["акт 2", "строителна линия", "откриване площадка", "основи"]
    related_stage_keys: [building.authorization, building.act14]
    related_document_keys: [document.site_opening]
    related_term_keys: []
    source_ids: [zut, ordinance_3]
    source_checked_at: "2026-09-04"
    content_version: 2
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      concise_answer: "Тук административната подготовка преминава в реално строителство. Протоколът за откриване на площадката и определяне на линия и ниво има конкретна роля и не е общ сертификат за напредък."
      key_points:
        - "Протоколът е свързан с точния строеж и разрешение."
        - "Изкопът и основите са физически дейности, различни от документалното начало."
        - "Напредъкът не следва автоматично от изминалото време."
      physical: |-
        Площадката се организира, сградата се трасира спрямо определените линии и нива и започват земните работи. В зависимост от терена могат да се изпълняват укрепване, отводняване, изкоп, подложни пластове, фундаменти и подземни части.

        Част от работите скоро стават невидими под следващите слоеве. Затова строителният процес използва специализирани актове и протоколи за скрити работи и контролирани нива; посетителят на обекта не може да ги замени само със снимка.
      documents: |-
        Протоколът за откриване на строителната площадка и определяне на строителна линия и ниво свързва началото с конкретното разрешение и строеж. Заповедната книга и последващите приложими актове документират отделни обстоятелства по изпълнението.

        Не всяко вътрешно или подготвително действие изисква един и същ формуляр, а публичната наличност на тези документи е различна. За купувача е разумно да поиска документите от възложителя или продавача и да провери как са описани в договора.
      importance: |-
        Точното позициониране и изпълнението на основите влияят върху целия строеж. Документалното начало помага да се проследи кое разрешение се изпълнява и кога, но трябва да се отнася до правилния блок или фаза.

        Ако договорът свързва плащане със „започване на строителството“, провери как е дефинирано това понятие. Маркетингово съобщение, първа копка и приложимият строителен протокол могат да бъдат различни събития.
      not_meaning: |-
        Откриването на площадката не означава, че конструкцията е приета, че сградата е достигнала груб строеж или че конкретният апартамент вече съществува като самостоятелен кадастрален обект.

        То не потвърждава бъдещ срок за Акт 14 или въвеждане в експлоатация и не поражда универсално плащане. Липсата на намерен публичен протокол също не доказва, че строежът не е започнал.
      discover: |-
        Установи кое точно събитие е настъпило: открита площадка, определени линия и ниво, започнал изкоп или изпълнени основи. После провери как това събитие е свързано с разрешението и фазата на твоя имот.

        Ако договорът използва този етап, прочети кой документ трябва да бъде представен, кой уведомява купувача и има ли срок или право на проверка преди следващо действие.
      verify:
        - "Сравни номера на разрешението, възложителя, описанието на строежа и фазата в протокола."
        - "Провери датата и обхвата на откриването, без да приемаш, че документ за една сграда обхваща целия комплекс."
        - "Попитай кой упражнява строителен надзор, кой води заповедната книга и къде се пазят приложимите строителни книжа."
        - "При оглед различавай видимата работа от удостовереното събитие и отбелязвай какво не може да се види след закриването му."
        - "Ако има плащане, прочети точната договорна клауза и поискай именно доказателството, посочено в нея."
      helpers: |-
        Строителният надзор и техническият ръководител имат роли в строителния процес и документацията. Независим инженер може да обясни видимите работи и какво обичайно следва да бъде документирано.

        Адвокатът преглежда договорното значение на събитието и дали представеното доказателство съответства на клаузата. Не очаквай техническият специалист да даде правен извод или адвокатът да приеме качеството на основите.
      next: |-
        Носещата конструкция се изгражда поетапно от подземната част към плочите, вертикалните елементи и покривната конструкция. Видимият ръст на сградата не е сам по себе си приемане на конструкцията.

        Следващата основна документална граница е Акт 14 за конкретния строеж или етап. Когато я разглеждаш, продължи да съпоставяш разрешение, обхват и участници.
    actions_by_buyer_stage:
      waiting_or_payment: "Провери твоя договор: Mesto не може да заключи, че дължиш плащане само от намерен протокол."
      default: "Поискай документалната връзка между разрешението, площадката и точната фаза."

  - key: building.act14
    slug: akt-14
    kind: stage
    locale: bg
    position: 4
    title: "Конструкцията и Акт 14"
    summary: "Акт образец 14 приема носещата конструкция; понятието „груб строеж“ има отделен правен и фактически контекст."
    aliases: ["акт14", "акт 14", "груб строеж", "конструкция"]
    related_stage_keys: [building.commencement, building.installations]
    related_document_keys: [document.act14]
    related_term_keys: [term.rough_construction]
    source_ids: [zut, ordinance_3, dnsk_qa]
    source_checked_at: "2026-09-04"
    content_version: 2
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      concise_answer: "Акт 14 е актът за приемане на конструкцията. Той е важна документална граница, но не е финално приемане на сградата и не бива автоматично да се приравнява на всяко доказателство за „груб строеж“."
      key_points:
        - "Отнася се до носещата конструкция и конкретния строеж."
        - "Груб строеж, кадастрално нанасяне и Акт 14 са свързани, но не са един и същ документ."
        - "Инсталации, фасади, общи части и присъединявания може да предстоят."
      physical: |-
        До този момент носещата система на строежа е изпълнена в обхвата, който се приема: фундаменти, вертикални носещи елементи, плочи, стълбищни рамена и предвидената покривна конструкция. Това е конструктивен, а не довършителен етап. Апартаментът може още да няма замазки, мазилки, завършени инсталации, фасада, асансьор или използваеми общи части.

        Външният вид не е достатъчен, за да се установи приемането на конструкцията. Две сгради могат да изглеждат еднакво напреднали, но документите им да се отнасят до различни блокове, секции или етапи. Обратно, след съставянето на акта на площадката може да са извършени допълнителни работи, които самият акт не описва като текущо физическо състояние.
      documents: |-
        Централният документ е акт образец 14 за приемане на конструкцията. Той трябва да се чете заедно с разрешението за строеж, одобрената конструктивна част, заповедите за изменения и останалите приложими строителни книжа. Важни са точният строеж, участниците, датата и дали актът обхваща цялата сграда или само отделен етап.

        „Акт 14“, установяването на „груб строеж“ и нанасянето на сградата или бъдещия обект в кадастъра са свързани теми, но не са взаимозаменяеми удостоверявания. Ако договорът или предстоящата сделка изисква конкретно доказателство за груб строеж, поискай точно него, вместо да приемаш, че всяка препратка към Акт 14 е достатъчна.
      importance: |-
        Етапът често е използван в оферти, предварителни договори и схеми за плащане, защото бележи съществен напредък на строежа. Това обаче не създава универсално задължение за плащане и не определя автоматично дали вече може да бъде прехвърлен конкретният обект. Отговорът зависи от текста на договора, предмета на сделката и приложимите вещноправни предпоставки.

        За купувача практичният въпрос е не само „има ли Акт 14“, а „за кой точно строеж е актът и какво следва от него за моя конкретен договор“. Проверявай дали блокът, входът, фазата и описанието съответстват на обещания имот и дали последващи изменения не са променили проекта.
      not_meaning: |-
        Акт 14 не означава готово за обитаване жилище. Той не потвърждава завършени инсталации, фасада, общи части, присъединяване към мрежите, успешни изпитвания или отстранени дефекти. Не е Акт 15 и не е разрешение за ползване или удостоверение за въвеждане в експлоатация.

        Наличието му не доказва кой притежава земята или бъдещия обект, че продавачът има право да го прехвърли, че няма тежести или че договорните срокове са изпълнени. Не приемай и обратното: ако Mesto не е намерило акта в проверен публичен източник, това не доказва, че документът не съществува.
      discover: |-
        Започни с обхвата. Разбери дали е приета конструкцията на целия строеж, на конкретен блок, секция или етап и дали точно там се намира обектът от офертата. После свържи документа с разрешението за строеж и актуалната проектна версия.

        Ако Акт 14 е посочен като условие за плащане или сделка, установи как договорът дефинира настъпването на етапа, кой трябва да те уведоми и какъв документ трябва да получиш. Общото търговско название не замества конкретната клауза.
      verify:
        - "Поискай копие или проверима препратка и сравни номера, датата, строежа, блока/секцията и разрешението за строеж."
        - "Провери кои участници са подписали документа и дали има отбелязани забележки, ограничен обхват или последващи изменения."
        - "Ако е нужно за сделката, поискай отделното приложимо доказателство за завършен груб строеж и не го замествай само с рекламно твърдение."
        - "Съпостави схемата и описанието на бъдещия обект с актуалната проектна документация; кадастралното нанасяне само по себе си не доказва собственост."
        - "Прочети точната договорна клауза за плащане или прехвърляне заедно с независим адвокат, преди да приемеш, че условието е настъпило."
      helpers: |-
        Конструктор или строителен инженер може да обясни какъв технически обхват е приет и дали описанието съответства на проектната документация. Строителният надзор може да насочи към строителните книжа, но не замества независимия съветник на купувача.

        Адвокатът преглежда вещните права, договора и значението на етапа за конкретно плащане или прехвърляне. Нотариусът има собствена роля при нотариалното производство; предварителната индивидуална проверка не бива да се оставя едва за деня на сделката.
      next: |-
        Обичайно следват ограждащи елементи, фасади, инсталации, асансьори, общи части, довършване и външни връзки. Тези работи могат да се припокриват и да напредват различно по входове или блокове.

        Следващата голяма документална граница е подготовката за приемане с Акт 15, но между двата акта няма един универсален публичен документ, който да показва процент готовност. Продължи да разделяш наблюдавания физически напредък от документално удостоверените събития.
    actions_by_buyer_stage:
      researching: "Използвай етапа като ориентир за въпросите си, не като доказателство, че конкретен имот е готов за покупка."
      before_deposit: "Поискай копие или проверима препратка и установи точния обхват преди да свържеш капарото с този етап."
      waiting_or_payment: "Провери точния текст на договора и документите, които той изисква. Не изчислявай плащане само по общото название „Акт 14“."
      default: "Съпостави акта с точния блок, фаза и бъдещ самостоятелен обект."

