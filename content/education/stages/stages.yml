        В акта могат да бъдат описани неизпълнени, недовършени или недобре изпълнени работи. Затова „има Акт 15“ не бива да се чете като „няма забележки“ или „всичко е готово за нанасяне“. Самият текст и приложенията са по-важни от краткото съобщение за етапа.
      documents: |-
        Централният документ е констативният акт образец 15. Той се свързва с разрешението за строеж, одобрените и екзекутивните проекти, актовете по време на строителството, резултатите от изпитвания и други документи, необходими за последващата процедура.

        Окончателният доклад на строителния надзор има отделна роля. Съставът на преписката и компетентният финален орган зависят от категорията и спецификата на строежа. Не приемай, че еднаквият търговски израз „Акт 16“ описва една и съща процедура за всеки проект.
      importance: |-
        Акт 15 е силна документална граница, защото показва, че строежът е представен за приемане между участниците и се подготвя финалната административна процедура. За купувача обаче решаващи остават обхватът, подписите, забележките и документите, които още трябва да бъдат представени.

        Ако договорът свързва плащане с Акт 15, провери дали условието е формулирано само като подписване, като предоставяне на копие, като липса на конкретни забележки или по друг начин. Mesto не може да изведе сума или падеж само от намерен запис.
      not_meaning: |-
        Акт 15 не е Протокол образец 16 и не е крайният административен акт за ползване. Не разрешава автоматично обитаване, не доказва, че всички външни връзки и общи части са в обещаното състояние и не гарантира, че финалният орган няма да поиска допълване.

        Той не прехвърля собственост, не предава ключове на купувача и не доказва липса на тежести. Нито съставянето му, нито публикация за него създава универсално договорно плащане.
      discover: |-
