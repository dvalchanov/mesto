      helpers: |-
        Строителният надзор, строителят, възложителят и проектантите имат различни роли в съставянето и техническото приемане. Независим инженер може да помогне на купувача да разбере забележките и реалното състояние.

        Адвокатът преглежда договорното значение и правата ти при непълно или спорно изпълнение. Компетентният орган провежда финалната процедура, но не проверява договора вместо купувача.
      next: |-
        Следва приложимата процедура за разрешение за ползване или удостоверение за въвеждане в експлоатация според категорията на строежа. За някои строежи част от процедурата включва държавна приемателна комисия и Протокол образец 16; за други финалният документ и орган са различни.

