entries:
  - key: document.reservation_agreement
    slug: dogovor-za-rezervatsiya-imot
    kind: document
    locale: bg
    category: agreements_finance
    title: "Договор за резервация на имот"
    summary: "Споразумение за временно спиране на имота от продажба срещу определена сума. В него трябва ясно да пише кога парите се връщат, приспадат или задържат."
    aliases: ["резервационен договор", "споразумение за резервация", "стоп капаро", "резервационна такса"]
    keywords: ["капаро", "депозит", "връщане", "срок", "брокер", "предварителен договор"]
    related_stage_keys: [building.land_planning, building.authorization, building.act14]
    related_document_keys: [document.brokerage_agreement, document.preliminary_contract, document.title_deed]
    related_term_keys: [term.deposit, term.off_plan, term.encumbrance]
    source_ids: [obligations_contracts, property_law]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: >-
        Договорът за резервация е частно споразумение, с което имотът обичайно се спира от активно предлагане за определен срок срещу платена сума и конкретни задължения. Няма едно задължително съдържание за всеки такъв договор, затова правата и задълженията зависят от точния текст.

        Сумата може да е платима на собственик, инвеститор или посредник и може да бъде наречена такса, депозит, капаро или задатък. Името не решава кога се връща, задържа или приспада.
      when: >-
        Появява се рано - преди пълната правна и техническа проверка и преди предварителния договор. Точно затова срокът трябва да позволява проверки, финансиране и преговори, вместо да превръща бързото плащане в натиск.
      who: >-
        Подписва се от лицето, което поема задължението да резервира, и от плащащия купувач. Провери дали това е собственикът, упълномощен представител, инвеститор или само брокер и дали има право да получи сумата и да обвърже продавача.
      why: >-
        Купувачът плаща, преди да е видял всички документи. Добре подготвеният договор дава достатъчно време за проверка и обяснява кога купувачът може да се откаже и да получи сумата обратно - например при проблем със собствеността, тежестите, кредита, проекта или договорните условия.
      establishes: >-
        Установява уговореното между страните: кой имот се резервира, за колко време, срещу каква сума, какви действия следват и при кои събития сумата се връща, приспада или задържа.
      not_establish: >-
        Не доказва собственост, чисти тежести, одобрен кредит, строителен етап или задължение за окончателна продажба извън ясно уговореното. Не е автоматично предварителен договор и платената сума не е автоматично законов задатък.
      compare: >-
        Провери страни и представителство, точна идентичност на имота, цена, получател и сметка, срок, проверки, проект на следващия договор, условия за кредит, връщане, задържане и приспадане, комисиона и решаване на спор.
      before_after: >-
        Преди подписване трябва да има поне базова проверка кой предлага имота и на какво основание. След резервацията следват договорените проверки и преговори; тя не трябва да замества подробния предварителен договор.
      payment: >-
        Самата резервация е свързана с плащане, затова платежното основание трябва да съвпада точно с договора. Изясни кой държи сумата, кога я превежда нататък и дали комисиона се удържа дори при несъстояла се сделка.
      availability: >-
        Mesto не получава, съхранява или тълкува частния договор за резервация. Наличието на публични данни за имота не означава, че клаузите са проверени или че сумата е защитена.
      where: >-
        Поискай проекта преди плащане от продавача, инвеститора или посредника. Не разчитай само на платежно нареждане или разписка; запази подписаната версия, приложенията и доказателството за плащане.
      professional_review: >-
        Адвокат е нужен преди невъзстановимо плащане, особено при ново строителство, неясен получател, кратки срокове, зависимост от кредит или автоматично препращане към неполучен предварителен договор.
      buyer_checks:
        - "Потвърди кой има право да резервира имота и да получи сумата."
        - "Опиши точния имот и цената, а не само номер от обявата."
        - "Запиши обективни основания и срок за връщане на сумата."
        - "Получи проекта на следващия договор преди необратимо плащане."

  - key: document.preliminary_contract
    slug: predvaritelen-dogovor
    kind: document
    locale: bg
    category: agreements_finance
    title: "Предварителен договор"
    summary: "Договорът, с който страните поемат ангажимент за бъдещата сделка. Той трябва ясно да уреди имота, цената, плащанията, сроковете и защитата на купувача."
    aliases: ["предварителен договор за покупко-продажба", "ПД", "договор на зелено", "договор за бъдещ имот"]
    keywords: ["цена", "плащания", "неустойка", "срок", "нотариален акт", "строителен етап"]
    related_stage_keys: [building.authorization, building.act14, building.act15, building.commissioning]
    related_document_keys: [document.reservation_agreement, document.title_deed, document.encumbrance_certificate, document.investment_project, document.handover_protocol]
    related_term_keys: [term.off_plan, term.deposit, term.bds_finish, term.property_areas, term.appurtenant_parts]
    source_ids: [obligations_contracts, property_law, registration_rules]
    source_checked_at: "2026-09-05"
    content_version: 2
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: >-
        С предварителния договор страните се задължават да сключат окончателна сделка при уговорените съществени условия. В него трябва ясно да е записано какво ще се прехвърли, на каква цена, кога и след представянето на какви доказателства.

        Особено при покупка „на зелено“ договорът носи много повече от обещание за нотариален акт: описва бъдещия обект, строителните характеристики, плащанията, допустимите промени, сроковете, предаването и последствията при неизпълнение.
      when: >-
        Подписва се след достатъчна проверка и преди окончателната нотариална сделка. Може да предхожда построяването и кадастралното нанасяне, което увеличава нуждата от точни проектни приложения и защита при промяна.
      who: >-
        Подписва се от бъдещите страни по окончателната сделка или надлежно упълномощени представители. Провери дали продавачът е собственик или носител на правото, дали дружеството се представлява правилно и дали всички необходими съпрузи или съсобственици участват.
      why: >-
        Това е документът, по който купувачът реално дължи големи плащания и може да търси изпълнение или обезщетение. Неясен предмет, едностранна промяна, слаб краен срок или символична отговорност на продавача могат да останат проблем до края на проекта.
      establishes: >-
        Установява задълженията, които страните действително са поели - имота и правата, цената, начина на плащане, срока за окончателния договор и всички допълнителни условия. Приложенията и анексите са част от уговореното.
      not_establish: >-
        Не прехвърля автоматично собственост, не е разрешение за строеж или ползване и не гарантира, че продавачът ще остане платежоспособен. Не доказва липса на тежести, фактическо достигане на етап или одобрение на кредита.
      compare: >-
        Провери страните, представителството и документите за собственост; поземления имот, правото на строеж и бъдещия обект; проекта, площите и принадлежностите; цената и ДДС; етапите и доказателствата; крайните срокове; промените; неустойките; тежестите; финансирането; нотариалната сделка; предаването; гаранциите и прекратяването.
      before_after: >-
        Преди него стоят резервацията и правната, техническата и финансова проверка. След подписването се следят само договорените събития и документи, а преди окончателната сделка се прави актуална проверка на собствеността и тежестите.
      payment: >-
        Това е основният източник на частния платежен график. Всеки етап трябва да има точна дефиниция, документ, обхват и процедура за уведомяване; пазарните думи „Акт 14“, „Акт 15“ и „Акт 16“ не са достатъчни без уточнение.
      availability: >-
        Mesto не получава, съхранява, тълкува или проследява частни договори и не изчислява падежи. Образователните страници помагат да зададеш въпроси, но не потвърждават твоята конкретна клауза.
      where: >-
        Получи проект и всички приложения достатъчно преди подписване от продавача или инвеститора. Съхранявай подписаните версии, анекси, уведомления и доказателства за всяко плащане и приемане.
      professional_review: >-
        Независим адвокат трябва да прегледа договора преди подписване и значимо плащане. Архитект или инженер проверява проектните и техническите приложения, а кредиторът трябва да потвърди отделно собствения си процес.
      buyer_checks:
        - "Индивидуализирай предмета чрез право, проект, обект, площи и принадлежности."
        - "Свържи всяко плащане с точен документ, обхват и процедура."
        - "Добави краен срок и работещи последици при забава или промяна."
        - "Уреди тежестите, финансирането, окончателната сделка и предаването отделно."

  - key: document.brokerage_agreement
    slug: dogovor-s-broker
    kind: document
    locale: bg
    category: agreements_finance
    title: "Договор с брокер или посредник"
    summary: "Урежда услугата на посредника, комисионата, момента на плащане и евентуалната изключителност. Имай предвид, че и протоколът за оглед може да съдържа договорни условия."
    aliases: ["договор за посредничество", "договор с агенция", "брокерски договор", "протокол за оглед", "комисиона"]
    keywords: ["посредник", "възнаграждение", "изключителност", "оглед", "комисиона", "услуга"]
    related_stage_keys: [building.land_planning, building.authorization]
    related_document_keys: [document.reservation_agreement, document.preliminary_contract, document.title_deed]
    related_term_keys: [term.deposit, term.possession_ownership]
    source_ids: [commercial_law, obligations_contracts]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: >-
        Договорът с брокер или агенция урежда каква посредническа услуга се възлага, какво възнаграждение се дължи и при кое събитие. Понякога част от условията са в общи условия, декларация или протокол за оглед, въпреки че документът изглежда като проста регистрация на посещение.

        Посредникът може да работи за продавача, за купувача или да има отношения и с двете страни. Договорът трябва ясно да показва кого представлява и какви задължения има към теб.
      when: >-
        Трябва да се прочете още преди първия оглед и остава важен при резервацията, преговорите и сделката. Клауза за изключителност или дълъг срок може да обвързва купувача дори след като сам намери имот или смени посредника.
      who: >-
        Подписва се от клиента и търговеца посредник или надлежния му представител. Провери точната фирма, ЕИК, представителство, адрес и дали лицето, което получава плащането, съвпада с договорната страна.
      why: >-
        Комисионата често е значим разход и може да се претендира при различни събития - оглед, резервация, предварителен договор или окончателна сделка. Купувачът трябва да знае каква работа получава срещу нея и какво не е включено.
      establishes: >-
        Установява възложените действия, срока, възнаграждението, условията за плащане, изключителността и други поети задължения. Протоколът за оглед може да свързва конкретен имот с договорената комисиона.
      not_establish: >-
        Не доказва собственост на продавача, точност на офертата, липса на тежести или извършена независима правна проверка. Плащането на комисиона не означава, че сделката е сигурна или че брокерът изпълнява ролята на адвокат или оценител.
      compare: >-
        Провери фирма и представител, конкретни услуги, срок и прекратяване, изключителност, размер и ДДС, точен момент на възнаграждението, имоти от огледи, работа с другата страна, връщане на разходи и санкции.
      before_after: >-
        Преди подписване изясни чий интерес представлява посредникът и какво ще извърши. След всеки оглед пази копие на подписаното, а преди резервация отдели брокерската комисиона от сумата към продавача.
      payment: >-
        Комисионата следва договореното събитие, не общ пазарен навик. Провери дали се дължи при несъстояла се сделка, отказ на банката, проблем в документите или директен контакт със собственик, и кога се издава счетоводен документ.
      availability: >-
        Mesto не извлича и не анализира брокерски договори или протоколи за оглед. От публичните данни за имота не може да се установи дали дължиш комисиона.
      where: >-
        Поискай предварително договора, общите условия, тарифата и копие от всеки протокол, който подписваш. Провери фирмата и представителя в Търговския регистър, когато посредникът е дружество.
      professional_review: >-
        Адвокат е полезен при изключителност, високи неустойки, неясно условие за дължимост на комисионата, работа за двете страни или опит протоколът за оглед да замести подробно споразумение.
      buyer_checks:
        - "Установи коя страна представлява посредникът и какви услуги поема."
        - "Прочети кога точно възниква комисионата и дали включва ДДС."
        - "Провери срока, изключителността, прекратяването и неустойките."
        - "Не подписвай протокол за оглед, без да прочетеш договорните му клаузи."

  - key: document.bank_valuation
    slug: pazarna-otsenka-za-ipotechen-kredit
    kind: document
    locale: bg
    category: agreements_finance
    title: "Пазарна оценка за ипотечен кредит"
    summary: "Оценка на имота като обезпечение за банката. Тя влияе върху финансирането, но не гарантира продажната цена, правния статут или бъдещата стойност."
    aliases: ["банкова оценка", "оценка на имота", "пазарна оценка", "оценка за ипотека", "оценителски доклад"]
    keywords: ["банка", "ипотека", "обезпечение", "оценител", "кредит", "LTV"]
    related_stage_keys: [building.act14, building.commissioning, building.handover]
    related_document_keys: [document.tax_assessment, document.title_deed, document.cadastral_sketch_scheme, document.preliminary_contract]
    related_term_keys: [term.mortgage, term.property_areas, term.object_designation, term.rough_construction]
    source_ids: [bnb_mortgage_guide, registry_certificates, cadastre_services]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: >-
        Пазарната оценка за ипотечен кредит е оценителски доклад, използван от кредитора, за да определи стойността на имота като обезпечение според своята методика и изисквания. Тя описва обекта, използваните данни и подхода към стойността.

        Банковата оценка служи на кредитния процес. Тя не потвърждава, че договорената цена е изгодна, и не задължава банката да финансира определена част от нея.
      when: >-
        Обичайно се възлага след първоначално разглеждане на кредита и документите за имота, преди окончателното одобрение и ипотеката. При строеж в развитие банката може да има отделни правила за допустима степен и последващи оценки.
      who: >-
        Изготвя се от оценител, приет или възложен от кредитора според неговия процес. Купувачът може да заплаща разхода, но получателят и ползвателят на оценката често е банката; провери достъпа си до целия доклад.
      why: >-
        Ако оценената стойност е под покупната цена, собственото участие може да се увеличи или кредитът да не бъде одобрен в очаквания размер. Докладът може да разкрие различно предназначение, площ, състояние или ограничена ликвидност.
      establishes: >-
        Установява професионалното мнение за стойността към посочената дата и при описаните допускания, документи и методика. За банката докладът е основа за оценката на обезпечението и кредитния риск.
      not_establish: >-
        Не гарантира бъдеща продажна цена, одобрение на кредита, собственост, липса на тежести, строителна законност или техническа изправност. Приетата от банка оценка не заменя правната проверка и огледа.
      compare: >-
        Провери възложител и оценител, дата, цел, идентификатор, адрес, площ, предназначение, степен на завършеност, документи, оглед, сравними сделки, допускания, ограничения и крайна стойност. Съпостави с договора и кадастралната схема.
      before_after: >-
        Преди оценката се събират документи за собствеността, кадастъра и строителството. След нея кредиторът прави отделна кредитна и правна преценка. Положителната оценка сама по себе си не е окончателно предложение или одобрение за кредит.
      payment: >-
        Плащането на оценката е разход, а не гаранция за кредит. Не поемай невъзстановими задължения към продавача преди да изясниш как по-ниска оценка, неодобрение или забавяне на банката се отразяват на резервацията и предварителния договор.
      availability: >-
        Mesto не възлага банкови оценки, не получава кредитни решения и не изчислява финансиране. Публичните данни в доклад на Mesto не са оценителски доклад за банка.
      where: >-
        Процесът се организира чрез избрания кредитор или одобрения от него оценител. Поискай да видиш доклада и списъка с липсващи документи, а не само съобщената крайна стойност.
      professional_review: >-
