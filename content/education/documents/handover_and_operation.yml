entries:
  - key: document.handover_protocol
    slug: priemo-predavatelen-protokol-imot
    kind: document
    locale: bg
    category: handover_operation
    title: "Приемо-предавателен протокол за имота"
    summary: "Описва състоянието на имота при предаването, получените ключове и документи, показанията на уредите и откритите дефекти."
    aliases: ["приемо предавателен протокол", "протокол за предаване", "предаване на ключове", "протокол за апартамент"]
    keywords: ["дефекти", "забележки", "владение", "ключове", "показания", "снимки"]
    related_stage_keys: [building.handover]
    related_document_keys: [document.title_deed, document.commissioning, document.warranty_documents, document.maintenance_agreement]
    related_term_keys: [term.possession_ownership, term.defects, term.warranty_period, term.utility_connection, term.garage_parking]
    source_ids: [obligations_contracts, construction_warranties]
    source_checked_at: "2026-09-05"
    content_version: 2
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: >-
        Приемо-предавателният протокол е двустранен документ, който описва фактическото предаване на конкретен имот и състоянието му към този момент. В него могат да се запишат помещения, принадлежности, ключове, уреди, показания, документи, явни дефекти и уговорени действия.

        Протоколът доказва какво е предадено, но не прехвърля собствеността. Нотариалната сделка, въвеждането в експлоатация и предаването на владението могат да бъдат на различни дати.
      when: >-
        Подписва се при предаване на владението или ключовете според договора. Проектът му трябва да се види предварително, а огледът да се направи на дневна светлина и с достатъчно време, не непосредствено преди формално подписване.
      who: >-
        Подписва се от предаващата и приемащата страна или от надлежните им представители. Технически специалист може да участва в огледа и да подготви приложение със забележки, но не подписва вместо страните.
      why: >-
        Протоколът е основното доказателство какво е получено и какви проблеми са били заявени при предаването. Формулировка „без забележки“ може да затрудни спор за видими дефекти, липсващи елементи или непредадени документи.
      establishes: >-
        Установява това, което страните конкретно са описали като предадено, прието, липсващо или оспорено на датата. Може да фиксира срок и отговорно лице за отстраняване, ако е записано ясно.
      not_establish: >-
        Не замества нотариален акт, разрешение за ползване, кадастрална схема или гаранционни права. Не доказва липса на скрити дефекти и не означава автоматично, че всички договорни задължения са окончателно изпълнени.
      compare: >-
        Провери идентификатор и договорен номер, помещения и принадлежности, договорена степен на завършеност, настилки и инсталации, общи части, паркомясто/гараж, ключове, дистанционни, уреди, показания, снимки, документи, дефекти, срокове и контакти.
      before_after: >-
        Преди протокола се правят технически оглед и сравнение с договора, проекта и спецификацията. След него се проследяват дефектите, гаранционните уведомления, партидите, таксите и фактическото използване на имота.
      payment: >-
        Подписването може да е свързано с последно плащане или освобождаване на задържана сума само по договора. Не подписвай приемане без забележки или потвърждение за плащане, което не съответства на фактите.
      availability: >-
        Mesto не извлича и не съхранява частния протокол. Образователната страница и примерният списък не доказват, че предаването е извършено или че конкретен дефект е заявен навреме.
      where: >-
        Поискай проекта от продавача или инвеститора и подготви собствен списък. Подписаното копие, снимките и приложенията трябва да останат при теб в четим и датиран вид.
      professional_review: >-
        Технически специалист е най-полезен за огледа и точните описания. Адвокат е нужен при отказ да се впишат дефекти, натиск за общо освобождаване от претенции или спор за плащане и владение.
      buyer_checks:
        - "Огледай и опиши всяко помещение, принадлежност и обща част, която се предава."
        - "Запиши дефектите конкретно със снимка, място, срок и отговорно лице."
        - "Преброй ключове, дистанционни, уреди и предадени документи."
        - "Не подписвай общо „без забележки“, ако фактическото състояние е различно."

  - key: document.warranty_documents
    slug: garantiyni-dokumenti-i-defekti
    kind: document
    locale: bg
    category: handover_operation
    title: "Гаранционни документи и протокол за дефекти"
    summary: "Договорите, гаранционните карти, протоколите и кореспонденцията показват кога е открит и заявен даден дефект и какво е направено по него."
    aliases: ["гаранционна карта", "гаранционни условия", "дефектен протокол", "списък с дефекти", "рекламация към строител"]
    keywords: ["гаранция", "дефект", "уведомление", "срок", "ремонт", "приемане"]
    related_stage_keys: [building.handover]
    related_document_keys: [document.handover_protocol, document.technical_passport, document.maintenance_agreement]
    related_term_keys: [term.warranty_period, term.defects, term.bds_finish]
    source_ids: [construction_warranties, obligations_contracts, ordinance_3]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: >-
        Няма един стандартен формуляр, наречен „гаранционни документи“. Комплектът може да включва гаранционни клаузи от договора, нормативни срокове, гаранционни карти за оборудване, инструкции, приемо-предавателни протоколи, списъци с дефекти и последваща кореспонденция.

        За купувача е важно документите ясно да свързват конкретния проблем, датата на установяването му, писменото уведомяване, отговорното лице и извършения ремонт.
      when: >-
        Подготовката започва преди предаването, когато се четат договорът и гаранционните условия. Документирането продължава при огледа и при всяка поява на дефект, без да се чака проблемът да стане по-голям или срокът да изтече.
      who: >-
        В зависимост от проблема и договора отговорност може да носи продавачът, строителят, инвеститорът, доставчикът или сервизът. Купувачът трябва да уведоми правилното лице, а технически специалист може да помогне за описването на причината.
      why: >-
        Устното „ще го оправим“ трудно доказва кога и какво е заявено. Добрата документация доказва, че си уведомил навреме, показва развитието на дефекта и помага да се различи лошото изпълнение от неправилна експлоатация или проблем в обща част.
      establishes: >-
        Всеки документ установява конкретен факт: договорен срок, предадено оборудване, видим дефект, дата на уведомяване, извършен ремонт или отказ. Заедно те показват последователността на събитията, но не гарантират изхода от евентуален спор.
      not_establish: >-
        Гаранционна карта не доказва, че строителният дефект е признат; протоколът не доказва вина, ако е едностранен и неясен. Изтичането на един договорен срок не решава автоматично всички възможни права и отговорности.
      compare: >-
        Провери кой отговаря, за кои елементи, от коя начална дата, срок и изключения; как се уведомява; адреси и контакти; срок за реакция; достъп за ремонт; приемане на ремонта и отражение върху общите части и застраховката.
      before_after: >-
        Преди дефекта стоят спецификацията, техническият оглед и протоколът за предаване. След уведомяването се пазят отговорите, посещенията, снимките и приемането на ремонта; при бездействие се преминава към професионална оценка и правни действия.
      payment: >-
        Дали можеш да задържиш част от последното плащане зависи от договора и приложимото право. Ако има дефекти, не решавай едностранно да прихващаш суми - провери договорната процедура и потърси правен съвет.
      availability: >-
        Mesto не приема рекламации и не следи гаранционни срокове за конкретен имот. То не може да установи от публични данни дали дефект е заявен, признат или поправен.
      where: >-
        Събери документите от продавача, инвеститора, управителя и доставчиците при предаването. Изпращай уведомления по доказуемия канал от договора и пази копия, снимки, входящи номера и протоколи за посещение.
      professional_review: >-
        Инженер или строителен специалист определя характера и вероятната причина на дефекта. Адвокат е нужен при значителна щета, отказ, спор за гаранционния срок, обща част или действие, което може да засегне доказателствата.
      buyer_checks:
        - "Събери договорните условия, гаранционните карти и контактите преди предаването."
        - "Документирай дефекта с дата, място, снимки и измерими прояви."
        - "Изпрати уведомление по доказуемия договорен канал."
        - "Приеми ремонта с нов протокол и отбележи оставащите проблеми."

  - key: document.condominium_documents
    slug: dokumenti-etazhna-sobstvenost
    kind: document
    locale: bg
    category: handover_operation
    title: "Документи на етажната собственост"
    summary: "От правилника, протоколите, бюджета, договорите и книгата на етажната собственост ще разбереш как се управлява сградата и какви решения и разходи те засягат."
    aliases: ["протоколи на входа", "домова книга", "книга на етажната собственост", "решения на общото събрание", "такса вход"]
    keywords: ["общо събрание", "управител", "бюджет", "ремонт", "общи части", "задължения"]
    related_stage_keys: [building.handover]
    related_document_keys: [document.technical_passport, document.maintenance_agreement, document.title_deed, document.handover_protocol]
    related_term_keys: [term.condominium, term.ideal_shares, term.appurtenant_parts, term.warranty_period]
    source_ids: [condominium_law, property_law, obligations_contracts]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: >-
        Документите на етажната собственост включват правилник за вътрешния ред, протоколи и решения на общото събрание, бюджет и отчети, книга на етажната собственост, договори с управител и доставчици и документи за ремонти според конкретната сграда.

        Няма един лист, който да разкаже цялото управление. Купувачът трябва да прочете последователност от решения и текущи задължения, особено при предстоящ голям ремонт или професионален управител.
      when: >-
        Трябва да се прегледат преди покупка на готово жилище и при предаване в нова сграда. След придобиването новият собственик трябва да се включи в управлението и да познава действащите правила, такси и решения.
      who: >-
        Съставят и съхраняват се от различни органи и участници в етажната собственост според вида на документа - общото събрание, управителя или управителния съвет, контролния орган или професионалния управител. Продавачът следва да съдейства за достъп до относимата информация.
      why: >-
        Таксите, натрупаните ремонти, споровете, състоянието на покрив, фасада и асансьор и договорите за управление могат да променят реалната цена на притежанието. Красивият апартамент не показва финансовото и техническото състояние на общите части.
      establishes: >-
        Всеки документ установява конкретно решение, отчет, правило, договор или вписана информация в своя обхват. Редовно приетите решения могат да обвързват собствениците според закона и конкретните обстоятелства.
      not_establish: >-
        Един протокол не доказва, че решението е изпълнено, че няма други задължения или че всички процедури са законосъобразни. Уверение от продавача „няма проблеми във входа“ не замества документите и разговор с управителя.
      compare: >-
        Провери последните протоколи, бюджети и отчети, размер и база на таксите, фонд „Ремонт и обновяване“, просрочия, планирани ремонти, договори, съдебни спорове, застраховки, технически паспорт и правила за ползване на общи части.
      before_after: >-
        Преди сделката се събира актуална информация и се уточнява кои задължения са на продавача. След придобиването купувачът уведомява управлението по съответния ред и получава информация как се изпращат съобщения, плащат такси и получават решенията.
      payment: >-
        Таксите за управление и ремонти са отделни от покупната цена. Предварителният или нотариалният договор трябва ясно да разпредели стари задължения, вече гласувани вноски и разходи, дължими около датата на предаване.
      availability: >-
        Mesto не извлича документи от частната етажна собственост и не знае дали конкретен апартамент има просрочия. Публичен имотен отчет не може да замести тази проверка.
      where: >-
        Поискай документите чрез продавача и управителя/управителния съвет, като пазиш личните данни на останалите собственици. За ключови твърдения и задължения искай писмена, актуална информация.
      professional_review: >-
        Адвокат е нужен при спорни решения, големи задължения, договори за дългосрочно управление или съдебни дела. Инженер преглежда планирани ремонти и технически проблеми на общите части.
      buyer_checks:
        - "Прочети последните решения, бюджета, отчетите и плана за ремонти."
        - "Установи размера, основанието и просрочията по текущите такси."
        - "Провери договорите с управител, поддръжка, асансьор и ключови доставчици."
        - "Разпредели писмено старите задължения и вече гласуваните вноски."

  - key: document.maintenance_agreement
    slug: dogovor-poddrazhka-upravlenie
    kind: document
    locale: bg
    category: handover_operation
    title: "Договор за поддръжка и управление"
    summary: "Частен договор за услуги, такси и ползване на общите площи в сграда или комплекс. Може да те обвърже с дългосрочен разход, отделен от собствеността."
    aliases: ["договор за поддръжка", "такса поддръжка", "договор за управление", "facility management", "комплекс от затворен тип"]
    keywords: ["годишна такса", "управител", "услуги", "индексация", "общи части", "срок"]
    related_stage_keys: [building.handover]
    related_document_keys: [document.condominium_documents, document.handover_protocol, document.preliminary_contract, document.warranty_documents]
    related_term_keys: [term.condominium, term.ideal_shares, term.appurtenant_parts, term.utility_connection]
    source_ids: [condominium_law, obligations_contracts, property_law]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: >-
        Договорът за поддръжка и управление урежда услуги за общи части, инфраструктура, охрана, озеленяване, почистване, рецепция или други дейности според сградата или комплекса. Той може да е отделен от правилата на етажната собственост и от самото право на собственост.

        Особено в комплекс от затворен тип или при свързано дружество на инвеститора договорът може да е дългосрочен и да съдържа автоматично продължаване, индексация и ограничения за прекратяване.
      when: >-
        Трябва да се прегледа преди резервация или предварителен договор, ако покупката е свързана със задължително управление. Важен е отново при предаването, когато започват таксите и реалното предоставяне на услугите.
      who: >-
        Подписва се между собственика/купувача и дружеството или лицето, което предоставя услугите, а в някои случаи е свързан с инвеститора или етажната собственост. Провери представителството и кой контролира изпълнителя.
      why: >-
        Таксата може съществено да увеличи годишния разход за имота и да се дължи независимо дали го обитаваш. Неясното описание на услугите може да доведе до плащане без измерим стандарт, отчетност или лесно прекратяване.
      establishes: >-
        Установява договорените услуги, площ или база за таксата, срок, начин на плащане, индексация, отчетност, достъп, санкции и прекратяване. Приложенията с бюджет и стандарт са съществена част.
      not_establish: >-
        Не доказва, че всички общи части са собственост на етажната собственост, че услугите се изпълняват качествено или че таксата не може да бъде оспорена. Не заменя решенията и задълженията по управлението на етажната собственост.
      compare: >-
        Провери страни, срок и продължаване, услуги и измерим стандарт, кои площи се обслужват, база и валута на таксата, ДДС, индексация, бюджет и отчет, контрол, прекратяване, неустойки, прехвърляне при продажба и връзка с общото събрание.
      before_after: >-
        Преди договора трябва да е ясно кой притежава и управлява инфраструктурата и какво вече е обещано в договора за покупка. След подписването изисквай отчети и протоколи за услугите и следи решенията на етажната собственост.
      payment: >-
        Изясни от коя дата започва таксата - нотариална сделка, предаване, въвеждане или календарна дата - и как се изчислява при непълна година. Не допускай първо плащане по фактура, преди да си получил договора и приложенията.
      availability: >-
        Mesto не извлича договори за поддръжка, фактури или частни бюджети. Публичната информация за комплекса не показва автоматично реалния разход и договорната обвързаност на апартамента.
      where: >-
