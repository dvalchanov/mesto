entries:
  - key: document.cadastral_sketch_scheme
    slug: skitsa-sreshtu-shema
    kind: document
    locale: bg
    category: property_identity
    title: "Кадастрална скица и схема"
    summary: "Скицата описва поземлен имот или сграда, а схемата - самостоятелен обект; и двете помагат за идентичността, но не гарантират собственост."
    aliases: ["скица", "схема", "схема на апартамент", "кадастрална схема", "скица на имот"]
    keywords: ["АГКК", "КАИС", "идентификатор", "граници", "площ", "предназначение"]
    related_stage_keys: [building.land_planning, building.handover]
    related_document_keys: [document.title_deed, document.tax_assessment, document.tolerance_certificate]
    related_term_keys: [term.cadastral_identifier, term.land_property, term.individual_object, term.object_designation, term.property_areas]
    source_ids: [cadastre, cadastre_law, cadastre_services]
    source_checked_at: "2026-09-05"
    content_version: 2
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: >-
        Скицата е официален документ от кадастъра за поземлен имот или сграда, а схемата - за самостоятелен обект в сграда, например апартамент, гараж или ателие. Те визуализират и описват данните от кадастралната карта и регистрите към момента на издаване.

        Изборът не е въпрос на предпочитание. Ако купуваш апартамент, обичайният документ за самия обект е схема; земята и сградата имат свои отделни идентификатори и документи.
      when: >-
        Използват се при проверка на оферта, подготовка на сделка, ипотечно финансиране, наследяване, делба или установено разминаване. При нов строеж първо може да има само проектни означения, а самостоятелният обект да бъде нанесен в кадастъра по-късно.
      who: >-
        Издават се от Агенцията по геодезия, картография и кадастър чрез службите и електронните услуги по приложимия ред. Копие от продавач или брокер трябва да запази номера, датата и издателя, за да може да се провери.
      why: >-
        Купувачът вижда идентификатора, местоположението, етажа, предназначението, площта и съседните обекти според кадастъра. Това позволява реално сравнение с нотариалния акт, договора и огледа, вместо покупка само по адрес или вътрешен номер.
      establishes: >-
        Установява кадастралните данни за точно посочения обект към момента и обхвата на услугата. Може да съдържа данни за регистрирани собственици и актове, но те са част от кадастралния регистър, не самостоятелно решение на спор за право.
      not_establish: >-
        Не гарантира собственост, липса на тежести, строителна законност, реална вътрешна площ или идентичност с рекламното разпределение. Нанесен обект не е автоматично разрешен за ползване, а липсващ онлайн документ не означава, че право не съществува.
      compare: >-
        Провери вида на документа, номера и датата, идентификатора, адреса, етажа, номера на обекта, предназначението, площта, прилежащите части и съседните обекти. Проследи предишните идентификатори и измененията и се увери, че нотариалният акт описва същия имот.
      before_after: >-
        Преди издаването стои актуалната кадастрална карта или процедурата по изменение. След като идентичността е потвърдена, отделно се проверяват титулът, вписванията, тежестите, строителните книжа и фактическото състояние.
      payment: >-
        Скица или схема не е достатъчна причина за капаро. Ако договорът изисква кадастрално нанасяне преди сделка или плащане, опиши точния обект, допустимите разлики и какво се случва при различно предназначение или площ.
      availability: >-
        Mesto може да работи с публични кадастрални данни и предоставен идентификатор, но не издава официална скица или схема и не гарантира, че визуализираният запис е актуалният документ за сделка.
      where: >-
        Официалният документ се заявява през КАИС или съответната СГКК. Поискай копието на продавача, но за сделка или спор използвай актуален официален документ и го сравни с останалите книжа.
      professional_review: >-
        Геодезист е подходящ при разминаване на граници, площ или обекти. Архитект проверява предназначението и преустройствата, а адвокатът и нотариусът сравняват кадастралните данни с документа за собственост и проекта на сделката в рамките на своите роли.
      buyer_checks:
        - "Избери правилния документ: скица за земя/сграда, схема за самостоятелен обект."
        - "Съпостави идентификатора, предназначението и съседите с нотариалния акт."
        - "Провери предишни идентификатори и скорошни изменения."
        - "Изследвай отделно собствеността, тежестите и строителния статут."

  - key: document.title_deed
    slug: notarialen-akt
    kind: document
    locale: bg
    category: property_identity
    title: "Нотариален акт"
    summary: "Официалният акт, с който се прехвърлят или удостоверяват права върху конкретен имот. Трябва да се чете заедно с предходните актове и актуалните вписвания."
    aliases: ["нотариален акт за покупко-продажба", "акт за собственост", "титул за собственост", "констативен нотариален акт"]
    keywords: ["собственост", "продавач", "вписване", "имотен регистър", "цена"]
    related_stage_keys: [building.handover]
    related_document_keys: [document.cadastral_sketch_scheme, document.encumbrance_certificate, document.tax_assessment, document.family_status_certificate, document.property_power_of_attorney]
    related_term_keys: [term.possession_ownership, term.ideal_shares, term.appurtenant_parts, term.right_of_use, term.property_record]
    source_ids: [property_law, obligations_contracts, notaries_law, registration_rules, property_registry]
    source_checked_at: "2026-09-05"
    content_version: 2
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: >-
        Нотариалният акт е официален акт, съставен в нотариално производство, чрез който се прехвърлят или удостоверяват вещни права върху недвижим имот според вида на производството. При покупко-продажба той съдържа волеизявленията на страните и точния предмет на сделката.

        Не всеки нотариален акт е договор за покупко-продажба: може да удостоверява собственост, дарение, учредяване на право на строеж, ипотека или друг акт. Заглавието и основанието трябва да се прочетат, не само думите „нотариален акт“.
      when: >-
        Необходим е още при първоначалната проверка на продавача, при подготовката на предварителния договор и при окончателната сделка. За ново строителство може да се разглеждат отделни актове за земята, правото на строеж и бъдещия обект.
      who: >-
        Нотариусът с компетентност по местонахождението на имота извършва нотариалното действие, а страните или надлежни представители изразяват волята си. Нотариусът е безпристрастен и не замества независимия адвокат на купувача.
      why: >-
        Това е основният документ, от който разбираш на какво основание продавачът твърди, че има права, и какво точно ще придобиеш - имот, идеални части, принадлежности, право на строеж или ползване. Пропусната принадлежност или различен идентификатор може съществено да промени сделката.
      establishes: >-
        Установява сделката или правото, удостоверени в конкретния акт, страните, имота, основанието и заявените условия. След вписването актът става част от публичната история на вписванията за имота и лицата.
      not_establish: >-
        Един стар акт не доказва самостоятелно, че продавачът все още е собственик, че няма последваща ипотека, възбрана или спор, че кадастърът съвпада или че имотът е без незаконни преустройства и дефекти.
      compare: >-
        Провери вида и датата, нотариус, акт/том/дело и вписване, страни и представителство, придобивно основание, идентификатор, адрес, предназначение, площ, граници, идеални части, принадлежности, тежести и цена. Проследи предходните актове и последващите вписвания.
      before_after: >-
        Преди окончателния акт трябва да има правна и фактическа проверка на продавача, имота и условията. След подписването актът се вписва, плащанията се извършват по предварително уговорения механизъм и владението се предава отделно, ако това е предвидено.
      payment: >-
        Актът може да съдържа изявления за цена и плащане, но реалният механизъм трябва да е съгласуван предварително. Не потвърждавай получена цена, предаване или липса на претенции, ако фактическото събитие не е настъпило или текстът не е точен.
      availability: >-
        Mesto не издава нотариални актове и не извършва пълно изследване на собствеността. Публични кадастрални или регистърни данни могат да съдържат препратка, но не заменят прегледа на самия акт и поредицата от придобивания.
      where: >-
        Поискай четливо копие от продавача и провери вписването чрез Имотния регистър по приложимата услуга. Проектът на бъдещия акт трябва да бъде получен достатъчно рано за независим преглед.
      professional_review: >-
        Независим адвокат изследва документите за собственост, историята на придобиванията, представителството и риска от оспорване. Нотариусът извършва законовите проверки за сделката, но не преговаря вместо купувача за най-подходящите договорни защити.
      buyer_checks:
        - "Проследи как продавачът е придобил правото и дали са нужни по-стари актове."
        - "Съпостави идентификатор, площ, предназначение, идеални части и принадлежности."
        - "Провери последващите вписвания и тежести към подходящ момент."
        - "Прегледай проекта на новия акт преди деня на сделката."

  - key: document.encumbrance_certificate
    slug: udostoverenie-za-tezhesti
    kind: document
    locale: bg
    category: property_identity
    title: "Удостоверение за тежести"
    summary: "Официално удостоверение за вписванията, отбелязванията и заличаванията за конкретен имот, лице и период. Полезността му зависи от точния обхват на заявлението."
    aliases: ["удостоверение за вписвания", "справка за тежести", "чисто удостоверение", "липса на тежести"]
    keywords: ["ипотека", "възбрана", "искова молба", "вписване", "период", "Имотен регистър"]
    related_stage_keys: [building.handover]
    related_document_keys: [document.title_deed, document.preliminary_contract, document.property_power_of_attorney]
    related_term_keys: [term.encumbrance, term.mortgage, term.attachment, term.registered_claim, term.property_record]
    source_ids: [registry_certificates, property_registry, registration_rules]
    source_checked_at: "2026-09-05"
    content_version: 2
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: >-
        Удостоверението за имот показва вписванията, отбелязванията и заличаванията за посочения имот за заявения период според данните в службата по вписванията. В него могат да се видят актове за собственост, ипотеки, възбрани, искови молби и други вписваеми обстоятелства.

        Разговорното „чисто удостоверение“ е опасно съкращение. Изводът зависи от това кой имот е описан, кои собственици са проследени, от коя начална дата и към коя дата е извършена справката.
      when: >-
        Нужно е преди значимо необратимо плащане и непосредствено около нотариалната сделка според организацията на проверката. При дълъг период между предварителен и окончателен договор е разумно да се следи за нови вписвания.
      who: >-
        Издава се от Агенцията по вписванията чрез съответната служба по вписванията. Заявителят определя имота, лицата и периода. Затова едно удостоверение може да е редовно издадено, но да не обхваща целия имот или необходимия период.
      why: >-
        Вписана ипотека, възбрана или спор може да засегне придобиването и начина на плащане. Купувачът трябва да види не само дали има запис, а дали е заличен, върху коя част тежи и как ще бъде уреден преди или едновременно със сделката.
      establishes: >-
        Установява официално резултата от справката за точно описания обхват и период към датата на издаване. Ако съдържа вписвания, те трябва да се анализират по вид, ред, предмет и статус.
      not_establish: >-
        Не гарантира абсолютна липса на всякакъв правен риск, не изследва невписуеми отношения и не поправя грешен идентификатор или непълна история. Старото удостоверение не покрива нови вписвания след крайната му дата.
      compare: >-
        Провери заявителя, службата, имота и идентификатора, собствениците и предходните описания, началната и крайната дата, всички актове и отбелязвания. Сравни данните с документите за собственост и поискай самите вписани актове при неясен запис.
      before_after: >-
        Преди удостоверението се изясняват идентичността и историята на собствеността, за да бъде заявен правилният обхват. След резултата се планират заличавания, банкови съгласия, едновременни плащания или отказ от сделка според конкретния риск.
      payment: >-
        Не прави значимо плащане само срещу обещание за бъдещо заличаване. Ако има ипотека или друга тежест, договорът и платежният механизъм трябва точно да уредят получателя, сумата, документа за заличаване и последователността.
      availability: >-
        Mesto не издава удостоверение за тежести и не извършва официална проверка за собственост. Данни от публичен отчет или кадастър не трябва да се представят като удостоверение от Имотния регистър.
      where: >-
        Заявява се чрез Агенцията по вписванията по приложимия ред. Адвокатът или нотариусът може да организира актуалната справка и да поиска копия от конкретните вписани актове.
      professional_review: >-
        Адвокат трябва да определи правилния период и лица, да прочете вписванията и да изгради безопасна последователност за заличаване и плащане. Нотариусът прави проверки за сделката, но не договаря защита само за купувача.
      buyer_checks:
        - "Провери точния имот, всички предходни описания и проверявания период."
        - "Поискай копия от вписаните актове, които не са ясни само по заглавие."
        - "Актуализирай справката достатъчно близо до сделката."
        - "Уреди заличаването и плащането като една ясна последователност."

  - key: document.tax_assessment
    slug: udostoverenie-danachna-otsenka
    kind: document
    locale: bg
    category: property_identity
    title: "Удостоверение за данъчна оценка"
    summary: "Общински документ с данъчната оценка и данни за декларирания имот, използван при сделки и други производства. Не е пазарна оценка или доказателство за собственост."
    aliases: ["данъчна оценка", "удостоверение за оценка", "оценка от общината", "ДО"]
    keywords: ["община", "местни данъци", "сделка", "пазарна цена", "деклариран имот"]
    related_stage_keys: [building.handover]
    related_document_keys: [document.cadastral_sketch_scheme, document.title_deed, document.rough_construction_certificate, document.bank_valuation]
    related_term_keys: [term.property_areas, term.individual_object, term.right_to_build]
    source_ids: [egov_tax_assessment, obligations_contracts, notaries_law]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: >-
        Удостоверението за данъчна оценка се издава от общинската администрация за деклариран недвижим имот, незавършено строителство или вещно право според заявената услуга. То съдържа стойност за данъчни и нотариални цели и данни от общинската данъчна партида.

        Данъчната оценка не е експертна оценка на пазарната цена. Ниска или висока стойност в документа не показва автоматично реалната стойност, качеството или справедливостта на договорената цена.
      when: >-
        Необходима е при подготовката на нотариална сделка, определянето на данъчната основа и някои административни или наследствени производства. За незавършен обект може да са нужни и данни за степента на завършеност.
      who: >-
        Издава се от общината по местонахождение на имота въз основа на данъчната партида и представените данни. Обикновено продавачът осигурява документа, но купувачът трябва да сравни съдържанието му с имота и правата, описани в сделката.
      why: >-
        Разминаване в собственик, адрес, площ, предназначение или идеални части може да забави сделката и да покаже, че данъчната, кадастралната и вещноправната идентичност не са синхронизирани. Това не решава спора, но е сигнал за проверка.
      establishes: >-
        Установява данъчната оценка и декларираните данни за конкретния обект към документа и услугата. Използва се за предвидените данъчни и нотариални изчисления според действащия режим.
      not_establish: >-
        Не доказва пазарна цена, собственост, липса на тежести, законност на строежа или реална площ. Вписването на лице като данъчно задължено не е самостоятелен титул за собственост.
      compare: >-
        Провери общината, изходящия номер и датата, собствениците и квотите, адреса, идентификатора, вида и предназначението, площта, идеалните части, правото на строеж или ползване и срока на валидност за планираната сделка. Сравни данните с нотариалния акт и схемата.
      before_after: >-
        Преди заявяването продавачът трябва да е декларирал имота и да е изяснил несъответствията. След издаването документът влиза в комплекта за сделката, но отделно остават проверките на титула и вписванията.
      payment: >-
        Данъчната оценка може да влияе върху основата за данък и такси, но не определя сама договорната цена или размера на кредита. Не използвай документа като единствена обосновка за аванс или за оценка на изгодността.
      availability: >-
        Mesto не заявява и не получава автоматично данъчна оценка, защото тя е официална общинска услуга, свързана с конкретен имот и заявител. Данни от кадастъра не са нейна замяна.
      where: >-
        Поискай актуалното удостоверение от продавача и провери издаването чрез съответната община или единния портал, когато услугата е достъпна. За сделката нотариусът уточнява необходимата актуалност и комплект.
      professional_review: >-
        Нотариус или адвокат проверява годността за сделката и несъответствията с титула. Данъчен специалист е необходим само при нетипичен предмет, корпоративна структура или по-сложни данъчни последици.
      buyer_checks:
        - "Съпостави собственик, квоти, идентификатор, площ и предназначение."
        - "Разграничи данъчната стойност от пазарната оценка и договорната цена."
        - "Провери дали документът е за точния вид право и степен на завършеност."
        - "Изясни несъответствията преди насрочване на сделката."

  - key: document.heir_certificate
    slug: udostoverenie-za-naslednitsi
    kind: document
    locale: bg
    category: property_identity
    title: "Удостоверение за наследници"
    summary: "Официален документ за лицата, вписани като наследници на починал човек; важен за наследствен имот, но не доказва самостоятелно кой притежава конкретната вещ."
    aliases: ["наследници", "удостоверение за законни наследници", "наследствен имот"]
    keywords: ["наследство", "наследодател", "квоти", "завещание", "продавачи"]
    related_stage_keys: [building.handover]
    related_document_keys: [document.title_deed, document.family_status_certificate, document.encumbrance_certificate]
    related_term_keys: [term.ideal_shares, term.marital_community, term.possession_ownership]
    source_ids: [egov_heirs, inheritance_law, property_law]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: >-
        Удостоверението за наследници изброява лицата, вписани като наследници на починал човек въз основа на регистрите на населението и приложимите правила. То помага да се установи кръгът от лица, които може да са придобили наследствени права.

        Документът не разпределя самото имущество и не показва непременно всички фактори - завещание, отказ от наследство, последваща делба, продажба или съдебен спор трябва да се проверяват отделно.
      when: >-
        Необходимо е, когато продавачът или предходен собственик е починал и имотът се продава като наследствен, както и когато собствеността е преминала през няколко наследявания. Стар документ може да не отразява последващи промени в данните.
      who: >-
        Издава се от компетентната общинска администрация по последния постоянен адрес на наследодателя по приложимия ред. Продавачите трябва да осигурят актуален документ и допълнителните актове за конкретното наследство.
      why: >-
        Ако не участват всички лица с права или квотите са погрешно приети, купувачът може да придобие по-малко от целия имот или да влезе в спор със съсобственик. Особено внимание е нужно при починали наследници и наследяване по заместване.
      establishes: >-
        Установява кои лица са посочени като наследници на конкретния наследодател в административното удостоверение. То е важна отправна точка за изчисляване и проверка на наследствената верига.
      not_establish: >-
        Не доказва, че наследодателят е притежавал имота, че всички наследници са приели или запазили правата си, че няма завещание, отказ, делба, последваща сделка или тежест. Не определя самостоятелно квотите при всеки сложен случай.
      compare: >-
        Провери наследодател, дата на смърт, издател и дата, всички наследници и отбелязани починали лица. Свържи документа с нотариалните актове, актовете за гражданско състояние, завещания, откази, делби и последващи вписвания.
      before_after: >-
        Първо се доказва правото на наследодателя. После се установява наследствената верига и квотите, а след това - дали всеки наследник е извършвал разпореждания. Едва тогава се подготвя сделка с правилните страни.
      payment: >-
        Не плащай капаро на един наследник за „целия имот“, преди да е ясно кой трябва да подпише и какви права има. Резервационният или предварителният договор трябва да обвързва надлежните лица и да урежда невъзможността за общо прехвърляне.
      availability: >-
        Mesto не извлича удостоверения за наследници и не обработва личните данни в тях. Това е документ, който се предоставя от страните и се преглежда в рамките на конкретната правна проверка.
      where: >-
        Поискай актуално удостоверение от продавачите и го потвърди чрез компетентната община или електронната услуга, когато е приложима. При сложна наследствена история поискай и всички свързани актове.
      professional_review: >-
        Адвокат трябва да изчисли квотите и да провери завещания, откази, делби и последващи сделки. Нотариусът проверява страните за конкретната сделка, но предварителната независима проверка остава важна.
      buyer_checks:
        - "Докажи първо, че наследодателят е бил собственик на точния имот."
        - "Проследи всеки починал наследник и всяко следващо наследяване."
        - "Провери завещания, откази, делби и последващи разпореждания."
        - "Увери се, че всички необходими лица участват в договорите."

  - key: document.family_status_certificate
    slug: udostoverenie-semeyno-polozhenie
    kind: document
    locale: bg
    category: property_identity
    title: "Удостоверение за семейно положение"
    summary: "Административен документ за семейното положение, съпруг или съпруга и деца. Помага да се проверят възможни съпружески права, но сам не доказва режима на собственост."
    aliases: ["семейно положение", "удостоверение за брак", "съпруг и деца", "граждански брак"]
    keywords: ["брак", "съпружеска общност", "лична собственост", "продавач", "режим"]
    related_stage_keys: [building.handover]
    related_document_keys: [document.title_deed, document.heir_certificate, document.property_power_of_attorney]
    related_term_keys: [term.marital_community, term.ideal_shares, term.possession_ownership]
    source_ids: [egov_family_status, family_code, property_law]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: >-
        Удостоверението за семейно положение, съпруг/а и деца показва регистрирани обстоятелства за гражданското състояние на лицето. При имотна сделка то помага да се установи дали при придобиването или продажбата може да има права и участие на съпруг.

        Самото наличие на брак не означава автоматично, че всеки имот е общ, а липсата на съпруг в стар нотариален акт не решава въпроса. Важни са датите, придобивното основание и избраният имуществен режим.
      when: >-
        Необходимо е при проверка на продавача и историята на придобиването, особено ако имотът е купен по време на брак или има дарение, наследство, брачен договор, развод или няколко последователни брака.
      who: >-
        Издава се от съответната общинска администрация въз основа на регистрите на гражданското състояние. Продавачът предоставя документа, но изводът за правата върху имота се прави след сравнение с останалите актове.
      why: >-
        Пропуснат съпруг или неправилна квалификация на имота може да доведе до оспорване или невъзможност да се прехвърли цялото право. Купувачът трябва да разбере кой трябва да подпише и на какво основание.
      establishes: >-
        Установява отразеното семейно положение и посочените лица към издаването. Помага да се изгради хронология около датата на придобиване и да се насочи проверката към приложимия режим.
      not_establish: >-
        Не доказва само по себе си дали имотът е съпружеска общност или лична собственост, дали има брачен договор, трансформация на лично имущество или съдебно решение. Не е титул и не показва тежести.
      compare: >-
        Сравни датите на брак, придобиване, развод и последващи сделки, имената на съпрузите и придобивното основание. Провери брачен договор или избран режим и необходимите съгласия за семейно жилище според конкретния случай.
      before_after: >-
        Първо се установява семейното положение към важните дати, а после се анализират начинът на придобиване и приложимият имуществен режим. Така се определя кои лица и изявления са необходими в предварителния и нотариалния договор.
      payment: >-
        Не плащай значим аванс, ако продавачът твърди, че съпругът „няма отношение“, без документална и правна проверка. Договорът трябва да уреди участието или необходимото съгласие преди плащане и сделка.
      availability: >-
        Mesto не извлича документи за гражданско състояние и не прави изводи за семейния режим от публични имотни данни. Това остава част от поверителната проверка на страните.
      where: >-
        Поискай актуалния документ от продавача и при нужда допълнителни актове за брак, развод или режим. Заявяването се извършва през компетентната община или наличната електронна услуга.
      professional_review: >-
        Адвокатът трябва да сравни датите, начина на придобиване и семейния режим. Нотариусът проверява необходимото участие за сделката, но спорните факти трябва да бъдат изяснени предварително.
      buyer_checks:
        - "Съпостави датата на придобиване с браковете и разводите на продавача."
        - "Провери придобивното основание и приложимия имуществен режим."
        - "Установи дали е нужен подпис или съгласие на съпруг."
        - "Не приемай административното удостоверение като самостоятелен извод за собственост."

  - key: document.property_power_of_attorney
    slug: palnomoshtno-imotna-sdelka
    kind: document
    locale: bg
    category: property_identity
    title: "Пълномощно за имотна сделка"
    summary: "Документът, чрез който представител действа вместо страна по сделката; трябва да покрива точно имота, действията и формата, без да се приема за доказателство за собственост."
    aliases: ["пълномощно", "нотариално пълномощно", "продажба чрез пълномощник", "представител"]
    keywords: ["представителна власт", "нотариална заверка", "оттегляне", "цена", "банкова сметка"]
    related_stage_keys: [building.handover]
    related_document_keys: [document.title_deed, document.encumbrance_certificate, document.preliminary_contract]
    related_term_keys: [term.possession_ownership, term.property_record]
    source_ids: [obligations_contracts, notaries_law, property_registry]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: >-
        Пълномощното е едностранно волеизявление, с което едно лице дава представителна власт на друго да извършва определени действия от негово име. При имотна сделка формата и съдържанието трябва да отговарят на действията, които представителят ще извърши.

        Широко общо пълномощно и конкретно пълномощно за един имот носят различен практически риск. Купувачът трябва да знае какво точно може да договори, подпише, получи или заяви пълномощникът.
      when: >-
        Необходимо е, когато продавач, купувач, наследник, съпруг или представител на дружество няма да се яви лично. Проверява се преди резервация, предварителен договор, получаване на плащане и нотариална сделка.
      who: >-
        Упълномощителят подписва документа с необходимите нотариални удостоверявания според действието. Нотариусът удостоверява предвидените обстоятелства, а представителят действа само в рамките на дадената власт.
      why: >-
        Дори собственикът да има безспорен титул, сделката може да е проблемна, ако представителят няма право да продаде точния имот, да договори цена, да получи сумата или ако пълномощното е оттеглено. Представителството е отделна проверка.
      establishes: >-
        Установява предоставената представителна власт в рамките на текста, формата и действащия статус. Може да включва конкретни имоти, минимална цена, банкова сметка, право на преупълномощаване и други ограничения.
      not_establish: >-
        Не доказва, че упълномощителят е собственик, че документът не е оттеглен, че представителят е изпълнил вътрешните указания или че посочената сметка е безопасна. Нотариалната заверка не заменя проверката на титула.
      compare: >-
        Провери самоличност, дата, нотариус и регистров номер, удостоверяване на подпис и съдържание когато е приложимо, точен имот и права, цена, получаване на средства, преупълномощаване, срок и ограничения. Потвърди актуалния статус по надлежния ред.
      before_after: >-
        Преди използването се проверяват титулът на упълномощителя и валидността на представителството. След подписването плащането и вписването трябва да следват проверения механизъм, а оригиналът се представя в нотариалното производство.
      payment: >-
        Не превеждай средства по сметка на представител само защото има общо пълномощно. Текстът трябва ясно да допуска получаването, а адвокатът и нотариусът да потвърдят начина на плащане и връзката с продавача.
      availability: >-
        Mesto не извлича, валидира или съхранява пълномощни. Публичните данни за имота и дружеството не доказват частната представителна власт на конкретно физическо лице.
      where: >-
        Поискай пълно четливо копие и оригинала за нотариалното производство. Проверката на нотариалното удостоверяване и евентуалното оттегляне се организира чрез нотариус и адвокат по приложимия ред.
      professional_review: >-
        Независим адвокат трябва да прочете обхвата и платежните права преди договор или превод. Нотариусът проверява годността за конкретното нотариално действие и самоличността на явилите се лица.
      buyer_checks:
        - "Провери точния имот, действието, цената и правото за получаване на средства."
        - "Потвърди формата, нотариалното удостоверяване и актуалния статус."
        - "Провери отделно собствеността на упълномощителя."
        - "Избягвай плащане към представител без изрична и професионално проверена власт."
