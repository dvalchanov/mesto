      who: >-
        Подписва се от нормативно определените участници — възложител, строител, надзор, проектант, общински представител или други лица според образеца и случая. Имената и качеството им трябва да съвпадат с конкретния строеж.
      why: >-
        Купувачът може да провери дали физическото начало е свързано с правилното разрешение, имот и фаза. Това е особено важно, когато офертата използва обща дата за „начало на комплекса“, а договорът е за по-късен блок.
      establishes: >-
