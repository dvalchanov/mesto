    summary: "„Акт 16“ е разговорно название за различни документи. Важно е да различаваш Протокол образец 16, разрешението за ползване и удостоверението за въвеждане в експлоатация."
    aliases: ["акт16", "акт 16", "протокол 16", "разрешение за ползване", "въвеждане в експлоатация", "удостоверение за въвеждане"]
    keywords: ["ДПК", "ДНСК", "категория строеж", "ползване", "община"]
    related_stage_keys: [building.commissioning]
