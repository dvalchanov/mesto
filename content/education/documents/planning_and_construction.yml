      who: >-
        Съставя се и се заверява от предвидените участници според ЗУТ и конкретните проектни части. Възложителят я представя в приемателната документация; устно обяснение от строителя не е екзекутивен документ.
      why: >-
        Разликата между проект и изпълнение може да засегне площ, разпределение, отвори, вертикални щрангове, общи части и използваемост. Купувачът трябва да знае дали промяната е допустимо отразена и как се съотнася към обещаното в договора.
      establishes: >-
        Установява отразените изпълнени отклонения в конкретните заверени части. Ако липсват отклонения, приложимият ред може да предвижда друго удостоверяване; изводът винаги зависи от пълния комплект.
      not_establish: >-
        Не узаконява съществени отклонения, не доказва качество без дефекти и не изменя автоматично частния договор с купувача. Не замества кадастралната схема, Акт 15 или крайното въвеждане.
      compare: >-
        Съпостави одобрения проект, екзекутивните части, заповедите за изменения, Акт 15 и кадастралните данни. За твоя обект провери граници, размери, площи, предназначение, принадлежности, отвори и инсталационни елементи.
      before_after: >-
        Стъпва върху одобрения проект и документираните промени по време на изпълнение. Следва да бъде отчетена в Акт 15 и приемателната процедура, а относимите данни се предават за съхранение и кадастрално отразяване по приложимия ред.
      payment: >-
        Ако договорът допуска промени или свързва плащане с Акт 15, поискай да видиш как изпълненото е отразено преди да приемеш, че събитието е настъпило без отклонения. Частният договор може да дава отделни права при промяна.
      availability: >-
        Mesto не извлича автоматично екзекутивните проектни части. Публичното наличие на Акт 15 или разрешение за ползване не означава, че Mesto е сравнило изпълненото с твоя договорен план.
      where: >-
        Поискай относимите части от възложителя, продавача или надзора. При значима разлика провери строителната преписка и поискай специалист да сравни одобрена, изменена и изпълнена версия.
      professional_review: >-
        Архитект и съответният инженер трябва да оценят техническата промяна. Адвокат преценява дали тя е допустима според договора, дали засяга предмета или цената и какви средства за защита са налични.
      buyer_checks:
        - "Поискай списък на всички промени спрямо договорното разпределение."
        - "Разграничи несъществено от съществено отклонение с помощта на специалист."
        - "Съпостави изпълнените площи, граници и инсталации с проекта."
        - "Не приемай Акт 15 като доказателство, че договорът е изпълнен без промени."

  - key: document.act15
