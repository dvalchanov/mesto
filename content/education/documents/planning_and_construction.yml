      what: >-
        Екзекутивната документация отразява несъществените отклонения от одобрените инвестиционни проекти, когато такива са настъпили при изпълнението. Тя показва какво е изградено спрямо първоначално одобреното и се включва в строителната документация.

        Екзекутивната документация не може да се използва за узаконяване на всяка промяна след изпълнението ѝ. Съществените отклонения имат отделен режим и може да изискват предварително одобрение и изменение на разрешението.
      when: >-
