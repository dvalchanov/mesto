    sections:
      what: >-
        Акт образец 15 е констативният акт за установяване годността за приемане на строежа. Чрез него предвидените участници описват изпълнението спрямо одобрения проект и заверената екзекутивна документация и предаването на строежа и документацията от строителя на възложителя.

        Това е важен късен документален етап, но не е разговорното „разрешение да се нанесеш“. Самият акт може да съдържа забележки и да се отнася само за определена фаза, блок или част.
      when: >-
        Съставя се след завършване на строежа за приемане и преди приложимата процедура по въвеждане в експлоатация. Между Акт 15 и крайния акт може да има допълване на документи, проверки и отстраняване на проблеми.
      who: >-
        Подписва се от предвидените участници — възложител, строител, проектанти, строителен надзор и други според категорията и случая. Подписите и представителството са част от проверката, не формален детайл.
      why: >-
        Купувачът разбира, че проектът е достигнал приемателна фаза, но трябва да види какво точно е прието и с какви забележки. Това влияе върху очакванията за окончателното разрешаване, договорните плащания и подготовката за предаване.
      establishes: >-
        Установява описаното състояние, годността за приемане и комплектоването на документацията за конкретния строеж, част или етап. Какво точно доказва зависи от съдържанието и приложенията му.
      not_establish: >-
        Не разрешава ползването, не е разрешение за ползване или удостоверение за въвеждане и не доказва собственост, липса на тежести, плащане, качество без дефекти или предаване на конкретен апартамент на купувача.
      compare: >-
        Провери разрешението, категорията, ПИ и УПИ, блока, етапа и описанието на строежа, датата, участниците, подписите, забележките, приложенията и екзекутивната документация. Сравни ги с последващия краен акт — и двата документа трябва действително да включват твоята сграда.
      before_after: >-
        Преди него са изпълнението, Акт 14, изпитванията и документацията на извършеното. След него следват приложимите проверки и Протокол образец 16/разрешение за ползване или удостоверение за въвеждане според категорията.
      payment: >-
        Може да бъде условие за плащане, но само конкретната клауза определя кога е изпълнено и как се доказва. Провери дали договорът изисква подписан акт за точния блок, дали допуска определени забележки и как трябва да бъдеш уведомен.
      availability: >-
        Mesto не може да получи самия Акт 15 във всеки случай. Публичен запис за друг административен акт или твърдение на продавача не означава, че Акт 15 е намерен и прегледан.
      where: >-
        Поискай пълния акт и приложенията от възложителя, продавача или строителния надзор. При необходимост направи справка в компетентната строителна преписка.
      professional_review: >-
        Инженер преглежда забележките, изпитванията и техническата готовност. Адвокат сравнява предмета и датата с договора, платежните клаузи и подготвяната сделка.
      buyer_checks:
        - "Прочети забележките, приложенията и точния обхват на приемането."
        - "Провери дали актът е за твоя блок, а не за инфраструктура или друга фаза."
        - "Разграничи Акт 15 от окончателното въвеждане в експлоатация."
        - "Провери кое условие в договора поражда задължение за плащане."

  - key: document.commissioning
    slug: akt-16-vavezhdane-v-eksploatatsiya
    kind: document
