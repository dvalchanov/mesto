    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: >-
        В ежедневния език „Акт 16“ често означава, че сградата е въведена в експлоатация. Юридически трябва да се различат Протокол образец 16, разрешението за ползване и удостоверението за въвеждане в експлоатация — те не са един и същ документ.

        Приложимата процедура зависи от категорията на строежа. Затова купувачът трябва да търси точния краен акт, издател и предмет, а не само фразата в обявата.
      when: >-
        След Акт 15 и изпълнение на предпоставките за конкретния строеж. Окончателният акт може да обхваща отделен етап или част от комплекс, а друга сграда на същия терен да следва различна процедура или дата.
      who: >-
        За строежи от първа до трета категория разрешението за ползване се издава от ДНСК след държавна приемателна комисия и Протокол образец 16. За четвърта и пета категория удостоверението за въвеждане се издава от органа, издал разрешението.
      why: >-
        Документът определя дали конкретният строеж е допуснат до ползване по приложимия режим. Това е отделно от собствеността, ключовете, индивидуалните партиди и качеството на апартамента — четири теми, които често погрешно се сливат.
      establishes: >-
        Крайният акт установява, че ползването на точно описания строеж, част или етап е разрешено. Номерът, датата, категорията и описанието показват кои части на проекта действително са обхванати.
      not_establish: >-
        Не доказва собствеността на продавача, липсата на ипотеки или възбрани, предаване на владение, откриване на индивидуални партиди, изпълнение на частен договор или липса на явни и скрити дефекти.
      compare: >-
        Провери вида на акта, издател, номер и дата, категория, разрешение за строеж, ПИ/УПИ, блок, вход, етап и предназначение. Съпостави приложенията и измененията и внимавай документ за трафопост, улица или съседен блок да не се приема за жилищната сграда.
      before_after: >-
        Предхожда се от Акт 15 и приемателната документация. След него остават вещната сделка, фактическото предаване, гаранционните отношения, поддръжката и реалното присъединяване според конкретния случай.
      payment: >-
        Ако договорът сочи „Акт 16“, изясни кой юридически документ има предвид и кога се счита получен — при издаване, влизане в сила или уведомяване. Не приемай разговорното название за достатъчно точно платежно условие.
      availability: >-
        Mesto търси записи в поддържаните публични регистри, включително НАГ за София. Липсата на намерен запис не доказва липса на акт, а намереният запис изисква проверка на предмета и връзката със сградата.
      where: >-
        Според категорията провери регистъра на ДНСК за разрешението за ползване или съответната община или районна администрация за удостоверението за въвеждане в експлоатация. Поискай и пълно копие от възложителя или продавача.
      professional_review: >-
        Адвокат проверява категорията, обхвата, действието и договорните последици. Инженер е нужен при технически забележки, фазиране или несъответствие между документа и реално изпълнената инфраструктура.
      buyer_checks:
        - "Установи дали гледаш протокол, разрешение за ползване или удостоверение."
        - "Провери категорията и компетентния издател."
        - "Съпостави предмета с точния блок, вход и фаза на покупката."
        - "Провери отделно собствеността, тежестите, предаването и партидите."

