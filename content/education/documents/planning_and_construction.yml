    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: >-
        Това удостоверение отразява, че строежът е достигнал степен „груб строеж“ за целите на приложимия режим по чл. 181 ЗУТ. То има особено значение, когато след тази степен се прехвърля построената сграда или самостоятелни части от нея, вместо само право на строеж.

        Документът не е просто друго име на Акт 14. Акт 14 приема конструкцията между участниците в строителството, докато удостоверението служи пред трети лица и при сделки за доказване на достигнатата степен според компетентното удостоверяване.
      when: >-
        Удостоверението е важно след завършването на сградата в груб строеж и преди нотариална сделка с конкретен незавършен обект, когато видът на прехвърляното право зависи от достигнатата степен.
      who: >-
        Издава или заверява се от компетентната администрация по приложимия ред въз основа на строителните документи и установената степен. Конкретната форма и орган трябва да се проверят за съответния строеж и община.
      why: >-
        Преди груб строеж купувачът често придобива или му се обещава право на строеж; след достигнатата степен предметът може да се третира различно. Неточното описание може да доведе до договор за различно право от това, което купувачът мисли, че придобива.
      establishes: >-
        Установява официално удостоверената степен на завършеност за посочения строеж и обхват към определена дата. Точният текст показва дали се отнася за цялата сграда, етап или друга част.
      not_establish: >-
        Не доказва въвеждане в експлоатация, годност за обитаване, завършени инсталации, кадастрално нанасяне, собственост на продавача или липса на тежести. Не решава само по себе си какво пише в предварителния договор.
      compare: >-
        Сравни строежа, разрешението, блока и етапа, датата, издателя, основанието, Акт 14 и данните за бъдещия обект. Провери как имотът и правото върху него са описани в предварителния договор и проекта на нотариален акт.
      before_after: >-
        Предхожда се от изпълнение и приемане на конструкцията. След удостоверената степен може да има вещна сделка, кадастрални действия и продължаващо строителство към Акт 15 и въвеждане.
      payment: >-
        Договорът може да свързва плащане или нотариално прехвърляне с „Акт 14“ или „груб строеж“. Изясни дали изисква именно това удостоверение, кой го представя и дали обхваща твоя блок.
      availability: >-
        Mesto не може да получи удостоверението за степен на завършеност във всеки случай. Информация за Акт 14 или видим напредък не доказва, че това отделно удостоверение е издадено.
      where: >-
        Поискай заверено копие от продавача или възложителя и потвърди при компетентната администрация. За нотариална сделка провери с нотариуса предварително кой документ и форма ще бъдат необходими.
      professional_review: >-
        Адвокат и нотариус трябва да сравнят удостоверението с вещното право и проекта на сделка. Инженер е полезен, ако има съмнение дали физическата и документалната степен съвпадат.
      buyer_checks:
        - "Не приемай Акт 14 като автоматичен заместител на удостоверението."
        - "Провери дали удостовереният обхват включва точния блок и етап."
        - "Съпостави документа с предмета на нотариалната сделка."
        - "Изясни дали придобиваш право на строеж или вече изграден самостоятелен обект."

