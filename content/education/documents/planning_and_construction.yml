entries:
  - key: document.design_visa
    slug: viza-za-proektirane
    kind: document
    locale: bg
    category: planning_construction
    title: "Виза за проектиране"
    summary: "Извадка от действащия устройствен план с указания за проектиране в даден имот. Тя е важна отправна точка, но не дава право да започне строителство."
    aliases: ["виза", "скица-виза", "виза за проектиране"]
    keywords: ["линии на застрояване", "устройствени показатели", "проект", "главен архитект"]
    related_stage_keys: [building.land_planning]
    related_document_keys: [document.pup, document.investment_project, document.building_permit]
    related_term_keys: [term.upi, term.land_property, term.gross_floor_area]
    source_ids: [zut, nag]
    source_checked_at: "2026-09-05"
    content_version: 2
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: >-
        Визата за проектиране е извадка от действащия подробен устройствен план, допълнена с данни и предписания за проектирането в конкретен имот. Тя показва изходните условия за проекта: допустимото застрояване, линиите, височините и другите ограничения за имота.

        Визата не е обещание каква точно сграда ще бъде одобрена. За купувача тя е начин да разбере върху каква планова основа е разработена идеята, а не готов заместител на инвестиционния проект и разрешението за строеж.
      when: >-
        Визата е важна в ранната фаза — преди одобряването на инвестиционния проект и издаването на разрешение за строеж. Може да има последваща виза или промяна в устройствената основа, затова провери датата и връзката с актуалния проект.
      who: >-
        Издава се от главния архитект на компетентната администрация по реда на ЗУТ. Проектантът използва данните ѝ, но не я издава; брокерска оферта или схема, подготвена от инвеститора, не е самата административна виза.
      why: >-
        Когато купуваш „на зелено“, рекламните визуализации често изпреварват окончателните одобрения. Визата помага да провериш дали проектът се отнася до реален имот и съответства на устройствените условия, както и дали по-късните документи сочат същия ПИ, УПИ и застрояване.
      establishes: >-
        Установява съдържанието на извадката и указанията към датата на издаване, за посочения имот и действащия тогава план. Може да покаже ограничителни и задължителни линии, начин на застрояване и други изрично отразени условия.
      not_establish: >-
        Не установява, че инвестиционният проект е одобрен, че разрешението за строеж е влязло в сила, че проектът няма да бъде изменян или че продавачът притежава бъдещия апартамент. Не доказва и текущ физически напредък.
      compare: >-
        Съпостави номера и датата, издателя, идентификатора и границите на имота, номера на УПИ и квартала, действащия ПУП, линиите и показателите на застрояване. После провери дали разрешението и одобреният проект се позовават на същата устройствена основа.
      before_after: >-
        Преди визата стои действащият устройствен план или процедурата по неговото изменение. След нея се разработват и оценяват проектните части, а едва след приложимите съгласувания и одобрения може да се стигне до разрешение за строеж.
      payment: >-
        Визата рядко е разумно самостоятелно основание за значително плащане. Ако договорът я споменава, провери дали изисква само издаване на виза или и одобрен проект, влязло в сила разрешение и точна идентичност на бъдещия обект.
      availability: >-
        Mesto може да показва публична препратка, когато има такава в поддържан административен източник, но не може да изтегли заверено копие от всяка община. Наличието на тази образователна страница не означава, че визата е намерена за конкретния имот.
      where: >-
        Поискай копие от инвеститора или продавача и го сравни с преписката в съответната община или районна администрация. За София част от информацията може да е видима през публичните услуги на НАГ, но това зависи от конкретната преписка.
      professional_review: >-
        Архитект или устройствен специалист може да прочете ограниченията и връзката с проекта. Адвокат е подходящ, когато договорът представя визата като гаранция за бъдещо разрешаване или я свързва с плащане и право на отказ.
      buyer_checks:
        - "Провери дали имотът и УПИ съвпадат с тези в офертата и проекта."
        - "Поискай актуалния документ, а не само изрязано изображение без номер и дата."
        - "Съпостави визата с одобрения проект и разрешението за строеж."
        - "Изясни дали след издаването ѝ има изменение на ПУП или нова виза."

  - key: document.pup
    slug: podroben-ustroystven-plan
    kind: document
    locale: bg
    category: planning_construction
    title: "Подробен устройствен план (ПУП)"
    summary: "Планът, който урежда границите, предназначението и застрояването на дадена територия. Той е основа за проектиране, но не одобрява конкретна сграда."
    aliases: ["ПУП", "план за регулация", "план за застрояване", "ПРЗ"]
    keywords: ["регулация", "застрояване", "устройствен план", "УПИ", "влизане в сила"]
    related_stage_keys: [building.land_planning]
    related_document_keys: [document.design_visa, document.investment_project, document.building_permit]
    related_term_keys: [term.upi, term.land_property, term.easement, term.gross_floor_area]
    source_ids: [zut, nag]
    source_checked_at: "2026-09-05"
    content_version: 2
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: >-
        Подробният устройствен план урежда как се организира конкретна територия. Според вида си той може да определя регулационни граници, предназначение, начин и линии на застрояване, достъп и други устройствени решения.

        ПУП е планова основа, а не комплектът чертежи на апартамента. За купувача най-важно е коя заповед или решение е одобрило приложимия план, влязло ли е в сила и дали по-късно е изменяно.
      when: >-
        Най-важен е преди проектирането и разрешаването на строежа, но може да е необходим и при покупка на готов имот — особено при спор за граници, достъп, бъдещо застрояване или разминаване между кадастъра и регулацията.
      who: >-
        Одобрява се от компетентния административен орган според обхвата и вида на плана. Проектантът го изработва, но окончателният статут идва от акта за одобряване и неговото действие, не от неприет проект или маркетингова схема.
      why: >-
        ПУП помага да разбереш дали имотът има предвидения устройствен режим и как проектът се вписва в него. Това е важно за достъпа, плътността, височината, разположението на сградата и връзката между разговорното „парцел“ и юридическия УПИ.
      establishes: >-
        Действащият план установява устройствените решения, които са изрично одобрени за посочената територия. Заповедта, графичната и текстовата част трябва да се четат заедно и за точния обхват.
      not_establish: >-
        Не доказва, че конкретният инвестиционен проект е одобрен, че разрешението за строеж е валидно, че собственикът има безспорни права или че сградата е изпълнена по плана. ПУП не е кадастрална карта и разликите не се решават с поглед върху един чертеж.
      compare: >-
        Провери вида на плана, акта за одобряване, датата и влизането в сила, обхванатите имоти, квартал и УПИ, предназначение, линии и показатели, достъп до улица и последващи изменения. Съпостави с визата, проекта, разрешението и актуалната кадастрална карта.
      before_after: >-
        Планът предхожда визата и инвестиционното проектиране. След него идват проектните части, оценката за съответствие и разрешението. Ако ПУП е изменен, провери кои последващи документи са издадени върху старата и кои върху новата основа.
      payment: >-
        Самото одобряване на ПУП не означава, че може да започне строителство или че бъдещ апартамент вече е индивидуализиран. Ако плащане зависи от „урегулиране“ или „одобрен ПУП“, договорът трябва да посочи точния акт, обхват и последици при обжалване или промяна.
      availability: >-
        Mesto може да показва намерени публични записи за част от устройствените процедури, основно според поддържаните местни източници. Не се приема, че липсата на онлайн запис означава липса на план или че показаната карта е пълната преписка.
      where: >-
        Провери в съответната община или районна администрация и поискай заповедта заедно с относимите графични и текстови части. Публичните портали са полезни за ориентация, но при неясен статут е необходима официална справка или копие.
      professional_review: >-
        Архитект или урбанист е нужен при сложни линии, показатели, свързано застрояване, достъп или разминаване с проекта. Адвокат трябва да оцени влизането в сила, обжалването и договорните обещания, основани на бъдеща планова промяна.
      buyer_checks:
        - "Намери акта за одобряване и провери дали планът е влязъл в сила."
        - "Съпостави номерата на ПИ, УПИ и квартала във всички документи."
        - "Провери за последващи изменения, които засягат строежа или достъпа."
        - "Не приемай цветна ситуационна схема за пълния действащ ПУП."

  - key: document.investment_project
    slug: odobren-investitsionen-proekt
    kind: document
    locale: bg
    category: planning_construction
    title: "Одобрен инвестиционен проект"
    summary: "Комплект от одобрени проектни части, по които строежът е разрешен и трябва да бъде изпълнен. От него можеш да провериш разпределението и техническите решения."
    aliases: ["инвестиционен проект", "одобрен проект", "архитектурен проект", "работен проект", "технически проект"]
    keywords: ["архитектура", "конструкции", "инсталации", "разпределение", "проектни части"]
    related_stage_keys: [building.land_planning, building.authorization]
    related_document_keys: [document.design_visa, document.pup, document.building_permit, document.executive_documentation]
    related_term_keys: [term.property_areas, term.object_designation, term.material_deviation, term.bds_finish]
    source_ids: [zut, dnsk_construction_control, nag]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: >-
        Одобреният инвестиционен проект е комплект от взаимно свързани проектни части — архитектурна, конструктивна, инсталационни и други според строежа. Той конкретизира какво е разрешено да бъде изградено и стои в основата на разрешението за строеж.

        За купувача най-разпознаваема е архитектурната част с етажи и разпределения, но важните обещания за общи части, инсталации, достъпност, паркиране и технически решения може да са в други части и приложения.
      when: >-
        Проектът трябва да се прегледа преди издаването на разрешението, при избор на имот „на зелено“, при договаряне на характеристиките, при промени по време на строителството и при сравнение с действително изпълненото преди приемането.
      who: >-
        Изработва се от правоспособни проектанти по съответните части и се одобрява от компетентния орган по приложимия ред. Инвеститорът може да предостави копия, но рекламното разпределение без белези за одобрение не е равнозначно на одобрен проект.
      why: >-
        Площ, предназначение, изложение, отвори, общи части, паркомясто и инсталационни трасета могат да влияят пряко върху това, което купуваш. Ако договорът се позовава на приложение, провери дали то съответства на одобрената версия и дали допуска едностранни промени.
      establishes: >-
        Установява одобреното проектно решение за конкретния строеж и версията на отделните части към одобряването. Заедно с разрешението показва разрешения обхват, но конкретният извод зависи от точната част и означенията в нея.
      not_establish: >-
        Не доказва, че всичко вече е изпълнено точно по чертежите, че няма одобрени изменения, че площта в рекламата е правно гарантирана или че продавачът има право да прехвърли описания обект. Не замества технически оглед.
      compare: >-
        Сравни титулен лист, номер и дата на одобряване, разрешение за строеж, проектант и фаза, вход, етаж, номер и предназначение на обекта, оси и граници, площи, прилежащи части, общи части и паркиране. Провери заповеди и одобрени изменения по чл. 154 ЗУТ.
      before_after: >-
        Стъпва върху действащ ПУП и виза, когато е приложима. След одобряването му се издава разрешението и строежът се изпълнява спрямо него. Допустимите промени се проследяват чрез одобрени изменения и екзекутивна документация, а не чрез устно уверение.
      payment: >-
        Проектът може да индивидуализира предмета на предварителния договор и да участва в определянето на договорен етап. Плащането обаче следва конкретната клауза и доказателство; „одобрен проект“ не означава автоматично издадено и влязло в сила разрешение.
      availability: >-
        Mesto не извлича автоматично пълния комплект проектни части. Публичен регистър може да потвърди административен акт или препратка, без да предоставя чертежите, по които купувачът трябва да направи конкретното сравнение.
      where: >-
        Поискай от инвеститора или продавача относимите заверени части и списък на последващите изменения. При необходимост те се проверяват и в строителната преписка при компетентната администрация при приложим ред за достъп.
      professional_review: >-
        Архитект сравнява апартамент, площи, общи части и изменения; инженер преглежда конкретни технически части. Адвокат проверява как проектът е включен в договора и какво се случва при допустима или съществена промяна.
      buyer_checks:
        - "Поискай одобрената версия, към която се позовава разрешението за строеж."
        - "Идентифицирай апартамента по вход, етаж, номер и предназначение, не само по маркетингово име."
        - "Съпостави договорните приложения с архитектурната част и таблицата с площи."
        - "Провери дали има одобрени изменения и как засягат твоя обект и общите части."

  - key: document.building_permit
    slug: razreshenie-za-stroezh
    kind: document
    locale: bg
    category: planning_construction
    title: "Разрешение за строеж"
    summary: "Административният акт, който разрешава точно описан строеж при определени условия и по одобрени проекти. Важен е, но не е достатъчен за цялостна проверка."
    aliases: ["строително разрешение", "разрешение за строителство", "РС"]
    keywords: ["влизане в сила", "възложител", "проект", "етап", "презаверяване"]
    related_stage_keys: [building.authorization]
    related_document_keys: [document.investment_project, document.site_opening, document.executive_documentation]
    related_term_keys: [term.upi, term.right_to_build, term.construction_roles, term.construction_category]
    source_ids: [zut, nag, dnsk_construction_control]
    source_checked_at: "2026-09-05"
    content_version: 2
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: >-
        Разрешението за строеж е индивидуален административен акт, който допуска изпълнението на конкретно описан строеж въз основа на одобрени инвестиционни проекти и приложимите законови предпоставки. То трябва да се чете заедно с проектите, върху които е издадено.

        Заглавието „има разрешение“ не е достатъчно: важни са влизането в сила, сроковете за започване и завършване, строежът и етапите, възложителят, категорията и всички последващи допълвания или презаверявания.
      when: >-
        Нужно е, преди строителството да започне по законовия ред. Остава важно през целия процес, защото актовете за площадката, конструкцията, приемането и въвеждането трябва да се отнасят до същия разрешен строеж или до ясно описана част от него.
      who: >-
        Издава се от компетентния орган по ЗУТ — обичайно от главния архитект на общината или района, а за определени обекти от друг предвиден орган. Строителят и инвеститорът не могат сами да създадат административното разрешение.
      why: >-
        За купувача документът свързва проекта с правото да се строи. Той помага да се провери дали рекламираният вход, блок, фаза и предназначение са в разрешения обхват, вместо да се разчита на общо разрешение за голям комплекс или съседна сграда.
      establishes: >-
        Установява, че към издаването компетентният орган е разрешил описания строеж при посочените проекти и условия. Съдържа данни за възложителя, имота, категорията и други елементи според случая.
      not_establish: >-
        Не доказва текущо физическо изпълнение, приемане на конструкцията, Акт 15 или въвеждане в експлоатация. Не доказва собственост на продавача, липса на тежести, идентичност на конкретен бъдещ апартамент или изпълнение на твоя договор.
      compare: >-
        Сравни номер, дата, орган, съобщаване и влизане в сила, възложител, ПИ/УПИ, адрес, наименование и етапи, категория, проектни части и условия. Проследи заповеди за допълване, изменения, презаверяване и връзката им с точния блок.
      before_after: >-
        Предхожда се от устройствена и проектна подготовка, права върху терена и одобрени проекти. След него идват откриването на площадката, определянето на строителна линия и ниво, изпълнението и съответните актове по Наредба № 3.
      payment: >-
        Може да бъде условие за плащане само ако договорът изрично го предвижда и посочва как се доказва — например чрез издаване или влизане в сила. Законът не определя общ график за плащане, а разрешение за друга фаза не поражда автоматично твое задължение.
      availability: >-
        Mesto търси препратки в поддържаните публични административни източници, включително НАГ за София. Това не гарантира пълна национална наличност, заверено копие или че намереният запис обхваща избрания обект.
      where: >-
        Поискай пълно копие с отбелязванията от възложителя или продавача и го провери в регистъра или преписката на компетентната администрация. При спор за действие или обжалване използвай официална справка.
      professional_review: >-
        Архитект или инженер може да проследи проектния обхват и измененията. Адвокат проверява действието на акта, правата на възложителя и начина, по който разрешението е превърнато в договорно обещание или условие за плащане.
      buyer_checks:
        - "Потвърди, че разрешението е за точния блок, фаза и предназначение."
        - "Провери влизането в сила, сроковете и евентуалното презаверяване."
