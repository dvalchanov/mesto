      who: >-
        Съставя се от определените правоспособни участници или консултанти според това дали е нов строеж или съществуваща сграда и по реда на Наредба № 5. Собственикът или етажната собственост го съхранява и актуализира при приложимите промени.
      why: >-
        Купувачът получава по-структурирана картина на конструкцията, инсталациите, основните ремонти и мерките за поддръжка. Това може да насочи към бъдещи разходи, ограничения или нужда от допълнително обследване, които не личат от интериорния оглед.
      establishes: >-
        Установява данните и оценките, включени в конкретния паспорт към датата и обхвата му. Може да съдържа базови характеристики, извършени обследвания и препоръчани или задължителни мерки.
      not_establish: >-
        Не доказва, че сградата е без дефекти днес, че всички препоръки са изпълнени, че общите части се поддържат добре или че конкретният апартамент няма незаконни преустройства. Не замества технически оглед.
      compare: >-
        Провери идентичност и адрес на строежа, дата и основание, съставител, конструктивна система, инсталации, извършени промени, предписани мерки и срокове. Съпостави с протоколите на етажната собственост и видимото състояние.
      before_after: >-
        За нов строеж стъпва върху проектната и приемателната документация. След съставянето му значимите промени, ремонти и обследвания трябва да се проследяват, така че паспортът да не се третира като непроменима снимка.
      payment: >-
        Техническият паспорт не поражда автоматично задължение за плащане. При покупка на готово жилище липсата или съдържанието му може да изисква допълнителна проверка, но последиците за цената, отказа или срока трябва да са уговорени изрично.
      availability: >-
        Mesto не извлича автоматично техническия паспорт и не може да определи съдържанието му от окончателния акт за ползване. Публичните препратки не заместват документа, съхраняван за конкретната сграда.
      where: >-
        Поискай го от продавача, инвеститора или управлението на етажната собственост. За нов строеж може да е част от документацията при възложителя и компетентната администрация според режима.
      professional_review: >-
        Строителен инженер или архитект може да оцени значението на описаните характеристики и мерки. Адвокат е нужен, ако достъпът се отказва или документът разкрива неизпълнени задължения с договорно значение.
      buyer_checks:
        - "Провери дали паспортът е за точната сграда и кога е съставен или актуализиран."
        - "Прочети мерките, сроковете и данните за значими ремонти."
        - "Съпостави документа със състоянието на общите части и решенията на собствениците."
        - "При технически съмнения възложи отделен оглед, а не разчитай само на паспорта."

