      compare: >-
        Провери образеца, дата, разрешение за строеж, ПИ/УПИ, наименование, блок и етап, определени коти, участници, подписи, забележки и приложени схеми. Сравни с последващите актове и със строителния график само като договорен, не официален ориентир.
      before_after: >-
        Преди него стоят разрешението и одобрените проекти. След него започва документираното изпълнение и се съставят актове за работи, които ще бъдат закрити, както и последващи протоколи за конструкцията и приемането.
      payment: >-
        Ако договорът използва „Акт 2“ като условие за плащане, провери кой образец, за кой блок и дали изисква подписване, заверяване или друго събитие. Самото изкопаване на терена или протокол за друга фаза не е достатъчно.
      availability: >-
        Mesto обичайно не извлича самия протокол автоматично. Публичен регистър може да съдържа дата или препратка, но това не замества копието и проверката на предмета и участниците.
      where: >-
        Поискай го от възложителя, строителния надзор или продавача. При необходимост провери строителната преписка в компетентната администрация според правилата за достъп.
      professional_review: >-
        Инженер или архитект може да провери техническите означения, котите и връзката с проекта. Адвокат е нужен, когато протоколът е условие за плащане, прекратяване или друг важен договорен ефект.
      buyer_checks:
        - "Установи кой точно образец е подписан и за коя фаза се отнася."
        - "Съпостави номера на разрешението, имота, блока и участниците."
        - "Не замествай копието на протокола със снимка от строителната площадка."
        - "Провери договорната дефиниция преди свързано плащане."

  - key: document.act14
    slug: akt-14
