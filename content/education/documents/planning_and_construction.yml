      why: >-
        Енергийните характеристики влияят върху комфорта, очакваните разходи и бъдещите решения на етажната собственост. Разлика между рекламиран и сертифициран клас е сигнал да се изяснят използваната версия и обхватът.
      establishes: >-
        Установява изчислените и удостоверени показатели за конкретната сграда към посочената дата и при използваната методика. Показва официално документирания клас, когато документът е валиден и правилно свързан.
      not_establish: >-
        Не гарантира конкретна сметка за отопление, безпроблемни инсталации, добро изпълнение на всеки детайл или бъдещи цени на енергията. Не доказва индивидуална партида, собственост или въвеждане в експлоатация.
      compare: >-
        Провери адрес и идентичност на сградата, вид на сертификата, регистрационни данни, издател, дата и валидност, енергиен клас, системи и препоръки. Съпостави с рекламата, техническия паспорт и реалните общи инсталации.
      before_after: >-
        Стъпва върху проектни или обследвани данни за сградата. След издаването му може да има ремонти, ново обследване или актуализиране; решенията за подобрения се вземат отделно и изискват бюджет и технически проект.
      payment: >-
        Обикновено не е самостоятелно основание за плащане по покупката. Ако класът е изрично обещана характеристика, включи точен документ, минимален резултат и последици при несъответствие в договора, вместо да разчиташ на рекламно твърдение.
      availability: >-
        Mesto не извлича автоматично сертификат за всяка сграда. Купувачът може да използва публичната справка на АУЕР, но съвпадението по населено място или сходен адрес трябва да се провери внимателно.
      where: >-
        Поискай копие от продавача, инвеститора или управлението на сградата и провери наличните регистрационни данни в портала на АУЕР. При разминаване се обърни към съставителя или правоспособен специалист.
      professional_review: >-
        Енергиен одитор или инженер може да обясни методиката, системите и реалистичните последици. Адвокат е нужен, когато енергийният клас е договорно обещан и несъответствието влияе върху приемане, цена или обезщетение.
      buyer_checks:
        - "Потвърди точната сграда, вида на сертификата, датата и валидността."
        - "Сравни сертифицирания клас с рекламните и договорните твърдения."
        - "Прочети системите и препоръките, а не само буквата на класа."
        - "Не превръщай сертификата в обещание за конкретна месечна сметка."

  - key: document.tolerance_certificate
    slug: udostoverenie-za-tarpimost
    kind: document
    locale: bg
    category: planning_construction
    title: "Удостоверение за търпимост"
    summary: "Документ за определени по-стари строежи без строителни книжа, които отговарят на законовите условия за търпимост. Не е разрешение за строеж или за ползване."
    aliases: ["удостоверение за търпим строеж", "търпимост на строеж", "търпим строеж"]
    keywords: ["стар строеж", "без строителни книжа", "узаконяване", "пристройка", "преустройство"]
    related_stage_keys: [building.land_planning, building.handover]
    related_document_keys: [document.title_deed, document.cadastral_sketch_scheme, document.technical_passport]
    related_term_keys: [term.object_designation, term.appurtenant_parts, term.possession_ownership]
    source_ids: [zut, egov_tolerance, dnsk_construction_control]
    source_checked_at: "2026-09-05"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: >-
        Удостоверението за търпимост се отнася до определени по-стари строежи, изградени без необходимите строителни книжа, които попадат в конкретен преходен режим и са били допустими по приложимите правила. То удостоверява преценка за търпимост на описания строеж.

        „Търпим“ не означава „редовно разрешен като нов строеж“. Документът има ограничена функция и трябва да се чете заедно с годината на изграждане, обхвата и всички останали права и факти.
      when: >-
        Най-често възниква при покупка на старо жилище, къща, пристройка, надстройка, гараж или преустройство, за което няма пълни строителни книжа. Не всеки стар или ненанесен обект може да получи такова удостоверение.
      who: >-
        Издава се от компетентната общинска администрация след заявление и доказателства по приложимия режим. Собственикът представя факти и документи, но администрацията прави удостоверяването за конкретния описан строеж.
      why: >-
        Купувачът трябва да разбере дали обектът, който вижда и плаща, има документален статут. Пристройка или усвоена тераса може да увеличава рекламираната площ, без да е част от законно описания самостоятелен обект.
      establishes: >-
        Установява, че точно описаният строеж е приет за търпим по посочения правен режим и въз основа на представените данни. Предметът може да е само част от видимото застрояване.
      not_establish: >-
        Не е разрешение за строеж, акт за узаконяване или удостоверение за въвеждане в експлоатация. Не доказва собственост, конструктивна безопасност към днешна дата, правилно предназначение на всички помещения или автоматично кадастрално нанасяне.
      compare: >-
        Провери издател, номер и дата, правно основание, година и описание на строежа, площ, местоположение и собственик по преписката. Съпостави със скица/схема, нотариален акт, архитектурно заснемане и реалното положение.
      before_after: >-
        Преди издаването се събират доказателства за времето и допустимостта на строежа. След това може да са нужни отделни кадастрални, вещноправни или технически действия; удостоверението не ги извършва автоматично.
      payment: >-
        Не плащай допълнителна цена за площ или постройка само защото продавачът обещава бъдещо удостоверение. Ако документът е условие за сделката, опиши кой го осигурява, за кой обект и какво става при отказ или по-тесен обхват.
      availability: >-
        Mesto не извлича автоматично удостоверения за търпимост от единен национален регистър. Липсата на дигитален запис не е доказателство нито за липса, нито за наличие на статут.
      where: >-
        Поискай документа и цялата относима преписка от продавача и потвърди при компетентната община. Проверка само в кадастъра не е достатъчна, защото нанасянето не е самостоятелна гаранция за строителна законност.
      professional_review: >-
        Архитект или инженер сравнява видимото със заснемането и допустимостта. Адвокат проверява дали документът покрива предмета на сделката и как остатъчната несигурност се урежда преди плащане.
      buyer_checks:
        - "Установи коя точно постройка или промяна обхваща удостоверението."
        - "Съпостави реалното положение със схемата, нотариалния акт и заснемането."
        - "Не приравнявай търпимостта на разрешение за строеж или въвеждане."
        - "Изискай професионален преглед, ако купуваш площ, която липсва в документа за собственост."
