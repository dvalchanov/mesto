    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: >-
        Акт образец 14 е актът за приемане на конструкцията. С него участниците описват носещата конструкция на конкретния строеж спрямо одобрения конструктивен проект и отбелязват установените обстоятелства.

        Пазарът използва „има Акт 14“ като кратък етикет за напреднал строеж. За купувача обаче е важно дали актът е за точния блок и цялата конструкция, какви забележки съдържа и как се свързва с отделното удостоверяване на степента „груб строеж“ при вещни сделки.
      when: >-
        Съставя се след изпълнение на носещата конструкция до проектната степен и преди следващите приемателни етапи. Фасадата, инсталациите и довършителните работи могат да са на различно физическо ниво.
      who: >-
        Подписва се от предвидените участници за конкретния строеж, включително относимите проектантски, строителни и надзорни роли. Само изявление на инвеститора или брокера не замества подписания акт.
      why: >-
        Това често е момент, с който договорът свързва плащане или възможна сделка с обект в груб строеж. Актът обаче не доказва автоматично точната идентичност и собствеността на бъдещия обект, готовност за ползване или липса на отклонения от проекта.
      establishes: >-
        Установява приемането на носещата конструкция в описания обхват и спрямо посочената проектна документация. За правилното му разбиране трябва да се прочетат и забележките, приложенията и точното описание на строежа.
      not_establish: >-
        Не установява завършени инсталации и фасада, Акт 15, въвеждане в експлоатация, качество на довършването, право на собственост или липса на тежести. Не трябва автоматично да се приравнява на удостоверение по чл. 181 ЗУТ.
      compare: >-
        Сравни разрешението, имота, строежа, етапа и блока, конструктивния проект, дата, участници, подписи, приложения и забележки. Провери дали последващо изменение засяга конструкция, разпределение или твоя обект.
      before_after: >-
        Преди него стоят разрешението, площадката, основите и междинното приемане на скрити работи. Следват ограждащи елементи, инсталации, довършване, екзекутивна документация и Акт 15.
      payment: >-
        Може да задейства плащане само по твоя договор. Провери дали е достатъчно подписването, изисква ли се удостоверение за груб строеж, липса на забележки или конкретен обхват, и кой уведомява купувача.
      availability: >-
        Няма един публичен източник, от който Mesto винаги може да получи копие на Акт 14. Препратка или дата в друг документ не означава, че самият акт е намерен и прегледан.
      where: >-
        Поискай пълно копие от възложителя, продавача или строителния надзор и провери връзката му със строителната преписка. Ако ще се прехвърля обект в груб строеж, поискай и документите, необходими за конкретната сделка.
      professional_review: >-
        Конструктор или инженер разглежда техническия обхват и забележките. Адвокат и нотариус проверяват вещноправния статут на бъдещия обект и достатъчността на документите за обещаната сделка.
      buyer_checks:
        - "Потвърди, че актът обхваща точния блок и цялата конструкция, която е важна за твоя обект."
        - "Прочети забележките и приложенията, не само първата страница."
        - "Разграничи Акт 14 от удостоверението за степен „груб строеж“."
        - "Провери точната договорна предпоставка преди плащане или прехвърляне."

  - key: document.rough_construction_certificate
    slug: udostoverenie-grub-stroezh
