    title: "Удостоверение за степен „груб строеж“"
    summary: "Официален документ за достигната степен „груб строеж“ по чл. 181 ЗУТ. Особено важен е при прехвърляне на обект преди завършването на сградата."
    aliases: ["удостоверение за груб строеж", "удостоверение по чл. 181", "степен на завършеност", "181 ЗУТ"]
    keywords: ["груб строеж", "прехвърляне", "право на строеж", "самостоятелен обект"]
    related_stage_keys: [building.act14]
    related_document_keys: [document.act14, document.title_deed, document.tax_assessment]
