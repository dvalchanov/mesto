entries:
  - key: document.building_permit
    slug: razreshenie-za-stroezh
    kind: document
    locale: bg
    title: "Разрешение за строеж"
    summary: "Административният акт, който допуска точно описан строеж при одобрени проекти и условия."
    aliases: ["строително разрешение", "разрешение за строителство"]
    keywords: ["влизане в сила", "възложител", "проект"]
    related_stage_keys: [building.authorization]
    related_document_keys: [document.design_visa, document.site_opening]
    related_term_keys: [term.upi, term.right_to_build]
    source_ids: [zut, nag]
    source_checked_at: "2026-09-04"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: "Разрешението за строеж допуска изпълнението на конкретно описан строеж въз основа на одобрени инвестиционни проекти и приложимите предпоставки."
      when: "Преди законосъобразното начало на строителството; последващи допълвания и изменения може да променят част от първоначалния обхват."
      who: "Издава се от компетентния орган по ЗУТ, обичайно главния архитект на общината/района според случая."
      why: "Купувачът трябва да знае дали бъдещият обект принадлежи към разрешения строеж и точната фаза, блок и предназначение."
      establishes: "Установява разрешения административен обхват, възложителя, проектната основа и други посочени условия."
      not_establish: "Не доказва текущ физически напредък, изпълнение по проекта, собственост на продавача, липса на тежести или въвеждане в експлоатация."
      compare: "Сравни номер и дата, влизане в сила, възложител, ПИ/УПИ, адрес, описание, етап, блок, категория, проект и последващи изменения."
      before_after: "Обикновено го предхождат устройствена и проектна подготовка; след него идват приложимите протоколи за площадка, линия и ниво."
      payment: "Може да е договорен тригер, но само ако твоят договор го казва и определя как се доказва. Няма универсален платежен график."
      availability: "Mesto търси препратки в текущо поддържаните публични регистри на НАГ за София; не обещава пълна национална или документна наличност."
      where: "От компетентната община/район, публичен регистър когато има такъв, възложителя или продавача."
      professional_review: "Архитект или инженер за проектния обхват; адвокат за правата, влизането в сила и връзката с договора."

  - key: document.site_opening
    slug: protokol-otkrivane-stroitelna-ploshtadka
    kind: document
    locale: bg
    title: "Протокол за откриване на строителната площадка"
    summary: "Протоколът за площадката, строителната линия и нивото документира контролираното начало, когато е приложим."
    aliases: ["акт 2", "образец 2", "строителна линия и ниво", "откриване на площадка"]
    keywords: ["начало на строежа", "трасиране"]
    related_stage_keys: [building.commencement]
    related_document_keys: [document.building_permit, document.act14]
    related_term_keys: []
    source_ids: [zut, ordinance_3, dnsk_commissioning]
    source_checked_at: "2026-09-04"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: "Протоколът по приложимия образец отразява откриването на площадката и определянето на строителна линия и ниво за конкретен строеж."
      when: "След разрешението за строеж и преди/при започване на строителните дейности според приложимия ред."
      who: "Съставя се и се подписва от определените в нормативния ред участници; конкретният състав зависи от строежа."
      why: "Свързва физическото начало с разрешения проект и точното място, но трябва да е за правилната фаза."
      establishes: "Документира действията и проверките, изрично включени в протокола."
      not_establish: "Не установява завършена конструкция, Акт 15, въвеждане в експлоатация или настъпило плащане."
      compare: "Сравни строеж, разрешение, УПИ/ПИ, дата, линия и ниво, участници, фаза и контролирани нива."
      before_after: "Предхожда се от разрешението; следват строителни актове за изпълнението и приемане на конструкцията."
      payment: "Провери точната договорна клауза. Самото разговорно „има Акт 2“ не определя сума или падеж."
      availability: "Mesto обичайно не извлича самия протокол автоматично; той се иска от възложителя/продавача или строителната преписка."
      where: "От възложителя, строителния надзор, продавача или компетентната администрация при приложим достъп."
      professional_review: "Инженер за техническия обхват; адвокат за договорното значение."

  - key: document.act14
    slug: akt-14
    kind: document
    locale: bg
    title: "Акт образец 14"
    summary: "Актът за приемане на конструкцията е важен строителен документ, но не е крайно приемане или универсално доказателство за всички последици на „груб строеж“."
    aliases: ["акт14", "акт 14", "образец 14", "акт за конструкцията"]
    keywords: ["груб строеж", "конструкция"]
    related_stage_keys: [building.act14]
    related_document_keys: [document.site_opening, document.act15]
    related_term_keys: [term.rough_construction]
    source_ids: [ordinance_3, zut, dnsk_qa]
    source_checked_at: "2026-09-04"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: "Акт образец 14 приема носещата конструкция на конкретния строеж спрямо конструктивната проектна част."
      when: "След изпълнение на конструкцията до приложимата проектна степен и преди следващите приемателни етапи."
      who: "Подписва се от нормативно определените участници в строителството за конкретния строеж."
      why: "Често е посочен в оферти и договори, но трябва да се установят точният обхват и отделните изисквания за груб строеж."
      establishes: "Установява приемането на носещата конструкция в описания обхват."
      not_establish: "Не установява готови инсталации, фасада, Акт 15, законно ползване, собственост или липса на тежести."
      compare: "Сравни разрешение, строеж/блок/етап, конструктивен проект, дата, участници и евентуални забележки."
      before_after: "След строителното начало и конструктивните работи; преди цялостното завършване и Акт 15."
      payment: "Възможно е договорът да свързва плащане с този етап. Провери точното определение и изисканото доказателство в твоя договор."
      availability: "Mesto не поддържа универсален публичен източник за самия Акт 14; може да открива вторични препратки, които не заместват документа."
      where: "От възложителя/инвеститора, продавача, строителния надзор или строителната преписка."
      professional_review: "Конструктор/инженер за техническата част; адвокат и нотариус за вещните и договорните последици."

  - key: document.act15
    slug: akt-15
    kind: document
    locale: bg
    title: "Акт образец 15"
    summary: "Констативният акт за годността за приемане предхожда финалната процедура, но не е разрешение за ползване."
    aliases: ["акт15", "акт 15", "образец 15", "констативен акт 15"]
    keywords: ["приемане на строежа", "екзекутивна документация"]
    related_stage_keys: [building.act15]
    related_document_keys: [document.act14, document.commissioning]
    related_term_keys: []
    source_ids: [ordinance_3, ministry_act15_16, dnsk_commissioning]
    source_checked_at: "2026-09-04"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: "Акт 15 е констативният акт, с който участниците установяват годността за приемане на строежа и предаването на строежа и документацията от строителя на възложителя."
      when: "След завършване на строежа за приемане и преди приложимата финална процедура по въвеждане в експлоатация."
      who: "Подписва се от предвидените участници — възложител, строител, проектанти, надзор и други според категорията и случая."
      why: "Показва напреднал документален етап, но купувачът трябва да види обхвата и забележките, а не само заглавието."
      establishes: "Установява описаното състояние, годност за приемане и приложената документация за конкретен строеж, част или етап."
      not_establish: "Не разрешава самостоятелно ползването и не доказва собственост, тежести, плащане или предаване на конкретен апартамент."
      compare: "Сравни разрешение, категория, блок/етап, описан строеж, дата, подписали лица, забележки и приложения."
      before_after: "След изпълнението и Акт 14; преди Протокол образец 16/разрешение за ползване или удостоверение за въвеждане."
      payment: "Може да е договорно събитие, но няма универсална законова схема за плащането на купувача. Чети своя договор."
      availability: "Mesto понастоящем не извлича универсално самия Акт 15. Публичен запис за друг акт не трябва да се представя като негово копие."
      where: "От възложителя, продавача, строителния надзор или компетентната преписка."
      professional_review: "Инженер за забележките и техническата готовност; адвокат за договора и предстоящата сделка."

  - key: document.commissioning
    slug: akt-16-vavezhdane-v-eksploatatsiya
    kind: document
    locale: bg
    title: "„Акт 16“ и въвеждане в експлоатация"
    summary: "„Акт 16“ е разговорно обобщение: различавай Протокол образец 16, разрешението за ползване и удостоверението за въвеждане в експлоатация."
    aliases: ["акт16", "акт 16", "протокол 16", "разрешение за ползване", "въвеждане в експлоатация", "удостоверение за въвеждане"]
    keywords: ["ДПК", "ДНСК", "категория строеж"]
    related_stage_keys: [building.commissioning]
    related_document_keys: [document.act15]
    related_term_keys: []
    source_ids: [zut, dnsk_commissioning, ministry_act15_16]
    source_checked_at: "2026-09-04"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: "В ежедневния език „Акт 16“ често означава крайното въвеждане. Юридически трябва да се различат Протокол образец 16, разрешение за ползване и удостоверение за въвеждане в експлоатация."
      when: "След Акт 15 и изпълнение на приложимите предпоставки за категорията и конкретния строеж."
      who: "За първа–трета категория ДНСК издава разрешение за ползване след ДПК; за четвърта–пета категория органът, издал разрешението, издава удостоверение за въвеждане."
      why: "Само точният документ, издател и обхват показват дали твоят блок, фаза или обект е включен."
      establishes: "Крайният акт установява разрешаването на ползването/въвеждането на описания строеж, част или етап по приложимия режим."
      not_establish: "Не доказва титула на продавача, липсата на тежести, качество без дефекти, предаване на ключове или изпълнение на частен договор."
      compare: "Провери категория, издател, номер, дата, влизане в сила когато е относимо, разрешение за строеж, идентификатори и точния предмет."
      before_after: "Предхожда се от Акт 15 и приложимата приемателна документация; след него остават сделка/предаване/гаранции според конкретния случай."
      payment: "Ако договорът сочи „Акт 16“, изясни кой конкретен документ има предвид и как се доказва настъпването му."
      availability: "Mesto търси поддържаните публични регистри на НАГ за София. Записът може да е непълен; липсата му не доказва липса на документ."
      where: "В регистъра на ДНСК за разрешения за ползване, компетентната община/район или от възложителя/продавача според категорията."
      professional_review: "Адвокат за обхвата и сделката; инженер при технически въпроси или несъответствия между фази и инфраструктура."

  - key: document.design_visa
    slug: viza-za-proektirane
    kind: document
    locale: bg
    title: "Виза за проектиране"
    summary: "Извадка и указания за проектиране в конкретен имот; не е разрешение за строеж."
    aliases: ["виза", "виза за проектиране"]
    keywords: ["проект", "застрояване"]
    related_stage_keys: [building.land_planning]
    related_document_keys: [document.pup, document.building_permit]
    related_term_keys: [term.upi]
    source_ids: [zut, nag]
    source_checked_at: "2026-09-04"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: "Визата за проектиране е извадка от действащия ПУП с данни и предписания, нужни за проектирането в конкретен имот."
      when: "В подготвителната фаза, преди одобряване на инвестиционен проект и разрешаване на строителството."
      who: "Издава се от главния архитект на компетентната администрация по приложимия ред."
      why: "Показва устройствената рамка за проектиране, но не гарантира, че рекламираната сграда е окончателно одобрена."
      establishes: "Установява съдържащите се в нея извадка и указания към датата на издаване."
      not_establish: "Не е разрешение за строеж, не доказва одобрен окончателен проект, започване или собственост."
      compare: "Сравни имот/УПИ, действащ план, линии на застрояване, предназначение, дата, издаващ орган и последващи промени."
      before_after: "Свързана е с ПУП; следват проекти, съгласувания и евентуално разрешение за строеж."
      payment: "Не приемай издадена виза като универсално основание за резервационна или друга вноска. Решаващ е договорът."
      availability: "Mesto търси записи във визовия регистър на НАГ за София, но не гарантира копие или пълнота."
      where: "От общината/района, публичния регистър когато е наличен, възложителя или проектанта."
      professional_review: "Архитект за прочит на устройствените параметри; адвокат при връзка с права и договор."

  - key: document.pup
    slug: podroben-ustroystven-plan
    kind: document
    locale: bg
    title: "Подробен устройствен план (ПУП)"
    summary: "ПУП урежда регулация и/или застрояване за конкретна територия; планът и кадастърът имат различни роли."
    aliases: ["пуп", "регулационен план", "застроителен план"]
    keywords: ["УПИ", "регулация", "план за застрояване"]
    related_stage_keys: [building.land_planning]
    related_document_keys: [document.design_visa]
    related_term_keys: [term.upi]
    source_ids: [zut, nag]
    source_checked_at: "2026-09-04"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: "ПУП е устройствен план с регулационна и/или застроителна част според вида му, който определя конкретни правила за територията."
      when: "Преди и по време на инвестиционното планиране; планове могат да се изменят по отделна процедура."
      who: "Одобрява се от компетентния орган по ЗУТ след съответната процедура."
      why: "Помага да разбереш УПИ, достъп, предназначение и допустимо застрояване, включително около разглеждания имот."
      establishes: "Установява устройствените предвиждания и граници в одобрения обхват."
      not_establish: "Не доказва собственост, точно изпълнение, действащо разрешение за конкретна сграда или бъдеща липса на изменения."
      compare: "Сравни номер и заповед за одобряване, влизане в сила, обхват, квартал/УПИ, графична и текстова част и кадастралната основа."
      before_after: "Може да предхожда визата и проекта; конкретното строителство изисква отделно разрешаване."
      payment: "Сам по себе си ПУП не поражда универсално плащане по частна покупка."
      availability: "Mesto може да открива записи за устройствени заповеди в НАГ и слоеве за контекст, но не извършва пълна планова експертиза."
      where: "В компетентната община/район, публичните портали и архива на проекта."
      professional_review: "Архитект/урбанист за графиките и режима; адвокат за процедурата и вещните последици."

  - key: document.cadastral_sketch_scheme
    slug: skitsa-sreshtu-shema
    kind: document
    locale: bg
    title: "Кадастрална скица и схема"
    summary: "Скицата е за поземлен имот/сграда според услугата, а схемата — за самостоятелен обект; те идентифицират, но не гарантират самостоятелно титул."
    aliases: ["скица", "схема", "схема на апартамент", "кадастрална схема"]
    keywords: ["АГКК", "идентификатор", "площ"]
    related_stage_keys: []
    related_document_keys: [document.title_deed]
    related_term_keys: [term.cadastral_identifier]
    source_ids: [cadastre, cadastre_law, cadastre_services]
    source_checked_at: "2026-09-04"
    content_version: 1
    editorial_status: published
    professional_review_status: pending
    professional_reviewer:
    professionally_reviewed_at:
    sections:
      what: "Скицата и схемата са официални кадастрални документи. За самостоятелен обект се издава схема; видът на услугата зависи от обекта и целта."
      when: "При идентифициране, сделки, вписвания, промени и други административни услуги според случая."
      who: "Издават се от АГКК/СГКК или чрез предвидените електронни услуги."
      why: "Дават актуална отправна точка за идентификатор, площ, предназначение, етаж и съседи, която трябва да се сравни с договорите."
      establishes: "Установяват кадастралните данни, показани в документа, към датата/заявлението и обхвата на услугата."
      not_establish: "Не са независима гаранция за собствеността, липсата на тежести, законността на всички преустройства или физическите размери на всяка стая."
      compare: "Сравни пълен идентификатор, вид обект, адрес, етаж, предназначение, площ, прилежащи части, съседи, дата и последно изменение."
      before_after: "Съпоставят се с документа за собственост, проектите, данъчните данни и вписванията според целта."
