default: &default
  adapter: postgis
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "mesto") %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "mesto_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("TEST_DATABASE_NAME", "mesto_test") %>

production:
  <<: *default
  # Keep the PostGIS adapter even when a provider supplies a postgres:// URL.
  url: <%= ENV["DATABASE_URL"]&.sub(/\Apostgres(?:ql)?:/, "postgis:") %>
