shared: &shared
  analysis_radii_metres:
    - 175
    - 500
    - 1000
    - 2000
  allowed_hosts:
    - api.sofiaplan.bg
    - gis.sofiaplan.bg
    - nag.sofia.bg
    - kais.cadastre.bg
    - overpass-api.de
    - ec.europa.eu
  http:
    open_timeout: 5
    read_timeout: 18
    retries: 2
  sofiaplan:
    base_url: <%= ENV.fetch("SOFIAPLAN_API_BASE_URL", "https://api.sofiaplan.bg") %>
    permission_status: review_required
    attribution: "Софияплан"
    permission_reference: "https://sofiaplan.bg"
    storage_reuse: unknown
    redistribution: unknown
    retention_constraints: unknown
    rate_limit: undocumented
    datasets:
      schools:
        id: "166"
        name: "Училища"
        category: schools
        relevant_at: "2018-08-08"
      kindergartens:
        id: "142"
        name: "Детски градини"
        category: kindergartens
        relevant_at: "2018-08-08"
      green_spaces:
        id: "235"
        name: "Паркове и градини"
        category: green_spaces
        relevant_at: "2020-09-14"
      transit:
        id: "47"
        name: "Метростанции"
        category: transit
        relevant_at: "2021-03-08"
      flood_risk:
        id: "51"
        name: "Райони със значителен потенциален риск от наводнения"
        category: flood_risk
        relevant_at: "2018-06-18"
  arcgis:
    development_potential:
      url: <%= ENV.fetch("SOFIAPLAN_ARCGIS_DEVELOPMENT_POTENTIAL_URL", "https://gis.sofiaplan.bg/server/rest/services/programa_za_sofia/programa_sofia_atlas_na_analizite/FeatureServer/31") %>
      name: "Потенциал за развитие"
      category: planning_development_potential
      permission_status: review_required
      attribution: "Софияплан"
      storage_reuse: unknown
      redistribution: unknown
      retention_constraints: unknown
      rate_limit: undocumented
    functional_zoning:
      url: <%= ENV.fetch("SOFIAPLAN_ARCGIS_FUNCTIONAL_ZONING_URL", "https://gis.sofiaplan.bg/server/rest/services/programa_za_sofia/programa_sofia_atlas_na_analizite/FeatureServer/33") %>
      name: "Преобладаващо функционално предназначение"
      category: planning_functional_zoning
      permission_status: review_required
      attribution: "Софияплан"
      storage_reuse: unknown
      redistribution: unknown
      retention_constraints: unknown
      rate_limit: undocumented
  openstreetmap:
    overpass_url: <%= ENV.fetch("OPENSTREETMAP_OVERPASS_URL", "https://overpass-api.de/api/interpreter") %>
    dataset_key: openstreetmap_amenities
    permission_status: approved
    attribution: "© OpenStreetMap contributors"
    permission_reference: "https://www.openstreetmap.org/copyright"
    # The bounded Overpass query covers the complete configured supporting
    # geometry. OSM's real-world mapping limitations remain disclosed in the UI.
    coverage_status: complete
    storage_reuse: "ODbL subject to attribution/share-alike requirements"
    redistribution: "ODbL requirements apply"
    retention_constraints: "No application-specific limit recorded"
    rate_limit: "Public Overpass fair-use policy; background scoped imports only"
  nag:
    request_delay_seconds: 0.5
    detail_limit: 25
    on_demand_ingestion_enabled: <%= ENV.fetch("NAG_ON_DEMAND_INGESTION_ENABLED", Rails.env.development?.to_s) %>
    successful_snapshot_max_age: <%= ENV.fetch("NAG_SUCCESSFUL_SNAPSHOT_MAX_AGE", 1.day.to_i) %>
    failed_snapshot_max_age: <%= ENV.fetch("NAG_FAILED_SNAPSHOT_MAX_AGE", 15.minutes.to_i) %>
    permission_status: <%= ENV.fetch("NAG_PERMISSION_STATUS", "review_required") %>
    storage_reuse: unknown
    redistribution: unknown
    retention_constraints: unknown
    rate_limit: "0.5 seconds between bounded registry requests"
    registers:
      building_permits:
        url: <%= ENV.fetch("NAG_BUILDING_PERMITS_URL", "https://nag.sofia.bg/RegisterBuildingPermitsPortal/Index") %>
        identifier_field: Identifier
      design_visas:
        url: <%= ENV.fetch("NAG_DESIGN_VISAS_URL", "https://nag.sofia.bg/registervisasofproection") %>
        identifier_field: KkkrIdentifier
      urban_planning_orders:
        url: <%= ENV.fetch("NAG_URBAN_PLANNING_ORDERS_URL", "https://nag.sofia.bg/registerurbanplanningorders") %>
        identifier_field: KkkrIdentifier
      occupancy_certificates:
        url: <%= ENV.fetch("NAG_OCCUPANCY_CERTIFICATES_URL", "https://nag.sofia.bg/RegisterCertificateForExploitationBuildings") %>
        identifier_field: Identifier
  cadastre:
    provider: <%= ENV.fetch("CADASTRE_PROVIDER", "open_data") %>
    open_data:
      portal_url: "https://kais.cadastre.bg/bg/OpenData"
      download_url: "https://kais.cadastre.bg/bg/OpenData/Download"
      download_timeout: 120
      max_archive_bytes: <%= ENV.fetch("CADASTRE_MAX_ARCHIVE_BYTES", 1.gigabyte) %>
      permission_status: review_required
      permission_by_object_kind:
        parcels: review_required
        buildings: review_required
        individual_objects: review_required
        parcel_rights: review_required
        building_rights: review_required
        individual_object_rights: review_required
      attribution: "Агенция по геодезия, картография и кадастър"
      permission_reference: "https://kais.cadastre.bg/bg/OpenData"
      storage_reuse: unknown
      redistribution: unknown
      retention_constraints: unknown
      rate_limit: undocumented
  property_register:
    provider: <%= ENV.fetch("MESTO_REGISTRY_DEMO", "false") == "true" ? "demo" : "unavailable" %>
    source_url: "https://www.registryagency.bg/bg/registri/imoten-registar/"
    automated_access_url: "https://www.registryagency.bg/bg/registri/imoten-registar/avtomatiziran-dostp-do-bazata-danni-na-imoten-registr-za-sluzheb/"
    demo_identifier: <%= ENV.fetch("MESTO_REGISTRY_DEMO_IDENTIFIER", "68134.1607.1254.1.5") %>
    demo_company_eik: "000000000"
    demo_source_url: "https://example.invalid/mesto-demo/property-register"
    permission_status: restricted
    storage_reuse: "No automated Mesto access; official interface is for legally authorized public institutions"
    redistribution: prohibited_without_authorization
    retention_constraints: unavailable
    rate_limit: unavailable
  commercial_register:
    provider: <%= ENV.fetch("MESTO_REGISTRY_DEMO", "false") == "true" ? "demo" : "unavailable" %>
    source_url: "https://www.registryagency.bg/bg/registri/targovski-registar/"
    automated_access_url: "https://www.registryagency.bg/bg/registri/targovski-registar/predostavyane-sreshtu-zaplashtane-na-cyalata-baza-danni/"
    demo_company_eik: "000000000"
    demo_source_url: "https://example.invalid/mesto-demo/commercial-register"
    permission_status: contract_required
    storage_reuse: "Requires an approved paid contract and compliance review"
    redistribution: "General terms prohibit providing the feed to third parties"
    retention_constraints: contract_dependent
    rate_limit: contract_dependent
  vies:
    service_url: <%= ENV.fetch("VIES_SERVICE_URL", "https://ec.europa.eu/taxation_customs/vies/services/checkVatService") %>
    permission_status: approved
    attribution: "European Commission VIES"
    storage_reuse: "Store the dated validation result and attribution; do not treat it as a company-register record"
    redistribution: "Public validation response"
    retention_constraints: "No personal address is persisted by Mesto"
    rate_limit: "Availability and throttling are controlled by the member-state VAT service"

development:
  <<: *shared
test:
  <<: *shared
production:
  <<: *shared
