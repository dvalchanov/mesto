          obtain: "Compare the report with a current official scheme for an individual unit or sketch for a parcel obtained through KAIS."
          importance: "An exact identity prevents checking or buying a different unit, construction stage, storage room, or parking space."
        area_comparison:
          title: "Area definition and comparison"
          available: "The report may show the cadastral area, but it does not have the listing, title deed, or the seller’s priced area calculation."
          obtain: "Request a breakdown of net/built-up area, common parts, terraces, storage and parking, then compare it with the cadastral scheme, title deed and approved design."
          importance: "Different area concepts may explain a discrepancy, but may also hide a higher price per usable square metre or a missing component."
        included_rights:
          title: "Storage, parking, land and ideal shares"
          available: "The cadastre and registered deeds may show whether extras are individual objects, appurtenances, ideal shares or a right to build."
          obtain: "Request an exact list of identifiers and areas and have a lawyer trace every right in the title deed and Property Register."
          importance: "Marketing language such as ‘included’ does not necessarily mean you acquire a separate transferable property right."
        boundaries_access:
          title: "Boundaries and lawful access"
          available: "Cadastral geometry shows registered boundaries; detailed plans and acts may show street regulation, easements and future expropriation."
          obtain: "Compare KAIS with the effective detailed plan and request right-of-way documents if access crosses another person’s or a private parcel."
          importance: "A physical road is not proof of lawful access, and a mismatch between parcel and regulated plot can affect construction and financing."
        zoning_plans:
          title: "Detailed plans, regulation and development parameters"
          available: "Public planning layers and orders may show use, regulation, height, density, landscaping and planned streets."
          obtain: "Open the applicable plan and orders in NAG/EPRUT; request a visa, extract or certificate from the municipality when legally reliable interpretation is needed."
          importance: "The effective plan determines what can be built on and around the property-not today’s view or a promise in a listing."
        design_visa:
          title: "Design visa"
          available: "A public entry may identify the subject, applicant, property and date. A visa frames design work, but is not a building permit and is not required in every case."
          obtain: "Review the complete document and its drawing and connect it to the effective plan, investment design and later building permit."
          importance: "It shows what design work was initiated and helps identify a mismatch between the marketed and authorised project."
        building_permit:
          title: "Building permit, amendments and validity"
          available: "The register may show number, date, developer, subject and affected property. A public row may omit later orders and proof that the permit became effective."
          obtain: "Request a certified copy, proof of entry into force, every Article 154 amendment, approved designs and, where needed, confirmation from the issuer about validity or revalidation."
          importance: "A permit for another property or stage-or one that has lost effect-does not authorise the unit being sold."
        construction_stage:
          title: "Actual stage - site opening, Act 14 and Act 15"
          available: "These construction records are not usually available as a complete public dataset, and this report does not certify the stage reached."
          obtain: "Request the construction-line protocol, Act 14 and rough-construction certificate, Act 15, site order book and supervision report as applicable to the current stage."
          importance: "The stage affects the right being transferred, bank financing and the risk that the project will not be completed."
        occupancy:
          title: "Commissioning certificate / permit for use"
          available: "Municipal registers publish certificates for category IV-V construction, while DNSK publishes permits for use for categories I-III. Commissioning may occur in stages."
          obtain: "Match the number, category, description, building, entrance, stage and subprojects to the unit, and request a certified copy from the developer or issuer."
          importance: "A document for a neighbouring entrance or another stage does not prove that the exact unit may lawfully be occupied."
        enforcement_changes:
          title: "Removal orders, bans and change of use"
          available: "DNSK and municipal registers may contain orders concerning unlawful or dangerous construction, construction bans and authorised changes of use."
          obtain: "Search by identifier, address, regulated plot and developer in DNSK, NAG/the municipality and EPRUT; request the file if a result matches."
          importance: "An order or unfinished change-of-use procedure can restrict occupation, alteration, financing or resale."
        title_chain:
          title: "Ownership and continuous chain of title"
          available: "The Property Register contains registered transactions and rights, while the cadastre records stated rights holders and deeds; no short search alone conclusively proves title."
          obtain: "Have a lawyer or notary review the original deed, direct predecessors, inheritance, divisions, historic descriptions and their connection to the current identifier."
          importance: "The seller must own exactly the right promised for transfer, without a break in title or unresolved co-owners."
        encumbrances:
          title: "Mortgages, attachments, claims and other encumbrances"
          available: "The Property Register offers paid online searches and a property certificate covering registrations, annotations and deletions at the time it is prepared."
          obtain: "Run an initial search before a deposit and obtain a fresh certificate immediately before closing using the correct property and all relevant owners/predecessors. Verify its authenticity code."
          importance: "An encumbrance may remain on the property or block transfer even when the seller presents an older ‘clean’ certificate."
        seller_company:
          title: "Seller, developer and related companies"
          available: "The Commercial Register shows current status, representatives, owners, changes, filed annual accounts, liquidation and insolvency."
          obtain: "Search each exact UIC in the chain-landowner, holder of the right to build, developer and payment recipient-and review current entries and filings."
          importance: "A project brand and legal seller may differ; legal and financial condition affect completion and refund risk."
        authority_family:
          title: "Authority, power of attorney and matrimonial regime"
          available: "The Commercial Register shows company representatives and RIOS shows a chosen matrimonial-property regime. No general public search proves the full continuing validity of a personal power of attorney."
          obtain: "Require the original or notarised power with specific authority and notarial verification; establish marital status and any required spouse or heir participation."
          importance: "A contract or payment involving a person without sufficient authority may not bind the owner."
        disputes_insolvency:
          title: "Court disputes, liquidation and insolvency"
          available: "Public court decisions and company entries may reveal known proceedings, but a search is not a complete certificate that no dispute exists."
          obtain: "Check the exact people and companies in the Commercial Register and e-Justice portal; have a lawyer connect results to the property and registered claims."
          importance: "A dispute concerning the land, right to build or seller can delay, invalidate or make the transaction practically impossible."
        approved_layout:
          title: "Approved design and actual layout"
          available: "Public registers rarely contain the complete approved architectural design; a cadastral scheme does not show exact room dimensions."
          obtain: "Request a certified architectural set and as-built survey, then have an architect or engineer compare them on site, including uses and removed walls."
          importance: "Unauthorised alterations can affect structure, lawful use, insurance, financing and resale."
        technical_inspection:
          title: "Independent technical inspection"
          available: "Online data cannot establish cracks, damp, noise, window and insulation quality, functioning services, or the condition of the roof, basement and common parts."
          obtain: "Hire an independent engineer or architect; inspect in daylight, test services and use thermography or moisture measurements when warranted."
          importance: "A cosmetic renovation can conceal expensive defects that appear in no registry."
        technical_passport_warranties:
          title: "Technical passport, warranties and defect records"
          available: "Technical passports and warranty files are not a generally accessible nationwide database for every buyer."
          obtain: "Request them from the owner, developer or condominium manager together with defect, repair, roof, lift, fire-system and warranty records."
          importance: "They describe design characteristics, maintenance, known defects and responsibility for remediation."
        energy_certificate:
          title: "Energy certificate"
          available: "SEDA maintains a search for registered certificates showing energy class, issue date and validity."
          obtain: "Search by district, municipality and settlement and request a certified copy of the exact certificate from the seller."
          importance: "Energy class affects expected running costs and helps test claims about building efficiency."
        contractor_supervisor:
          title: "Builder and construction supervisor"
          available: "CPRS shows the construction groups and categories for which a builder is registered; DNSK shows a consultant/supervisor’s validity and scope."
          obtain: "Take the exact names and UICs from the permit and construction file and verify their registration for the project category at the relevant time."
          importance: "Appropriate registration does not guarantee quality, but absence or mismatch is a material warning sign."
        condominium:
          title: "Condominium, common parts and planned expenditure"
          available: "There is no complete public register of a particular entrance’s internal debts, decisions, leaks, disputes and future repairs."
          obtain: "Request rules, recent minutes, budget, repair fund, management contract, debt statement and planned works; speak to the manager and neighbours."
          importance: "A major repair, weak reserve or dysfunctional condominium can create substantial costs immediately after purchase."
        flood_risk:
          title: "Flood risk"
          available: "When a reliable spatial layer is applied, the report shows intersections with the parcel or point used. This is screening, not an individual engineering assessment."
          obtain: "Open the official flood-risk maps and relevant basin directorate information; request damage history and professional assessment for basement units or risk areas."
          importance: "Risk affects safety, insurance, future repairs and the usability of basements and garages."
        geological_environmental:
          title: "Landslides, geological processes and protected areas"
          available: "MRDPW and EEA publish maps/registers for landslides, construction bans, protected territories and Natura 2000."
          obtain: "Check the property coordinates against official layers and request an opinion from the municipality, Geozashtita, RIEW or an engineering geologist when there is an intersection."
          importance: "A restriction or active process can change buildability, stabilisation cost and safety."
        cultural_heritage:
          title: "Cultural heritage and protection zones"
          available: "Registers and municipal plans may show whether the building is a cultural asset or lies in a protection zone."
          obtain: "Check NIICH/the Ministry of Culture and municipality by exact address and identifier; request official confirmation and the applicable regime when uncertain."
          importance: "Status may require approval for façades, windows, repairs or alterations and increase cost and timelines."
        surroundings:
          title: "Services, transport, green space and future development"
          available: "The report uses available maps and datasets for schools, kindergartens, transport and green space, with source dates and scope disclosed."
          obtain: "Visit at different times and check effective plans, neighbouring permits, school catchments and actual routes, noise and parking."
          importance: "A map does not show capacity, quality, traffic or a future construction site, all of which affect daily life and value."
        utilities_access:
          title: "Electricity, water, sewer, gas and access capacity"
          available: "Some municipalities publish infrastructure layers, but a nearby line does not prove contracted connection or adequate capacity."
          obtain: "Request connection contracts and opinions, active accounts, individual meters, authorised electrical load and road-access documents."
          importance: "Temporary accounts, septic systems, low capacity or unresolved access can make occupation costly or impossible."
        taxes_debts:
          title: "Local taxes, utilities and other debts"
          available: "Tax, utility and internal condominium liabilities are not freely searchable online by a buyer."
          obtain: "Request the current tax valuation/certificates required for the deal, paid bills and a written manager’s statement; allocate debts and meter readings in the contract."
          importance: "Not every personal debt follows the property, but unpaid bills, disputed accounts and false declarations can delay closing and handover."
        market_value:
          title: "Market price and valuation"
          available: "Listings show asking rather than necessarily achieved prices; there is no sufficiently complete free official dataset for a precise automated valuation of one property."
          obtain: "Compare genuinely similar properties and commission an independent valuation, especially for financing, an unusual property or a large deposit."
          importance: "Area definitions, legal status, stage and defects can make superficially similar prices incomparable."
        deposit_contract:
          title: "Reservation/preliminary agreement and deposit"
          available: "No public register makes a private contract or payment safe. Labels such as deposit, earnest money or reservation are insufficient without clear terms."
          obtain: "Have the buyer’s lawyer review and amend the agreement: exact parties and object, price and VAT, deadlines, documents and milestones, exit/refund terms, encumbrances, remedies and the authorised recipient’s bank account."
          importance: "A poorly drafted or non-refundable payment can leave the buyer without the property and facing a difficult recovery claim."
        final_day_controls:
          title: "Checks immediately before closing and handover"
          available: "Registry and physical circumstances can change after the initial due-diligence review."
          obtain: "On closing day confirm identity and authority, a fresh encumbrance search/certificate, the mortgage-release mechanism, payment flow and a handover protocol covering keys, meters and readings."
          importance: "Final controls close the time gap between the report, signing and physical delivery of the property."
