    navigation_title: "Mesto library"
    cta:
      title: "Have a specific property in mind?"
      text: "Turn theory into a check of a real cadastral identifier."
      button: "Check the property"
    guides:
      eyebrow: "Buyer guide"
      title: "A calm purchase begins with the right questions"
      lead: "A structured approach to documents, public information and conversations before paying a deposit."
      intro: "You do not need to be a lawyer or architect to notice important discrepancies. You need to know what to request, what to compare and when to involve a specialist."
      sections:
        - title: "Start with the exact identity"
          body: "Compare the cadastral identifier, address, floor, designated use and area across all available documents and the listing. Different concepts of area are not interchangeable."
          items: ["Request a current cadastral scheme or sketch.", "Compare the individual unit, building and parcel.", "Record every discrepancy instead of assuming it is a technical error."]
        - title: "Check the public trail"
          body: "Permits, design visas and planning orders provide context, but they are not an automatic assessment of whether a transaction is safe. Read the subject, scope, date and exact affected property."
          note: "No result in one public register does not prove that a document does not exist."
        - title: "Bring in specialists before the deposit"
          body: "A notary, lawyer and technical specialist check different risks. Public data helps you reach them with better questions."
          items: ["A current encumbrance certificate immediately before the transaction.", "Verification of ownership and the seller's authority.", "Inspection of the actual layout, services and common parts."]
    documents:
      eyebrow: "Property documents"
      title: "Each document answers a different question"
      lead: "How to read the main documents without expecting one of them to prove everything."
      intro: "Good due diligence is a comparison, not a search for one magic document. The exact property, issuer, date, scope and relationship to the other evidence all matter."
      sections:
        - title: "Cadastral scheme or sketch"
          body: "Identifies the object in the cadastral map and shows key characteristics. For an individual unit, look for a scheme; for a parcel, a sketch."
          items: ["Check the date of issue.", "Compare the identifier and area.", "See whether the address, floor and use match."]
        - title: "Title deed"
          body: "Documents the basis of acquisition and describes the property using information available when it was drawn up. It does not replace a current ownership and encumbrance check."
          note: "A difference between an old description and the current cadastre needs a documented explanation."
        - title: "Construction documents"
          body: "The design visa, building permit, approved plans and commissioning documents have different roles. Check that they relate to the exact building, stage and unit."
          items: ["A design visa is not a building permit.", "A permit does not prove the completed work matches the design.", "Commissioning may happen in stages."]
    glossary:
      eyebrow: "Buyer glossary"
      title: "Property terms, in human language"
      lead: "Short explanations of the words you will meet in documents, listings and conversations."
      intro: "Terms are precise only within a specific document and context. Use these explanations as orientation, not a substitute for professional interpretation."
      sections:
        - title: "Cadastral identifier"
          body: "A unique numeric code for an object in the cadastre. Three parts usually mean a parcel, four a building, and five an individual unit in a building."
          note: "The full identifier is a more reliable starting point than the address."
        - title: "UPI and cadastral parcel"
          body: "A cadastral parcel is an object in the cadastre. A UPI is a regulated land plot under a detailed development plan. Their boundaries and numbers may not fully match."
          items: ["The parcel describes the cadastral unit.", "The UPI describes the planning regulation.", "Comparing them requires current plans."]
        - title: "Footprint and gross floor area"
          body: "The building footprint is the area occupied on the land. Gross floor area combines specified floor areas under the applicable rules. Neither is automatically the area of an apartment."
          items: ["Net area and area including common parts are different figures.", "Check exactly how area is defined in each document."]
