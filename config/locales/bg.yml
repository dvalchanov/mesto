  knowledge:
    navigation_title: "Библиотека на Mesto"
    cta:
      title: "Имаш конкретен имот предвид?"
      text: "Превърни теорията в проверка по реален кадастрален идентификатор."
      button: "Провери имота"
    guides:
      eyebrow: "Наръчник за купувача"
      title: "Спокойна покупка започва с правилните въпроси"
      lead: "Практичен подход към документите, публичната информация и важните разговори преди капарото."
      intro: "Не е нужно да бъдеш юрист или архитект, за да забележиш важните несъответствия. Нужно е да знаеш какво да поискаш, какво да сравниш и кога да включиш специалист."
      sections:
        - title: "Започни от точната идентичност"
          body: "Сравни кадастралния идентификатор, адреса, етажа, предназначението и площта във всички налични документи и в обявата. Различните понятия за площ не са взаимозаменяеми."
          items: ["Поискай актуална кадастрална схема или скица.", "Сравни самостоятелния обект, сградата и поземления имот.", "Запиши всяко разминаване, вместо да го приемаш за техническа грешка."]
        - title: "Провери публичната следа"
          body: "Разрешенията, визите и устройствените заповеди дават контекст, но не са автоматична оценка дали една сделка е безопасна. Чети предмета, обхвата, датата и точния засегнат имот."
          note: "Липсата на резултат в един публичен регистър не доказва липса на документ."
        - title: "Преди капаро включи специалистите"
          body: "Нотариусът, адвокатът и техническият специалист проверяват различни рискове. Публичните данни ти помагат да стигнеш до тях с по-добри въпроси."
          items: ["Актуално удостоверение за тежести непосредствено преди сделката.", "Проверка на собствеността и представителната власт на продавача.", "Оглед на реалното разпределение, инсталациите и общите части."]
    documents:
      eyebrow: "Документи за имота"
      title: "Всеки документ отговаря на различен въпрос"
      lead: "Как да четеш основните документи, без да очакваш един от тях да доказва всичко."
      intro: "Добрата проверка е съпоставка, не търсене на един магически документ. Важни са точният обект, издателят, датата, обхватът и връзката с останалите сведения."
      sections:
        - title: "Кадастрална схема или скица"
          body: "Идентифицира обекта в кадастралната карта и показва основни характеристики. За самостоятелен обект търси схема; за поземлен имот — скица."
          items: ["Провери датата на издаване.", "Сравни идентификатора и площта.", "Виж дали адресът, етажът и предназначението съвпадат."]
        - title: "Нотариален акт"
          body: "Документира придобивното основание и описва имота според данните към момента на съставянето. Не замества актуална проверка за собственост и тежести."
          note: "Разлика между старо описание и актуален кадастър трябва да бъде обяснена документално."
        - title: "Строителни книжа"
          body: "Визата, разрешението за строеж, одобрените проекти и документите за въвеждане в експлоатация имат различна роля. Проверявай дали се отнасят до точната сграда, етап и обект."
          items: ["Визата не е разрешение за строеж.", "Разрешението не доказва, че изпълненото съвпада с проекта.", "Въвеждането в експлоатация може да бъде по етапи."]
    glossary:
      eyebrow: "Речник на купувача"
      title: "Имотните понятия — на разбираем език"
      lead: "Кратки обяснения на понятията, които ще срещнеш в документи, обяви и разговори."
      intro: "Термините са точни само в конкретен документ и контекст. Използвай тези обяснения като ориентир, а не като заместител на професионално тълкуване."
      sections:
        - title: "Кадастрален идентификатор"
          body: "Уникален цифров код за обект в кадастъра. Три части обичайно означават поземлен имот, четири — сграда, а пет — самостоятелен обект в сграда."
          note: "Пълният идентификатор е по-надеждна отправна точка от адреса."
        - title: "УПИ и поземлен имот"
          body: "Поземленият имот е обект на кадастъра. УПИ е урегулиран поземлен имот по подробен устройствен план. Границите и номерата им могат да не съвпадат напълно."
          items: ["ПИ описва кадастралната единица.", "УПИ описва регулационното отреждане.", "Съпоставката изисква актуални планове."]
        - title: "ЗП и РЗП"
          body: "Застроената площ е площта, заета от сградата на терена. Разгънатата застроена площ сумира определени площи по етажите съгласно приложимите правила. Нито едното не е автоматично площта на апартамента."
          items: ["Чистата площ и площта с общи части са различни величини.", "Проверявай как точно е дефинирана площта в конкретния документ."]
