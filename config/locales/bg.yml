          available: "Кадастралната геометрия показва регистрираните граници; ПУП и актовете могат да покажат улична регулация, сервитути и бъдещо отчуждаване."
          obtain: "Съпостави КАИС с действащия ПУП и поискай документи за право на преминаване, ако достъпът минава през чужд или частен имот."
          importance: "Физическият път до имота не доказва законен достъп, а разминаването между ПИ и УПИ може да засегне строителството и финансирането."
        zoning_plans:
          title: "ПУП, регулация и параметри на застрояване"
          available: "Публичните устройствени слоеве и заповеди могат да покажат предназначение, регулация, височина, плътност, озеленяване и планирани улици."
          obtain: "Отвори приложимия план и заповедите в НАГ/ЕПРУТ; за правно сигурно тълкуване поискай виза, извадка или удостоверение от общината."
          importance: "Действащият план определя какво може да се строи върху имота и около него, не текущата гледка или обещанието в обявата."
        design_visa:
          title: "Виза за проектиране"
          available: "Публичният запис може да посочи предмет, възложител, имот и дата. Визата задава проектна рамка, но не е разрешение за строеж и не е задължителна във всеки случай."
          obtain: "Прегледай пълния документ и графичната му част и го свържи с действащия ПУП, инвестиционния проект и последващото разрешение за строеж."
          importance: "Показва за какво е започнало проектирането и помага да се открият несъвпадения между рекламирания и разрешения проект."
        building_permit:
          title: "Разрешение за строеж, изменения и валидност"
          available: "Регистърът може да покаже номер, дата, възложител, предмет и засегнат имот. Публичният ред невинаги съдържа всички допълващи заповеди и доказателство за влизане в сила."
          obtain: "Поискай заверено копие, печат/удостоверяване за влизане в сила, всички изменения по чл. 154 ЗУТ, одобрените проекти и при нужда потвърждение от издателя за валидност или презаверка."
          importance: "Разрешение за друг имот, етап или изгубило действие разрешение не узаконява продавания обект."
        construction_stage:
          title: "Реален етап — откриване, Акт 14 и Акт 15"
          available: "Тези строителни протоколи обичайно не са пълен публичен набор и този доклад не потвърждава достигнат етап."
          obtain: "Поискай протокол за строителна линия и ниво, Акт 14 с удостоверение за груб строеж, Акт 15, заповедна книга и доклад на строителния надзор според текущия етап."
          importance: "Етапът влияе върху това какво право се прехвърля, банковото финансиране и риска проектът да не бъде завършен."
        occupancy:
          title: "Въвеждане в експлоатация / разрешение за ползване"
          available: "Общинските регистри публикуват удостоверения за IV–V категория, а ДНСК — разрешения за ползване за I–III категория. Въвеждането може да е по етапи."
          obtain: "Съпостави номера, категорията, описанието, сградата, входа, етапа и всички подобекти с продавания обект; поискай заверено копие от възложителя или издателя."
          importance: "Документ за съседен вход или друг етап не доказва, че точният обект може законно да се ползва."
        enforcement_changes:
          title: "Премахване, забрани и промяна на предназначение"
          available: "ДНСК и общинските регистри могат да съдържат заповеди за незаконни или опасни строежи, строителни забрани и разрешени промени на предназначение."
          obtain: "Търси по идентификатор, адрес, УПИ и възложител в ДНСК, НАГ/общината и ЕПРУТ; поискай преписката, ако има съвпадение."
          importance: "Заповед или неприключила промяна може да ограничи ползването, преустройството, кредита или бъдещата продажба."
        title_chain:
          title: "Собственост и непрекъсната верига от актове"
          available: "Имотният регистър съдържа вписани сделки и права, а кадастърът пази данни за посочени правоимащи и актове, но нито една кратка справка сама не доказва безспорно собственост."
          obtain: "Адвокат или нотариус да прегледа оригиналния акт, всички преки праводатели, наследяване, делби, стари описания и връзката им с актуалния идентификатор."
          importance: "Продавачът трябва да притежава точно правото, което обещава да прехвърли, без прекъсване или неуредени съсобственици."
        encumbrances:
          title: "Ипотеки, възбрани, искови молби и други тежести"
          available: "Имотният регистър предлага платени онлайн справки и удостоверение за имот за вписвания, отбелязвания и заличавания към момента на изготвяне."
          obtain: "Направи предварителна справка преди капаро и поискай ново удостоверение непосредствено преди сделката, с правилно описан имот и всички относими собственици/праводатели. Провери кода за автентичност."
          importance: "Тежест може да остане върху имота или да блокира прехвърлянето, дори продавачът да представя старо „чисто“ удостоверение."
        seller_company:
          title: "Продавач, инвеститор и свързани дружества"
          available: "Търговският регистър показва актуално състояние, представители, собственици, промени, обявени годишни отчети, ликвидация и несъстоятелност."
          obtain: "Търси по точен ЕИК всяко дружество по веригата — собственик на земята, носител на право на строеж, инвеститор и получател на плащането — и прегледай актуалните вписвания и отчети."
          importance: "Марка на проект и юридически продавач може да са различни; финансовото и правното състояние влияят върху риска от незавършване и връщане на плащания."
        authority_family:
          title: "Представителна власт, пълномощно и съпружески режим"
          available: "Търговският регистър показва кой представлява дружество, а РИОС — избрания имуществен режим на съпрузи. Пълната валидност на лично пълномощно не се доказва с общодостъпна справка."
          obtain: "Изискай оригинал/нотариално заверено пълномощно с точни права и проверка от нотариус; установи семейно положение, съгласие на съпруг и наследници, когато е приложимо."
          importance: "Договор или плащане към лице без достатъчна власт може да не обвърже собственика."
        disputes_insolvency:
          title: "Съдебни спорове, ликвидация и несъстоятелност"
          available: "Публичните съдебни актове и търговските вписвания могат да разкрият известни дела и производства, но търсенето не е пълен сертификат за липса на спор."
          obtain: "Провери точните лица и дружества в Търговския регистър и портала за електронно правосъдие; адвокат да свърже откритото с имота и вписаните искови молби."
          importance: "Спор за земята, правото на строеж или продавача може да забави, обезсили или направи практически неизпълнима сделката."
        approved_layout:
          title: "Одобрен проект и фактическо разпределение"
          available: "Публичните регистри рядко дават целия одобрен архитектурен проект; кадастралната схема не показва точни размери на стаите."
          obtain: "Поискай заверена архитектурна част и заснемане на изпълненото, после архитект/инженер да ги сравни на място, включително предназначение и премахнати стени."
          importance: "Неодобрено преустройство може да засегне конструкция, ползване, застраховка, кредит и бъдеща препродажба."
        technical_inspection:
          title: "Независим технически оглед"
          available: "Онлайн данните не установяват пукнатини, влага, шум, качество на дограма и изолация, работата на инсталациите или състоянието на покрив, мазе и общи части."
          obtain: "Наеми независим строителен инженер/архитект; направи оглед при дневна светлина, тестове на инсталациите и при нужда термография или измерване на влага."
          importance: "Видимият ремонт може да прикрива скъпи дефекти, които не се виждат в нито един регистър."
        technical_passport_warranties:
          title: "Технически паспорт, гаранции и дефектни протоколи"
          available: "Техническият паспорт и гаранционната документация не са общодостъпна национална база за всеки купувач."
          obtain: "Поискай ги от собственика, инвеститора или управителя на етажната собственост заедно с протоколи за дефекти, ремонти, покрив, асансьор, пожарни системи и гаранционни срокове."
          importance: "Показват проектните характеристики, поддръжката, известните дефекти и кой носи отговорност за отстраняването им."
        energy_certificate:
          title: "Енергиен сертификат"
          available: "АУЕР поддържа справка за регистрирани сертификати с енергиен клас, дата и валидност."
          obtain: "Търси сградата по област, община и населено място и поискай от продавача заверено копие на точния сертификат."
          importance: "Енергийният клас влияе върху очакваните разходи и помага да се проверят твърденията за ефективност на сградата."
        contractor_supervisor:
          title: "Строител и строителен надзор"
          available: "ЦПРС показва за кои групи и категории е вписан строителят, а ДНСК — валидността и обхвата на консултанта/строителния надзор."
          obtain: "Вземи точните имена и ЕИК от разрешението и строителните книжа и провери регистрацията им за категорията на конкретния строеж към относимия период."
          importance: "Подходящата правоспособност не гарантира качество, но липсата или несъответствието е съществен предупредителен сигнал."
        condominium:
          title: "Етажна собственост, общи части и планирани разходи"
          available: "Няма пълен публичен регистър на вътрешните задължения, решения, течове, спорове и бъдещи ремонти на конкретния вход."
          obtain: "Поискай правилник, последните протоколи, бюджет, фонд „Ремонт и обновяване“, договор с управител, справка за задължения и планирани ремонти; говори с управителя и съседи."
          importance: "Голям ремонт, слаб фонд или конфликтна етажна собственост може да създаде значителни разходи веднага след покупката."
        flood_risk:
          title: "Риск от наводнения"
          available: "Когато е приложен надежден пространствен слой, докладът показва пресичания с имота или използваната точка. Това е скрининг, не индивидуална инженерна оценка."
          obtain: "Отвори картите в ИСУРН и съответната басейнова дирекция; за сутеренни обекти и рискови зони поискай история на щети и професионална оценка."
          importance: "Рискът влияе върху безопасност, застраховане, бъдещи ремонти и използваемостта на мазета и гаражи."
        geological_environmental:
          title: "Свлачища, геоложки процеси и защитени зони"
          available: "МРРБ и ИАОС публикуват карти/регистри за свлачища, строителни забрани, защитени територии и Натура 2000."
          obtain: "Провери координатите на имота в официалните слоеве и при съвпадение поискай становище от общината, „Геозащита“, РИОСВ или инженер-геолог."
          importance: "Ограничение или активен процес може да промени възможността за строеж, цената на укрепване и безопасността."
        cultural_heritage:
          title: "Културно наследство и охранителни зони"
          available: "Регистри и общински планове могат да покажат дали сградата е културна ценност или попада в охранителна зона."
          obtain: "Провери НИНКН/Министерството на културата и общината по точен адрес и идентификатор; при съмнение поискай официално удостоверяване и приложим режим."
          importance: "Статутът може да изисква съгласуване за фасада, дограма, ремонт или преустройство и да увеличи сроковете и разходите."
        surroundings:
          title: "Услуги, транспорт, зелени площи и бъдещо развитие"
          available: "Докладът използва налични карти и набори за училища, детски градини, транспорт и зелени площи; датата и обхватът на всеки източник са посочени."
          obtain: "Посети района в различни часове и провери действащите ПУП, разрешенията на съседните имоти, приемните райони и реалните маршрути, шум и паркиране."
          importance: "Картата не показва капацитет, качество, трафик и бъдеща строителна площадка, а те влияят пряко върху ежедневието и стойността."
        utilities_access:
          title: "Присъединяване и капацитет на ток, вода, канал, газ и достъп"
          available: "Някои общини публикуват инфраструктурни слоеве, но наличието на линия наблизо не доказва договорено присъединяване или достатъчен капацитет."
          obtain: "Поискай договори и становища за присъединяване, открити партиди, индивидуални измервателни уреди, разрешено електрическо натоварване и документи за пътния достъп."
          importance: "Временни партиди, септична яма, слаб капацитет или неуреден достъп могат да направят ползването скъпо или невъзможно."
        taxes_debts:
          title: "Местни данъци, комунални и други задължения"
          available: "Данъчните, комуналните и вътрешните задължения към етажната собственост не са общодостъпни за свободна онлайн проверка от купувач."
          obtain: "Поискай актуална данъчна оценка/удостоверения според сделката, платени сметки и писмена справка от управителя; договорът да разпредели задълженията и показанията на уредите."
          importance: "Не всяко лично задължение следва имота, но неплатени сметки, спорни партиди и неверни декларации могат да забавят сделката и предаването."
        market_value:
          title: "Пазарна цена и оценка"
          available: "Обявите показват офертни, не непременно реално платени цени; няма достатъчно пълен безплатен официален набор за точна автоматична оценка на конкретен имот."
          obtain: "Сравни реално съпоставими имоти и възложи независима оценка, особено при кредит, нетипичен имот или голямо капаро."
          importance: "Точната площ, правният статус, етапът и дефектите могат да направят привидно сходните цени несъпоставими."
        deposit_contract:
          title: "Резервационен/предварителен договор и капаро"
          available: "Няма публичен регистър, който да направи частен договор или плащане безопасни. Наименованието „депозит“, „капаро“ или „задатък“ не е достатъчно без ясни клаузи."
          obtain: "Адвокат на купувача да провери и редактира договора: точни страни и обект, цена и ДДС, срокове, документи и етапи, условия за отказ/връщане, тежести, санкции и банкова сметка на оправомощения получател."
          importance: "Лошо формулирано или невъзстановимо плащане може да остави купувача без имот и с труден иск за връщане на сумата."
        final_day_controls:
          title: "Проверки непосредствено преди сделката и предаването"
          available: "Състоянието в регистрите и на място може да се промени след първоначалната проверка."
          obtain: "В деня на сделката потвърди самоличност и представителна власт, свежо удостоверение/справка за тежести, договорения механизъм за заличаване на ипотека, плащането и приемо-предавателен протокол с ключове, уреди и показания."
          importance: "Финалният контрол затваря времевата пролука между доклада, подписването и фактическото предаване на имота."
