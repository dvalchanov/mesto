      priority_guides:
        area_comparison:
          compare_intro: "В нотариалния акт потърси идентификатора в описанието на имота и сравни всяка налична стойност:"
          steps:
            - "Използвай извлечените от Mesto стойности по-долу; отвори имота в КАИС по идентификатора, а за актуален официален документ заяви схема или скица."
            - "В нотариалния акт потърси идентификатора в описанието на имота и провери площ, предназначение, адрес, етаж и прилежащи или идеални части."
            - "В одобрения проект и площообразуването отдели чиста/застроена площ от общи части, тераси и отделни обекти като склад или гараж; изискай писмено обяснение за всяка разлика."
          watch: "Необяснена разлика в площта, общи части представени като чиста площ или склад/паркомясто без отделно описано право."
        boundaries_access:
          compare_intro: "В актуалната скица и графичната част на ПУП първо потвърди, че са за същия поземлен имот, УПИ и квартал. Използвай тези стойности като ориентир."
          steps:
            - "Отвори КАИС по идентификатора и провери очертанието, съседите и връзката на имота с улица."
            - "В регистъра на ПУП на НАГ или в ЕПРУТ търси по същия идентификатор/УПИ и отвори действащия план, заповедта и графичната част."
            - "Ако достъпът пресича чужд или частен имот, поискай вписан документ за право на преминаване и го свържи с точния маршрут."
          watch: "Разминаване между ПИ и УПИ, липса на законен излаз на улица, сервитут, бъдеща улица или отчуждаване през имота."
        zoning_plans:
          compare_intro: "В заглавния блок на плана, заповедта и графичната част потвърди същия ПИ/УПИ. Това са вече намерените за имота ориентири."
          steps:
            - "Търси идентификатора в регистъра на ПУП на НАГ и в ЕПРУТ; използвай и УПИ, квартал и местност, ако идентификаторът не връща резултат."
            - "Отвори само относимите влезли в сила планове и заповеди и свали графичната и текстовата им част."
            - "Запиши предназначение, плътност, КИНТ, височина, озеленяване, отстояния и планирани улици и ги сравни с обещаното от продавача."
          watch: "Заявление или процедура, представени като действащ план; липсваща заповед/графика или параметри, различни от рекламата."
        design_visa:
          compare_intro: "В официалния запис и приложената виза потвърди номерата на имота/УПИ и данните на открития от Mesto запис."
          steps:
            - "В регистъра на визите на НАГ търси по кадастрален идентификатор, УПИ, местност или регистрационен номер."
            - "Отвори записа и приложения файл; провери издател, дата, основание, възложител, обхват и графична част."
            - "Свържи визата с действащия ПУП, инвестиционния проект и последващото разрешение за строеж за същия имот."
          watch: "Различен идентификатор или УПИ, липсващо приложение, различен предмет или виза без съответстващо разрешение за строеж."
        building_permit:
          compare_intro: "В разрешението и заповедите към него потвърди номерата на имота/УПИ, сградата и данните на открития от Mesto запис."
          steps:
            - "В регистъра на разрешенията за строеж на НАГ търси по идентификатор, адрес или номер и отвори точния запис."
            - "Провери издател, дата, влизане в сила, възложител, описание, имот и всички заповеди към разрешението, показани в детайла."
            - "Поискай заверено копие, одобрените проекти и измененията по чл. 154 ЗУТ и ги сравни с точната сграда, етап и изпълнено строителство."
          watch: "Разрешение за друг имот/етап, липса на влизане в сила, непоказани изменения или разлика между одобрено и изпълнено."
        occupancy:
          compare_intro: "В разрешението за ползване или удостоверението намери описанието на строежа и етапа; сравни го с тези данни за сградата и откритите записи."
          steps:
            - "Търси по идентификатор, адрес и номер в регистъра на НАГ; провери и регистъра на ДНСК във всички години по наименование и местонахождение."
            - "Съпостави номер, издател, категория, строеж, вход, етап, УПИ/идентификатор и включените подобекти с продавания обект."
            - "Поискай заверено копие от възложителя или издателя и провери дали последващи поправки или етапи променят обхвата му."
          watch: "Документ за съседен вход, друга сграда или различен етап; адресът съвпада, но идентификаторът и обхватът не."
        title_chain:
          compare_intro: "В акта на продавача намери описанието на прехвърляния имот и го сравни ред по ред. Тези кадастрални стойности идентифицират обекта, но не доказват собственост."
          steps:
            - "Вземи оригиналния акт на продавача и точните имена/ЕГН или ЕИК на продавача и преките праводатели."
            - "В Имотния регистър заяви платена справка за имот по кадастрален идентификатор; нужен е регистриран и автентикиран профил. Ако няма резултат, избери правилната Служба по вписванията и търси по останалите критерии и по лицата."
            - "Проследи всеки акт назад, включително наследяване, делби и стари описания, до непрекъсната връзка с актуалния идентификатор."
          watch: "Липса на резултат не доказва собственост или „чист“ имот: по-стари вписвания може да предхождат електронния регистър или кадастралния идентификатор."
        encumbrances:
          compare_intro: "Използвай тези стойности в заявлението и провери дали издаденото удостоверение обхваща точно същия имот и описаните с него права/части."
          steps:
            - "Направи предварителна платена справка за имота и относимите собственици/праводатели преди капаро; порталът изисква регистрация, автентикация и електронно плащане."
            - "Заяви удостоверение за имот за целия относим период с точно описание и приложения; провери посочената Служба по вписванията и периода на справката."
            - "Непосредствено преди подписване поискай ново удостоверение и сравни всички вписвания, отбелязвания и заличавания със самите актове."
          watch: "Ипотека, възбрана, искова молба, право на ползване, дългосрочен наем или заличаване, което не обхваща точната тежест и имот."
        technical_inspection:
          compare_intro: "Дай тези стойности на инженера и ги сравнете със заглавния блок на одобрения проект, площообразуването и фактическото положение на място."
          steps:
            - "Поискай одобрения архитектурен проект, техническия паспорт, документа за въвеждане в експлоатация, гаранциите и протоколите за ремонти/дефекти."
            - "Направи оглед на дневна светлина с независим инженер или архитект на точния обект, общите части, покрив и мазе; тествай инсталации и измери влага при съмнение."
            - "Изискай писмен списък със снимки, тежест на дефектите, спешност и ориентировъчна цена; сравни фактическото разпределение с одобрения проект."
          watch: "Активна влага, конструктивни пукнатини, опасни инсталации, непозволено преустройство или големи отложени ремонти на общите части."
