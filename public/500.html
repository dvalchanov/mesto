      a.button { display: inline-flex; min-height: 52px; align-items: center; gap: 10px; margin-top: 32px; border-radius: 4px; padding: 14px 22px; background: #b95f3f; color: #fff; font-size: 14px; font-weight: 800; text-decoration: none; }

      a.button:focus-visible { outline: 3px solid rgba(185, 95, 63, .3); outline-offset: 3px; }
      .brand { display: block; margin-bottom: 56px; color: #173f34; font-size: 15px; font-weight: 800; letter-spacing: .32em; text-decoration: none; }
