name: mesto

services:
  postgres:
    image: postgis/postgis:17-3.5
    # The upstream image is currently amd64-only; Docker Desktop emulates it on Apple silicon.
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-mesto_development}
      POSTGRES_USER: ${DATABASE_USERNAME:-mesto}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(cat /proc/1/comm)\" = postgres ] && pg_isready -U ${DATABASE_USERNAME:-mesto} -d ${DATABASE_NAME:-mesto_development}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  proxy:
    image: caddy:2-alpine
    command:
      - caddy
      - reverse-proxy
      - --from
      - http://mesto.localhost
      - --to
      - host.docker.internal:3000
      - --header-up
      - "X-Forwarded-For: 127.0.0.1"
    ports:
      - "127.0.0.1:80:80"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  redis_data:
